 prospectus), issuing a fixed number of shares. After that:<\/p>\n<ul>\n<li>Shares trade in the <strong>secondary market<\/strong> (NYSE, Nasdaq, OTC) between investors; the fund does <strong>not<\/strong> redeem them. Bought and sold through a broker like a stock, paying <strong>commissions<\/strong> (not sales charges).<\/li>\n<li>Price is set by <strong>supply and demand<\/strong>, so shares can trade at a <strong>premium<\/strong> or (more often) a <strong>discount<\/strong> to NAV. The NAV is still calculated and published, but the market price can be anything.<\/li>\n<li>Can issue <strong>preferred stock and bonds<\/strong> (leverage) in addition to common — unlike open-end funds.<\/li>\n<li>Can be bought on margin and sold short; can be traded intraday.<\/li>\n<li>Often used for less-liquid assets (muni bonds, emerging market debt) because the manager never has to sell holdings to meet redemptions.<\/li>\n<li><strong>Interval funds<\/strong> are a hybrid that offers periodic repurchases at NAV.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Open-end (mutual fund)<\/th>\n<th>Closed-end fund<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Capitalization<\/td>\n<td>Continuous; unlimited shares<\/td>\n<td>One-time IPO; fixed shares<\/td>\n<\/tr>\n<tr>\n<td>Where bought/sold<\/td>\n<td>From/to the fund (via underwriter/dealers)<\/td>\n<td>Secondary market (exchange)<\/td>\n<\/tr>\n<tr>\n<td>Price<\/td>\n<td>NAV + sales charge (forward pricing)<\/td>\n<td>Supply &amp; demand; premium/discount to NAV<\/td>\n<\/tr>\n<tr>\n<td>Cost to trade<\/td>\n<td>Sales charge (load) or no-load<\/td>\n<td>Brokerage commission<\/td>\n<\/tr>\n<tr>\n<td>Securities issued<\/td>\n<td>Common only<\/td>\n<td>Common, preferred, bonds<\/td>\n<\/tr>\n<tr>\n<td>Fractional shares<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Margin / short<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Prospectus<\/td>\n<td>Always (continuous offering)<\/td>\n<td>Only at IPO<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s7-5\" data-sec=\"s7-5\"><span class=\"secnum\">7.5<\/span> Exchange-traded funds<\/h2>\n<h3 id=\"s7-5-1\" data-sec=\"s7-5-1\"><span class=\"secnum\">7.5.1<\/span> Passive ETFs<\/h3>\n<p>An <strong>exchange-traded fund<\/strong> holds a basket of securities and trades on an exchange <strong>throughout the day<\/strong> like a stock. Most ETFs are <strong>passive<\/strong> — they track an index (S&amp;P 500, total bond market, gold price, a sector). Legally most are registered as open-end companies or UITs under the 1940 Act, but they behave very differently from mutual funds:<\/p>\n<ul>\n<li><strong>Intraday trading<\/strong> at market prices; can be bought on <strong>margin<\/strong>, <strong>sold short<\/strong>, and traded with limit/stop orders.<\/li>\n<li>Price stays very close to NAV because of the <strong>creation/redemption<\/strong> mechanism: large institutions (\"authorized participants\") exchange baskets of the underlying securities for large blocks of ETF shares (creation units) and vice versa, arbitraging away any premium or discount.<\/li>\n<li><strong>Low expense ratios<\/strong> (passive) and <strong>tax-efficient<\/strong> (in-kind creation/redemption means few capital gains distributions).<\/li>\n<li>Investors pay <strong>brokerage commissions<\/strong> (though many brokers now charge zero) and the <strong>bid-ask spread<\/strong>, not sales charges. Frequent small purchases can rack up costs — a mutual fund may be better for dollar-cost averaging.<\/li>\n<li>Dividends are paid to shareholders; distributions taxed like a mutual fund's.<\/li>\n<li>Buy and sell through a broker; a prospectus is available but not necessarily delivered on each secondary purchase.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Mutual fund<\/th>\n<th>ETF<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pricing<\/td>\n<td>Once daily at NAV (forward pricing)<\/td>\n<td>Continuous, market price ≈ NAV<\/td>\n<\/tr>\n<tr>\n<td>Trading<\/td>\n<td>With the fund<\/td>\n<td>On the exchange<\/td>\n<\/tr>\n<tr>\n<td>Margin / short / limit orders<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Typical management<\/td>\n<td>Active or passive<\/td>\n<td>Mostly passive (active ETFs exist)<\/td>\n<\/tr>\n<tr>\n<td>Costs<\/td>\n<td>Sales charge, expense ratio<\/td>\n<td>Commission, spread, (low) expense ratio<\/td>\n<\/tr>\n<tr>\n<td>Tax efficiency<\/td>\n<td>Lower<\/td>\n<td>Higher<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s7-5-2\" data-sec=\"s7-5-2\"><span class=\"secnum\">7.5.2<\/span> Other ETFs<\/h3>\n<ul>\n<li><strong>Actively managed ETFs<\/strong> — a manager picks securities; higher expenses.<\/li>\n<li><strong>Leveraged ETFs<\/strong> — use derivatives to deliver <strong>2× or 3×<\/strong> the <strong>daily<\/strong> return of an index. Because the leverage resets daily, over periods longer than a day the return <strong>compounds and diverges<\/strong> from the index multiple — especially in volatile markets. Not suitable for buy-and-hold investors; FINRA considers them complex products requiring heightened suitability review.<\/li>\n<li><strong>Inverse ETFs<\/strong> — deliver the <strong>opposite<\/strong> of the index's daily return (−1×, −2×, −3×), letting investors bet against a market without shorting. Same daily-reset problem.<\/li>\n<li><strong>Commodity ETFs<\/strong> — hold physical gold/silver or commodity futures. Futures-based ones suffer from contango/roll costs and may be taxed as partnerships (K-1s).<\/li>\n<li><strong>Currency, volatility (VIX), and thematic ETFs.<\/strong><\/li>\n<li><strong>Smart beta / factor ETFs<\/strong> — rule-based tilts (value, momentum, low volatility).<\/li>\n<\/ul>\n<h3 id=\"s7-5-3\" data-sec=\"s7-5-3\"><span class=\"secnum\">7.5.3<\/span> Exchange-traded notes<\/h3>\n<p>An <strong>ETN<\/strong> is an <strong>unsecured debt obligation of a bank<\/strong> (not a fund) that promises to pay the return of an index at maturity, minus fees. The investor owns <strong>no portfolio<\/strong> — just the bank's promise. Therefore ETNs carry the <strong>credit risk of the issuing bank<\/strong> in addition to market risk (Lehman Brothers ETNs became worthless in 2008). They trade on exchanges like ETFs, can track hard-to-hold assets (commodities, volatility), and have no tracking error. Interest/dividends are not paid; return comes at sale or maturity (usually taxed as capital gain). Complex product — suitability scrutiny.<\/p>\n<hr />\n<h2 id=\"s7-6\" data-sec=\"s7-6\"><span class=\"secnum\">7.6<\/span> Unit investment trusts<\/h2>\n<p>A <strong>UIT<\/strong> is an investment company that holds a <strong>fixed, unmanaged portfolio<\/strong> of securities (bonds or stocks) for a set period and then terminates, distributing the proceeds.<\/p>\n<ul>\n<li><strong>No board of directors, no investment adviser, no active management<\/strong> — the portfolio is assembled once by the sponsor and then \"supervised\" (securities are only sold if credit deteriorates).<\/li>\n<li>Organized under a <strong>trust indenture<\/strong> with a trustee.<\/li>\n<li>Investors buy <strong>units<\/strong> (redeemable at NAV from the sponsor, which often maintains a secondary market). Sold with a sales charge via a prospectus.<\/li>\n<li><strong>Fixed termination date.<\/strong> Bond UITs pay monthly income and terminate when the bonds mature; equity UITs typically run 1–5 years.<\/li>\n<li>Low ongoing expenses (no manager), but a sales charge up front and little flexibility.<\/li>\n<li>Many <strong>variable annuity separate accounts<\/strong> and some ETFs (e.g., the original SPDR S&amp;P 500) are legally UITs.<\/li>\n<\/ul>\n<p><strong>Suitability:<\/strong> investors who want a known, diversified, buy-and-hold portfolio with predictable income (bond UITs) and no manager risk.<\/p>\n<hr />\n<h2 id=\"s7-7\" data-sec=\"s7-7\"><span class=\"secnum\">7.7<\/span> Alpha and beta<\/h2>\n<p>Portfolio performance measures that show up in fund fact sheets and on the exam.<\/p>\n<ul>\n<li><strong>Beta<\/strong> — a measure of a security's or fund's <strong>systematic (market) risk<\/strong>: how much it moves relative to the overall market (beta of the market = <strong>1.0<\/strong>).<\/li>\n<li>Beta 1.5 → expected to move 1.5× the market (more volatile, aggressive).<\/li>\n<li>Beta 0.5 → moves half as much (defensive, less volatile).<\/li>\n<li>Beta 0 → uncorrelated with the market (e.g., cash); negative beta moves opposite (rare — gold at times).<\/li>\n<li>Beta measures <strong>non-diversifiable<\/strong> risk; a diversified portfolio's risk is essentially its beta.<\/li>\n<li><strong>Alpha<\/strong> — the return a fund earns <strong>above (or below) what its beta would predict<\/strong>; the portion attributable to the manager's skill (or luck). Alpha of +2 means the manager beat the risk-adjusted expectation by 2 percentage points. Positive alpha is the goal of active management; index funds target alpha of zero.<\/li>\n<li><strong>Standard deviation<\/strong> — a measure of <strong>total volatility<\/strong> (both systematic and unsystematic). Higher standard deviation = wider swings = more risk.<\/li>\n<li><strong>Sharpe ratio<\/strong> — (return − risk-free rate) ÷ standard deviation; return per unit of total risk. Higher is better.<\/li>\n<li><strong>R-squared<\/strong> — how much of a fund's movement is explained by its benchmark (100 = perfect index tracker).<\/li>\n<li><strong>Correlation<\/strong> — ranges from +1 (move together) to −1 (move opposite). Diversification works best with assets that have low or negative correlation.<\/li>\n<\/ul>\n<p><strong>Modern portfolio theory (MPT)<\/strong> — combine assets with low correlation to reduce risk for a given expected return; the set of optimal combinations is the <strong>efficient frontier<\/strong>. <strong>Capital asset pricing model (CAPM)<\/strong>: expected return = risk-free rate + beta × (market return − risk-free rate).<\/p>\n<p><strong>Example.<\/strong> Risk-free rate 3%, market return 9%, fund beta 1.2. Expected return = 3% + 1.2 × (9% − 3%) = 10.2%. If the fund actually returned 12%, its alpha is <strong>+1.8%<\/strong>.<\/p>\n<hr />\n<h2>Chapter 7 quick review<\/h2>\n<ul>\n<li>1940 Act: face-amount certificate cos., UITs, management companies (open-end vs. closed-end). Diversified = <strong>75-5-10<\/strong>. $100,000 net worth to go public. Board ≥ 40% independent. Objective change needs shareholder vote.<\/li>\n<li>Mutual fund: continuous primary offering (prospectus always), redeemable at NAV (paid within <strong>7 days<\/strong>), forward pricing, common stock only, no margin/short.<\/li>\n<li><strong>NAV = (assets − liabilities) ÷ shares. POP = NAV ÷ (1 − SC%).<\/strong> Sales charge is a % of POP. Max <strong>8.5%<\/strong> (only with breakpoints, ROA, reinvestment at NAV). No-load → 12b-1 ≤ 0.25%; 12b-1 max 1.00% total.<\/li>\n<li>Breakpoints: LOI (13 months, backdate 90 days, new money only), ROA (current value, future purchases), combination privilege. <strong>Breakpoint sales are prohibited.<\/strong> No breakpoints for investment clubs.<\/li>\n<li>Share classes: <strong>A<\/strong> = front-end + breakpoints (big/long); <strong>B<\/strong> = CDSC, converts to A (small/long); <strong>C<\/strong> = level load, never converts (short-term).<\/li>\n<li>Subchapter M: distribute ≥ <strong>90%<\/strong> of net investment income → fund untaxed on distributed amounts (conduit).<\/li>\n<li>Distributions taxable whether reinvested or not; LT cap gains distributions are LT regardless of holding period; reinvestment raises basis.<\/li>\n<li>Closed-end: IPO once, trades on exchange at premium/discount to NAV, commissions, can issue preferred/debt, margin OK.<\/li>\n<li>ETFs: intraday, margin/short OK, low cost, tax efficient; leveraged/inverse reset <strong>daily<\/strong> — not buy-and-hold. ETNs = bank debt → credit risk, no portfolio.<\/li>\n<li>UIT: fixed, unmanaged, no board/adviser, terminates, units redeemable.<\/li>\n<li>Beta = market risk vs. market (1.0); alpha = excess return from manager skill; standard deviation = total risk; Sharpe = return per unit of risk.<\/li>\n<\/ul>"}, {"num": 8, "name": "Alternative Pooled Investments", "file": "08-alternative-pooled-investments.md", "minutes": 8, "sections": [{"id": "s8-1", "num": "8.1", "title": "Real estate investment trusts (REITs)", "level": 2}, {"id": "s8-2", "num": "8.2", "title": "Hedge funds", "level": 2}, {"id": "s8-3", "num": "8.3", "title": "Direct participation programs", "level": 2}], "html": "\n<blockquote>\n<p>REITs, hedge funds and direct participation programs (DPPs). Shorter chapter, but each product has a handful of reliably tested facts.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s8-1\" data-sec=\"s8-1\"><span class=\"secnum\">8.1<\/span> Real estate investment trusts (REITs)<\/h2>\n<p>A <strong>REIT<\/strong> is a company that owns, operates or finances income-producing real estate and sells shares to investors, letting them participate in real estate without buying property directly.<\/p>\n<p><strong>Three types.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Invests in<\/th>\n<th>Income source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Equity REIT<\/strong><\/td>\n<td>Owns and operates properties (apartments, office buildings, malls, hotels, warehouses, data centers)<\/td>\n<td>Rents and property appreciation<\/td>\n<\/tr>\n<tr>\n<td><strong>Mortgage REIT<\/strong><\/td>\n<td>Lends to property owners or buys mortgages/MBS<\/td>\n<td>Interest; sensitive to interest rates<\/td>\n<\/tr>\n<tr>\n<td><strong>Hybrid REIT<\/strong><\/td>\n<td>Both<\/td>\n<td>Both<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tax treatment — the key testable rule.<\/strong> A REIT avoids corporate income tax if it:<\/p>\n<ul>\n<li>Distributes at least <strong>90%<\/strong> of its taxable income to shareholders as dividends (a conduit, like Subchapter M), and<\/li>\n<li>Has at least <strong>75%<\/strong> of its assets in real estate (and derives ≥ 75% of gross income from real estate sources).<\/li>\n<\/ul>\n<p>REIT dividends are generally taxed to investors as <strong>ordinary income<\/strong> (not qualified dividends), though investors may be eligible for a 20% qualified business income deduction. <strong>Losses are not passed through<\/strong> to shareholders — this is a major difference from DPPs/limited partnerships. Only income flows through.<\/p>\n<p><strong>Trading and structure.<\/strong><\/p>\n<ul>\n<li>Most REITs are <strong>publicly traded on exchanges (NYSE)<\/strong> — liquid, priced by the market, bought with commissions like any stock.<\/li>\n<li><strong>Non-traded (public, non-listed) REITs<\/strong> are registered with the SEC but don't trade; they are illiquid (redemption programs are limited), carry high upfront fees (often 10%+), and have raised FINRA suitability concerns. Values on statements may not reflect what an investor could actually get.<\/li>\n<li><strong>Private REITs<\/strong> are unregistered and sold to accredited investors.<\/li>\n<li>REITs are <strong>not<\/strong> investment companies under the 1940 Act, even though they look like closed-end funds. They are registered under the 1933 Act and trade under the 1934 Act.<\/li>\n<li>Not redeemable (negotiable).<\/li>\n<\/ul>\n<p><strong>Why investors buy REITs.<\/strong> Regular, relatively high <strong>dividend income<\/strong>; diversification into real estate; liquidity (for listed REITs); an inflation hedge (rents and property values tend to rise with inflation). REITs are also a modest hedge against the stock market because real estate has lower correlation with equities.<\/p>\n<p><strong>Risks.<\/strong> Real estate market risk, interest-rate risk (rising rates hurt REIT prices, especially mortgage REITs), leverage, and — for non-traded REITs — severe liquidity risk and high fees.<\/p>\n<hr />\n<h2 id=\"s8-2\" data-sec=\"s8-2\"><span class=\"secnum\">8.2<\/span> Hedge funds<\/h2>\n<p>A <strong>hedge fund<\/strong> is a privately organized investment pool, usually structured as a <strong>limited partnership<\/strong>, that uses a wide range of strategies — leverage, short selling, derivatives, arbitrage, distressed debt, currencies, commodities — to seek positive (\"absolute\") returns in any market.<\/p>\n<p><strong>Regulation and access.<\/strong><\/p>\n<ul>\n<li>Sold as <strong>private placements<\/strong> under <strong>Regulation D<\/strong>, so they are <strong>not registered<\/strong> with the SEC under the 1933 Act, and most are <strong>exempt from the Investment Company Act of 1940<\/strong> (3(c)(1) funds with ≤ 100 investors or 3(c)(7) funds limited to \"qualified purchasers\").<\/li>\n<li>Available only to <strong>accredited investors<\/strong> (net worth over $1 million excluding primary residence, or income over $200,000 individually / $300,000 jointly in each of the last two years) and institutions. Many require much higher minimums ($1 million+) and limit themselves to qualified purchasers ($5 million+ in investments).<\/li>\n<li>Minimal disclosure requirements — no prospectus; an offering memorandum instead. Large advisers must register with the SEC as investment advisers.<\/li>\n<li>Hedge fund <strong>managers<\/strong> often register under the Investment Advisers Act of 1940.<\/li>\n<\/ul>\n<p><strong>Characteristics the exam tests.<\/strong><\/p>\n<ul>\n<li><strong>Illiquid<\/strong> — lock-up periods (often 1 year+) and redemption only at quarterly or annual windows with notice.<\/li>\n<li><strong>High fees<\/strong> — the classic \"<strong>2 and 20<\/strong>\": a 2% annual management fee plus 20% of profits (performance/incentive fee). Many have a <strong>high-water mark<\/strong> (performance fee only on new gains).<\/li>\n<li><strong>Leverage and derivatives<\/strong> → potentially large, fast losses; the fund itself can be wiped out (limited partners cannot lose more than they invested).<\/li>\n<li><strong>Lack of transparency<\/strong> — strategies and holdings are proprietary.<\/li>\n<li><strong>Less regulatory oversight<\/strong> than mutual funds.<\/li>\n<li>Returns are often <strong>uncorrelated<\/strong> with the broad market, which is the diversification argument.<\/li>\n<\/ul>\n<p><strong>Fund of hedge funds<\/strong> — a fund that invests in several hedge funds. Can be registered under the 1940 Act and sold to retail investors with lower minimums, but adds a <strong>second layer of fees<\/strong> and still carries the underlying funds' illiquidity and risk.<\/p>\n<p><strong>Suitability.<\/strong> Only for sophisticated, wealthy investors with high risk tolerance who can afford to lock up money and potentially lose it. Not for retail investors seeking liquidity or transparency.<\/p>\n<hr />\n<h2 id=\"s8-3\" data-sec=\"s8-3\"><span class=\"secnum\">8.3<\/span> Direct participation programs<\/h2>\n<p>A <strong>direct participation program (DPP)<\/strong> is a business — almost always a <strong>limited partnership (LP)<\/strong> (sometimes an LLC or S corporation) — that passes income, gains, <strong>losses<\/strong>, deductions and tax credits directly through to investors, avoiding corporate taxation. \"Direct participation\" means investors participate directly in the cash flow and tax consequences.<\/p>\n<p><strong>Structure.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Party<\/th>\n<th>Role<\/th>\n<th>Liability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>General partner (GP)<\/strong><\/td>\n<td>Manages the business, makes all decisions, has a fiduciary duty to the LPs, must keep at least a 1% interest, can't compete with the partnership<\/td>\n<td><strong>Unlimited<\/strong> personal liability<\/td>\n<\/tr>\n<tr>\n<td><strong>Limited partners (LPs)<\/strong><\/td>\n<td>Passive investors; provide capital; vote on major matters (sale of assets, change of GP, dissolution); may sue the GP; may inspect books<\/td>\n<td><strong>Limited<\/strong> to their investment (plus any recourse debt they agreed to) — but they must <strong>not<\/strong> participate in management or they risk losing limited status<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Documents: <strong>certificate of limited partnership<\/strong> (filed with the state), <strong>partnership agreement<\/strong>, and a <strong>subscription agreement<\/strong> that the investor signs and the GP must <strong>accept<\/strong> — the GP decides whether to admit an investor. Investors are usually required to disclose net worth and income because DPPs have suitability thresholds.<\/p>\n<p><strong>Types of programs.<\/strong><\/p>\n<ul>\n<li><strong>Real estate<\/strong> — raw land (speculative, appreciation only, no depreciation), new construction, existing properties (income + depreciation), government-assisted housing (tax credits).<\/li>\n<li><strong>Oil and gas<\/strong> — <strong>exploratory (\"wildcat\")<\/strong> programs (highest risk/reward), <strong>developmental<\/strong> (drilling near proven reserves), <strong>income<\/strong> programs (buy producing wells — lowest risk, immediate income), and combination programs. Tax benefits: <strong>intangible drilling costs (IDCs)<\/strong> are deductible immediately; <strong>depletion<\/strong> allowances for the resource used up.<\/li>\n<li><strong>Equipment leasing<\/strong> — buy equipment (aircraft, railcars, computers) and lease it; income plus depreciation deductions.<\/li>\n<li><strong>Other:<\/strong> cattle feeding, cable TV, agriculture.<\/li>\n<\/ul>\n<p><strong>Tax features.<\/strong><\/p>\n<ul>\n<li>Income and <strong>losses<\/strong> flow through to partners' personal returns (unlike REITs and corporations). Historically, large early-year losses from depreciation were the main attraction (\"tax shelters\").<\/li>\n<li>Since the 1986 tax reform, DPP losses are <strong>passive losses<\/strong> that can offset only <strong>passive income<\/strong> (from other DPPs or rental activities), not wages or portfolio income. Unused passive losses carry forward.<\/li>\n<li><strong>Depreciation<\/strong> (real estate, equipment) and <strong>depletion<\/strong> (oil, gas, minerals) are the main non-cash deductions.<\/li>\n<li><strong>Recapture<\/strong> — when the asset is sold, previously deducted depreciation may be taxed as ordinary income.<\/li>\n<li>An investor's <strong>cost basis<\/strong> = cash invested + share of recourse debt (and, for real estate, non-recourse debt). Losses can't exceed basis.<\/li>\n<li>At dissolution, assets are distributed in order: secured creditors → general creditors → limited partners → general partner.<\/li>\n<\/ul>\n<p><strong>Risks and drawbacks.<\/strong><\/p>\n<ul>\n<li><strong>Illiquidity<\/strong> — no secondary market to speak of; transferring an interest usually requires GP approval. This is the number-one risk tested.<\/li>\n<li>Long holding periods (often 7–15 years).<\/li>\n<li>Business risk of the venture; GP competence.<\/li>\n<li>Tax-law risk (benefits can be reduced by legislation); the IRS may challenge \"abusive\" shelters.<\/li>\n<li>Complex <strong>K-1<\/strong> tax reporting for investors.<\/li>\n<li>High upfront costs and fees.<\/li>\n<\/ul>\n<p><strong>Evaluating a DPP.<\/strong> Economic viability of the venture is the most important factor — a program should make sense as a business apart from tax benefits. Also consider the GP's track record, the program's objectives and timeline, start-up costs, and the ability to borrow/leverage.<\/p>\n<p><strong>Suitability.<\/strong> High net worth, high tax bracket investors who need passive income to shelter or want the specific asset exposure, have a long time horizon and can tolerate illiquidity. Most states and sponsors impose minimum income/net-worth standards. Not for investors who need liquidity, and the tax benefits are wasted in retirement accounts.<\/p>\n<p><strong>Comparison table — the exam's favorite.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>REIT<\/th>\n<th>Hedge fund<\/th>\n<th>DPP (LP)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Liquidity<\/td>\n<td>Listed: high; non-traded: low<\/td>\n<td>Low (lock-ups)<\/td>\n<td>Very low<\/td>\n<\/tr>\n<tr>\n<td>Passes through income<\/td>\n<td>Yes (90% rule)<\/td>\n<td>Yes (partnership)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Passes through <strong>losses<\/strong><\/td>\n<td><strong>No<\/strong><\/td>\n<td>Yes (partnership)<\/td>\n<td><strong>Yes<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Investor type<\/td>\n<td>Anyone (listed)<\/td>\n<td>Accredited only<\/td>\n<td>Usually net-worth minimums<\/td>\n<\/tr>\n<tr>\n<td>SEC registration<\/td>\n<td>Yes (public)<\/td>\n<td>No (Reg D)<\/td>\n<td>Public DPPs yes; private via Reg D<\/td>\n<\/tr>\n<tr>\n<td>1940 Act investment company?<\/td>\n<td>No<\/td>\n<td>No (exempt)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Management<\/td>\n<td>Corporate management<\/td>\n<td>GP/adviser<\/td>\n<td>General partner<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Chapter 8 quick review<\/h2>\n<ul>\n<li>REIT: equity / mortgage / hybrid; distribute ≥ <strong>90%<\/strong> of income and ≥ 75% in real estate to avoid corporate tax; dividends taxed as ordinary income; <strong>no loss pass-through<\/strong>; listed REITs liquid, non-traded REITs illiquid with high fees; not a 1940 Act investment company.<\/li>\n<li>Hedge fund: private LP, Reg D, accredited investors only, lock-ups, 2-and-20 fees, leverage/shorting/derivatives, little disclosure; fund of hedge funds adds a layer of fees but can be sold to retail.<\/li>\n<li>DPP: limited partnership; GP manages with unlimited liability; LPs passive with limited liability (lose it if they manage); subscription agreement must be accepted by the GP; income <strong>and losses<\/strong> flow through (passive losses offset only passive income); depreciation/depletion/IDCs; <strong>illiquid<\/strong>; evaluate economic viability first; dissolution: secured creditors → general creditors → LPs → GP.<\/li>\n<li>Oil &amp; gas: exploratory (riskiest), developmental, income (safest).<\/li>\n<\/ul>"}, {"num": 9, "name": "Options", "file": "09-options.md", "minutes": 12, "sections": [{"id": "s9-1", "num": "9.1", "title": "Fundamentals", "level": 2}, {"id": "s9-2", "num": "9.2", "title": "Contracts and the market", "level": 2}, {"id": "s9-2-1", "num": "9.2.1", "title": "Issuance & the market", "level": 3}, {"id": "s9-2-2", "num": "9.2.2", "title": "Options contracts", "level": 3}, {"id": "s9-2-3", "num": "9.2.3", "title": "Premiums & exercise", "level": 3}, {"id": "s9-2-4", "num": "9.2.4", "title": "Stock split & dividend adjustments", "level": 3}, {"id": "s9-3", "num": "9.3", "title": "Strategies", "level": 2}, {"id": "s9-3-1", "num": "9.3.1", "title": "Long calls", "level": 3}, {"id": "s9-3-2", "num": "9.3.2", "title": "Short calls", "level": 3}, {"id": "s9-3-3", "num": "9.3.3", "title": "Long puts", "level": 3}, {"id": "s9-3-4", "num": "9.3.4", "title": "Short puts", "level": 3}, {"id": "s9-3-5", "num": "9.3.5", "title": "Hedging strategies", "level": 3}, {"id": "s9-3-6", "num": "9.3.6", "title": "Income strategies", "level": 3}, {"id": "s9-3-7", "num": "9.3.7", "title": "Index options", "level": 3}], "html": "\n<blockquote>\n<p>Options are tested at a basic level on the SIE — definitions, the four basic positions (max gain/loss/breakeven), simple hedging and income strategies, and index option basics. You don't need advanced spreads/straddles. Learn the four-position table cold.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s9-1\" data-sec=\"s9-1\"><span class=\"secnum\">9.1<\/span> Fundamentals<\/h2>\n<p>An <strong>option<\/strong> is a contract giving the buyer the <strong>right<\/strong> (not the obligation) to buy or sell a specific amount of an underlying asset at a set price within a set period. The seller (writer) takes on the <strong>obligation<\/strong> to fulfill the contract if the buyer exercises. Options are <strong>derivatives<\/strong> — their value derives from the underlying security.<\/p>\n<p><strong>Two types of contracts.<\/strong><\/p>\n<ul>\n<li><strong>Call<\/strong> — the right to <strong>buy<\/strong> the underlying at the strike price. Buyers of calls are <strong>bullish<\/strong>.<\/li>\n<li><strong>Put<\/strong> — the right to <strong>sell<\/strong> the underlying at the strike price. Buyers of puts are <strong>bearish<\/strong>.<\/li>\n<\/ul>\n<p><strong>Two sides of every contract.<\/strong><\/p>\n<ul>\n<li><strong>Buyer (holder, long)<\/strong> — pays the <strong>premium<\/strong>; has rights; risk is limited to the premium paid.<\/li>\n<li><strong>Seller (writer, short)<\/strong> — receives the premium; has obligations; takes on risk in exchange for income.<\/li>\n<\/ul>\n<p><strong>Contract terms (standard equity option).<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Underlying<\/strong><\/td>\n<td>The stock (e.g., XYZ)<\/td>\n<\/tr>\n<tr>\n<td><strong>Contract size<\/strong><\/td>\n<td><strong>100 shares<\/strong> per contract<\/td>\n<\/tr>\n<tr>\n<td><strong>Strike (exercise) price<\/strong><\/td>\n<td>The price at which the stock is bought/sold if exercised<\/td>\n<\/tr>\n<tr>\n<td><strong>Expiration<\/strong><\/td>\n<td>Standard monthly options expire on the <strong>third Friday<\/strong> of the month (trading stops at 4:00 pm ET that day; exercise cut-off 5:30 pm ET). Weeklies and LEAPS (up to 39 months) also exist.<\/td>\n<\/tr>\n<tr>\n<td><strong>Premium<\/strong><\/td>\n<td>The price of the option, quoted per share; multiply by 100 for the contract cost. A premium of 3 = $300.<\/td>\n<\/tr>\n<tr>\n<td><strong>Style<\/strong><\/td>\n<td><strong>American<\/strong> (exercise any time before expiration — all equity options) vs. <strong>European<\/strong> (exercise only at expiration — most index options)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Reading an option:<\/strong> \"Buy 1 XYZ Jan 50 call @ 3\" = the buyer pays $300 for the right to buy 100 shares of XYZ at $50 any time until the January expiration.<\/p>\n<p><strong>The four basic positions and market sentiment.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Position<\/th>\n<th>Sentiment<\/th>\n<th>Right/obligation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Long call<\/td>\n<td>Bullish<\/td>\n<td>Right to buy<\/td>\n<\/tr>\n<tr>\n<td>Short call<\/td>\n<td>Bearish (or neutral)<\/td>\n<td>Obligation to sell<\/td>\n<\/tr>\n<tr>\n<td>Long put<\/td>\n<td>Bearish<\/td>\n<td>Right to sell<\/td>\n<\/tr>\n<tr>\n<td>Short put<\/td>\n<td>Bullish (or neutral)<\/td>\n<td>Obligation to buy<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why use options?<\/strong> Speculation with leverage (control 100 shares for a small premium), <strong>hedging<\/strong> an existing position (insurance), and generating <strong>income<\/strong> (writing options). Options are a <strong>zero-sum game<\/strong> — the buyer's gain is the writer's loss and vice versa.<\/p>\n<hr />\n<h2 id=\"s9-2\" data-sec=\"s9-2\"><span class=\"secnum\">9.2<\/span> Contracts and the market<\/h2>\n<h3 id=\"s9-2-1\" data-sec=\"s9-2-1\"><span class=\"secnum\">9.2.1<\/span> Issuance &amp; the market<\/h3>\n<ul>\n<li>Listed options are <strong>issued and guaranteed by the Options Clearing Corporation (OCC)<\/strong>, which stands between every buyer and seller, eliminating counterparty risk. The OCC sets standardized terms (strikes, expirations). There is no \"issuer\" in the corporate sense — the OCC creates contracts as buyers and sellers are matched.<\/li>\n<li>Options trade on exchanges, chiefly the <strong>Cboe (Chicago Board Options Exchange)<\/strong>, plus NYSE Arca, Nasdaq PHLX, ISE and others. Options are <strong>not<\/strong> registered under the 1933 Act with a traditional prospectus; instead, investors must receive the <strong>Options Disclosure Document (ODD)<\/strong> — <em>Characteristics and Risks of Standardized Options<\/em> — at or before account approval.<\/li>\n<li><strong>Settlement of option trades: T+1<\/strong> (regular way). Exercise of an equity option results in a stock transaction that settles <strong>T+1<\/strong> as well.<\/li>\n<li>Options are <strong>wasting assets<\/strong> — their time value declines as expiration approaches and they are worthless if they expire out of the money.<\/li>\n<li>Open interest = number of contracts outstanding.<\/li>\n<\/ul>\n<h3 id=\"s9-2-2\" data-sec=\"s9-2-2\"><span class=\"secnum\">9.2.2<\/span> Options contracts<\/h3>\n<p><strong>In, at, out of the money<\/strong> — depends only on the strike vs. the stock price (premium is ignored).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Call<\/th>\n<th>Put<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>In the money (ITM)<\/strong><\/td>\n<td>Stock price <strong>above<\/strong> strike<\/td>\n<td>Stock price <strong>below<\/strong> strike<\/td>\n<\/tr>\n<tr>\n<td><strong>At the money<\/strong><\/td>\n<td>Stock = strike<\/td>\n<td>Stock = strike<\/td>\n<\/tr>\n<tr>\n<td><strong>Out of the money (OTM)<\/strong><\/td>\n<td>Stock price below strike<\/td>\n<td>Stock price above strike<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Mnemonic: <strong>Call Up, Put Down<\/strong> — a call is in the money when the stock is up above the strike; a put is in the money when the stock is down below the strike.<\/p>\n<p><strong>Intrinsic value<\/strong> = the amount by which the option is in the money (never negative).<\/p>\n<ul>\n<li>Call intrinsic value = stock price − strike (if positive).<\/li>\n<li>Put intrinsic value = strike − stock price (if positive).<\/li>\n<\/ul>\n<p><strong>Time value<\/strong> = premium − intrinsic value. Reflects the time remaining and the stock's volatility. At expiration, time value is zero and the option is worth exactly its intrinsic value.<\/p>\n<p><strong>Example.<\/strong> XYZ is at $54. An XYZ 50 call trades at 6. Intrinsic value = 54 − 50 = 4; time value = 6 − 4 = <strong>2<\/strong>. An XYZ 50 put trading at 1 has intrinsic value 0 (out of the money) and time value 1.<\/p>\n<p><strong>Factors that increase a premium:<\/strong> more time to expiration, higher volatility of the underlying, deeper in the money. For calls, higher interest rates and lower dividends; for puts, the opposite.<\/p>\n<h3 id=\"s9-2-3\" data-sec=\"s9-2-3\"><span class=\"secnum\">9.2.3<\/span> Premiums &amp; exercise<\/h3>\n<p><strong>Three ways to close an option position.<\/strong><\/p>\n<ol>\n<li><strong>Let it expire<\/strong> — buyer loses the premium; writer keeps it. Most common for OTM options.<\/li>\n<li><strong>Closing transaction<\/strong> — buyer sells the option (<strong>closing sale<\/strong>); writer buys it back (<strong>closing purchase<\/strong>). Most common way to realize a profit.<\/li>\n<li><strong>Exercise<\/strong> — buyer exercises the right; the OCC assigns a writer (randomly, and the firm then assigns a customer by random selection, first-in-first-out or another fair method — never on a \"largest position\" basis). The buyer/holder is the <strong>only<\/strong> party who can exercise.<\/li>\n<\/ol>\n<p><strong>Automatic exercise.<\/strong> The OCC automatically exercises equity options that are in the money by <strong>$0.01 or more<\/strong> at expiration unless the holder instructs otherwise.<\/p>\n<p><strong>Exercise mechanics.<\/strong> Exercising a call: the holder pays strike × 100 and receives 100 shares; the assigned writer delivers the shares. Exercising a put: the holder delivers 100 shares and receives strike × 100; the assigned writer must buy. Stock delivered from an exercise settles T+1.<\/p>\n<p><strong>Tax basics.<\/strong> Premiums are capital in nature. A buyer who lets an option expire has a capital loss equal to the premium; a writer whose option expires has a short-term capital gain. When a call is exercised, the premium adjusts the stock's cost (buyer's cost basis = strike + premium; writer's sale proceeds = strike + premium). When a put is exercised, the buyer's sale proceeds = strike − premium; the writer's cost basis = strike − premium.<\/p>\n<h3 id=\"s9-2-4\" data-sec=\"s9-2-4\"><span class=\"secnum\">9.2.4<\/span> Stock split &amp; dividend adjustments<\/h3>\n<p>The OCC adjusts option contracts for corporate actions so neither side is harmed.<\/p>\n<ul>\n<li><strong>Even forward splits (2:1, 3:1, etc.)<\/strong> — the <strong>number of contracts<\/strong> is multiplied and the <strong>strike<\/strong> is divided. 1 XYZ 60 call after a 2:1 split → <strong>2 XYZ 30 calls<\/strong>, each still for 100 shares.<\/li>\n<li><strong>Uneven splits (3:2, 5:4) and stock dividends<\/strong> — the number of contracts stays the same, the <strong>number of shares per contract<\/strong> increases and the strike is reduced proportionally. 1 XYZ 60 call after a 3:2 split → 1 XYZ 40 call covering <strong>150 shares<\/strong>.<\/li>\n<li><strong>Reverse splits<\/strong> — shares per contract decrease, strike increases.<\/li>\n<li><strong>Cash dividends<\/strong> — <strong>no adjustment<\/strong> for ordinary cash dividends (only for unusually large/special dividends). The stock price drops by the dividend on the ex-date, which hurts call holders and helps put holders.<\/li>\n<\/ul>\n<p>The total value of the position (contracts × shares × strike) is unchanged by any adjustment.<\/p>\n<hr />\n<h2 id=\"s9-3\" data-sec=\"s9-3\"><span class=\"secnum\">9.3<\/span> Strategies<\/h2>\n<p>For each of the four basic positions, know: sentiment, maximum gain, maximum loss, and breakeven. Premiums are per share; multiply by 100 for dollar totals.<\/p>\n<h3 id=\"s9-3-1\" data-sec=\"s9-3-1\"><span class=\"secnum\">9.3.1<\/span> Long calls<\/h3>\n<p>Buy a call → <strong>bullish<\/strong>. Right to buy at the strike.<\/p>\n<ul>\n<li><strong>Maximum loss:<\/strong> the premium paid.<\/li>\n<li><strong>Maximum gain:<\/strong> unlimited (stock can rise forever).<\/li>\n<li><strong>Breakeven:<\/strong> strike + premium.<\/li>\n<li>Profits when the stock rises above the breakeven by expiration.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> Buy 1 ABC Mar 40 call @ 2. Max loss $200. Breakeven $42. If ABC rises to $50 and the holder exercises and sells the stock: buy at 40, sell at 50 = $1,000 gain − $200 premium = <strong>$800 profit<\/strong>. Used for leveraged speculation or to lock in a purchase price.<\/p>\n<h3 id=\"s9-3-2\" data-sec=\"s9-3-2\"><span class=\"secnum\">9.3.2<\/span> Short calls<\/h3>\n<p>Write (sell) a call → <strong>bearish/neutral<\/strong>. Obligation to sell at the strike if assigned.<\/p>\n<ul>\n<li><strong>Maximum gain:<\/strong> the premium received.<\/li>\n<li><strong>Maximum loss:<\/strong> <strong>unlimited<\/strong> if <strong>uncovered (naked)<\/strong> — the writer may have to buy stock at any price to deliver. (If <strong>covered<\/strong> — the writer owns the stock — the risk is the downside of the stock, cushioned by the premium.)<\/li>\n<li><strong>Breakeven:<\/strong> strike + premium (same as the long call; the writer profits below it).<\/li>\n<\/ul>\n<p>Naked call writing is the <strong>riskiest<\/strong> basic option strategy and requires a margin account and the highest level of option approval.<\/p>\n<h3 id=\"s9-3-3\" data-sec=\"s9-3-3\"><span class=\"secnum\">9.3.3<\/span> Long puts<\/h3>\n<p>Buy a put → <strong>bearish<\/strong>. Right to sell at the strike.<\/p>\n<ul>\n<li><strong>Maximum loss:<\/strong> the premium.<\/li>\n<li><strong>Maximum gain:<\/strong> strike − premium (stock can only fall to zero).<\/li>\n<li><strong>Breakeven:<\/strong> strike − premium.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> Buy 1 XYZ Jun 50 put @ 3. Max loss $300. Breakeven $47. Max gain $4,700 (if XYZ goes to 0). A long put is the alternative to selling short with limited risk.<\/p>\n<h3 id=\"s9-3-4\" data-sec=\"s9-3-4\"><span class=\"secnum\">9.3.4<\/span> Short puts<\/h3>\n<p>Write a put → <strong>bullish/neutral<\/strong>. Obligation to buy at the strike if assigned.<\/p>\n<ul>\n<li><strong>Maximum gain:<\/strong> the premium.<\/li>\n<li><strong>Maximum loss:<\/strong> strike − premium (stock can fall to zero and the writer must still buy at the strike).<\/li>\n<li><strong>Breakeven:<\/strong> strike − premium.<\/li>\n<\/ul>\n<p>A short put is \"covered\" if the writer has cash equal to the strike (cash-secured put) or is short the stock. Some investors write puts to buy a stock they like at a lower effective price.<\/p>\n<h3>Summary table (memorize)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Position<\/th>\n<th>Sentiment<\/th>\n<th>Max gain<\/th>\n<th>Max loss<\/th>\n<th>Breakeven<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Long call<\/strong><\/td>\n<td>Bullish<\/td>\n<td>Unlimited<\/td>\n<td>Premium<\/td>\n<td>Strike + premium<\/td>\n<\/tr>\n<tr>\n<td><strong>Short call<\/strong><\/td>\n<td>Bearish<\/td>\n<td>Premium<\/td>\n<td>Unlimited (naked)<\/td>\n<td>Strike + premium<\/td>\n<\/tr>\n<tr>\n<td><strong>Long put<\/strong><\/td>\n<td>Bearish<\/td>\n<td>Strike − premium<\/td>\n<td>Premium<\/td>\n<td>Strike − premium<\/td>\n<\/tr>\n<tr>\n<td><strong>Short put<\/strong><\/td>\n<td>Bullish<\/td>\n<td>Premium<\/td>\n<td>Strike − premium<\/td>\n<td>Strike − premium<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rules of thumb: <strong>Calls → add<\/strong> the premium to the strike for breakeven; <strong>puts → subtract<\/strong>. Buyers' max loss = premium; writers' max gain = premium. The buyer's max gain is the writer's max loss.<\/p>\n<h3 id=\"s9-3-5\" data-sec=\"s9-3-5\"><span class=\"secnum\">9.3.5<\/span> Hedging strategies<\/h3>\n<p>Options as <strong>insurance<\/strong> for a stock position.<\/p>\n<ul>\n<li><strong>Protective put (married put):<\/strong> own stock + <strong>buy a put<\/strong>. Protects against a decline — the put locks in a minimum sale price (the strike). Cost: the premium. Maximum loss = (stock cost − strike) + premium; upside unlimited (minus the premium). The best hedge for a long stock position. Breakeven = stock cost + premium.<\/li>\n<li><strong>Protective call:<\/strong> short stock + <strong>buy a call<\/strong>. Protects a short seller against a rise — caps the repurchase price at the strike. Max loss = (strike − short sale price) + premium. The best hedge for a short stock position.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> An investor bought XYZ at $50 and buys an XYZ 45 put @ 2. Worst case: she puts the stock at 45, losing $5/share plus the $2 premium = max loss <strong>$700<\/strong>. Breakeven = $52.<\/p>\n<h3 id=\"s9-3-6\" data-sec=\"s9-3-6\"><span class=\"secnum\">9.3.6<\/span> Income strategies<\/h3>\n<ul>\n<li><strong>Covered call:<\/strong> own stock + <strong>write a call<\/strong>. The writer collects premium income and is willing to sell the stock at the strike. Appropriate for a <strong>neutral to mildly bullish<\/strong> outlook on stock already owned. It is the <strong>most conservative option strategy<\/strong> and the one most commonly permitted in retirement accounts and basic-level option accounts.<\/li>\n<li>Max gain = (strike − stock cost) + premium.<\/li>\n<li>Max loss = stock cost − premium (stock goes to zero).<\/li>\n<li>Breakeven = stock cost − premium.<\/li>\n<li>Downside: upside above the strike is <strong>given up<\/strong> (the stock gets called away).<\/li>\n<li><strong>Covered put:<\/strong> short stock + write a put. Income on a short position; rare.<\/li>\n<li><strong>Cash-secured put:<\/strong> write a put while holding cash to buy the stock if assigned — a way to earn income while waiting to buy a stock at a lower price.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> Investor owns 100 XYZ bought at $48, writes an XYZ 50 call @ 3. Max gain = (50 − 48) + 3 = $5 × 100 = <strong>$500<\/strong>. Breakeven = 48 − 3 = <strong>$45<\/strong>. Max loss = $4,500.<\/p>\n<h3 id=\"s9-3-7\" data-sec=\"s9-3-7\"><span class=\"secnum\">9.3.7<\/span> Index options<\/h3>\n<p>Options on a stock index (S&amp;P 500 — SPX, S&amp;P 100 — OEX, Nasdaq-100 — NDX, Russell 2000, VIX) rather than a single stock.<\/p>\n<ul>\n<li><strong>Cash settled<\/strong> — no stock changes hands. On exercise, the ITM amount × the multiplier (<strong>$100<\/strong>) is paid in cash the next business day (T+1).<\/li>\n<li>Most broad-based index options are <strong>European style<\/strong> (exercisable only at expiration); some (OEX) are American.<\/li>\n<li>Settlement value is typically based on the index's <strong>closing<\/strong> value on the exercise day (or the opening value for a.m.-settled options).<\/li>\n<li>Used to <strong>hedge a diversified portfolio<\/strong> (buy index puts) or to speculate on the overall market without picking stocks.<\/li>\n<li>Index options have the same max gain/loss rules as equity options; a broad-based index put is the classic portfolio hedge.<\/li>\n<li>Trade mostly on the Cboe; broad-based index options get favorable 60/40 tax treatment (60% long-term, 40% short-term) regardless of holding period.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> An investor with a $500,000 diversified portfolio buys S&amp;P 500 puts to protect against a market drop. If the index falls 10%, the puts gain roughly enough to offset the portfolio's loss (minus the premium paid).<\/p>\n<p><strong>Other option types (just recognize):<\/strong> <strong>LEAPS<\/strong> (long-term, up to 39 months), <strong>foreign currency options<\/strong> (hedge exchange-rate risk; the OCC issues them too), <strong>interest rate/yield-based options<\/strong>, options on ETFs (physically settled like equity options).<\/p>\n<hr />\n<h2>Chapter 9 quick review<\/h2>\n<ul>\n<li>Call = right to buy; put = right to sell. Buyer pays premium and has rights; writer receives premium and has obligations. 100 shares per contract; premium × 100 = cost.<\/li>\n<li>Expiration: third Friday; equity options American style; index options usually European and <strong>cash settled<\/strong> ($100 multiplier).<\/li>\n<li>OCC issues/guarantees all listed options; ODD must be delivered before approval; options trades settle T+1.<\/li>\n<li>ITM: call when stock &gt; strike; put when stock &lt; strike. Intrinsic value = ITM amount; time value = premium − intrinsic.<\/li>\n<li>Auto-exercise at $0.01 ITM. Assignment random/FIFO, never largest first.<\/li>\n<li>Even splits: more contracts, lower strike. Uneven splits/stock dividends: more shares per contract. Cash dividends: no adjustment.<\/li>\n<li>The four-position table: buyers risk the premium; naked call writers face unlimited loss; put writers' max loss = strike − premium. Calls add premium for breakeven, puts subtract.<\/li>\n<li>Hedges: long stock → buy put; short stock → buy call. Income: long stock → write call (covered call = most conservative, caps upside).<\/li>\n<li>Index options hedge whole portfolios; cash settled next business day.<\/li>\n<\/ul>"}, {"num": 10, "name": "Taxes", "file": "10-taxes.md", "minutes": 9, "sections": [{"id": "s10-1", "num": "10.1", "title": "Dividends", "level": 2}, {"id": "s10-2", "num": "10.2", "title": "Interest", "level": 2}, {"id": "s10-3", "num": "10.3", "title": "Capital gains", "level": 2}, {"id": "s10-4", "num": "10.4", "title": "Types of income", "level": 2}], "html": "\n<blockquote>\n<p>Investment taxation is sprinkled throughout the exam — in questions about munis, Treasuries, mutual funds, retirement plans and gifts. This chapter consolidates the rules. Numbers below are the 2026 figures; the SIE tests concepts more than exact dollar thresholds.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s10-1\" data-sec=\"s10-1\"><span class=\"secnum\">10.1<\/span> Dividends<\/h2>\n<p><strong>Cash dividends<\/strong> are taxable in the year received, whether taken in cash or reinvested.<\/p>\n<ul>\n<li><strong>Qualified dividends<\/strong> — paid by US corporations (and qualifying foreign corporations) on stock held for more than 60 days around the ex-dividend date. Taxed at the <strong>long-term capital gains rates (0%, 15% or 20%<\/strong> depending on income).<\/li>\n<li><strong>Non-qualified (ordinary) dividends<\/strong> — taxed as <strong>ordinary income<\/strong> at the investor's marginal rate. Includes dividends from REITs, money market funds, most bond fund \"dividends\" (which are really interest), and short-term capital gains distributions from mutual funds.<\/li>\n<li><strong>Stock dividends and stock splits<\/strong> — <strong>not taxable<\/strong> when received; the investor's cost basis per share is adjusted downward (total basis spread over more shares). Tax applies only when the shares are sold.<\/li>\n<li><strong>Corporate recipients<\/strong> — a corporation that receives dividends from another domestic corporation can exclude a portion (the <strong>dividends-received deduction<\/strong>, generally 50%, or 65% if it owns 20%+ of the payer) from taxable income. This is why preferred stock is popular with corporate investors.<\/li>\n<li><strong>Dividends from mutual funds<\/strong> — reported on Form <strong>1099-DIV<\/strong>; long-term capital gains distributions are long-term to the shareholder no matter how long the fund shares were held.<\/li>\n<li><strong>Foreign dividends<\/strong> — foreign taxes withheld can usually be claimed as a <strong>foreign tax credit<\/strong> on the US return.<\/li>\n<li>Brokerage firms report dividends to the IRS and investors on <strong>Form 1099-DIV<\/strong>; interest on <strong>1099-INT<\/strong>; sales proceeds and cost basis on <strong>1099-B<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s10-2\" data-sec=\"s10-2\"><span class=\"secnum\">10.2<\/span> Interest<\/h2>\n<table>\n<thead>\n<tr>\n<th>Source<\/th>\n<th>Federal tax<\/th>\n<th>State/local tax<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Corporate bonds<\/strong>, CDs, bank accounts, money market funds, commercial paper<\/td>\n<td>Taxable (ordinary income)<\/td>\n<td>Taxable<\/td>\n<\/tr>\n<tr>\n<td><strong>US Treasuries<\/strong> (bills, notes, bonds, TIPS, STRIPS, savings bonds) and most <strong>federal agencies<\/strong> (FHLB, Farm Credit)<\/td>\n<td>Taxable<\/td>\n<td><strong>Exempt<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ginnie Mae, Fannie Mae, Freddie Mac<\/strong> (mortgage-backed)<\/td>\n<td>Taxable<\/td>\n<td>Taxable<\/td>\n<\/tr>\n<tr>\n<td><strong>Municipal bonds<\/strong><\/td>\n<td><strong>Exempt<\/strong> (except private activity bonds subject to AMT and taxable munis)<\/td>\n<td>Exempt in the state of issue (usually); territory bonds exempt everywhere<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Original issue discount (OID).<\/strong> When a bond is issued below par (zero-coupon bonds are the extreme), the discount is treated as interest that <strong>accretes<\/strong> each year. For corporate and Treasury zeros, this accreted amount is <strong>taxable each year<\/strong> even though no cash is received (\"<strong>phantom income<\/strong>\"). The cost basis rises by the accretion, so there's no capital gain if held to maturity. For municipal OID, the accretion is tax-exempt interest. Zeros are therefore best held in tax-deferred accounts.<\/p>\n<p><strong>Market discount.<\/strong> A bond bought below par in the secondary market: the discount is taxed as <strong>ordinary interest income<\/strong> when the bond is sold or matures (or the investor may elect to accrue it annually). Applies even to munis.<\/p>\n<p><strong>Premium bonds.<\/strong> Taxable bonds bought above par: the investor may <strong>amortize<\/strong> the premium annually (reducing basis and reducing taxable interest). For tax-exempt munis, amortization is <strong>required<\/strong> and the amortized premium is <strong>not deductible<\/strong>.<\/p>\n<p><strong>Accrued interest<\/strong> paid to a seller is deducted from the buyer's first interest payment for tax purposes; the seller reports it as interest income.<\/p>\n<p><strong>Series EE and I savings bonds<\/strong> — interest is tax-deferred until redemption and may be entirely federally tax-free if used for qualified higher-education expenses (income limits apply).<\/p>\n<hr />\n<h2 id=\"s10-3\" data-sec=\"s10-3\"><span class=\"secnum\">10.3<\/span> Capital gains<\/h2>\n<p>A <strong>capital gain or loss<\/strong> is realized when a capital asset (stock, bond, fund share, option, real estate) is <strong>sold<\/strong> — not while it's merely appreciating (\"unrealized\" gains are not taxed).<\/p>\n<pre><code>Gain (loss) = Sale proceeds (net of commissions) − Cost basis\n<\/code><\/pre>\n<p><strong>Cost basis<\/strong> = purchase price + commissions/fees paid (plus reinvested distributions for funds). Brokers report basis on Form 1099-B for covered securities.<\/p>\n<p><strong>Holding period — the critical distinction.<\/strong><\/p>\n<ul>\n<li><strong>Short-term<\/strong> — held <strong>one year or less<\/strong>. Taxed as <strong>ordinary income<\/strong>.<\/li>\n<li><strong>Long-term<\/strong> — held <strong>more than one year<\/strong>. Taxed at the preferential rates of <strong>0%, 15% or 20%<\/strong> (plus a 3.8% net investment income tax for high earners).<\/li>\n<\/ul>\n<p>The holding period starts the day <strong>after<\/strong> the trade date of the purchase and ends on the trade date of the sale.<\/p>\n<p><strong>Netting rules.<\/strong> Each year, short-term gains and losses are netted; long-term gains and losses are netted; then the two results are netted against each other.<\/p>\n<ul>\n<li>Net capital losses can offset capital gains without limit.<\/li>\n<li>After that, up to <strong>$3,000<\/strong> of net capital loss per year ($1,500 married filing separately) can be deducted against <strong>ordinary income<\/strong>.<\/li>\n<li>Any remaining loss is <strong>carried forward<\/strong> indefinitely to future years (keeping its short/long character).<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> An investor has $10,000 of long-term gains and $18,000 of short-term losses. Net = $8,000 loss. $3,000 is deducted against ordinary income this year; $5,000 carries forward.<\/p>\n<p><strong>Wash sale rule.<\/strong> If an investor sells a security at a <strong>loss<\/strong> and buys the <strong>same or a substantially identical<\/strong> security within <strong>30 days before or after<\/strong> the sale (a 61-day window), the loss is <strong>disallowed<\/strong> for tax purposes. The disallowed loss is <strong>added to the cost basis<\/strong> of the new shares (it isn't lost forever, just deferred). \"Substantially identical\" includes the same stock, options or warrants on it, convertible bonds/preferred convertible into it, and the same mutual fund. Buying a different company in the same industry is <strong>not<\/strong> a wash sale. The rule doesn't apply to gains.<\/p>\n<p><strong>Determining which shares were sold<\/strong> (for partial sales of a position bought at different times/prices):<\/p>\n<ul>\n<li><strong>FIFO (first-in, first-out)<\/strong> — the IRS default; usually produces the largest gain in a rising market.<\/li>\n<li><strong>Specific identification<\/strong> — the investor tells the broker which lot to sell; most flexible for tax management (sell the highest-cost lot to minimize the gain).<\/li>\n<li><strong>Average cost<\/strong> — permitted for mutual fund shares.<\/li>\n<\/ul>\n<p><strong>Gifts and inheritances.<\/strong><\/p>\n<ul>\n<li><strong>Gifted securities:<\/strong> the recipient takes the donor's <strong>cost basis and holding period<\/strong> (carryover basis). Exception: if the stock has declined below the donor's basis at the time of the gift, the recipient's basis for a loss is the fair market value at the gift date. The donor may give up to the <strong>annual gift tax exclusion (2026: $19,000 per recipient; $38,000 for a married couple)<\/strong> without filing a gift tax return; larger gifts use up part of the lifetime estate/gift exemption. Gifts between spouses are unlimited and untaxed.<\/li>\n<li><strong>Inherited securities:<\/strong> the heir's basis is <strong>stepped up (or down) to the fair market value on the date of death<\/strong>, and the holding period is <strong>automatically long-term<\/strong> regardless of how long the deceased or heir held it. This \"step-up\" erases the unrealized gain. The estate may owe estate tax if it exceeds the exemption (2026: about $15 million per person).<\/li>\n<\/ul>\n<p><strong>Other capital-gain items.<\/strong><\/p>\n<ul>\n<li><strong>Mutual fund exchanges<\/strong> within a family are taxable sales.<\/li>\n<li><strong>Bond conversion<\/strong> to stock is not a taxable event.<\/li>\n<li><strong>Options:<\/strong> expired options are capital gains/losses; exercised options adjust the stock's basis or proceeds (Chapter 9).<\/li>\n<li><strong>Broad-based index options, futures:<\/strong> 60% long-term / 40% short-term regardless of holding period.<\/li>\n<li><strong>Collectibles<\/strong> (precious metal coins, art) long-term gains are taxed at a maximum 28%.<\/li>\n<li><strong>Return of capital<\/strong> distributions (common with REITs, MLPs, some funds) are not taxed when received; they <strong>reduce cost basis<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s10-4\" data-sec=\"s10-4\"><span class=\"secnum\">10.4<\/span> Types of income<\/h2>\n<p>The tax code sorts income into three buckets, and losses from one bucket generally can't offset income in another.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Examples<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Earned (active) income<\/strong><\/td>\n<td>Wages, salaries, tips, bonuses, self-employment income<\/td>\n<td>Taxed at ordinary rates; the only income eligible for <strong>IRA contributions<\/strong>; subject to payroll (FICA) taxes<\/td>\n<\/tr>\n<tr>\n<td><strong>Portfolio (investment) income<\/strong><\/td>\n<td>Interest, dividends, capital gains, royalties<\/td>\n<td>Interest and non-qualified dividends taxed as ordinary income; qualified dividends and LT gains at preferential rates; capital losses offset portfolio gains (plus $3,000 of ordinary income)<\/td>\n<\/tr>\n<tr>\n<td><strong>Passive income<\/strong><\/td>\n<td>Income from <strong>limited partnerships/DPPs<\/strong>, rental real estate the investor doesn't actively manage, businesses in which the investor doesn't materially participate<\/td>\n<td><strong>Passive losses can offset only passive income<\/strong>, never earned or portfolio income; unused losses carry forward until the activity is sold<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Progressive taxation.<\/strong> The US income tax is <strong>progressive<\/strong> — higher income is taxed at higher <strong>marginal rates<\/strong> (brackets currently range from 10% to 37%). The <strong>marginal rate<\/strong> is the rate on the next dollar earned; the <strong>effective rate<\/strong> is total tax ÷ total income. <strong>Regressive<\/strong> taxes (sales tax, FICA up to the wage base) take a larger percentage of lower incomes. A <strong>flat tax<\/strong> charges one rate to everyone.<\/p>\n<p><strong>Alternative minimum tax (AMT).<\/strong> A parallel calculation that adds back certain \"preference items\" (including interest on <strong>private activity municipal bonds<\/strong>, accelerated depreciation, certain DPP deductions) to make sure high-income taxpayers pay a minimum amount. Investors subject to AMT should avoid private activity bonds.<\/p>\n<p><strong>Tax-advantaged vs. tax-deferred vs. tax-free.<\/strong><\/p>\n<ul>\n<li><strong>Tax-deferred<\/strong> — no tax now, taxed later (traditional IRA/401(k), annuity gains, savings bond interest). Growth compounds untaxed.<\/li>\n<li><strong>Tax-free (tax-exempt)<\/strong> — never taxed (Roth IRA qualified withdrawals, municipal bond interest, 529 qualified withdrawals).<\/li>\n<li><strong>Tax-advantaged<\/strong> — umbrella term for both.<\/li>\n<\/ul>\n<p><strong>Withholding and reporting.<\/strong><\/p>\n<ul>\n<li>Brokers must obtain a customer's <strong>Social Security/taxpayer ID number<\/strong> (Form W-9); if not provided, the firm must apply <strong>backup withholding (24%)<\/strong> on dividends, interest and sales proceeds.<\/li>\n<li>Foreign investors complete Form <strong>W-8BEN<\/strong>; US tax is withheld on dividends (often 30% or a treaty rate) but generally not on capital gains or portfolio interest.<\/li>\n<li>Tax year for individuals is the <strong>calendar year<\/strong>; returns due April 15. Securities sold by December 31 (trade date) count for that year, even though settlement may occur in January.<\/li>\n<\/ul>\n<p><strong>Tax strategies the exam may describe.<\/strong><\/p>\n<ul>\n<li><strong>Tax-loss harvesting<\/strong> — selling losers to offset gains (mind the wash sale rule).<\/li>\n<li><strong>Asset location<\/strong> — hold tax-inefficient assets (taxable bonds, REITs, zeros) in tax-deferred accounts and tax-efficient assets (index funds, munis) in taxable accounts.<\/li>\n<li><strong>Holding past one year<\/strong> to convert short-term to long-term treatment.<\/li>\n<li><strong>Gifting appreciated stock<\/strong> to charity (deduct FMV, avoid the gain) or to lower-bracket family members (subject to \"kiddie tax\" rules for children's unearned income).<\/li>\n<\/ul>\n<hr />\n<h2>Chapter 10 quick review<\/h2>\n<ul>\n<li>Qualified dividends &amp; long-term gains: 0/15/20%. Ordinary dividends, interest, short-term gains: ordinary rates. Stock dividends/splits: not taxable; basis adjusted.<\/li>\n<li>Treasuries: federal tax yes, state no. Munis: federal no, in-state usually no; private activity bonds → AMT. GNMA/FNMA/FHLMC: taxed at all levels.<\/li>\n<li>OID accretion on corporate/Treasury zeros is taxed annually (phantom income); muni OID is tax-free; market discount is ordinary income; muni premium must be amortized.<\/li>\n<li>Long-term = <strong>more than one year<\/strong>. Net losses: offset gains, then <strong>$3,000<\/strong>/yr vs. ordinary income, carry forward the rest.<\/li>\n<li><strong>Wash sale:<\/strong> loss disallowed if the same/substantially identical security is bought within <strong>30 days before or after<\/strong>; loss added to the new basis.<\/li>\n<li>Default lot method: FIFO; specific ID is most flexible; average cost allowed for funds.<\/li>\n<li><strong>Gift: donor's basis carries over.<\/strong> <strong>Inheritance: stepped-up basis to date-of-death value, automatically long-term.<\/strong> Annual gift exclusion $19,000 (2026).<\/li>\n<li>Earned income is required for IRA contributions. Passive losses offset only passive income.<\/li>\n<li>Progressive tax = higher brackets at higher income. Backup withholding 24% if no TIN. Trade date governs the tax year.<\/li>\n<\/ul>"}, {"num": 11, "name": "The Primary Market", "file": "11-the-primary-market.md", "minutes": 17, "sections": [{"id": "s11-1", "num": "11.1", "title": "Roles", "level": 2}, {"id": "s11-2", "num": "11.2", "title": "Underwriting commitments", "level": 2}, {"id": "s11-3", "num": "11.3", "title": "Types of offerings", "level": 2}, {"id": "s11-4", "num": "11.4", "title": "The IPO process", "level": 2}, {"id": "s11-4-1", "num": "11.4.1", "title": "Overview", "level": 3}, {"id": "s11-4-2", "num": "11.4.2", "title": "Preparing for the sale", "level": 3}, {"id": "s11-4-3", "num": "11.4.3", "title": "Effective registration", "level": 3}, {"id": "s11-4-4", "num": "11.4.4", "title": "Exemptions", "level": 3}, {"id": "s11-5", "num": "11.5", "title": "Rule 144", "level": 2}, {"id": "s11-6", "num": "11.6", "title": "Other rules", "level": 2}], "html": "\n<blockquote>\n<p>How new securities come to market: the players, underwriting commitments, types of offerings, the IPO process under the Securities Act of 1933, exemptions (Reg D, Reg A, Rule 147, 144A), Rule 144 for restricted/control stock, and the related FINRA rules (Rule 5130 on IPO allocations).<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s11-1\" data-sec=\"s11-1\"><span class=\"secnum\">11.1<\/span> Roles<\/h2>\n<p>The <strong>primary market<\/strong> is where an issuer sells new securities to investors for the first time and <strong>receives the proceeds<\/strong>. The transaction is governed by the <strong>Securities Act of 1933<\/strong> (the \"Paper Act\" / \"Truth in Securities Act\"), whose goals are full and fair disclosure (via registration and the prospectus) and the prevention of fraud in new issues.<\/p>\n<p><strong>Key participants.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Participant<\/th>\n<th>Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Issuer<\/strong><\/td>\n<td>The corporation, municipality or government selling the securities to raise capital<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment banker / underwriter<\/strong><\/td>\n<td>A broker-dealer that advises the issuer, helps structure and price the offering, and distributes the securities to investors<\/td>\n<\/tr>\n<tr>\n<td><strong>Managing (lead) underwriter / syndicate manager<\/strong><\/td>\n<td>The firm that leads the deal, forms the syndicate, runs the books, and handles the stabilizing bid<\/td>\n<\/tr>\n<tr>\n<td><strong>Syndicate<\/strong><\/td>\n<td>A group of underwriters that share the risk and distribution; bound by the <strong>agreement among underwriters (syndicate agreement)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Selling group<\/strong><\/td>\n<td>Broker-dealers that help sell the issue but take <strong>no underwriting risk<\/strong> (act as agents for a concession)<\/td>\n<\/tr>\n<tr>\n<td><strong>Securities and Exchange Commission (SEC)<\/strong><\/td>\n<td>Reviews the registration statement for <strong>completeness<\/strong> (not merit); never approves or guarantees an offering<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer agent / registrar<\/strong><\/td>\n<td>Issue and record ownership of the new shares<\/td>\n<\/tr>\n<tr>\n<td><strong>Legal counsel, auditors<\/strong><\/td>\n<td>Due diligence, legal opinions, audited financials<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The underwriting spread<\/strong> — the difference between the public offering price and what the issuer receives — is split into:<\/p>\n<ul>\n<li><strong>Manager's fee<\/strong> (smallest piece, to the lead for running the deal),<\/li>\n<li><strong>Underwriting (syndicate) fee<\/strong> (to all syndicate members for taking risk),<\/li>\n<li><strong>Selling concession<\/strong> (largest piece, to whoever sells the shares — syndicate members or the selling group).<\/li>\n<\/ul>\n<p>A selling group member earns only the concession; a syndicate member that sells earns the underwriting fee plus the concession; the manager earns all three on shares it sells.<\/p>\n<hr />\n<h2 id=\"s11-2\" data-sec=\"s11-2\"><span class=\"secnum\">11.2<\/span> Underwriting commitments<\/h2>\n<p>The underwriting agreement between the issuer and the syndicate specifies how much risk the underwriters take.<\/p>\n<p><strong>Firm commitment<\/strong> — the underwriters <strong>buy the entire issue from the issuer<\/strong> and resell it to the public. They act as <strong>principals<\/strong> and bear the full risk of unsold shares. The issuer is guaranteed its money. This is the most common arrangement for corporate IPOs and most negotiated offerings.<\/p>\n<ul>\n<li><strong>Standby<\/strong> underwriting — a form of firm commitment used with a <strong>rights offering<\/strong>: the underwriter agrees to buy any shares existing shareholders don't subscribe for.<\/li>\n<\/ul>\n<p><strong>Best efforts<\/strong> — the underwriters act as <strong>agents<\/strong>, selling as much as they can and returning unsold shares to the issuer. No risk of ownership for the underwriter; the issuer bears the risk that not all shares sell. Variations:<\/p>\n<ul>\n<li><strong>All-or-none (AON)<\/strong> — the entire issue must sell or the offering is cancelled and investors' money is returned. Funds are held in escrow until completion.<\/li>\n<li><strong>Mini-max<\/strong> — a minimum amount must be sold for the deal to go forward; the underwriter may then sell up to a maximum. Also escrow-based.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Firm commitment<\/th>\n<th>Best efforts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Underwriter's capacity<\/td>\n<td>Principal (dealer)<\/td>\n<td>Agent (broker)<\/td>\n<\/tr>\n<tr>\n<td>Who bears unsold-share risk<\/td>\n<td>Underwriter<\/td>\n<td>Issuer<\/td>\n<\/tr>\n<tr>\n<td>Underwriter's compensation<\/td>\n<td>Spread<\/td>\n<td>Commission/concession<\/td>\n<\/tr>\n<tr>\n<td>Typical use<\/td>\n<td>Established issuers, IPOs<\/td>\n<td>Smaller/riskier issuers, DPPs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Competitive vs. negotiated.<\/strong> In a <strong>competitive bid<\/strong> (used mostly for municipal G.O. bonds and utilities), syndicates submit sealed bids and the issuer picks the lowest cost; in a <strong>negotiated<\/strong> underwriting (corporates, revenue bonds), the issuer selects the underwriter and they negotiate terms.<\/p>\n<p><strong>Stabilization.<\/strong> During the offering, the managing underwriter may enter a <strong>stabilizing bid<\/strong> at or <strong>below<\/strong> the public offering price (never above) to support the price and prevent a collapse while the issue is being distributed. This is the only legal form of price manipulation, and it must be disclosed in the prospectus.<\/p>\n<p><strong>Green shoe (over-allotment option).<\/strong> Allows underwriters to sell up to <strong>15%<\/strong> more shares than planned if demand is strong.<\/p>\n<hr />\n<h2 id=\"s11-3\" data-sec=\"s11-3\"><span class=\"secnum\">11.3<\/span> Types of offerings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Offering<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Initial public offering (IPO)<\/strong><\/td>\n<td>A company's first sale of stock to the public; the company goes from private to public<\/td>\n<\/tr>\n<tr>\n<td><strong>Follow-on / subsequent (additional) public offering<\/strong><\/td>\n<td>Sale of new shares by a company that is already public<\/td>\n<\/tr>\n<tr>\n<td><strong>Primary offering<\/strong><\/td>\n<td>The <strong>issuer<\/strong> sells newly created shares; proceeds go to the <strong>issuer<\/strong> (raises capital). Both IPOs and follow-ons are primary offerings.<\/td>\n<\/tr>\n<tr>\n<td><strong>Secondary offering<\/strong><\/td>\n<td><strong>Existing shareholders<\/strong> (founders, VCs, insiders) sell their shares in a registered offering; proceeds go to the <strong>selling shareholders<\/strong>, not the company. No new shares are created. (Note: \"secondary offering\" ≠ \"secondary market.\")<\/td>\n<\/tr>\n<tr>\n<td><strong>Split (combined) offering<\/strong><\/td>\n<td>Part primary, part secondary<\/td>\n<\/tr>\n<tr>\n<td><strong>Shelf registration (Rule 415)<\/strong><\/td>\n<td>A seasoned issuer registers securities once and sells them over up to <strong>3 years<\/strong> \"off the shelf\" as market conditions warrant, with a supplement to the base prospectus for each takedown<\/td>\n<\/tr>\n<tr>\n<td><strong>Rights offering<\/strong><\/td>\n<td>New shares offered to existing shareholders first (preemptive rights); may be backed by a standby underwriter<\/td>\n<\/tr>\n<tr>\n<td><strong>Private placement<\/strong><\/td>\n<td>Unregistered sale to a limited number of accredited/sophisticated investors under Reg D (see 11.4.4)<\/td>\n<\/tr>\n<tr>\n<td><strong>Direct listing<\/strong><\/td>\n<td>A company lists existing shares on an exchange without an underwritten offering (no new capital raised)<\/td>\n<\/tr>\n<tr>\n<td><strong>SPAC<\/strong><\/td>\n<td>A \"blank check\" shell company that IPOs to raise cash and later merges with a private company, taking it public<\/td>\n<\/tr>\n<tr>\n<td><strong>Tender offer / exchange offer<\/strong><\/td>\n<td>Offer to buy back shares or swap securities (not a capital raise)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s11-4\" data-sec=\"s11-4\"><span class=\"secnum\">11.4<\/span> The IPO process<\/h2>\n<h3 id=\"s11-4-1\" data-sec=\"s11-4-1\"><span class=\"secnum\">11.4.1<\/span> Overview<\/h3>\n<p>Under the Securities Act of 1933, any <strong>non-exempt<\/strong> security offered to the public must be <strong>registered with the SEC<\/strong>, and investors must be given a <strong>prospectus<\/strong>. The registration process divides into three periods with specific rules about what underwriters may do:<\/p>\n<table>\n<thead>\n<tr>\n<th>Period<\/th>\n<th>Begins<\/th>\n<th>What's allowed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pre-registration (pre-filing)<\/strong><\/td>\n<td>Before the registration statement is filed<\/td>\n<td><strong>Nothing.<\/strong> No offers, no sales, no solicitation of interest (\"gun-jumping\" is prohibited). Normal advertising of the business is fine.<\/td>\n<\/tr>\n<tr>\n<td><strong>Cooling-off period<\/strong><\/td>\n<td>Registration statement filed with the SEC<\/td>\n<td>Lasts at least <strong>20 days<\/strong> (usually longer). Underwriters may distribute the <strong>preliminary prospectus (red herring)<\/strong>, publish <strong>tombstone ads<\/strong>, take <strong>indications of interest<\/strong>, and hold <strong>road shows / due diligence meetings<\/strong>. <strong>No sales, no orders, no money accepted, no promises.<\/strong> The red herring may not be marked up or accompanied by sales literature.<\/td>\n<\/tr>\n<tr>\n<td><strong>Post-effective (effective) period<\/strong><\/td>\n<td>SEC declares the registration <strong>effective<\/strong><\/td>\n<td>Sales may be made. Every buyer must receive the <strong>final prospectus<\/strong> no later than the confirmation of sale.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s11-4-2\" data-sec=\"s11-4-2\"><span class=\"secnum\">11.4.2<\/span> Preparing for the sale<\/h3>\n<p><strong>Registration statement (Form S-1).<\/strong> Filed by the issuer with the SEC; its contents become the prospectus. It includes: description of the business, the offering and use of proceeds, risk factors, capitalization, audited financial statements, management and their compensation, major shareholders, legal proceedings, and the underwriting arrangements. The issuer, its directors, officers who sign, auditors, and the underwriters are all <strong>liable<\/strong> for material misstatements or omissions.<\/p>\n<p><strong>Preliminary prospectus (red herring).<\/strong> So called for the red-ink legend on the cover stating that the registration has not yet become effective. Contains everything except the <strong>final public offering price<\/strong> and the <strong>effective date<\/strong> (it may show a price range). Used to gauge demand during the cooling-off period.<\/p>\n<p><strong>Indications of interest.<\/strong> Non-binding expressions by investors of how many shares they'd like; neither the investor nor the firm is committed. The underwriter uses them to <strong>build the book<\/strong> and set the price.<\/p>\n<p><strong>Tombstone advertisement.<\/strong> A bare-bones ad listing the issuer, the security, the amount, the offering price (or range), and the underwriters — with a statement that it is not an offer to sell and that offers are made only by prospectus. The only advertising permitted during the cooling-off period; it is not deemed an \"offer.\"<\/p>\n<p><strong>Due diligence meeting.<\/strong> Held near the end of the cooling-off period among the issuer, underwriters, counsel and accountants to review the registration statement and make sure everything is accurate and complete. Underwriters who perform adequate due diligence have a defense against liability.<\/p>\n<p><strong>Blue-sky registration.<\/strong> The offering must also be registered (or qualify for an exemption) in each <strong>state<\/strong> where it will be sold, under state securities (\"blue-sky\") laws administered under the Uniform Securities Act. Three methods: <strong>coordination<\/strong> (filed with the state at the same time as the SEC — typical for IPOs), <strong>qualification<\/strong> (full state review — used when there's no SEC registration), <strong>notice filing<\/strong> (for federal covered securities such as exchange-listed stocks and mutual funds — the state just gets a notice and a fee).<\/p>\n<p><strong>Pricing.<\/strong> The final price is set on the evening before the effective date based on the book of indications. Underwriters then sign the final underwriting agreement.<\/p>\n<h3 id=\"s11-4-3\" data-sec=\"s11-4-3\"><span class=\"secnum\">11.4.3<\/span> Effective registration<\/h3>\n<p>The SEC reviews the registration statement for completeness and may issue <strong>deficiency letters<\/strong> (comments) that pause the 20-day clock until fixed. When the SEC is satisfied it declares the registration <strong>effective<\/strong>. Crucially:<\/p>\n<blockquote>\n<p>The SEC does <strong>not<\/strong> approve, endorse, or pass on the accuracy of a registration statement or the merits of a security. Every prospectus must say so in the <strong>SEC disclaimer<\/strong>. It is a violation to tell a customer that the SEC \"approved\" an issue.<\/p>\n<\/blockquote>\n<p><strong>Final prospectus (statutory prospectus).<\/strong> Contains everything in the red herring plus the final offering price, the underwriting spread, the effective date, and the delivery date. Must be delivered to every purchaser in the offering no later than with the confirmation. The <strong>prospectus delivery requirement<\/strong> continues into the aftermarket for dealers:<\/p>\n<table>\n<thead>\n<tr>\n<th>Offering type<\/th>\n<th>Dealers must deliver a prospectus on aftermarket trades for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>IPO of a security that will <strong>not<\/strong> be listed on an exchange/Nasdaq<\/td>\n<td><strong>90 days<\/strong> after the effective date<\/td>\n<\/tr>\n<tr>\n<td>IPO of a security that <strong>will<\/strong> be listed<\/td>\n<td><strong>25 days<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Follow-on offering, non-listed<\/td>\n<td><strong>40 days<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Follow-on offering, listed<\/td>\n<td>0 days (no aftermarket requirement)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Access-equals-delivery: posting the prospectus on EDGAR generally satisfies the requirement for IPOs.<\/p>\n<p><strong>Securities Act liability.<\/strong> Anyone who buys in a registered offering and suffers a loss because of a material misstatement or omission in the registration statement can sue the issuer, directors, signing officers, experts (auditors) and underwriters (Section 11). Section 12 and Section 17 impose anti-fraud liability for any offer or sale.<\/p>\n<p><strong>FINRA Rule 5130 — new issue (IPO) allocations.<\/strong> FINRA member firms may <strong>not sell new issues of common stock to \"restricted persons\"<\/strong>:<\/p>\n<ul>\n<li>FINRA members and their <strong>employees<\/strong> (associated persons) and their <strong>immediate family<\/strong> (spouse, children, parents, siblings, in-laws, and anyone they materially support).<\/li>\n<li>Finders, fiduciaries of the managing underwriter (attorneys, accountants), and portfolio managers who buy for institutions (when buying for their own accounts).<\/li>\n<li>Any person owning a broker-dealer.<\/li>\n<\/ul>\n<p>Before selling an IPO to an account, the firm must obtain a written (or electronic) representation from the beneficial owner within the prior <strong>12 months<\/strong> confirming the account is eligible. Exceptions include accounts with ≤ 10% restricted-person ownership (de minimis), investment companies, and certain issuer-directed shares. The rule aims to keep IPOs — especially \"hot issues\" that trade at an immediate premium — from going to insiders. <strong>Spinning<\/strong> (allocating hot IPO shares to executives of companies to win their investment banking business) is separately prohibited by <strong>FINRA Rule 5131<\/strong>, which also restricts <strong>flipping<\/strong> penalties and quid pr
