/strong> — buying bonds with staggered maturities to reduce interest-rate and reinvestment risk. <strong>Barbell<\/strong> — concentrate in short and long maturities. <strong>Bullet<\/strong> — all mature around one date.<\/p>\n<hr />\n<h2>Chapter 3 quick review<\/h2>\n<ul>\n<li>Par $1,000; coupon fixed, paid semiannually; bondholders are creditors.<\/li>\n<li>Price quoted as % of par; 1 point = $10; corporates in 1/8ths, Treasuries in 1/32nds.<\/li>\n<li><strong>Rates up, prices down.<\/strong> Long maturity and low coupon = most volatile.<\/li>\n<li>Accrued interest: corporate/muni 30/360; government actual/365; up to but not including settlement.<\/li>\n<li>Ratings: BBB/Baa is the lowest investment grade; below is junk.<\/li>\n<li>Callable → higher coupon, called when rates fall. Puttable → lower coupon, put when rates rise.<\/li>\n<li>Zero coupon: deep discount, no reinvestment risk, most rate-sensitive, phantom income taxed annually (unless muni).<\/li>\n<li>Yields: discount bond → Nominal &lt; CY &lt; YTM &lt; YTC; premium bond → the reverse. Quote yield to worst.<\/li>\n<li>Yield curve: normal, flat, inverted (recession signal). Credit spreads widen in bad times.<\/li>\n<li>Settlement T+1; TRACE for corporates; MSRB for munis.<\/li>\n<\/ul>"}, {"num": 4, "name": "Corporate Debt", "file": "04-corporate-debt.md", "minutes": 10, "sections": [{"id": "s4-1", "num": "4.1", "title": "Short-term products (the money market)", "level": 2}, {"id": "s4-2", "num": "4.2", "title": "Long-term products", "level": 2}, {"id": "s4-3", "num": "4.3", "title": "Convertible products", "level": 2}, {"id": "s4-4", "num": "4.4", "title": "Liquidation policy", "level": 2}, {"id": "s4-5", "num": "4.5", "title": "The market & quotes", "level": 2}, {"id": "s4-6", "num": "4.6", "title": "Bank issues", "level": 2}, {"id": "s4-7", "num": "4.7", "title": "Eurodollars & Eurobonds", "level": 2}], "html": "\n<blockquote>\n<p>Builds on Chapter 3. Focus areas: the money-market products, secured vs. unsecured bonds, convertibles math, liquidation priority, and the bank-issued products (CDs, BAs, Eurodollars).<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s4-1\" data-sec=\"s4-1\"><span class=\"secnum\">4.1<\/span> Short-term products (the money market)<\/h2>\n<p>The <strong>money market<\/strong> is where high-quality debt with <strong>one year or less<\/strong> to maturity trades. These instruments are highly liquid, low-risk, low-return, and are typically bought at a <strong>discount<\/strong> and mature at face value (the gain is the \"interest\"). They are used by investors for cash management and by corporations for short-term borrowing.<\/p>\n<p><strong>Commercial paper (CP).<\/strong><\/p>\n<ul>\n<li>Unsecured <strong>promissory notes<\/strong> issued by large, creditworthy corporations (and finance companies) to fund short-term needs like payroll and inventory.<\/li>\n<li>Maturity: <strong>up to 270 days<\/strong> (most are 30–90 days). Why 270? Because debt with a maturity of 270 days or less is <strong>exempt from SEC registration<\/strong> under the Securities Act of 1933.<\/li>\n<li>Sold at a discount; minimum denominations are large (typically $100,000+), so buyers are institutions and money market funds.<\/li>\n<li>Rated by the rating agencies (e.g., A-1/P-1 for top tier).<\/li>\n<\/ul>\n<p><strong>Negotiable (jumbo) certificates of deposit.<\/strong> Bank-issued time deposits of <strong>$100,000 or more<\/strong> that can be traded in the secondary market before maturity. Pay interest at maturity. FDIC-insured only up to <strong>$250,000<\/strong>. (Regular bank CDs, by contrast, are not negotiable — see 4.6.)<\/p>\n<p><strong>Banker's acceptances (BAs).<\/strong> A time draft (post-dated check) guaranteed (\"accepted\") by a bank, used to finance <strong>import/export<\/strong> transactions. Maturities up to 270 days (commonly 30–180). Traded at a discount. Think \"BA = foreign trade.\"<\/p>\n<p><strong>Repurchase agreements (repos).<\/strong> A dealer sells securities (usually Treasuries) and agrees to buy them back at a slightly higher price on a set date — effectively a short-term collateralized loan. Overnight repos are common. A <strong>reverse repo<\/strong> is the same transaction from the other side. The Fed uses repos to manage bank reserves.<\/p>\n<p><strong>Treasury bills.<\/strong> The government's money-market instrument (Chapter 6). Maturities of 4, 8, 13, 17, 26 and 52 weeks; sold at a discount.<\/p>\n<p><strong>Federal funds.<\/strong> Overnight loans of excess reserves between banks. The <strong>fed funds rate<\/strong> is the most-watched short-term rate (the Fed targets it).<\/p>\n<p><strong>Money market funds<\/strong> — mutual funds that invest in all of the above (Chapter 7).<\/p>\n<table>\n<thead>\n<tr>\n<th>Instrument<\/th>\n<th>Issuer<\/th>\n<th>Max maturity<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Commercial paper<\/td>\n<td>Corporations<\/td>\n<td>270 days<\/td>\n<td>Unsecured; registration-exempt<\/td>\n<\/tr>\n<tr>\n<td>Negotiable CD<\/td>\n<td>Banks<\/td>\n<td>Usually ≤ 1 yr<\/td>\n<td>$100k+; tradable<\/td>\n<\/tr>\n<tr>\n<td>Banker's acceptance<\/td>\n<td>Banks (for importers/exporters)<\/td>\n<td>270 days<\/td>\n<td>Foreign trade<\/td>\n<\/tr>\n<tr>\n<td>Repo<\/td>\n<td>Dealers/banks<\/td>\n<td>Overnight to short<\/td>\n<td>Collateralized by Treasuries<\/td>\n<\/tr>\n<tr>\n<td>T-bill<\/td>\n<td>US Treasury<\/td>\n<td>52 weeks<\/td>\n<td>Safest<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s4-2\" data-sec=\"s4-2\"><span class=\"secnum\">4.2<\/span> Long-term products<\/h2>\n<p>Corporate bonds with maturities beyond one year. Classified mainly by what backs them.<\/p>\n<h3>Secured bonds (backed by specific collateral)<\/h3>\n<ul>\n<li><strong>Mortgage bonds<\/strong> — secured by real estate/plant. First-mortgage bonds have the senior claim on the property; second-mortgage bonds are junior. Common for utilities.<\/li>\n<li><strong>Equipment trust certificates (ETCs)<\/strong> — secured by movable equipment (aircraft, railcars, trucks, ships). Title is held by a trustee until the debt is repaid. Common for airlines and railroads. Very safe because the equipment can be repossessed and resold.<\/li>\n<li><strong>Collateral trust bonds<\/strong> — secured by securities the issuer owns (e.g., stock of a subsidiary), held by a trustee.<\/li>\n<\/ul>\n<h3>Unsecured bonds (backed only by the issuer's promise)<\/h3>\n<ul>\n<li><strong>Debentures<\/strong> — backed by the full faith and credit of the issuer. Most corporate bonds are debentures. Holders are <strong>general creditors<\/strong>.<\/li>\n<li><strong>Subordinated debentures<\/strong> — rank below other debentures. Higher yield for the extra risk. Often convertible.<\/li>\n<li><strong>Guaranteed bonds<\/strong> — guaranteed by a company other than the issuer (usually a parent guaranteeing a subsidiary's debt). Credit quality depends on the guarantor.<\/li>\n<li><strong>Income (adjustment) bonds<\/strong> — pay interest only if the company earns enough. Issued by companies in reorganization. Trade <strong>flat<\/strong> (no accrued interest). Highly speculative.<\/li>\n<\/ul>\n<h3>Other corporate bond types<\/h3>\n<ul>\n<li><strong>High-yield (\"junk\") bonds<\/strong> — rated below BBB/Baa. Higher coupon, higher default risk. Often issued in leveraged buyouts.<\/li>\n<li><strong>Zero-coupon corporate bonds<\/strong> — deep discount, phantom income taxed annually.<\/li>\n<li><strong>Floating-rate notes<\/strong> — coupon resets to a benchmark; price stable.<\/li>\n<li><strong>Step-up bonds<\/strong> — coupon increases over time.<\/li>\n<\/ul>\n<p><strong>Debt vs. equity for the issuer.<\/strong> Debt is cheaper (interest is tax-deductible to the corporation; dividends are not) and doesn't dilute ownership, but interest is a fixed legal obligation and adds <strong>leverage<\/strong> (financial risk). Highly leveraged companies are riskier for both bondholders and stockholders.<\/p>\n<hr />\n<h2 id=\"s4-3\" data-sec=\"s4-3\"><span class=\"secnum\">4.3<\/span> Convertible products<\/h2>\n<p>A <strong>convertible bond<\/strong> (usually a convertible debenture) can be exchanged for a fixed number of common shares. Investors accept a <strong>lower coupon<\/strong> in exchange for the upside. Issuers like them because they lower borrowing costs and conversion eliminates the debt.<\/p>\n<p><strong>The math (this gets tested).<\/strong><\/p>\n<pre><code>Conversion ratio  = Par ÷ Conversion price\nParity price of the bond  = Stock market price × Conversion ratio\nParity price of the stock = Bond market price ÷ Conversion ratio\n<\/code><\/pre>\n<p><strong>Example.<\/strong> A $1,000 par bond is convertible at $50. Conversion ratio = 1,000 / 50 = <strong>20 shares<\/strong>.<\/p>\n<ul>\n<li>If the stock trades at $55, parity for the bond = 55 × 20 = <strong>$1,100<\/strong>. If the bond is trading at $1,050, it's cheaper to buy the bond and convert than to buy the stock directly — an <strong>arbitrage<\/strong> opportunity.<\/li>\n<li>If the bond trades at $1,200, parity for the stock = 1,200 / 20 = <strong>$60<\/strong>.<\/li>\n<\/ul>\n<p><strong>Behavior.<\/strong><\/p>\n<ul>\n<li>When the stock is far <strong>below<\/strong> the conversion price, the bond trades like a straight bond (on its yield) — this is its <strong>investment value<\/strong> or \"bond floor.\"<\/li>\n<li>When the stock is near/above the conversion price, the bond's price tracks the stock (parity).<\/li>\n<li>The bond usually trades at a small <strong>premium over parity<\/strong> because of the downside protection the coupon provides.<\/li>\n<li><strong>Anti-dilution<\/strong> provisions adjust the conversion price for stock splits and stock dividends so the holder's conversion value is preserved.<\/li>\n<li>Conversion is <strong>not a taxable event<\/strong>; the holder's cost basis carries over to the shares.<\/li>\n<li><strong>Forced conversion<\/strong>: if the bond is callable and the stock is above parity, the issuer can call the bond, forcing holders to convert (worth more than the call price) — which eliminates the issuer's debt.<\/li>\n<\/ul>\n<p><strong>Who should buy convertibles?<\/strong> Investors who want <strong>income with growth potential<\/strong> and some downside protection. Downsides: lower yield than straight debt and dilution risk for common stockholders when conversion occurs.<\/p>\n<hr />\n<h2 id=\"s4-4\" data-sec=\"s4-4\"><span class=\"secnum\">4.4<\/span> Liquidation policy<\/h2>\n<p>In a corporate bankruptcy (Chapter 7 liquidation), claims are paid in strict order. Each tier must be paid in full before the next receives anything.<\/p>\n<ol>\n<li><strong>Secured creditors<\/strong> — up to the value of their collateral (mortgage bonds, ETCs, collateral trust bonds).<\/li>\n<li><strong>Administrative costs, wages, taxes<\/strong> (statutory priority — sometimes shown as before general creditors).<\/li>\n<li><strong>Unsecured/general creditors<\/strong> — debenture holders, suppliers, banks with unsecured loans.<\/li>\n<li><strong>Subordinated debenture holders.<\/strong><\/li>\n<li><strong>Preferred stockholders.<\/strong><\/li>\n<li><strong>Common stockholders<\/strong> — residual claim; usually receive nothing.<\/li>\n<\/ol>\n<p>A bondholder's claim is the par value plus accrued interest. Any secured creditor whose collateral didn't cover the claim joins the general creditors for the remainder.<\/p>\n<p><strong>Chapter 11 reorganization<\/strong> is the alternative to liquidation: the company keeps operating under court supervision, and old bondholders are often given new securities (sometimes income bonds or stock) in the reorganized company.<\/p>\n<hr />\n<h2 id=\"s4-5\" data-sec=\"s4-5\"><span class=\"secnum\">4.5<\/span> The market &amp; quotes<\/h2>\n<p><strong>Where corporates trade.<\/strong> A small number of corporate bonds are listed on the NYSE, but the overwhelming majority trade <strong>OTC<\/strong> between dealers. Trades must be reported to <strong>TRACE<\/strong> within 15 minutes, making corporate bond prices publicly available.<\/p>\n<p><strong>Quotations.<\/strong> Corporate bonds are quoted as a percentage of par in <strong>1/8-point increments<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Quote<\/th>\n<th>Dollar price<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>100<\/td>\n<td>$1,000<\/td>\n<\/tr>\n<tr>\n<td>97 ½<\/td>\n<td>$975.00<\/td>\n<\/tr>\n<tr>\n<td>102 ⅜<\/td>\n<td>$1,023.75<\/td>\n<\/tr>\n<tr>\n<td>89 ⅛<\/td>\n<td>$891.25<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A dealer quote might read \"97 ½ – 98 ¼\": bid $975, ask $982.50. The customer buys at the ask and sells at the bid.<\/p>\n<p><strong>Reading a bond description.<\/strong> \"XYZ 5s of '38\" = XYZ Corporation bonds with a 5% coupon maturing in 2038. \"5s\" means 5% coupon; paid semiannually ($25).<\/p>\n<p><strong>Accrued interest on corporates.<\/strong> 30/360 basis; interest is paid semiannually on dates such as J&amp;J 1 (January 1 and July 1), F&amp;A 15, M&amp;S 1, A&amp;O 1, M&amp;N 15, J&amp;D 1.<\/p>\n<p><strong>Example.<\/strong> A corporate bond pays interest J&amp;J 1. It is sold with settlement on March 16. Accrued interest covers Jan 1 through March 15: January (30) + February (30) + 15 days of March = <strong>75 days<\/strong>. On a 6% bond: $60 × 75/360 = <strong>$12.50<\/strong> owed by the buyer to the seller.<\/p>\n<p><strong>Settlement:<\/strong> regular way T+1.<\/p>\n<p><strong>Markups.<\/strong> Dealers acting as principal mark up prices; FINRA requires markups to be fair, and since 2018 retail confirmations must disclose the markup on most corporate and agency bond trades.<\/p>\n<hr />\n<h2 id=\"s4-6\" data-sec=\"s4-6\"><span class=\"secnum\">4.6<\/span> Bank issues<\/h2>\n<p><strong>Certificates of deposit (non-negotiable).<\/strong> Time deposits with a bank for a fixed term (one month to several years) paying a fixed rate. Insured by the <strong>FDIC up to $250,000 per depositor, per bank, per ownership category<\/strong>. Early withdrawal triggers a penalty. These are bank products, not securities, and not SIPC-covered — but the exam still tests them.<\/p>\n<p><strong>Negotiable (jumbo) CDs.<\/strong> $100,000 minimum; can be sold in the secondary market before maturity (so no early-withdrawal penalty but you face interest-rate risk). Interest paid at maturity. FDIC coverage still capped at $250,000.<\/p>\n<p><strong>Brokered CDs.<\/strong> CDs that a broker-dealer buys from banks and sells to its customers. They are FDIC-insured (the broker arranges insurance to pass through to the customer), can be sold in a secondary market (price may be below par), and sometimes are callable. Disclosure of call features and the secondary-market risk is required.<\/p>\n<p><strong>Structured CDs / market-linked CDs.<\/strong> Return tied to an index; principal protected only if held to maturity. Complex; suitability concerns.<\/p>\n<p><strong>Bank-related money market items:<\/strong> banker's acceptances (4.1), federal funds, and <strong>Eurodollar deposits<\/strong> (next section).<\/p>\n<hr />\n<h2 id=\"s4-7\" data-sec=\"s4-7\"><span class=\"secnum\">4.7<\/span> Eurodollars &amp; Eurobonds<\/h2>\n<p><strong>Eurodollars<\/strong> are <strong>US-dollar-denominated deposits held in banks outside the United States<\/strong> (originally Europe, hence the name, but now anywhere — a dollar deposit in a Tokyo bank is a Eurodollar deposit). They are not subject to US bank reserve requirements or FDIC insurance. Eurodollar <strong>time deposits<\/strong> and <strong>Eurodollar CDs<\/strong> are money-market instruments. The interest rates on them were historically benchmarked to LIBOR, now replaced by <strong>SOFR<\/strong> (Secured Overnight Financing Rate) and similar rates.<\/p>\n<p><strong>Eurobonds<\/strong> are bonds issued and sold <strong>outside the country whose currency they are denominated in<\/strong>. A <strong>Eurodollar bond<\/strong> is a dollar-denominated bond issued outside the US (e.g., a US corporation selling dollar bonds in London). Key points:<\/p>\n<ul>\n<li>Not registered with the SEC (issued outside US jurisdiction), so they cannot be sold to US investors at issue (though they may trade later).<\/li>\n<li>Usually pay interest <strong>annually<\/strong> (not semiannually) and are often in bearer form.<\/li>\n<li>Investors in a Eurobond denominated in a foreign currency bear <strong>currency risk<\/strong>; Eurodollar bond holders do not have currency risk if they are dollar-based investors.<\/li>\n<li>Lower regulatory cost means issuers can borrow cheaply.<\/li>\n<\/ul>\n<p><strong>Yankee bonds<\/strong> (for contrast): dollar-denominated bonds issued <strong>in the US<\/strong> by a <strong>foreign<\/strong> issuer and registered with the SEC. US investors face no currency risk.<\/p>\n<table>\n<thead>\n<tr>\n<th>Bond<\/th>\n<th>Issued where<\/th>\n<th>Currency<\/th>\n<th>Registered with SEC?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Eurodollar bond<\/td>\n<td>Outside US<\/td>\n<td>USD<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Yankee bond<\/td>\n<td>In the US<\/td>\n<td>USD<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Eurobond (general)<\/td>\n<td>Outside the home country of the currency<\/td>\n<td>Any<\/td>\n<td>Depends on the country<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Chapter 4 quick review<\/h2>\n<ul>\n<li>Money market = ≤ 1 year, discount instruments: commercial paper (≤ 270 days, unsecured, exempt from registration), negotiable CDs ($100k+), BAs (foreign trade), repos, T-bills, fed funds.<\/li>\n<li>Secured: mortgage bonds, ETCs (equipment), collateral trust (securities). Unsecured: debentures, subordinated debentures, guaranteed bonds, income bonds (trade flat).<\/li>\n<li>Convertibles: ratio = par ÷ conversion price; parity = stock × ratio; lower coupon; not taxable to convert; forced conversion via call.<\/li>\n<li>Liquidation order: secured → general creditors → subordinated → preferred → common.<\/li>\n<li>Quotes in 1/8ths; 1 point = $10; accrued interest 30/360; TRACE reporting; T+1.<\/li>\n<li>CDs: FDIC $250,000; negotiable CDs tradable; brokered CDs may be callable.<\/li>\n<li>Eurodollars = USD deposits abroad; Eurodollar bonds = USD bonds issued outside US, unregistered, annual interest. Yankee bonds = foreign issuer, in the US, registered.<\/li>\n<\/ul>"}, {"num": 5, "name": "Municipal Debt", "file": "05-municipal-debt.md", "minutes": 10, "sections": [{"id": "s5-1", "num": "5.1", "title": "Foundations & taxation", "level": 2}, {"id": "s5-2", "num": "5.2", "title": "General obligation (G.O.) bonds", "level": 2}, {"id": "s5-3", "num": "5.3", "title": "Revenue bonds", "level": 2}, {"id": "s5-4", "num": "5.4", "title": "Short-term notes", "level": 2}, {"id": "s5-5", "num": "5.5", "title": "Trading", "level": 2}, {"id": "s5-6", "num": "5.6", "title": "Suitability", "level": 2}], "html": "\n<blockquote>\n<p>Municipal bonds are a favorite SIE topic because they combine product knowledge with tax rules and a distinct regulator (the MSRB). Nail the GO-vs-revenue distinction, the tax-equivalent yield formula, and the types of short-term notes.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s5-1\" data-sec=\"s5-1\"><span class=\"secnum\">5.1<\/span> Foundations &amp; taxation<\/h2>\n<p><strong>Who issues municipal bonds (\"munis\").<\/strong> States, cities, counties, towns, school districts, public authorities (airports, toll roads, water utilities), and US territories (Puerto Rico, Guam, US Virgin Islands). The federal government does <strong>not<\/strong> issue munis.<\/p>\n<p><strong>Why they exist.<\/strong> To finance public projects — schools, roads, bridges, hospitals, sewer systems — and sometimes to fund operations.<\/p>\n<p><strong>The tax advantage — the whole reason people buy munis.<\/strong><\/p>\n<ul>\n<li>Interest on most municipal bonds is <strong>exempt from federal income tax<\/strong>.<\/li>\n<li>If the investor lives in the state of issuance, interest is usually also exempt from <strong>state and local<\/strong> tax (\"double\" or \"triple\" tax-exempt).<\/li>\n<li>Bonds issued by <strong>US territories<\/strong> (Puerto Rico, etc.) are <strong>triple tax-exempt for all US investors<\/strong> regardless of state.<\/li>\n<li><strong>Capital gains<\/strong> on munis are fully taxable — only the <em>interest<\/em> is exempt. Buy a muni at $950, sell at $1,000 → $50 taxable capital gain.<\/li>\n<li><strong>Private activity bonds<\/strong> (munis that mainly benefit a private entity, e.g., a stadium or industrial development bond) may be subject to the <strong>alternative minimum tax (AMT)<\/strong>.<\/li>\n<li>Interest on municipal bonds is <strong>not exempt<\/strong> if the bond is a \"taxable muni\" (e.g., Build America Bonds, some pension-funding bonds).<\/li>\n<\/ul>\n<p><strong>Tax-equivalent yield (TEY).<\/strong> The taxable yield an investor would need to match a muni's tax-free yield.<\/p>\n<pre><code>Tax-equivalent yield = Municipal yield ÷ (1 − Tax bracket)\n<\/code><\/pre>\n<p><strong>Example.<\/strong> A 4% muni for an investor in the 32% bracket: 4% ÷ (1 − 0.32) = 4% ÷ 0.68 = <strong>5.88%<\/strong>. A corporate bond would need to yield more than 5.88% to be better after tax.<\/p>\n<p>Reverse direction: <strong>tax-free equivalent yield<\/strong> = corporate yield × (1 − tax bracket). A 6% corporate at a 32% bracket ≈ 4.08% tax-free.<\/p>\n<p><strong>Rule:<\/strong> the <strong>higher<\/strong> the investor's tax bracket, the <strong>more<\/strong> attractive munis are. Munis are <strong>inappropriate<\/strong> inside tax-deferred retirement accounts (IRAs, 401(k)s) — the tax benefit is wasted and muni yields are lower than taxable yields.<\/p>\n<p><strong>Legal opinion.<\/strong> Every new municipal issue carries a <strong>legal opinion<\/strong> from bond counsel stating that the bond is a valid, legally binding obligation of the issuer and that the interest is tax-exempt. An <strong>unqualified<\/strong> legal opinion has no reservations (good); a <strong>qualified<\/strong> opinion raises concerns.<\/p>\n<p><strong>Regulation.<\/strong> Municipal securities are <strong>exempt from registration<\/strong> under the Securities Act of 1933 and from the Trust Indenture Act. Instead of a prospectus, the issuer prepares an <strong>official statement (OS)<\/strong>; a <strong>preliminary official statement<\/strong> is used during marketing. The <strong>Municipal Securities Rulemaking Board (MSRB)<\/strong> writes rules for dealers and advisers in munis but has <strong>no enforcement power<\/strong> — FINRA, the SEC and bank regulators enforce MSRB rules. The <strong>anti-fraud<\/strong> provisions of federal securities law still apply fully to munis. The <strong>EMMA<\/strong> website (Electronic Municipal Market Access) publishes official statements, continuing disclosures and trade data.<\/p>\n<hr />\n<h2 id=\"s5-2\" data-sec=\"s5-2\"><span class=\"secnum\">5.2<\/span> General obligation (G.O.) bonds<\/h2>\n<p><strong>Backed by the full faith, credit and taxing power of the issuer.<\/strong> Repaid from general tax revenues.<\/p>\n<ul>\n<li>State G.O.s are backed mainly by <strong>income and sales taxes<\/strong>.<\/li>\n<li>Local G.O.s (cities, counties, school districts) are backed mainly by <strong>property taxes (ad valorem taxes)<\/strong>, assessed in <strong>mills<\/strong> (1 mill = $1 per $1,000 of assessed value, or 0.1%).<\/li>\n<li>Because they pledge the taxing power, G.O.s usually require <strong>voter approval<\/strong> and are subject to <strong>statutory debt limits<\/strong> (a cap on how much the issuer can borrow).<\/li>\n<li>Generally <strong>safer<\/strong> than revenue bonds from the same issuer (lower yield).<\/li>\n<\/ul>\n<p><strong>Analyzing a G.O. bond<\/strong> (credit factors):<\/p>\n<ul>\n<li>Tax base and its diversity; property values; population trends.<\/li>\n<li>Existing debt per capita, overlapping debt (debt of other overlapping jurisdictions on the same taxpayers).<\/li>\n<li>Budget practices, unfunded pension liabilities.<\/li>\n<li>Overall economy of the municipality.<\/li>\n<\/ul>\n<p><strong>Double-barreled bonds.<\/strong> Revenue bonds that are <em>also<\/em> backed by the issuer's taxing power if revenues fall short. Rated as G.O.s.<\/p>\n<hr />\n<h2 id=\"s5-3\" data-sec=\"s5-3\"><span class=\"secnum\">5.3<\/span> Revenue bonds<\/h2>\n<p><strong>Backed only by the revenue of a specific project or source<\/strong>, not by taxes. Examples: toll roads and bridges, airports, water and sewer systems, hospitals, public power utilities, stadiums, housing. If the project doesn't generate enough revenue, bondholders are not paid — the issuer's tax base is not pledged.<\/p>\n<ul>\n<li><strong>No voter approval<\/strong> required and <strong>not subject to debt limits<\/strong> (because taxes aren't pledged).<\/li>\n<li>Generally <strong>higher yield<\/strong> than G.O.s (more risk).<\/li>\n<li><strong>Feasibility study<\/strong> — prepared by engineers/consultants to project whether the project will generate enough revenue; a key document for analysis.<\/li>\n<li><strong>Rate covenant<\/strong> — issuer promises to charge user fees high enough to cover expenses and debt service.<\/li>\n<li><strong>Debt service coverage ratio<\/strong> = net revenue available ÷ annual debt service (principal + interest). A ratio of 2.0 means revenue is twice what's needed; higher is safer.<\/li>\n<li><strong>Flow of funds<\/strong> — the indenture specifies the order in which revenues are applied: operating &amp; maintenance expenses first, then debt service, then reserve funds, then surplus.<\/li>\n<li>Other covenants: insurance covenant, maintenance covenant, additional-bonds test (limits new debt with equal claim), non-discrimination covenant.<\/li>\n<\/ul>\n<p><strong>Special types of revenue bonds.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Backed by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Industrial development (IDR/IDB)<\/strong><\/td>\n<td>Lease payments from a private corporation using the facility; credit depends on the corporation; usually subject to AMT (private activity bond)<\/td>\n<\/tr>\n<tr>\n<td><strong>Special tax bonds<\/strong><\/td>\n<td>A specific tax (e.g., gasoline, tobacco, hotel tax)<\/td>\n<\/tr>\n<tr>\n<td><strong>Special assessment bonds<\/strong><\/td>\n<td>Assessments on properties that benefit from the improvement (sidewalks, sewers)<\/td>\n<\/tr>\n<tr>\n<td><strong>Moral obligation bonds<\/strong><\/td>\n<td>Project revenue, plus a non-binding promise that the state legislature <em>may<\/em> appropriate funds if needed<\/td>\n<\/tr>\n<tr>\n<td><strong>Lease-rental bonds<\/strong><\/td>\n<td>Lease payments from a government entity that uses the facility (schools, office buildings)<\/td>\n<\/tr>\n<tr>\n<td><strong>Certificates of participation (COPs)<\/strong><\/td>\n<td>Lease revenues; avoid voter approval requirements<\/td>\n<\/tr>\n<tr>\n<td><strong>Housing bonds<\/strong><\/td>\n<td>Mortgage payments; often federally backed<\/td>\n<\/tr>\n<tr>\n<td><strong>Public housing authority (PHA/NHA) bonds<\/strong><\/td>\n<td>Backed by the US government — safest muni<\/td>\n<\/tr>\n<tr>\n<td><strong>Double-barreled<\/strong><\/td>\n<td>Project revenue plus taxing power<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s5-4\" data-sec=\"s5-4\"><span class=\"secnum\">5.4<\/span> Short-term notes<\/h2>\n<p>Municipalities issue short-term notes (typically <strong>less than 12 months<\/strong>, sometimes up to 3 years) to bridge timing gaps between spending and incoming revenue, or as interim financing before a bond sale. Notes are rated separately (Moody's MIG 1–3 for notes; VMIG for variable-rate demand notes; S&amp;P SP-1 to SP-3).<\/p>\n<table>\n<thead>\n<tr>\n<th>Note<\/th>\n<th>Repaid from<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Tax anticipation notes (TANs)<\/strong><\/td>\n<td>Future tax collections<\/td>\n<\/tr>\n<tr>\n<td><strong>Revenue anticipation notes (RANs)<\/strong><\/td>\n<td>Future non-tax revenue (e.g., state or federal aid)<\/td>\n<\/tr>\n<tr>\n<td><strong>Tax and revenue anticipation notes (TRANs)<\/strong><\/td>\n<td>Both<\/td>\n<\/tr>\n<tr>\n<td><strong>Bond anticipation notes (BANs)<\/strong><\/td>\n<td>Proceeds of a future long-term bond issue<\/td>\n<\/tr>\n<tr>\n<td><strong>Grant anticipation notes (GANs)<\/strong><\/td>\n<td>Expected federal/state grant money<\/td>\n<\/tr>\n<tr>\n<td><strong>Construction loan notes (CLNs)<\/strong><\/td>\n<td>Permanent financing after a housing project is built<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Variable-rate demand obligations (VRDOs) / tax-exempt commercial paper<\/strong> — longer-term munis with rates that reset periodically (daily/weekly) and a <strong>put<\/strong> feature letting investors sell back at par on reset dates; treated as money-market instruments. <strong>Auction rate securities (ARS)<\/strong> are similar but reset via auctions and became illiquid in 2008 when auctions failed.<\/p>\n<p><strong>Tax-exempt money market funds<\/strong> invest in these instruments.<\/p>\n<hr />\n<h2 id=\"s5-5\" data-sec=\"s5-5\"><span class=\"secnum\">5.5<\/span> Trading<\/h2>\n<p><strong>Primary market.<\/strong> Most new munis are sold through <strong>underwriting syndicates<\/strong>:<\/p>\n<ul>\n<li><strong>Competitive bid<\/strong> — the issuer publishes a <strong>notice of sale<\/strong> and awards the issue to the syndicate offering the lowest net interest cost (NIC) or true interest cost (TIC). Typical for <strong>G.O.<\/strong> bonds.<\/li>\n<li><strong>Negotiated<\/strong> — the issuer chooses an underwriter and negotiates terms. Typical for <strong>revenue<\/strong> bonds.<\/li>\n<li>The syndicate signs a <strong>syndicate letter / agreement among underwriters<\/strong>. Orders are filled in priority: <strong>pre-sale → group net → designated → member<\/strong>.<\/li>\n<li>Buyers receive the <strong>official statement<\/strong>; MSRB rules require delivery of a final OS by settlement.<\/li>\n<\/ul>\n<p><strong>Secondary market.<\/strong> Munis trade <strong>OTC<\/strong> through dealers. The market is thin; many issues rarely trade. Features:<\/p>\n<ul>\n<li>Quotes are typically on a <strong>yield (basis) for serial bonds<\/strong> and on <strong>price for term bonds<\/strong>.<\/li>\n<li>Trades are reported to the MSRB's <strong>Real-Time Transaction Reporting System (RTRS)<\/strong> within 15 minutes and displayed on EMMA.<\/li>\n<li>Settlement: <strong>T+1<\/strong> (regular way). Accrued interest on a <strong>30/360<\/strong> basis.<\/li>\n<li>Dealers may act as broker (agent) or dealer (principal); <strong>MSRB Rule G-30<\/strong> requires fair prices and markups, and markup disclosure on retail confirmations.<\/li>\n<li><strong>Broker's brokers<\/strong> — intermediaries that help dealers find buyers/sellers of munis without revealing identities.<\/li>\n<li><strong>Municipal bond insurance<\/strong> — issuers can buy insurance (from AGM, BAM, etc.) guaranteeing principal and interest; insured bonds carry the insurer's rating.<\/li>\n<li><strong>Bank-qualified bonds<\/strong> — small G.O. issues (≤ $10 million/year) that banks can buy and deduct 80% of the carrying cost.<\/li>\n<\/ul>\n<p><strong>Key MSRB rules to know.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Topic<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>G-17<\/td>\n<td>Fair dealing; dealers must deal fairly with everyone<\/td>\n<\/tr>\n<tr>\n<td>G-19<\/td>\n<td>Suitability<\/td>\n<\/tr>\n<tr>\n<td>G-20<\/td>\n<td>Gifts and gratuities — <strong>$100 per person per year<\/strong> limit (business entertainment excluded)<\/td>\n<\/tr>\n<tr>\n<td>G-30<\/td>\n<td>Fair pricing (markups)<\/td>\n<\/tr>\n<tr>\n<td>G-32<\/td>\n<td>Delivery of official statement by settlement<\/td>\n<\/tr>\n<tr>\n<td>G-37<\/td>\n<td><strong>Political contributions / \"pay-to-play\"<\/strong> — an MFP may give at most <strong>$250 per election<\/strong> to a candidate the MFP <strong>is entitled to vote for<\/strong>; a larger contribution, or any contribution to an official the MFP can't vote for, bars the dealer from negotiated underwriting with that issuer for <strong>two years<\/strong><\/td>\n<\/tr>\n<tr>\n<td>G-39<\/td>\n<td>Telemarketing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>G-37 clarified:<\/strong> An MFP may give up to <strong>$250 per election<\/strong> to a candidate <strong>for whom the MFP is eligible to vote<\/strong>. Any contribution above that, or <em>any<\/em> contribution to an official the MFP can't vote for, triggers a <strong>two-year ban<\/strong> on the firm doing negotiated municipal business with that issuer.<\/p>\n<\/blockquote>\n<p><strong>Tax treatment of discounts and premiums.<\/strong><\/p>\n<ul>\n<li><strong>Original issue discount (OID)<\/strong> munis — the discount accretes tax-free (treated as tax-exempt interest).<\/li>\n<li><strong>Market discount<\/strong> munis (bought at a discount in the secondary market) — the discount is taxed as <strong>ordinary income<\/strong> when realized.<\/li>\n<li><strong>Premium<\/strong> munis — the premium must be <strong>amortized<\/strong> (reduces cost basis); the amortization is not deductible because the interest is tax-free.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s5-6\" data-sec=\"s5-6\"><span class=\"secnum\">5.6<\/span> Suitability<\/h2>\n<p><strong>Ideal investor:<\/strong> high federal tax bracket, seeking <strong>tax-free income<\/strong>, investing in a <strong>taxable account<\/strong>, often a resident of the issuing state (for state tax exemption). Conservative to moderate risk tolerance.<\/p>\n<p><strong>Not appropriate for:<\/strong><\/p>\n<ul>\n<li>Low-bracket investors — a taxable bond will usually give more after tax. Always compare using the tax-equivalent yield.<\/li>\n<li><strong>Tax-deferred accounts<\/strong> (IRAs, 401(k)s) — the tax exemption is wasted.<\/li>\n<li>Investors seeking growth.<\/li>\n<li>Corporations are rarely good buyers (lower yields; corporate rates) unless in high brackets.<\/li>\n<\/ul>\n<p><strong>Risk factors specific to munis:<\/strong><\/p>\n<ul>\n<li><strong>Credit risk<\/strong> varies — G.O.s of large states are very safe; small revenue bonds and territory bonds (Puerto Rico's default) can be risky.<\/li>\n<li><strong>Legislative risk<\/strong> — a change in the tax code could reduce the value of the exemption.<\/li>\n<li><strong>Liquidity risk<\/strong> — thin secondary market.<\/li>\n<li><strong>Call risk<\/strong> — most munis are callable (typically 10 years after issue).<\/li>\n<li><strong>Interest-rate risk<\/strong> — like all bonds.<\/li>\n<\/ul>\n<p><strong>Muni bond funds and ETFs<\/strong> offer diversification and are appropriate for investors who want tax-free income but can't buy enough individual bonds to diversify.<\/p>\n<hr />\n<h2>Chapter 5 quick review<\/h2>\n<ul>\n<li>Issued by states, cities, authorities, territories; interest exempt from <strong>federal<\/strong> tax; state exemption usually only for in-state residents; territory bonds exempt everywhere.<\/li>\n<li>Capital gains on munis are taxable. Private activity bonds may trigger AMT.<\/li>\n<li><strong>TEY = muni yield ÷ (1 − tax bracket).<\/strong> Higher bracket → munis more attractive. Never in an IRA.<\/li>\n<li><strong>G.O.<\/strong>: taxing power, voter approval, debt limits, property (ad valorem) taxes for local, safer.<\/li>\n<li><strong>Revenue<\/strong>: project revenue only, no voter approval, feasibility study, rate covenant, coverage ratio, flow of funds, higher yield. Variants: IDRs (private corp, AMT), special tax, special assessment, moral obligation, double-barreled, PHA (US-backed, safest).<\/li>\n<li>Notes: TANs, RANs, TRANs, BANs, GANs; VRDOs have a put feature.<\/li>\n<li>Exempt from 1933 Act registration — official statement, legal opinion (unqualified is good). MSRB makes rules; FINRA/SEC enforce; EMMA for disclosure.<\/li>\n<li>Competitive bid for G.O.s (notice of sale), negotiated for revenue; order priority pre-sale → group net → designated → member.<\/li>\n<li>MSRB G-37: $250 limit to candidates you can vote for; otherwise two-year ban. G-20: $100 gift limit.<\/li>\n<li>Settlement T+1; 30/360 accrued interest; RTRS trade reporting.<\/li>\n<\/ul>"}, {"num": 6, "name": "US Government Debt (and the Economy)", "file": "06-us-government-debt.md", "minutes": 12, "sections": [{"id": "s6-1", "num": "6.1", "title": "Foundations", "level": 2}, {"id": "s6-2", "num": "6.2", "title": "Treasury products", "level": 2}, {"id": "s6-3", "num": "6.3", "title": "Federal agency products", "level": 2}, {"id": "s6-4", "num": "6.4", "title": "The market", "level": 2}, {"id": "s6-5", "num": "6.5", "title": "The economy, the Fed and policy", "level": 2}, {"id": "s6-5-1", "num": "6.5.1", "title": "Monetary policy", "level": 3}, {"id": "s6-5-2", "num": "6.5.2", "title": "Rates", "level": 3}, {"id": "s6-5-3", "num": "6.5.3", "title": "Tools of the Federal Reserve", "level": 3}, {"id": "s6-5-4", "num": "6.5.4", "title": "Economic factors", "level": 3}, {"id": "s6-5-5", "num": "6.5.5", "title": "Fiscal policy", "level": 3}], "html": "\n<blockquote>\n<p>Two big topics live here: (1) Treasury and agency securities, and (2) the Federal Reserve, monetary/fiscal policy and economic indicators. Section 1 of the FINRA outline (\"Knowledge of Capital Markets,\" 16%) draws heavily on 6.5.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s6-1\" data-sec=\"s6-1\"><span class=\"secnum\">6.1<\/span> Foundations<\/h2>\n<p>The US Treasury borrows to fund the federal deficit by issuing securities that are backed by the <strong>full faith and credit of the United States<\/strong> — considered to have <strong>no credit (default) risk<\/strong>, which makes them the benchmark \"risk-free rate\" against which all other yields are measured. They still carry <strong>interest-rate risk<\/strong>, <strong>inflation risk<\/strong> and (for coupon-bearing issues) <strong>reinvestment risk<\/strong>.<\/p>\n<p><strong>Tax treatment (memorize).<\/strong> Interest on US Treasury and most agency securities is <strong>taxable at the federal level but exempt from state and local income tax<\/strong>. (Exactly the opposite of municipal bonds.) Exception: Ginnie Mae, Fannie Mae and Freddie Mac mortgage-backed interest is taxable at <strong>all<\/strong> levels.<\/p>\n<p><strong>How Treasuries are sold.<\/strong> At regularly scheduled <strong>Treasury auctions<\/strong> conducted by the Fed on behalf of the Treasury:<\/p>\n<ul>\n<li><strong>Competitive bids<\/strong> (from primary dealers and institutions) specify the yield they'll accept.<\/li>\n<li><strong>Non-competitive bids<\/strong> (typically individuals, through TreasuryDirect or brokers) accept whatever yield the auction sets and are always filled first.<\/li>\n<li>Treasuries are issued in <strong>book-entry<\/strong> form only (no certificates).<\/li>\n<li>Minimum denomination is <strong>$100<\/strong>.<\/li>\n<\/ul>\n<p><strong>Quotes.<\/strong> Treasury notes and bonds are quoted in <strong>1/32nds<\/strong> of a point. \"99.08\" or \"99-08\" = 99 8/32 = 99.25% of par = $992.50. T-bills are quoted on a <strong>discount yield<\/strong> basis (annualized discount from par), so for bills a <strong>higher<\/strong> quoted number means a <strong>lower<\/strong> price.<\/p>\n<p><strong>Settlement:<\/strong> T+1 (regular way), through the Federal Reserve's book-entry system. Accrued interest on Treasuries uses <strong>actual days / 365<\/strong>.<\/p>\n<hr />\n<h2 id=\"s6-2\" data-sec=\"s6-2\"><span class=\"secnum\">6.2<\/span> Treasury products<\/h2>\n<table>\n<thead>\n<tr>\n<th>Security<\/th>\n<th>Maturity<\/th>\n<th>Interest<\/th>\n<th>How sold<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Treasury bills (T-bills)<\/strong><\/td>\n<td>4, 8, 13, 17, 26, 52 weeks (≤ 1 year)<\/td>\n<td>None — sold at a <strong>discount<\/strong>, mature at par<\/td>\n<td>Weekly/monthly auctions<\/td>\n<td>Money-market instrument; quoted on discount yield; most liquid security in the world<\/td>\n<\/tr>\n<tr>\n<td><strong>Treasury notes (T-notes)<\/strong><\/td>\n<td><strong>2–10 years<\/strong> (2, 3, 5, 7, 10)<\/td>\n<td>Semiannual coupon<\/td>\n<td>Auction<\/td>\n<td>Quoted in 1/32nds<\/td>\n<\/tr>\n<tr>\n<td><strong>Treasury bonds (T-bonds)<\/strong><\/td>\n<td><strong>20–30 years<\/strong><\/td>\n<td>Semiannual coupon<\/td>\n<td>Auction<\/td>\n<td>Quoted in 1/32nds; some old issues callable<\/td>\n<\/tr>\n<tr>\n<td><strong>TIPS<\/strong> (Treasury Inflation-Protected Securities)<\/td>\n<td>5, 10, 30 years<\/td>\n<td>Fixed coupon <strong>rate<\/strong> on a principal that adjusts with CPI<\/td>\n<td>Auction<\/td>\n<td>Protects against inflation; principal increase is taxed annually as income (phantom income); at maturity you receive the greater of adjusted or original principal<\/td>\n<\/tr>\n<tr>\n<td><strong>STRIPS<\/strong> (Separate Trading of Registered Interest and Principal of Securities)<\/td>\n<td>Various<\/td>\n<td><strong>Zero-coupon<\/strong> — each coupon and the principal are stripped and sold separately at a discount<\/td>\n<td>Created by dealers from Treasuries<\/td>\n<td>Backed directly by the Treasury; no reinvestment risk; most interest-rate-sensitive; accreted discount taxed annually<\/td>\n<\/tr>\n<tr>\n<td><strong>Treasury receipts<\/strong> (CATS, TIGRs, etc.)<\/td>\n<td>Various<\/td>\n<td>Zero-coupon<\/td>\n<td>Created by broker-dealers<\/td>\n<td>Collateralized by Treasuries held in trust but <strong>not direct obligations<\/strong> of the Treasury (slightly less safe than STRIPS)<\/td>\n<\/tr>\n<tr>\n<td><strong>Floating-rate notes (FRNs)<\/strong><\/td>\n<td>2 years<\/td>\n<td>Rate resets weekly to the 13-week T-bill auction rate<\/td>\n<td>Auction<\/td>\n<td>Minimal interest-rate risk<\/td>\n<\/tr>\n<tr>\n<td><strong>Savings bonds (Series EE, I)<\/strong><\/td>\n<td>Up to 30 years<\/td>\n<td>EE: fixed rate; I: fixed + inflation component<\/td>\n<td>TreasuryDirect<\/td>\n<td><strong>Non-negotiable<\/strong> (can't be sold, only redeemed); interest is tax-deferred until redemption; may be federally tax-free if used for qualified education expenses<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>TIPS example.<\/strong> $1,000 TIPS with a 2% coupon. CPI rises 3% in year one → principal becomes $1,030; the coupon is 2% × $1,030 = $20.60. If inflation continues, both principal and dollar interest keep rising. In deflation the principal falls (but never below the original at maturity).<\/p>\n<p><strong>Which Treasury has the most interest-rate risk?<\/strong> Long-term STRIPS (long maturity + zero coupon). <strong>Least?<\/strong> T-bills and FRNs.<\/p>\n<hr />\n<h2 id=\"s6-3\" data-sec=\"s6-3\"><span class=\"secnum\">6.3<\/span> Federal agency products<\/h2>\n<p>Federal agencies and <strong>government-sponsored enterprises (GSEs)<\/strong> issue debt to support specific sectors (housing, agriculture, education). Agency securities generally yield slightly more than Treasuries. Interest is federally taxable; state tax treatment varies.<\/p>\n<p><strong>Direct government backing vs. GSE.<\/strong><\/p>\n<ul>\n<li><strong>Ginnie Mae (GNMA — Government National Mortgage Association)<\/strong> — part of HUD. Its <strong>mortgage-backed pass-through certificates<\/strong> are the <strong>only<\/strong> agency securities backed by the <strong>full faith and credit of the US government<\/strong>. Interest is taxable at <strong>federal, state and local<\/strong> levels. Minimum $25,000 (pools), pay <strong>monthly<\/strong> interest and principal.<\/li>\n<li><strong>Fannie Mae (FNMA)<\/strong> and <strong>Freddie Mac (FHLMC)<\/strong> — publicly traded GSEs (in federal conservatorship since 2008) that buy mortgages from lenders and issue mortgage-backed securities. Not legally backed by the government (\"implied\" backing). Taxable at all levels.<\/li>\n<li><strong>Federal Farm Credit Banks<\/strong>, <strong>Federal Home Loan Banks<\/strong> — GSEs issuing notes and bonds to support agriculture and housing. Interest exempt from state/local tax.<\/li>\n<li><strong>Sallie Mae (SLM)<\/strong> — formerly a GSE for student loans, now private.<\/li>\n<li><strong>Tennessee Valley Authority (TVA)<\/strong> — issues bonds backed by its power revenues.<\/li>\n<\/ul>\n<p><strong>Mortgage-backed securities (MBS) — key concepts.<\/strong><\/p>\n<ul>\n<li>A <strong>pass-through<\/strong> collects mortgage payments from a pool of homeowners and passes principal and interest through to investors <strong>monthly<\/strong>. Each payment is part interest (taxable) and part return of principal (not taxable).<\/li>\n<li><strong>Prepayment risk<\/strong> — when rates <strong>fall<\/strong>, homeowners refinance, returning principal early that must be reinvested at lower rates. <strong>Extension risk<\/strong> — when rates <strong>rise<\/strong>, prepayments slow and the security's life extends. Because of this, MBS cash flows and maturities are uncertain; the \"average life\" is an estimate.<\/li>\n<li><strong>Collateralized mortgage obligations (CMOs)<\/strong> — MBS pools carved into <strong>tranches<\/strong> with different maturities and priorities to redistribute prepayment risk. Sequential-pay tranches get principal in order; <strong>planned amortization class (PAC)<\/strong> tranches have the most predictable cash flow (prepayment risk shifted to \"companion/support\" tranches); <strong>Z-tranches<\/strong> accrue like zeros. CMOs pay interest monthly, are taxable at all levels, and are <strong>complex<\/strong> — FINRA requires specific disclosure and suitability review; they must not be compared to Treasuries or CDs in communications. Minimum denomination typically $1,000.<\/li>\n<li><strong>Collateralized debt obligations (CDOs)<\/strong> and <strong>asset-backed securities (ABS)<\/strong> — similar structures backed by other loans (auto loans, credit cards, corporate debt).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s6-4\" data-sec=\"s6-4\"><span class=\"secnum\">6.4<\/span> The market<\/h2>\n<p><strong>Primary dealers<\/strong> — a group of large banks and broker-dealers approved by the Fed to bid at every Treasury auction and to trade directly with the Fed in open-market operations.<\/p>\n<p><strong>Secondary market.<\/strong> Treasuries trade OTC in an enormous, extremely liquid dealer market; spreads are tiny (fractions of a 32nd). Prices are published daily. Agency securities trade similarly but less liquidly.<\/p>\n<p><strong>Settlement.<\/strong> T+1 regular way; same-day cash settlement is common for Treasuries. Delivery via Fed book-entry.<\/p>\n<p><strong>Treasury yields as benchmarks.<\/strong> The 10-year Treasury yield is the benchmark for mortgage rates and corporate bonds; the 3-month T-bill rate is the \"risk-free rate\" in financial models. The <strong>spread<\/strong> between a corporate bond and the Treasury of the same maturity reflects credit risk.<\/p>\n<p><strong>The yield curve<\/strong> (Treasuries define it): normal, flat, inverted — see Chapter 3. The Fed influences the <strong>short<\/strong> end directly; the long end reflects market expectations for growth and inflation.<\/p>\n<hr />\n<h2 id=\"s6-5\" data-sec=\"s6-5\"><span class=\"secnum\">6.5<\/span> The economy, the Fed and policy<\/h2>\n<h3 id=\"s6-5-1\" data-sec=\"s6-5-1\"><span class=\"secnum\">6.5.1<\/span> Monetary policy<\/h3>\n<p><strong>Monetary policy<\/strong> is controlled by the <strong>Federal Reserve<\/strong> (the Fed) — the US central bank, independent of Congress and the President in day-to-day operations. Its dual mandate: <strong>stable prices (control inflation)<\/strong> and <strong>maximum employment<\/strong>. The <strong>Federal Open Market Committee (FOMC)<\/strong> — 12 members (7 governors + NY Fed president + 4 rotating regional presidents) — meets roughly every 6 weeks (8 times a year) to set policy.<\/p>\n<ul>\n<li><strong>Easy (expansionary, accommodative) money policy<\/strong> — Fed increases the money supply, lowers interest rates → stimulates borrowing, spending, growth; risk of inflation. Used during recessions.<\/li>\n<li><strong>Tight (contractionary, restrictive) money policy<\/strong> — Fed decreases the money supply, raises rates → slows the economy to fight inflation. Risk of recession.<\/li>\n<\/ul>\n<p><strong>Money supply measures.<\/strong> <strong>M1<\/strong> = currency in circulation + checking/demand deposits (+ savings deposits since 2020). <strong>M2<\/strong> = M1 + small time deposits + retail money market funds. <strong>M3<\/strong> adds large time deposits and institutional funds.<\/p>\n<h3 id=\"s6-5-2\" data-sec=\"s6-5-2\"><span class=\"secnum\">6.5.2<\/span> Rates<\/h3>\n<table>\n<thead>\n<tr>\n<th>Rate<\/th>\n<th>What it is<\/th>\n<th>Who sets it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Federal funds rate<\/strong><\/td>\n<td>Rate banks charge each other for <strong>overnight<\/strong> loans of excess reserves held at the Fed. The most sensitive, closely watched indicator of Fed policy.<\/td>\n<td>The market, but the <strong>FOMC sets a target range<\/strong> and manages it via open-market operations<\/td>\n<\/tr>\n<tr>\n<td><strong>Discount rate<\/strong><\/td>\n<td>Rate the Fed charges <strong>member banks<\/strong> for short-term loans directly from the Fed's \"discount window\"<\/td>\n<td><strong>The Fed<\/strong> (directly)<\/td>\n<\/tr>\n<tr>\n<td><strong>Prime rate<\/strong><\/td>\n<td>Rate commercial banks charge their <strong>most creditworthy corporate customers<\/strong>; benchmark for many consumer loans<\/td>\n<td>Banks (typically fed funds + 3%)<\/td>\n<\/tr>\n<tr>\n<td><strong>Broker call (call money) rate<\/strong><\/td>\n<td>Rate banks charge broker-dealers on loans used to finance customer margin accounts<\/td>\n<td>Banks; usually slightly above fed funds<\/td>\n<\/tr>\n<tr>\n<td><strong>SOFR<\/strong><\/td>\n<td>Secured Overnight Financing Rate — the replacement for LIBOR as the benchmark for floating-rate products<\/td>\n<td>Published by the NY Fed from repo transactions<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Rough ordering from lowest to highest: fed funds ≈ discount rate &lt; broker call &lt; prime.<\/p>\n<p><strong>Interest-rate effects.<\/strong> Rising rates: bond prices fall, borrowing costs rise, stock valuations tend to fall (especially growth stocks and rate-sensitive sectors like utilities), the dollar tends to strengthen. Falling rates: the reverse.<\/p>\n<h3 id=\"s6-5-3\" data-sec=\"s6-5-3\"><span class=\"secnum\">6.5.3<\/span> Tools of the Federal Reserve<\/h3>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>To ease (stimulate)<\/th>\n<th>To tighten (fight inflation)<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Open-market operations (FOMC)<\/strong><\/td>\n<td><strong>Buys<\/strong> Treasuries from primary dealers → adds reserves/money to the system → rates fall<\/td>\n<td><strong>Sells<\/strong> Treasuries → drains money → rates rise<\/td>\n<td><strong>Most frequently used<\/strong> and most flexible tool; repos (temporary buying) and reverse repos (temporary selling) are the day-to-day versions<\/td>\n<\/tr>\n<tr>\n<td><strong>Discount rate<\/strong><\/td>\n<td>Lower<\/td>\n<td>Raise<\/td>\n<td>Signal of Fed intent<\/td>\n<\/tr>\n<tr>\n<td><strong>Reserve requirements<\/strong><\/td>\n<td>Lower (banks can lend more)<\/td>\n<td>Raise<\/td>\n<td>Most powerful but <strong>least used<\/strong> (reserve ratio has been 0% since 2020)<\/td>\n<\/tr>\n<tr>\n<td><strong>Interest on reserve balances<\/strong><\/td>\n<td>Lower<\/td>\n<td>Raise<\/td>\n<td>Modern primary tool for steering fed funds within the target range<\/td>\n<\/tr>\n<tr>\n<td><strong>Margin requirements (Reg T)<\/strong><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>The Fed sets them (50%), but they are rarely changed and not really used as a policy tool<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Quantitative easing (QE)<\/strong> — large-scale purchases of long-term Treasuries and MBS to push long rates down when short rates are already near zero. <strong>Quantitative tightening (QT)<\/strong> — letting holdings run off.<\/p>\n<p><strong>Memory aid:<\/strong> when the Fed <strong>buys<\/strong>, it pumps money in (easy). When the Fed <strong>sells<\/strong>, it soaks money up (tight). \"Buy = Bigger money supply.\"<\/p>\n<h3 id=\"s6-5-4\" data-sec=\"s6-5-4\"><span class=\"secnum\">6.5.4<\/span> Economic factors<\/h3>\n<p><strong>The business cycle.<\/strong> Four phases: <strong>expansion<\/strong> (recovery) → <strong>peak<\/strong> → <strong>contraction<\/strong> (recession) → <strong>trough<\/strong>, then repeat.<\/p>\n<ul>\n<li><strong>Recession<\/strong> — commonly defined as <strong>two consecutive quarters of declining GDP<\/strong> (officially declared by the NBER).<\/li>\n<li><strong>Depression<\/strong> — a severe, prolonged recession (often described as 6+ quarters of decline or a very deep fall in GDP).<\/li>\n<\/ul>\n<p><strong>Key measures.<\/strong><\/p>\n<ul>\n<li><strong>Gross domestic product (GDP)<\/strong> — total value of goods and services produced <em>within<\/em> the US, regardless of who owns the producer. (GNP = output of US-owned entities anywhere.) Reported quarterly, adjusted for inflation as \"real GDP.\"<\/li>\n<li><strong>Consumer Price Index (CPI)<\/strong> — the main measure of inflation (prices of a basket of consumer goods). The <strong>Producer Price Index (PPI)<\/strong> measures wholesale prices and tends to lead CPI.<\/li>\n<li><strong>Inflation<\/strong> — general rise in prices; erodes purchasing power; hurts fixed-income investors most. <strong>Deflation<\/strong> — falling prices. <strong>Stagflation<\/strong> — stagnant growth plus high inflation.<\/li>\n<li><strong>Unemployment rate<\/strong> — lagging indicator.<\/li>\n<\/ul>\n<p><strong>Economic indicators<\/strong> (classified by timing relative to the cycle).<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Leading<\/strong> (change <em>before<\/em> the economy)<\/td>\n<td><strong>Stock market (S&amp;P 500)<\/strong>, building permits/housing starts, new orders for durable goods, initial unemployment claims, money supply (M2), average weekly hours in manufacturing, consumer expectations, yield curve/spread<\/td>\n<\/tr>\n<tr>\n<td><strong>Coincident<\/strong> (move <em>with<\/em> the economy)<\/td>\n<td>GDP, industrial production, personal income, nonfarm payrolls/employment, manufacturing &amp; trade sales<\/td>\n<\/tr>\n<tr>\n<td><strong>Lagging<\/strong> (change <em>after<\/em>)<\/td>\n<td><strong>Unemployment rate<\/strong>, average duration of unemployment, CPI/inflation, prime rate, corporate profits, consumer debt levels, inventories-to-sales ratio<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Economic theories (know the one-liners).<\/strong><\/p>\n<ul>\n<li><strong>Keynesian<\/strong> — government spending and taxation (fiscal policy) drive demand; government should spend during downturns.<\/li>\n<li><strong>Monetarist<\/strong> (Milton Friedman) — the money supply is what matters; the Fed should grow it steadily.<\/li>\n<li><strong>Supply-side<\/strong> — cut taxes and regulation to encourage production; growth will follow.<\/li>\n<\/ul>\n<p><strong>International factors.<\/strong><\/p>\n<ul>\n<li><strong>Balance of payments / balance of trade<\/strong> — exports minus imports. A <strong>trade deficit<\/strong> (imports &gt; exports) tends to weaken the dollar over time.<\/li>\n<li><strong>Currency effects<\/strong>: a <strong>weak dollar<\/strong> helps US exporters (their goods are cheaper abroad) and hurts importers and US consumers of foreign goods; a <strong>strong dollar<\/strong> does the opposite. Foreign investors holding US bonds gain when the dollar strengthens.<\/li>\n<li><strong>Exchange rates<\/strong> are set in the foreign-exchange (forex) market; higher US interest rates tend to attract foreign capital and strengthen the dollar.<\/li>\n<\/ul>\n<h3 id=\"s6-5-5\" data-sec=\"s6-5-5\"><span class=\"secnum\">6.5.5<\/span> Fiscal policy<\/h3>\n<p><strong>Fiscal policy<\/strong> is the government's use of <strong>taxation and spending<\/strong>, set by <strong>Congress and the President<\/strong> (not the Fed). It's rooted in Keynesian economics.<\/p>\n<ul>\n<li><strong>Expansionary fiscal policy<\/strong> — cut taxes, increase government spending → stimulates demand; increases the budget deficit; can cause inflation.<\/li>\n<li><strong>Contractionary fiscal policy<\/strong> — raise taxes, cut spending → slows the economy; reduces the deficit.<\/li>\n<li>Fiscal policy is <strong>slower<\/strong> to implement than monetary policy (requires legislation) but can target specific groups.<\/li>\n<li>Large deficits mean more Treasury issuance, which can push interest rates up (\"crowding out\" private borrowing).<\/li>\n<\/ul>\n<p><strong>Monetary vs. fiscal — the comparison the exam wants:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Monetary policy<\/th>\n<th>Fiscal policy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Who<\/td>\n<td>Federal Reserve (FOMC)<\/td>\n<td>Congress &amp; President<\/td>\n<\/tr>\n<tr>\n<td>Tools<\/td>\n<td>Open-market ops, discount rate, reserve requirements<\/td>\n<td>Taxes, government spending<\/td>\n<\/tr>\n<tr>\n<td>Speed<\/td>\n<td>Fast<\/td>\n<td>Slow<\/td>\n<\/tr>\n<tr>\n<td>Theory<\/td>\n<td>Monetarist<\/td>\n<td>Keynesian<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Chapter 6 quick review<\/h2>\n<ul>\n<li>Treasuries: no credit risk; interest <strong>federally taxable, state/local exempt<\/strong>; book-entry; $100 minimum; T+1; actual/365 accrual; notes/bonds quoted in 1/32nds.<\/li>\n<li>Bills ≤ 1 yr (discount); notes 2–10 yrs; bonds 20–30 yrs; TIPS adjust principal for CPI; STRIPS = Treasury zeros; receipts = dealer-created zeros; savings bonds non-negotiable.<\/li>\n<li><strong>Ginnie Mae = only agency with full US backing<\/strong>; MBS pay monthly, taxed at all levels; prepayment risk when rates fall, extension risk when rates rise; CMOs split into tranches (PAC = most predictable).<\/li>\n<li>Fed = monetary policy (FOMC, 8 meetings/yr). Tools: open-market ops (most used — buy to ease, sell to tighten), discount rate, reserve requirements (least used), interest on reserves.<\/li>\n<li>Rates: fed funds (overnight bank-to-bank, Fed targets), discount (Fed to banks), prime (banks to best customers), broker call (banks to BDs for margin).<\/li>\n<li>Recession = 2 consecutive quarters of negative GDP. Leading indicators: stock market, housing starts, M2, new orders, jobless claims. Lagging: unemployment rate, CPI, prime rate.<\/li>\n<li>Weak dollar helps exporters; strong dollar helps importers.<\/li>\n<li>Fiscal policy = Congress/President, taxes &amp; spending, Keynesian, slow.<\/li>\n<\/ul>"}, {"num": 7, "name": "Investment Companies", "file": "07-investment-companies.md", "minutes": 18, "sections": [{"id": "s7-1", "num": "7.1", "title": "Foundations", "level": 2}, {"id": "s7-2", "num": "7.2", "title": "Types of funds", "level": 2}, {"id": "s7-3", "num": "7.3", "title": "Open-end management companies (mutual funds)", "level": 2}, {"id": "s7-3-1", "num": "7.3.1", "title": "Characteristics", "level": 3}, {"id": "s7-3-2", "num": "7.3.2", "title": "Shareholder rights", "level": 3}, {"id": "s7-3-3", "num": "7.3.3", "title": "Transactions", "level": 3}, {"id": "s7-3-4", "num": "7.3.4", "title": "Returns", "level": 3}, {"id": "s7-3-5", "num": "7.3.5", "title": "Share classes", "level": 3}, {"id": "s7-3-6", "num": "7.3.6", "title": "Subchapter M", "level": 3}, {"id": "s7-4", "num": "7.4", "title": "Closed-end management companies", "level": 2}, {"id": "s7-5", "num": "7.5", "title": "Exchange-traded funds", "level": 2}, {"id": "s7-5-1", "num": "7.5.1", "title": "Passive ETFs", "level": 3}, {"id": "s7-5-2", "num": "7.5.2", "title": "Other ETFs", "level": 3}, {"id": "s7-5-3", "num": "7.5.3", "title": "Exchange-traded notes", "level": 3}, {"id": "s7-6", "num": "7.6", "title": "Unit investment trusts", "level": 2}, {"id": "s7-7", "num": "7.7", "title": "Alpha and beta", "level": 2}], "html": "\n<blockquote>\n<p>Mutual funds, closed-end funds, ETFs and UITs. This is one of the most heavily tested product areas. Know the Investment Company Act of 1940 classifications, how NAV and POP work, sales charge rules and breakpoints, share classes, Subchapter M, and the ETF/closed-end/open-end comparisons.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s7-1\" data-sec=\"s7-1\"><span class=\"secnum\">7.1<\/span> Foundations<\/h2>\n<p>An <strong>investment company<\/strong> pools money from many investors and invests it according to a stated objective, giving each investor an undivided interest in a diversified, professionally managed portfolio. Governed by the <strong>Investment Company Act of 1940<\/strong>.<\/p>\n<p><strong>Advantages for investors:<\/strong> diversification, professional management, liquidity, low minimums, convenience (automatic reinvestment, exchanges within a fund family), record-keeping. <strong>Disadvantages:<\/strong> fees and expenses, no control over individual holdings, tax inefficiency (capital gains distributions), and for mutual funds, pricing only once per day.<\/p>\n<p><strong>Three classifications under the 1940 Act:<\/strong><\/p>\n<ol>\n<li><strong>Face-amount certificate companies<\/strong> — issue certificates promising a fixed sum at a future date in exchange for lump-sum or periodic payments. Nearly extinct.<\/li>\n<li><strong>Unit investment trusts (UITs)<\/strong> — fixed, unmanaged portfolios; redeemable units; no board of directors (see 7.6).<\/li>\n<li><strong>Management companies<\/strong> — actively or passively managed portfolios with a board of directors. Subdivided into:\n   - <strong>Open-end<\/strong> (mutual funds) — continuously issue and redeem shares; no secondary market (7.3).\n   - <strong>Closed-end<\/strong> — fixed number of shares sold in an IPO, then trade on exchanges (7.4).<\/li>\n<\/ol>\n<p>Management companies are further labeled <strong>diversified<\/strong> or <strong>non-diversified<\/strong>. A <strong>diversified<\/strong> company meets the <strong>75-5-10 test<\/strong>: at least 75% of its assets are invested such that no more than <strong>5%<\/strong> of total assets is in any one issuer and the fund owns no more than <strong>10%<\/strong> of any one issuer's voting shares (the other 25% is unrestricted).<\/p>\n<p><strong>Registration.<\/strong> An investment company must register with the SEC under the 1940 Act and its shares are registered under the Securities Act of 1933 (prospectus required). To make a public offering it needs at least <strong>$100,000<\/strong> in net worth (seed capital).<\/p>\n<p><strong>Key people.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Role<\/th>\n<th>Function<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Board of directors<\/strong><\/td>\n<td>Oversees the fund; hires the adviser, custodian, transfer agent; at least <strong>40% must be independent<\/strong> (non-interested) directors<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment adviser (portfolio manager)<\/strong><\/td>\n<td>Manages the portfolio per the objective; paid a management fee (the largest expense); contract approved by the board and shareholders; initially 2 years, renewed annually<\/td>\n<\/tr>\n<tr>\n<td><strong>Custodian<\/strong> (usually a bank)<\/td>\n<td>Holds the fund's cash and securities; safekeeping<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer agent<\/strong><\/td>\n<td>Issues/redeems shares, keeps shareholder records, sends statements and distributions<\/td>\n<\/tr>\n<tr>\n<td><strong>Underwriter/distributor (sponsor)<\/strong><\/td>\n<td>Markets the shares to broker-dealers and the public; collects the sales charge<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Shareholder voting rights.<\/strong> Shareholders elect the board, approve the adviser's contract, and must approve any change in the fund's <strong>investment objective<\/strong>, changes in fees/12b-1 plans, and changes from diversified to non-diversified. A mutual fund <strong>cannot<\/strong> change its objective without a majority vote of shareholders.<\/p>\n<hr />\n<h2 id=\"s7-2\" data-sec=\"s7-2\"><span class=\"secnum\">7.2<\/span> Types of funds<\/h2>\n<p>Funds are classified by <strong>investment objective<\/strong>, which is stated in the prospectus and determines suitability.<\/p>\n<table>\n<thead>\n<tr>\n<th>Fund type<\/th>\n<th>Objective / holdings<\/th>\n<th>Suitable for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Money market fund<\/strong><\/td>\n<td>Capital preservation &amp; liquidity; short-term debt (CP, T-bills, repos); maintains stable <strong>$1.00 NAV<\/strong> (not guaranteed); no sales charge; check-writing<\/td>\n<td>Emergency funds, parking cash<\/td>\n<\/tr>\n<tr>\n<td><strong>Growth fund<\/strong><\/td>\n<td>Capital appreciation; stocks of growing companies; little income<\/td>\n<td>Long-horizon investors<\/td>\n<\/tr>\n<tr>\n<td><strong>Aggressive growth / small-cap<\/strong><\/td>\n<td>Maximum appreciation; volatile<\/td>\n<td>High risk tolerance<\/td>\n<\/tr>\n<tr>\n<td><strong>Value fund<\/strong><\/td>\n<td>Undervalued stocks<\/td>\n<td>Moderate<\/td>\n<\/tr>\n<tr>\n<td><strong>Income (equity income) fund<\/strong><\/td>\n<td>Dividend income; utilities, blue chips, preferred<\/td>\n<td>Income seekers<\/td>\n<\/tr>\n<tr>\n<td><strong>Growth &amp; income<\/strong><\/td>\n<td>Mix of both<\/td>\n<td>Balanced needs<\/td>\n<\/tr>\n<tr>\n<td><strong>Balanced fund<\/strong><\/td>\n<td>Stocks <strong>and<\/strong> bonds, roughly fixed proportions (e.g., 60/40)<\/td>\n<td>Moderate, one-fund solution<\/td>\n<\/tr>\n<tr>\n<td><strong>Asset allocation fund<\/strong><\/td>\n<td>Stocks, bonds and cash, proportions adjusted by the manager<\/td>\n<td>Moderate<\/td>\n<\/tr>\n<tr>\n<td><strong>Target-date (lifecycle) fund<\/strong><\/td>\n<td>Allocation becomes more conservative as the target date approaches (\"glide path\")<\/td>\n<td>Retirement savers; 401(k) default options<\/td>\n<\/tr>\n<tr>\n<td><strong>Bond (fixed-income) fund<\/strong><\/td>\n<td>Income; corporate, government, muni or high-yield bonds<\/td>\n<td>Income; interest-rate risk<\/td>\n<\/tr>\n<tr>\n<td><strong>Municipal bond fund<\/strong><\/td>\n<td>Federally tax-free income<\/td>\n<td>High-bracket taxable accounts; <strong>never in an IRA<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Index fund<\/strong><\/td>\n<td>Replicate an index (S&amp;P 500); passive; <strong>lowest expenses<\/strong>, low turnover, tax efficient<\/td>\n<td>Cost-conscious investors<\/td>\n<\/tr>\n<tr>\n<td><strong>Sector / specialized fund<\/strong><\/td>\n<td>One industry (tech, health care, energy, gold) — concentrated, more risk<\/td>\n<td>Investors wanting targeted exposure<\/td>\n<\/tr>\n<tr>\n<td><strong>International fund<\/strong><\/td>\n<td>Non-US companies; currency risk<\/td>\n<td>Diversification<\/td>\n<\/tr>\n<tr>\n<td><strong>Global fund<\/strong><\/td>\n<td>US <strong>and<\/strong> non-US<\/td>\n<td>Diversification<\/td>\n<\/tr>\n<tr>\n<td><strong>Emerging markets<\/strong><\/td>\n<td>Developing countries; high risk<\/td>\n<td>Aggressive<\/td>\n<\/tr>\n<tr>\n<td><strong>Fund of funds<\/strong><\/td>\n<td>Holds other mutual funds; layered fees<\/td>\n<td>Simplicity<\/td>\n<\/tr>\n<tr>\n<td><strong>Hedge-like / alternative strategy funds<\/strong><\/td>\n<td>Long/short, leverage, derivatives inside a '40 Act wrapper<\/td>\n<td>Sophisticated<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Risk spectrum (lowest → highest):<\/strong> money market → government bond → investment-grade bond → balanced → growth &amp; income → growth → aggressive growth / sector / emerging markets.<\/p>\n<hr />\n<h2 id=\"s7-3\" data-sec=\"s7-3\"><span class=\"secnum\">7.3<\/span> Open-end management companies (mutual funds)<\/h2>\n<h3 id=\"s7-3-1\" data-sec=\"s7-3-1\"><span class=\"secnum\">7.3.1<\/span> Characteristics<\/h3>\n<ul>\n<li><strong>Continuous offering<\/strong> — the fund issues new shares whenever investors buy; it is always a primary offering, so a <strong>prospectus<\/strong> must be delivered with or before every solicitation.<\/li>\n<li><strong>Redeemable<\/strong> — investors sell shares back <strong>to the fund<\/strong> (not to other investors) at the next-computed <strong>NAV<\/strong>. The fund must pay redemption proceeds within <strong>7 calendar days<\/strong>.<\/li>\n<li><strong>No secondary market.<\/strong> Shares aren't traded on exchanges.<\/li>\n<li>Only <strong>common stock<\/strong> is issued — no preferred, no bonds. Mutual funds may not issue senior securities; they generally cannot buy on margin or sell short (and are limited in borrowing).<\/li>\n<li><strong>Fractional shares<\/strong> are allowed.<\/li>\n<li>Priced once per day using <strong>forward pricing<\/strong> — orders are filled at the next NAV calculated after the order is received (NAV is computed at the close, 4:00 pm ET).<\/li>\n<li>Shares can be purchased from the fund, through its underwriter, or through broker-dealers that have a selling agreement with the underwriter. A broker-dealer may <strong>not<\/strong> hold itself out as a buyer of fund shares at a discount or maintain an inventory.<\/li>\n<\/ul>\n<h3 id=\"s7-3-2\" data-sec=\"s7-3-2\"><span class=\"secnum\">7.3.2<\/span> Shareholder rights<\/h3>\n<ul>\n<li>Vote for the board, on the adviser contract, on changes to the investment objective and fundamental policies, and on fee changes.<\/li>\n<li>Receive <strong>semiannual reports<\/strong> (annual report must be audited) with financial statements and the portfolio holdings.<\/li>\n<li>Receive dividends and capital gains distributions pro-rata.<\/li>\n<li>Right to redeem at NAV at any time the market is open.<\/li>\n<li>Right to a prospectus and, on request, the <strong>Statement of Additional Information (SAI)<\/strong>.<\/li>\n<\/ul>\n<p><strong>The prospectus<\/strong> (summary prospectus permitted) contains: investment objective and strategies, risks, <strong>fee table<\/strong> (sales charges and annual operating expenses), performance (1-, 5-, 10-year returns), management, purchase and redemption procedures, and tax information. Performance shown must be as of the most recent calendar quarter and must be accompanied by the \"past performance does not guarantee future results\" disclosure.<\/p>\n<h3 id=\"s7-3-3\" data-sec=\"s7-3-3\"><span class=\"secnum\">7.3.3<\/span> Transactions<\/h3>\n<p><strong>Net asset value (NAV) per share.<\/strong><\/p>\n<pre><code>NAV per share = (Total assets − Total liabilities) ÷ Shares outstanding\n<\/code><\/pre>\n<p>NAV changes when the portfolio's securities change in value, when dividends/interest are received, or when distributions are paid out. NAV does <strong>not<\/strong> change when investors buy or redeem shares (money and shares move proportionally).<\/p>\n<p><strong>Public offering price (POP)<\/strong> for a fund with a front-end load:<\/p>\n<pre><code>POP = NAV ÷ (1 − Sales charge %)\nSales charge % = (POP − NAV) ÷ POP\n<\/code><\/pre>\n<p>The sales charge is always calculated as a percentage of the <strong>POP<\/strong> (offering price), not the NAV.<\/p>\n<p><strong>Example.<\/strong> NAV = $19.00, sales charge 5%. POP = 19 / 0.95 = <strong>$20.00<\/strong>. The $1.00 goes to the underwriter/selling dealer. If quoted \"NAV 19.00, POP 20.00,\" sales charge = 1/20 = 5%.<\/p>\n<p><strong>Maximum sales charge.<\/strong> FINRA Rule 2341 caps the sales charge on mutual fund shares at <strong>8.5%<\/strong> of the POP — and a fund may only charge the maximum if it offers <strong>all<\/strong> of: breakpoints, rights of accumulation, and automatic dividend reinvestment at NAV. Funds that also charge a 12b-1 fee have a lower cap (6.25%–7.25%); the exam tests the 8.5% figure.<\/p>\n<p><strong>No-load fund<\/strong> — sold at NAV with no sales charge (may still have a 12b-1 fee of up to <strong>0.25%<\/strong> and still call itself no-load).<\/p>\n<p><strong>Breakpoints<\/strong> — reduced sales charges for larger purchases. A typical schedule: under $25,000 → 5.75%; $25k–$50k → 5.0%; $50k–$100k → 4.5%; $100k+ → 3.5%; $1 million+ → 0%. Breakpoints are available to individuals, married couples, parents with minor children (custodial accounts), and most trusts/corporations — <strong>not<\/strong> to investment clubs or groups formed to pool purchases.<\/p>\n<p>Ways to qualify for a breakpoint:<\/p>\n<ul>\n<li><strong>Letter of intent (LOI)<\/strong> — investor states an intent to invest enough to hit a breakpoint within <strong>13 months<\/strong>; receives the reduced charge immediately on all purchases. Can be <strong>backdated up to 90 days<\/strong> to include a recent purchase. If the investor doesn't complete it, the fund retroactively collects the higher charge (shares are held in escrow). Appreciation does not count toward the LOI; only new money does.<\/li>\n<li><strong>Rights of accumulation (ROA)<\/strong> — once the <strong>current value<\/strong> of all holdings in the fund family (plus the new purchase) crosses a breakpoint, the lower charge applies to <strong>future<\/strong> purchases (not retroactive). No time limit; appreciation counts.<\/li>\n<li><strong>Combination privilege<\/strong> — combining purchases across funds within the same family to reach a breakpoint.<\/li>\n<\/ul>\n<p><strong>Breakpoint sale<\/strong> — a <strong>prohibited<\/strong> practice: a rep sells an amount just below a breakpoint (e.g., $24,000 when the breakpoint is $25,000) to earn a higher commission, or splits a purchase across fund families so no breakpoint is reached. Reps must inform customers of breakpoints.<\/p>\n<p><strong>Other privileges.<\/strong> <strong>Exchange (conversion) privilege<\/strong> — switch between funds in the same family at NAV with no new sales charge (still a taxable event). <strong>Automatic reinvestment<\/strong> of distributions at NAV. <strong>Systematic withdrawal plans<\/strong>. <strong>Dollar cost averaging<\/strong> — investing a fixed dollar amount at regular intervals, buying more shares when prices are low and fewer when high; results in an average cost per share <strong>lower<\/strong> than the average price per share over time (doesn't guarantee profit).<\/p>\n<p><strong>Redemption.<\/strong> At the next NAV, less any <strong>redemption fee<\/strong> or <strong>contingent deferred sales charge (CDSC)<\/strong>. Must be paid within <strong>7 days<\/strong>. Some funds impose short-term redemption fees to discourage market timing. Redemption is a <strong>taxable event<\/strong> (capital gain/loss).<\/p>\n<h3 id=\"s7-3-4\" data-sec=\"s7-3-4\"><span class=\"secnum\">7.3.4<\/span> Returns<\/h3>\n<p>A mutual fund investor earns a return from three sources:<\/p>\n<ol>\n<li><strong>Dividend distributions<\/strong> — from the net investment income (dividends and interest the fund receives, minus expenses). Taxed to the shareholder as ordinary or qualified dividends.<\/li>\n<li><strong>Capital gains distributions<\/strong> — from gains the fund realized selling portfolio securities, usually paid once a year. <strong>Long-term<\/strong> capital gains distributions are taxed as long-term gains to the shareholder <strong>regardless of how long the shareholder has owned the fund<\/strong>. Short-term gains are passed through as ordinary dividends.<\/li>\n<li><strong>Unrealized appreciation<\/strong> — the increase in NAV, realized only when the investor sells.<\/li>\n<\/ol>\n<p><strong>Total return<\/strong> = (ending NAV − beginning NAV + distributions) ÷ beginning NAV.<\/p>\n<p>Distributions are taxable whether taken in cash or <strong>reinvested<\/strong>. Reinvested distributions <strong>increase the cost basis<\/strong>. A fund's NAV drops by the amount of a distribution on the ex-date; buying right before a big distribution (\"buying a dividend\") gives the investor an immediate tax bill with no economic gain — a sales practice reps must not encourage.<\/p>\n<p><strong>Expense ratio<\/strong> = annual operating expenses (management fee + 12b-1 fee + other) ÷ average net assets. Lower is better; index funds often under 0.10%, actively managed equity funds commonly 0.5%–1.5%.<\/p>\n<p><strong>12b-1 fees<\/strong> — annual distribution/marketing fees charged against fund assets, named after SEC Rule 12b-1. Must be approved by the board (including a majority of independent directors) and shareholders, and reviewed annually. Max <strong>0.75%<\/strong> for distribution plus <strong>0.25%<\/strong> for service fees (total 1.00%). A fund calling itself \"no-load\" may charge at most 0.25%.<\/p>\n<h3 id=\"s7-3-5\" data-sec=\"s7-3-5\"><span class=\"secnum\">7.3.5<\/span> Share classes<\/h3>\n<p>The same portfolio sold with different fee structures. The exam tests which class fits which investor.<\/p>\n<table>\n<thead>\n<tr>\n<th>Class<\/th>\n<th>Sales charge<\/th>\n<th>12b-1 fee<\/th>\n<th>Best for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Class A<\/strong><\/td>\n<td><strong>Front-end load<\/strong> (deducted from the purchase); breakpoints available<\/td>\n<td>Low (≈0.25%)<\/td>\n<td><strong>Large investments<\/strong> (breakpoints) and <strong>long holding periods<\/strong> — lowest total cost over time<\/td>\n<\/tr>\n<tr>\n<td><strong>Class B<\/strong><\/td>\n<td><strong>Back-end load (CDSC)<\/strong> that declines each year, usually to 0% after 6–8 years, then shares <strong>convert to Class A<\/strong><\/td>\n<td>Higher (≈1.00%)<\/td>\n<td>Smaller amounts held long-term; <strong>never for large investments<\/strong> (no breakpoints — a $1 million Class B purchase is a red flag)<\/td>\n<\/tr>\n<tr>\n<td><strong>Class C<\/strong><\/td>\n<td>Level load — small or no front load, 1% CDSC if sold within the first year<\/td>\n<td>Higher (≈1.00%), <strong>ongoing, never converts<\/strong><\/td>\n<td><strong>Short-term<\/strong> holding periods (1–3 years); most expensive if held long-term<\/td>\n<\/tr>\n<tr>\n<td><strong>Class I / institutional<\/strong><\/td>\n<td>None<\/td>\n<td>None/low<\/td>\n<td>Institutions, retirement plans, advisory accounts<\/td>\n<\/tr>\n<tr>\n<td><strong>Class R<\/strong><\/td>\n<td>None<\/td>\n<td>Varies<\/td>\n<td>Retirement plans<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A CDSC is assessed on the <strong>lesser<\/strong> of the original purchase price or the current value at redemption.<\/p>\n<p><strong>Rule of thumb:<\/strong> Big money or long horizon → A. Small money, long horizon → B (or A). Short horizon → C.<\/p>\n<h3 id=\"s7-3-6\" data-sec=\"s7-3-6\"><span class=\"secnum\">7.3.6<\/span> Subchapter M<\/h3>\n<p>Under <strong>Subchapter M of the Internal Revenue Code<\/strong>, a fund that qualifies as a <strong>regulated investment company (RIC)<\/strong> acts as a <strong>conduit (pipeline)<\/strong>: it pays no corporate tax on income it distributes to shareholders. To qualify, the fund must distribute at least <strong>90%<\/strong> of its <strong>net investment income<\/strong> to shareholders. (It then pays tax only on whatever it retains.) Shareholders pay tax on the distributions. Nearly all mutual funds, closed-end funds, ETFs, REITs (which have a similar 90% rule) qualify.<\/p>\n<p>If a fund distributes 90%+ of its income, it is taxed only on the undistributed portion; if it fails the 90% test, it is taxed on <strong>all<\/strong> its income like a regular corporation.<\/p>\n<hr />\n<h2 id=\"s7-4\" data-sec=\"s7-4\"><span class=\"secnum\">7.4<\/span> Closed-end management companies<\/h2>\n<p>A <strong>closed-end fund (CEF)<\/strong> raises capital <strong>once<\/strong> in an IPO (with a
