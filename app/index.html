<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIE Study Hub</title>
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (app sections) · for Textbook a second column (chapter accordion) · reading/work pane. Dark-first, like a study console. */
:root{
  --bg:#1b1f26; --bg-2:#22272f; --bg-3:#2a303a; --line:#343b47; --line-2:#3f4856;
  --fg:#e8ecf1; --fg-2:#b4bcc8; --fg-3:#7f8a99;
  --accent:#5db3ff; --accent-2:#2d7fd1; --accent-ink:#0b1420;
  --good:#4cc38a; --warn:#f0b541; --bad:#f2666c;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --radius:10px; --rail:208px; --toc:272px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f7fa; --bg-2:#ffffff; --bg-3:#eef1f5; --line:#dde2ea; --line-2:#c9d0da;
    --fg:#1b222c; --fg-2:#45505e; --fg-3:#73808f;
    --accent:#1f6fd1; --accent-2:#1a5db0; --accent-ink:#ffffff;
    --good:#1f9d61; --warn:#b97c0b; --bad:#d13c43; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f5f7fa; --bg-2:#ffffff; --bg-3:#eef1f5; --line:#dde2ea; --line-2:#c9d0da;
  --fg:#1b222c; --fg-2:#45505e; --fg-3:#73808f;
  --accent:#1f6fd1; --accent-2:#1a5db0; --accent-ink:#ffffff;
  --good:#1f9d61; --warn:#b97c0b; --bad:#d13c43; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.9em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:var(--rail) 1fr;height:100%;min-height:0}
.rail{background:var(--bg-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:4px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-weight:700;letter-spacing:.2px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);font-family:var(--mono);font-size:12px;font-weight:600}
.rail .exam-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:4px 10px 8px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg-2);text-align:left;width:100%}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--bg-3);color:var(--fg)}
.navbtn.active{background:var(--bg-3);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.rail .spacer{flex:1}
.rail .foot{font-size:12px;color:var(--fg-3);padding:8px 10px;line-height:1.4}
.rail .foot .pct{color:var(--fg);font-weight:600}
.railbar{height:5px;background:var(--bg-3);border-radius:3px;margin:6px 10px 2px;overflow:hidden}
.railbar i{display:block;height:100%;background:var(--accent);border-radius:3px}

main{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.topbar h1{font-size:19px;font-weight:600}
.topbar .grow{flex:1}
.menubtn{display:none!important}
.view{flex:1;min-height:0;overflow:auto}
.pad{padding:22px;max-width:1100px}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;background:var(--bg-3);border:1px solid var(--line-2);color:var(--fg);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--bg-3);color:var(--fg-2)}
.chip.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chip.accent{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}

/* Cards & stats */
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h2{font-size:15px;font-weight:600;margin-bottom:12px;color:var(--fg)}
.card h2 small{font-weight:400;color:var(--fg-3);margin-left:8px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3)}
.stat .val{font-size:26px;font-weight:600;margin-top:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--fg-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
.bar{height:7px;background:var(--bg-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good i{background:var(--good)}.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.tablewrap{overflow-x:auto}
.chrow td:first-child{white-space:nowrap}
.chrow .bar{min-width:110px}
.muted{color:var(--fg-3)}
.empty{color:var(--fg-3);font-size:14px;padding:12px 0}

/* Textbook */
.book{display:grid;grid-template-columns:var(--toc) 1fr;height:100%;min-height:0}
.toc{border-right:1px solid var(--line);background:var(--bg-2);overflow:auto;min-width:0}
.toc .search{padding:12px 12px 6px}
.toc input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
.chap{border-bottom:1px solid var(--line)}
.chap > button{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left;font-weight:500;color:var(--fg-2)}
.chap > button:hover{color:var(--fg)}
.chap.open > button{color:var(--fg)}
.chap .caret{margin-left:auto;transition:transform .15s;color:var(--fg-3)}
.chap.open .caret{transform:rotate(90deg)}
.chap .done{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.chap ul{list-style:none;margin:0;padding:0 0 6px}
.chap li button{width:100%;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 30px;text-align:left;font-size:13px;color:var(--fg-2)}
.chap li.l3 button{padding-left:44px;font-size:12.5px}
.chap li button:hover{color:var(--fg)}
.chap li button.current{color:var(--accent);background:var(--bg-3);box-shadow:inset 3px 0 0 var(--accent)}
.chap li .tick{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center}
.chap li.read .tick{background:var(--good);border-color:var(--good)}
.chap li .tick svg{width:10px;height:10px;stroke:var(--accent-ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;display:none}
.chap li.read .tick svg{display:block}
.reader{overflow:auto;min-width:0}
.article{max-width:760px;margin:0 auto;padding:26px 26px 60px}
.article .meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;color:var(--fg-3);font-size:13px;margin:6px 0 18px}
.article h1.ct{font-size:28px;font-weight:600;margin-bottom:2px}
.prose h2{font-size:21px;font-weight:600;margin:38px 0 12px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.prose h3{font-size:17px;font-weight:600;margin:26px 0 8px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.prose h2 .secnum,.prose h3 .secnum{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:.85em;padding-top:.15em}
.prose h2 .mark,.prose h3 .mark{margin-left:auto;font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-3);white-space:nowrap}
.prose h2 .mark:hover,.prose h3 .mark:hover{border-color:var(--accent);color:var(--fg)}
.prose h2 .mark.on,.prose h3 .mark.on{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:transparent;color:var(--good)}
.prose p{margin:0 0 12px;max-width:70ch}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px;max-width:70ch}
.prose li{margin:4px 0}
.prose blockquote{margin:0 0 16px;padding:10px 16px;border-left:3px solid var(--accent);background:var(--bg-2);border-radius:0 8px 8px 0;color:var(--fg-2)}
.prose blockquote p{margin:0}
.prose table{font-size:13.5px;margin:4px 0 18px;display:block;overflow-x:auto;width:max-content;max-width:100%}
.prose th,.prose td{border:1px solid var(--line)}
.prose th{background:var(--bg-3);color:var(--fg-2);text-transform:none;letter-spacing:0;font-size:13px}
.prose tr:nth-child(even) td{background:color-mix(in srgb,var(--bg-2) 60%,transparent)}
.prose pre{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13px;margin:0 0 14px}
.prose code{background:var(--bg-3);padding:1px 5px;border-radius:4px}
.prose pre code{background:none;padding:0}
.prose hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.prose strong{color:var(--fg)}
.prose h2:first-child{border-top:0;margin-top:10px;padding-top:0}
.article .endnav{display:flex;justify-content:space-between;gap:10px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.quickreview h2{color:var(--accent)}

/* Quiz / exam */
.qwrap{max-width:820px;margin:0 auto;padding:22px}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.qhead .grow{flex:1}
.timer{font-family:var(--mono);font-size:18px;font-weight:500;padding:6px 12px;border-radius:8px;background:var(--bg-2);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qcard{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.qcard .qn{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qcard .qtext{font-size:17px;font-weight:500;margin:10px 0 18px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;text-align:left;width:100%;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt .let{font-family:var(--mono);font-weight:600;color:var(--fg-3);width:18px;flex:none}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt.sel .let{color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.right .let{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .let{color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.explain .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:6px}
.explain.ok .tag{color:var(--good)}.explain.no .tag{color:var(--bad)}
.qfoot{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.qfoot .grow{flex:1}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:16px}
.navgrid button{height:34px;border-radius:6px;border:1px solid var(--line-2);font-family:var(--mono);font-size:12px;color:var(--fg-2);background:var(--bg)}
.navgrid button.ans{background:var(--bg-3);color:var(--fg)}
.navgrid button.flag{border-color:var(--warn);color:var(--warn)}
.navgrid button.cur{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.navgrid button.ok{border-color:var(--good);color:var(--good)}
.navgrid button.ko{border-color:var(--bad);color:var(--bad)}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.chbtn{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--radius);background:var(--bg-2);border:1px solid var(--line);text-align:left}
.chbtn:hover{border-color:var(--accent)}
.chbtn .t{font-weight:600}
.chbtn .s{font-size:12px;color:var(--fg-3);display:flex;gap:8px;flex-wrap:wrap}
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.score .big{font-size:54px;font-weight:600;font-family:var(--mono);line-height:1}
.score .big.pass{color:var(--good)}.score .big.fail{color:var(--bad)}
.inlineconfirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--bg-3);font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--fg-2);cursor:pointer}
.toggle input{accent-color:var(--accent)}
textarea.io{width:100%;min-height:110px;font-family:var(--mono);font-size:12px;background:var(--bg);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:10px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.chart{width:100%;height:auto;display:block}
.sheet .prose h2{border-top:0;font-size:18px;margin-top:28px}
.sheet .prose table{font-size:13px}
.hint{font-size:13px;color:var(--fg-3);margin:6px 0 14px;max-width:70ch}

@media (max-width:900px){
  :root{--rail:0px}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:240px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vw transparent}
  .rail.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.45)}
  .menubtn{display:inline-flex!important}
  .book{grid-template-columns:1fr}
  .toc{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .toc.open{transform:none;box-shadow:0 0 0 100vw rgba(0,0,0,.45)}
  .grid2{grid-template-columns:1fr}
  .article{padding:18px 16px 50px}
  .pad{padding:16px}
  .qwrap{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Sections">
    <div class="brand"><span class="logo">SIE</span><span>SIE Study Hub</span></div>

    <button class="navbtn" data-view="textbook"><svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg>Textbook</button>
    <button class="navbtn" data-view="quizzes"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Chapter quizzes</button>

    <div class="spacer"></div>
    <div class="railbar"><i id="railbar" style="width:0%"></i></div>

  </nav>

  <main>

      <button class="btn sm menubtn" id="menubtn" aria-label="Open navigation">☰</button>

      <span class="chip accent" id="topchip" hidden></span>

</div>

<template id="tpl-cheat"><div class="pad sheet"><div class="prose"><h1>SIE Cheat Sheet — Numbers, Formulas &amp; Dates</h1>
<h2>Formulas</h2>
<table>
<thead>
<tr>
<th>What</th>
<th>Formula</th>
</tr>
</thead>
<tbody>
<tr>
<td>Outstanding shares</td>
<td>Issued − Treasury</td>
</tr>
<tr>
<td>Current yield (bond or stock)</td>
<td>Annual income ÷ Market price</td>
</tr>
<tr>
<td>Tax-equivalent yield (muni)</td>
<td>Muni yield ÷ (1 − tax bracket)</td>
</tr>
<tr>
<td>Conversion ratio</td>
<td>Par ÷ Conversion price</td>
</tr>
<tr>
<td>Parity price of bond/preferred</td>
<td>Stock price × Conversion ratio</td>
</tr>
<tr>
<td>Parity price of stock</td>
<td>Bond price ÷ Conversion ratio</td>
</tr>
<tr>
<td>NAV per share</td>
<td>(Assets − Liabilities) ÷ Shares outstanding</td>
</tr>
<tr>
<td>POP (front-end load fund)</td>
<td>NAV ÷ (1 − Sales charge %)</td>
</tr>
<tr>
<td>Sales charge %</td>
<td>(POP − NAV) ÷ POP</td>
</tr>
<tr>
<td>Expense ratio</td>
<td>Annual expenses ÷ Average net assets</td>
</tr>
<tr>
<td>EPS</td>
<td>(Net income − Preferred dividends) ÷ Common shares</td>
</tr>
<tr>
<td>P/E</td>
<td>Price ÷ EPS</td>
</tr>
<tr>
<td>Dividend payout ratio</td>
<td>Dividends per share ÷ EPS</td>
</tr>
<tr>
<td>Current ratio</td>
<td>Current assets ÷ Current liabilities</td>
</tr>
<tr>
<td>Working capital</td>
<td>Current assets − Current liabilities</td>
</tr>
<tr>
<td>Long margin equity</td>
<td>LMV − Debit balance</td>
</tr>
<tr>
<td>Short margin equity</td>
<td>Credit balance − SMV</td>
</tr>
<tr>
<td>Long maintenance call point</td>
<td>Debit ÷ 0.75</td>
</tr>
<tr>
<td>Short maintenance call point</td>
<td>Credit ÷ 1.30</td>
</tr>
<tr>
<td>Buying power</td>
<td>SMA × 2</td>
</tr>
<tr>
<td>Rule 144 volume limit</td>
<td>Greater of 1% outstanding or 4-week avg weekly volume (per 90 days)</td>
</tr>
<tr>
<td>CAPM expected return</td>
<td>Rf + β × (Rm − Rf)</td>
</tr>
<tr>
<td>Alpha</td>
<td>Actual return − CAPM expected return</td>
</tr>
<tr>
<td>Split (A-for-B)</td>
<td>Shares × A/B; price × B/A</td>
</tr>
<tr>
<td>Accrued interest (corp/muni)</td>
<td>Coupon × days/360 (30-day months)</td>
</tr>
</tbody>
</table>

<p>Call Up / Put Down. Even split → more contracts, lower strike. Uneven split → more shares per contract. No adjustment for cash dividends. Auto-exercise at $0.01 ITM. Index options: cash settled, $100 multiplier, usually European.</p>
<h2>Yield relationships</h2>
<ul>
<li>Discount bond: Nominal &lt; CY &lt; YTM &lt; YTC</li>
<li>Premium bond: Nominal &gt; CY &gt; YTM &gt; YTC</li>
<li>Rates ↑ → prices ↓. Long maturity &amp; low coupon = most volatile. Zeros: most volatile, no reinvestment risk, phantom income.</li>
<li>Lowest investment grade: <strong>BBB / Baa</strong>.</li>
</ul>

<h2>Margin</h2>
<p>Reg T <strong>50%</strong> (Fed). FINRA: min deposit <strong>$2,000</strong>; maintenance <strong>25% long / 30% short</strong>. Rehypothecation <strong>140%</strong> of debit. Pattern day trader <strong>$25,000</strong>. Mutual funds/IPOs not marginable for <strong>30 days</strong>. No margin: custodial, IRA, most trusts.</p>
<h2>Mutual funds</h2>
<p>Max sales charge <strong>8.5%</strong> (needs breakpoints + ROA + reinvestment at NAV). No-load → 12b-1 ≤ <strong>0.25%</strong>; 12b-1 max <strong>1.00%</strong>. LOI <strong>13 months</strong>, backdate <strong>90 days</strong>. Diversified = <strong>75-5-10</strong>. Subchapter M: distribute ≥ <strong>90%</strong>. Board ≥ <strong>40%</strong> independent. $100,000 net worth to go public. Class A = front load (big/long); B = CDSC → converts to A; C = level (short-term). REIT: 90% distribution, 75% real estate, no loss pass-through.</p>
<h2>Primary market</h2>
<p>Cooling-off ≥ <strong>20 days</strong>. Prospectus delivery after IPO: <strong>90 days</strong> non-listed, <strong>25 days</strong> listed; follow-on non-listed <strong>40 days</strong>. Green shoe <strong>15%</strong>. Reg D 506(b): unlimited accredited + <strong>35</strong> non-accredited. Accredited: <strong>$1M net worth</strong> (ex-home) or <strong>$200k/$300k</strong> income. Reg A: <strong>$20M / $75M</strong>. Crowdfunding <strong>$5M</strong>. Rule 147: 6-month resale lock. 144A: QIBs ≥ <strong>$100M</strong>. Rule 144: <strong>6-month</strong> hold; Form 144 valid <strong>90 days</strong>; de minimis ≤ <strong>5,000 shares &amp; ≤ $50,000</strong>. Commercial paper ≤ <strong>270 days</strong> (exempt). Penny stock &lt; <strong>$5</strong> unlisted. Shelf: <strong>3 years</strong>. Rule 5130: no IPOs to restricted persons.</p>
<h2>Municipal</h2>
<p>TEY = yield ÷ (1 − bracket). G-37: <strong>$250</strong>/election to candidates you can vote for, else <strong>2-year</strong> ban. G-20 gifts <strong>$100</strong>. G.O. = taxes, voter approval, debt limits; revenue = project, feasibility study, coverage ratio. Notes: TAN, RAN, TRAN, BAN, GAN. Territory bonds triple tax-free. Private activity → AMT. Not for IRAs.</p>
<h2>Government</h2>
<p>Treasuries: fed taxable, state exempt; quoted 1/32nds; $100 min; actual/365. Bills ≤ 52 wks (discount); notes 2–10 yrs; bonds 20–30 yrs. Ginnie Mae = only full-faith agency; MBS taxed at all levels; prepayment risk when rates fall. Fed tools: open-market ops (most used; buy = ease), discount rate, reserve requirements (least used). Fed funds = bank-to-bank overnight; discount = Fed to banks; prime = banks to best customers; broker call = banks to BDs. Recession = 2 quarters negative GDP. Leading: stock market, housing starts, M2, claims. Lagging: unemployment, CPI, prime rate. Fiscal = Congress/President (taxes, spending).</p>
<h2>Taxes</h2>
<p>LT &gt; 1 year: 0/15/20%. Net loss deduction <strong>$3,000</strong>/yr, carry forward. Wash sale <strong>30 days</strong> before/after. Gift: donor's basis carries. Inheritance: <strong>stepped-up</strong>, auto long-term. Gift exclusion <strong>$19,000</strong> (2026). Backup withholding <strong>24%</strong>. Qualified dividends = LT rates. Passive losses only vs. passive income. Earned income needed for IRA.</p>
<h2>Retirement (2026)</h2>
<p>IRA <strong>$7,500</strong> + <strong>$1,100</strong> catch-up (50+); deadline April 15; excess 6%. 401(k) <strong>$24,500</strong> + <strong>$8,000</strong> (50+) / <strong>$11,250</strong> (60–63); total <strong>$72,000</strong>. SIMPLE <strong>$17,000</strong> (≤ 100 employees; 3% match or 2%; 25% penalty first 2 yrs). SEP employer-only 25%/$72,000. Early penalty <strong>10%</strong> before <strong>59½</strong>. RMD at <strong>73</strong> (75 if born 1960+); 25% penalty. Roth: 5 years + 59½, no RMD, income limits. Rollover <strong>60 days</strong>, once/12 months, <strong>20%</strong> withholding on plan checks. ERISA: age 21 + 1 year; employee money always vested. 457 = no 10% penalty. 403(b) = schools/non-profits. DB favors older; DC favors younger. 529: $19k/yr or $95k 5-yr election, owner controls, 10% on non-qualified earnings. Coverdell <strong>$2,000</strong>/yr, income limits, until 18, use by 30. VA: AIR drives payment changes; straight life = highest; LIFO; M&amp;E charge; 1035 exchange tax-free. VL: 24-month exchange right, 9% max sales charge.</p>
<h2>Accounts</h2>
<p>Required: name, address, DOB, SSN, rep, principal approval, other-BD employment, insider status. Trusted contact (attempt). Account record copy every <strong>36 months</strong>. JTWROS → survivor; TIC → estate. UGMA/UTMA: one custodian/one minor, irrevocable, minor's SSN, no margin. Discretionary: written authority + principal approval; time/price only ≠ discretion. Statements quarterly; confirms by settlement. Complaints kept <strong>4 years</strong>; arbitration eligibility <strong>6 years</strong>. SAR <strong>$5,000</strong>/30 days; CTR <strong>&gt; $10,000</strong> cash. <strong>SIPC $500,000 / $250,000 cash</strong>, per separate customer, not market losses. FDIC $250,000. BCP: annual review, 2 emergency contacts.</p>
<h2>Orders</h2>
<p>Buy limit &amp; sell stop <strong>below</strong> market; sell limit &amp; buy stop <strong>above</strong> (BLiSS/SLoBS). Stop → market order when triggered; stop-limit → limit order (may not fill). Orders below market reduced on ex-date unless DNR. Order tickets kept 3 years. Circuit breakers: 7%/13% → 15 min (not after 3:25); 20% → day. Reg SHO short-sale restriction at −10%. Best execution regardless of payment for order flow.</p>
<h2>Rules &amp; ethics</h2>
<p>Insider trading: treble damages; <strong>$5M / 20 years</strong> (firms $25M). Senior hold: <strong>15 + 10</strong> business days; specified adult 65+ or impaired 18+. TCPA: <strong>8 am–9 pm</strong> called party's time; national DNC check every 31 days; 18-month relationship exemption. Gifts <strong>$100</strong>/person/year. OBA: prior written notice. Private securities transactions: notice; approval if paid. Outside accounts: employer consent. Borrowing/lending: family, institution, same-firm rep, personal/business relationship (with procedures). Sharing accounts: written approval + proportional (except family). Never guarantee against loss.
Communications: correspondence ≤ 25 retail/30 days; retail &gt; 25 → principal pre-approval; new firm files 10 business days <strong>before</strong> use; fund/VA/DPP/CMO filed within 10 business days <strong>after</strong> first use; institutional → procedures. Performance 1/5/10 yr at max load. Records 3 years.
Licensing: SIE 18+, no sponsor, 75 Q / 105 min / 70 pass / 4 yrs valid; fails wait 30/30/180. U4 changes 30 days; U5 30 days; lapse after 2 yrs (MQP 5). CE: Regulatory Element annually (inactive if missed); Firm Element annual needs analysis. Statutory disqualification: felony/securities misdemeanor within 10 years.
Records: permanent (org docs, minutes); <strong>6 yrs</strong> (blotters, ledgers, stock record, account records); <strong>4 yrs</strong> (complaints); <strong>3 yrs</strong> (tickets, confirms, communications, U4/U5 post-termination, gifts, net capital); first 2 years easily accessible.
Regulators: SEC (government, 1934 Act); FINRA (SRO, BDs/reps); MSRB (rules only, no enforcement, no issuers); states/NASAA (blue-sky, Series 63/65/66); CFTC/NFA (futures); FinCEN (AML); SIPC; FDIC. Reg BI: disclosure, care, conflicts, compliance; Form CRS. IAs = fiduciary.</p></div></div></template>

<script>
const CHAPTERS = [{"num": 1, "name": "Common Stock", "file": "01-common-stock.md", "minutes": 13, "sections": [{"id": "s1-1", "num": "1.1", "title": "Basic characteristics", "level": 2}, {"id": "s1-2", "num": "1.2", "title": "Rights of common stockholders", "level": 2}, {"id": "s1-2-1", "num": "1.2.1", "title": "Pro-rata share of dividends", "level": 3}, {"id": "s1-2-2", "num": "1.2.2", "title": "Board of Directors", "level": 3}, {"id": "s1-2-3", "num": "1.2.3", "title": "Inspection of books and records", "level": 3}, {"id": "s1-2-4", "num": "1.2.4", "title": "Maintaining proportionate ownership", "level": 3}, {"id": "s1-2-5", "num": "1.2.5", "title": "Stock splits", "level": 3}, {"id": "s1-2-6", "num": "1.2.6", "title": "Assets upon liquidation", "level": 3}, {"id": "s1-2-7", "num": "1.2.7", "title": "Transfer ownership", "level": 3}, {"id": "s1-3", "num": "1.3", "title": "Trading", "level": 2}, {"id": "s1-3-1", "num": "1.3.1", "title": "Negotiable or redeemable", "level": 3}, {"id": "s1-3-2", "num": "1.3.2", "title": "The primary & secondary market", "level": 3}, {"id": "s1-3-3", "num": "1.3.3", "title": "Settlement", "level": 3}, {"id": "s1-3-4", "num": "1.3.4", "title": "Cash dividends", "level": 3}, {"id": "s1-3-5", "num": "1.3.5", "title": "Selling short", "level": 3}, {"id": "s1-3-6", "num": "1.3.6", "title": "American Depositary Receipts", "level": 3}, {"id": "s1-3-7", "num": "1.3.7", "title": "Tender offers & buybacks", "level": 3}, {"id": "s1-4", "num": "1.4", "title": "Suitability", "level": 2}, {"id": "s1-5", "num": "1.5", "title": "Fundamental analysis", "level": 2}], "html": "\n<blockquote>\n<p><strong>Exam weight context:<\/strong> Equity securities fall under FINRA SIE Section 2, \"Understanding Products and Their Risks\" (44% of the exam, the largest section). Expect several questions on stockholder rights, dividends, settlement, short sales, ADRs and basic fundamental analysis.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s1-1\" data-sec=\"s1-1\"><span class=\"secnum\">1.1<\/span> Basic characteristics<\/h2>\n<p><strong>What common stock is.<\/strong> Common stock represents an <em>ownership<\/em> (equity) interest in a corporation. When a company incorporates, its charter authorizes a maximum number of shares (<strong>authorized shares<\/strong>). Shares actually sold to investors are <strong>issued shares<\/strong>. Shares the company later buys back and holds are <strong>treasury stock<\/strong>. Shares still in investors' hands are <strong>outstanding shares<\/strong>:<\/p>\n<pre><code>Outstanding shares = Issued shares − Treasury stock\n<\/code><\/pre>\n<p>Treasury stock has no voting rights and receives no dividends.<\/p>\n<p><strong>Par value.<\/strong> An arbitrary accounting value (often $0.01 or $1). It has nothing to do with market value. For common stock, par is essentially meaningless to investors; for preferred stock and bonds, par is critical (see later chapters).<\/p>\n<p><strong>Limited liability.<\/strong> The most a common stockholder can lose is the amount invested. Shareholders are never liable for the corporation's debts.<\/p>\n<p><strong>Why companies issue stock.<\/strong> To raise capital without taking on debt. Unlike bond interest, dividends are never a legal obligation, so stock is a flexible funding source — but it dilutes existing owners.<\/p>\n<p><strong>Why investors buy it.<\/strong><\/p>\n<ul>\n<li><strong>Capital appreciation<\/strong> (growth) — the primary reason. Historically, stocks have outperformed bonds and cash over long periods.<\/li>\n<li><strong>Dividend income<\/strong> — paid at the discretion of the board of directors.<\/li>\n<li><strong>Inflation hedge<\/strong> — because stock prices and corporate earnings tend to rise with prices in the economy.<\/li>\n<\/ul>\n<p><strong>Risks of common stock.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Market (systematic) risk<\/td>\n<td>The whole market falls and takes the stock with it. Cannot be diversified away.<\/td>\n<\/tr>\n<tr>\n<td>Business (non-systematic) risk<\/td>\n<td>The specific company does poorly. <em>Can<\/em> be reduced by diversification.<\/td>\n<\/tr>\n<tr>\n<td>Liquidity risk<\/td>\n<td>Difficulty selling at a fair price (thinly traded stocks).<\/td>\n<\/tr>\n<tr>\n<td>Legislative/regulatory risk<\/td>\n<td>New laws hurt the company or industry.<\/td>\n<\/tr>\n<tr>\n<td>Currency risk<\/td>\n<td>Relevant for foreign stocks and ADRs.<\/td>\n<\/tr>\n<tr>\n<td>Liquidation risk<\/td>\n<td>Common stockholders are paid <strong>last<\/strong> if the company goes bankrupt.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Market capitalization.<\/strong> Market cap = share price × shares outstanding. Common buckets: large-cap (roughly $10B+), mid-cap ($2B–$10B), small-cap (under $2B), micro-cap. Smaller caps = more growth potential but more volatility and risk.<\/p>\n<p><strong>Types of common stock by investment style.<\/strong><\/p>\n<ul>\n<li><strong>Growth stocks<\/strong> — reinvest earnings, pay little or no dividend, high P/E ratios.<\/li>\n<li><strong>Value stocks<\/strong> — trade below what fundamentals suggest; often pay dividends.<\/li>\n<li><strong>Income stocks<\/strong> — mature companies with reliable, high dividends (utilities).<\/li>\n<li><strong>Blue chips<\/strong> — large, well-established, financially sound companies.<\/li>\n<li><strong>Cyclical<\/strong> — earnings rise and fall with the economy (autos, airlines, steel).<\/li>\n<li><strong>Defensive (non-cyclical)<\/strong> — stable regardless of the economy (food, utilities, pharmaceuticals, tobacco).<\/li>\n<li><strong>Speculative / penny stocks<\/strong> — high risk. A <strong>penny stock<\/strong> is a non-exchange-listed stock trading under <strong>$5 per share<\/strong>; special disclosure and suitability rules apply (the \"penny stock rules,\" SEC Rule 15g-9).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s1-2\" data-sec=\"s1-2\"><span class=\"secnum\">1.2<\/span> Rights of common stockholders<\/h2>\n<p>Common stockholders are owners, and ownership brings a bundle of rights. Memorize these seven.<\/p>\n<h3 id=\"s1-2-1\" data-sec=\"s1-2-1\"><span class=\"secnum\">1.2.1<\/span> Pro-rata share of dividends<\/h3>\n<p>If the board declares a dividend, every share of the same class gets the same amount. A shareholder with 1% of the shares gets 1% of the total dividend. Dividends are <em>not<\/em> guaranteed — the board can suspend or cut them at any time. Dividends can be paid in cash, in additional stock (stock dividend), or occasionally in property/shares of a subsidiary.<\/p>\n<h3 id=\"s1-2-2\" data-sec=\"s1-2-2\"><span class=\"secnum\">1.2.2<\/span> Board of Directors<\/h3>\n<p>Common stockholders elect the board, which hires management and sets dividend policy. Stockholders vote on major corporate matters (mergers, issuance of new shares beyond authorization, stock splits, changes to the charter). They do <strong>not<\/strong> vote on whether to pay a dividend — that's the board's decision.<\/p>\n<p>Two voting methods:<\/p>\n<ul>\n<li><strong>Statutory voting<\/strong> — one vote per share per board seat. If you own 100 shares and 5 seats are open, you can cast up to 100 votes <em>for each<\/em> seat. Favors large shareholders.<\/li>\n<li><strong>Cumulative voting<\/strong> — total votes = shares × seats open (100 × 5 = 500), which you may distribute however you want, including all 500 on one candidate. Favors <strong>small/minority shareholders<\/strong> because they can concentrate their votes.<\/li>\n<\/ul>\n<p>Shareholders who cannot attend the annual meeting vote by <strong>proxy<\/strong> (a written authorization for someone else to vote their shares). Proxy solicitations are regulated by the SEC under the Securities Exchange Act of 1934.<\/p>\n<h3 id=\"s1-2-3\" data-sec=\"s1-2-3\"><span class=\"secnum\">1.2.3<\/span> Inspection of books and records<\/h3>\n<p>Stockholders can inspect certain corporate records — the annual report, audited financial statements, and the list of shareholders. This does not extend to day-to-day internal records.<\/p>\n<h3 id=\"s1-2-4\" data-sec=\"s1-2-4\"><span class=\"secnum\">1.2.4<\/span> Maintaining proportionate ownership<\/h3>\n<p>The <strong>preemptive right<\/strong>: when the corporation issues new shares, existing stockholders get the first chance to buy enough to maintain their percentage of ownership. This is delivered through a <strong>rights offering<\/strong>.<\/p>\n<p><strong>Rights (subscription rights):<\/strong><\/p>\n<ul>\n<li>Short-term (typically 30–60 days).<\/li>\n<li>One right per share owned; a set number of rights plus cash buys one new share.<\/li>\n<li>The subscription price is <strong>below the current market price<\/strong>, so rights have value and trade in the secondary market.<\/li>\n<li>A shareholder can exercise, sell, or let them expire.<\/li>\n<\/ul>\n<p><strong>Warrants<\/strong> (for comparison — frequently tested next to rights):<\/p>\n<ul>\n<li>Long-term (years, sometimes perpetual).<\/li>\n<li>Exercise price is <strong>above<\/strong> the market price at issuance; they have no intrinsic value initially and are a long-term speculative bet.<\/li>\n<li>Usually attached to a bond or preferred offering as a \"sweetener\" to lower the issuer's borrowing cost. Can be detached and traded separately.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Rights<\/th>\n<th>Warrants<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Term<\/td>\n<td>Short (weeks)<\/td>\n<td>Long (years)<\/td>\n<\/tr>\n<tr>\n<td>Exercise price vs. market<\/td>\n<td>Below<\/td>\n<td>Above<\/td>\n<\/tr>\n<tr>\n<td>Who receives<\/td>\n<td>Existing shareholders<\/td>\n<td>Usually bond/preferred buyers as sweetener<\/td>\n<\/tr>\n<tr>\n<td>Purpose<\/td>\n<td>Preemptive right<\/td>\n<td>Sweetener<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s1-2-5\" data-sec=\"s1-2-5\"><span class=\"secnum\">1.2.5<\/span> Stock splits<\/h3>\n<p>Shareholders vote on splits. A split changes the number of shares and the price per share, but <strong>not<\/strong> the total market value of a holding or the shareholder's ownership percentage.<\/p>\n<ul>\n<li><strong>Forward split<\/strong> (e.g., 2-for-1): more shares, lower price. 100 shares @ $80 → 200 shares @ $40. Done to make shares more affordable/liquid.<\/li>\n<li><strong>Reverse split<\/strong> (e.g., 1-for-10): fewer shares, higher price. 1,000 shares @ $0.50 → 100 shares @ $5. Done to avoid exchange delisting or improve image.<\/li>\n<\/ul>\n<p>Quick method for any split \"A-for-B\": new shares = old shares × A/B; new price = old price × B/A.<\/p>\n<p>A <strong>stock dividend<\/strong> (e.g., 10%) works like a small forward split: 100 shares @ $50 → 110 shares @ $45.45. Total value unchanged; cost basis per share is adjusted down.<\/p>\n<h3 id=\"s1-2-6\" data-sec=\"s1-2-6\"><span class=\"secnum\">1.2.6<\/span> Assets upon liquidation<\/h3>\n<p>If the corporation is liquidated, common stockholders have a <strong>residual claim<\/strong> — they are paid last, after:<\/p>\n<ol>\n<li>Secured creditors (bondholders with collateral)<\/li>\n<li>Administrative costs, unpaid wages and taxes<\/li>\n<li>Unsecured creditors / general creditors (debentures, suppliers)<\/li>\n<li>Subordinated debenture holders<\/li>\n<li>Preferred stockholders<\/li>\n<li><strong>Common stockholders<\/strong><\/li>\n<\/ol>\n<p>This is why common stock is the riskiest security a corporation issues (junior-most claim).<\/p>\n<h3 id=\"s1-2-7\" data-sec=\"s1-2-7\"><span class=\"secnum\">1.2.7<\/span> Transfer ownership<\/h3>\n<p>Shares are <strong>freely transferable<\/strong> (negotiable) — the holder can sell or gift them without the issuer's permission. Transfers are recorded by the <strong>transfer agent<\/strong> (maintains the shareholder list, issues/cancels certificates, pays dividends) and audited by the <strong>registrar<\/strong> (makes sure shares outstanding never exceed authorized). Most shares today are held in <strong>street name<\/strong> (registered to the broker-dealer, beneficially owned by the customer) or in book-entry form at the <strong>Depository Trust Company (DTC)<\/strong>.<\/p>\n<hr />\n<h2 id=\"s1-3\" data-sec=\"s1-3\"><span class=\"secnum\">1.3<\/span> Trading<\/h2>\n<h3 id=\"s1-3-1\" data-sec=\"s1-3-1\"><span class=\"secnum\">1.3.1<\/span> Negotiable or redeemable<\/h3>\n<p>A <strong>negotiable<\/strong> security is one you sell to <em>another investor<\/em> in the secondary market — common stock, bonds, closed-end funds, ETFs. A <strong>redeemable<\/strong> security is one you sell back to the <em>issuer<\/em> — open-end mutual funds, unit investment trusts, variable annuities. Common stock is negotiable: the corporation does not redeem it (though it may voluntarily buy shares back).<\/p>\n<h3 id=\"s1-3-2\" data-sec=\"s1-3-2\"><span class=\"secnum\">1.3.2<\/span> The primary &amp; secondary market<\/h3>\n<ul>\n<li><strong>Primary market<\/strong> — the issuer sells new securities to investors (IPO, follow-on offering). Proceeds go to the <strong>issuer<\/strong>. Governed mainly by the Securities Act of 1933.<\/li>\n<li><strong>Secondary market<\/strong> — investors trade existing securities among themselves (NYSE, Nasdaq, OTC). Proceeds go to the <strong>selling investor<\/strong>, not the issuer. Governed mainly by the Securities Exchange Act of 1934.<\/li>\n<\/ul>\n<p>The secondary market is further divided into the first market (exchange-listed on exchange), second market (OTC/unlisted), third market (listed stocks traded OTC), and fourth market (institution-to-institution directly, via ECNs). See Chapter 12.<\/p>\n<h3 id=\"s1-3-3\" data-sec=\"s1-3-3\"><span class=\"secnum\">1.3.3<\/span> Settlement<\/h3>\n<p>Settlement is when the buyer's money and the seller's security are actually exchanged.<\/p>\n<table>\n<thead>\n<tr>\n<th>Security<\/th>\n<th>Regular-way settlement<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Corporate stocks &amp; bonds, municipal bonds, ETFs, mutual funds<\/td>\n<td><strong>T+1<\/strong> (one business day after trade date)<\/td>\n<\/tr>\n<tr>\n<td>US Treasury securities, options<\/td>\n<td><strong>T+1<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Cash settlement<\/td>\n<td>Same day<\/td>\n<\/tr>\n<tr>\n<td>Reg T payment deadline (broker-dealer customer)<\/td>\n<td><strong>T+3<\/strong> (two business days after settlement, i.e., S+2)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>The US moved corporate securities from T+2 to <strong>T+1 on May 28, 2024<\/strong>. The exam tests T+1.<\/p>\n<\/blockquote>\n<p>If a customer fails to pay by the Reg T deadline, the firm must sell out the position and <strong>freeze<\/strong> the account for 90 days (cash must be in the account before any purchase).<\/p>\n<h3 id=\"s1-3-4\" data-sec=\"s1-3-4\"><span class=\"secnum\">1.3.4<\/span> Cash dividends<\/h3>\n<p>Four dates to memorize, in order:<\/p>\n<ol>\n<li><strong>Declaration date<\/strong> — board announces the dividend, the amount, the record date and the payable date.<\/li>\n<li><strong>Ex-dividend date<\/strong> — first day the stock trades <em>without<\/em> the dividend. Set by the exchange/FINRA. With T+1 settlement, <strong>ex-date = record date<\/strong> (same day). Buyers on or after the ex-date do not get the dividend. On the ex-date the stock's opening price is reduced by the dividend amount.<\/li>\n<li><strong>Record date<\/strong> — the issuer checks its books; shareholders of record receive the dividend.<\/li>\n<li><strong>Payable date<\/strong> — dividend is paid.<\/li>\n<\/ol>\n<p>Mnemonic: <strong>DERP<\/strong> (Declaration, Ex, Record, Payable).<\/p>\n<p>To receive the dividend you must <em>buy before<\/em> the ex-date (so that the trade settles by the record date). A buyer who purchases on the ex-date or later does not receive it; the seller does.<\/p>\n<p><strong>Dividend yield<\/strong> = annual dividend ÷ current market price. A stock at $40 paying $0.50 quarterly has a yield of $2.00 / $40 = 5%.<\/p>\n<p>Cash dividends are taxable in the year received. Qualified dividends get lower long-term capital gains rates (Chapter 10).<\/p>\n<h3 id=\"s1-3-5\" data-sec=\"s1-3-5\"><span class=\"secnum\">1.3.5<\/span> Selling short<\/h3>\n<p>A <strong>short sale<\/strong> is selling stock you do not own by borrowing it (from the broker-dealer's inventory or other customers' margin accounts) and hoping to buy it back later at a lower price.<\/p>\n<ul>\n<li>Profit if the price falls; loss if it rises.<\/li>\n<li><strong>Maximum gain<\/strong> = sale price × shares (stock goes to zero). <strong>Maximum loss = unlimited<\/strong> (no ceiling on how high a stock can go). This is why short selling is suitable only for sophisticated/risk-tolerant investors.<\/li>\n<li>Must be done in a <strong>margin account<\/strong>.<\/li>\n<li>The short seller must pay any dividends to the lender of the shares.<\/li>\n<li>Regulation SHO: broker must <em>locate<\/em> borrowable shares before executing a short sale; \"naked\" shorting is prohibited. Short sale orders must be marked \"short.\"<\/li>\n<li>Short interest is reported by exchanges; a <strong>short squeeze<\/strong> occurs when a rising price forces shorts to buy back, pushing the price even higher.<\/li>\n<\/ul>\n<h3 id=\"s1-3-6\" data-sec=\"s1-3-6\"><span class=\"secnum\">1.3.6<\/span> American Depositary Receipts<\/h3>\n<p>An <strong>ADR<\/strong> is a negotiable receipt issued by a US bank representing shares of a foreign company held in custody abroad. ADRs let US investors buy foreign stocks easily:<\/p>\n<ul>\n<li>Trade on US exchanges or OTC, <strong>priced and paying dividends in US dollars<\/strong>.<\/li>\n<li>The holder bears <strong>currency (exchange-rate) risk<\/strong> — if the foreign currency weakens against the dollar, the ADR's value and dividends fall even if the foreign share price is unchanged.<\/li>\n<li>ADR holders generally do <strong>not<\/strong> have voting rights (the depositary bank holds the actual shares).<\/li>\n<li>The foreign country may withhold tax on dividends; the US investor can often claim a foreign tax credit.<\/li>\n<li>Sponsored ADRs are issued with the company's cooperation (can list on NYSE/Nasdaq); unsponsored ADRs trade OTC.<\/li>\n<\/ul>\n<h3 id=\"s1-3-7\" data-sec=\"s1-3-7\"><span class=\"secnum\">1.3.7<\/span> Tender offers &amp; buybacks<\/h3>\n<ul>\n<li><strong>Tender offer<\/strong> — an offer, usually at a premium to market, to buy shares directly from stockholders (often part of a takeover attempt). Must remain open at least <strong>20 business days<\/strong>. Shareholders may tender only shares they actually own (\"net long\" position) — you cannot tender borrowed/short shares.<\/li>\n<li><strong>Buyback (share repurchase)<\/strong> — the company buys its own shares in the open market, converting outstanding shares into treasury stock. Fewer shares outstanding → higher earnings per share and often a higher price. An alternative to dividends for returning cash to shareholders.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s1-4\" data-sec=\"s1-4\"><span class=\"secnum\">1.4<\/span> Suitability<\/h2>\n<p>Common stock is suitable for investors whose primary objective is <strong>growth (capital appreciation)<\/strong> with a long time horizon. Specific matches:<\/p>\n<table>\n<thead>\n<tr>\n<th>Investor profile<\/th>\n<th>Appropriate common stock type<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Young investor, long horizon, aggressive<\/td>\n<td>Growth, small-cap, speculative<\/td>\n<\/tr>\n<tr>\n<td>Needs current income but wants equity exposure<\/td>\n<td>Income/blue-chip/utility stocks<\/td>\n<\/tr>\n<tr>\n<td>Conservative, wants stability<\/td>\n<td>Blue-chip, defensive<\/td>\n<\/tr>\n<tr>\n<td>Expecting economic expansion<\/td>\n<td>Cyclical stocks<\/td>\n<\/tr>\n<tr>\n<td>Expecting recession<\/td>\n<td>Defensive stocks<\/td>\n<\/tr>\n<tr>\n<td>Wants international diversification<\/td>\n<td>ADRs, foreign stocks (accept currency risk)<\/td>\n<\/tr>\n<tr>\n<td>Bearish on a specific stock, risk tolerant<\/td>\n<td>Short sale (margin account required)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Common stock is <strong>not<\/strong> appropriate as a primary holding for investors who need principal preservation or who have a very short time horizon, because of market volatility.<\/p>\n<hr />\n<h2 id=\"s1-5\" data-sec=\"s1-5\"><span class=\"secnum\">1.5<\/span> Fundamental analysis<\/h2>\n<p>Fundamental analysts study a company's financial statements and economic position to determine what the stock <em>should<\/em> be worth. (Contrast with <strong>technical analysts<\/strong>, who study price and volume charts — trendlines, support/resistance, head-and-shoulders patterns, moving averages — and ignore fundamentals.)<\/p>\n<p><strong>The balance sheet<\/strong> — a snapshot at a point in time:<\/p>\n<pre><code>Assets = Liabilities + Shareholders' Equity (net worth)\n<\/code><\/pre>\n<ul>\n<li>Current assets (cash, receivables, inventory — convertible to cash within a year) vs. fixed assets.<\/li>\n<li>Current liabilities (due within a year) vs. long-term debt.<\/li>\n<li><strong>Working capital<\/strong> = current assets − current liabilities (measures liquidity).<\/li>\n<li><strong>Current ratio<\/strong> = current assets ÷ current liabilities.<\/li>\n<li><strong>Quick (acid-test) ratio<\/strong> = (current assets − inventory) ÷ current liabilities.<\/li>\n<li><strong>Debt-to-equity ratio<\/strong> = long-term debt ÷ shareholders' equity (measures leverage).<\/li>\n<li><strong>Book value per share<\/strong> = (shareholders' equity − preferred stock) ÷ common shares outstanding.<\/li>\n<\/ul>\n<p><strong>The income statement<\/strong> — performance over a period:<\/p>\n<pre><code>Revenue − Cost of goods sold = Gross profit\nGross profit − Operating expenses = Operating income (EBIT)\nEBIT − Interest = Pre-tax income\nPre-tax income − Taxes = Net income\nNet income − Preferred dividends = Earnings available to common\n<\/code><\/pre>\n<ul>\n<li><strong>Earnings per share (EPS)<\/strong> = earnings available to common ÷ common shares outstanding.<\/li>\n<li><strong>Price-to-earnings (P/E) ratio<\/strong> = market price ÷ EPS. High P/E → growth stock / high expectations; low P/E → value stock.<\/li>\n<li><strong>Dividend payout ratio<\/strong> = dividends per share ÷ EPS.<\/li>\n<li><strong>Dividend yield<\/strong> = annual dividend ÷ market price.<\/li>\n<li><strong>Return on equity<\/strong> = net income ÷ shareholders' equity.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> A company earns $5 million, pays $1 million in preferred dividends, has 2 million common shares, and trades at $40. EPS = ($5M − $1M) / 2M = $2.00. P/E = $40 / $2 = 20.<\/p>\n<p><strong>Other fundamental considerations:<\/strong> management quality, competitive position, industry trends, and macro factors (interest rates, GDP, inflation). The efficient market hypothesis (EMH) argues that prices already reflect all available information — strong form says even insider information is priced in, semi-strong says all public information, weak form says only past prices.<\/p>\n<hr />\n<h2>Chapter 1 quick review<\/h2>\n<ul>\n<li>Common stock = ownership; limited liability; paid <strong>last<\/strong> in liquidation.<\/li>\n<li>Outstanding = issued − treasury.<\/li>\n<li>Seven rights: dividends pro-rata, vote for board (statutory vs. cumulative — cumulative helps small holders), inspect books, preemptive rights (rights offering, short-term, below market), vote on splits, residual assets, free transferability.<\/li>\n<li>Rights are short/below market; warrants are long/above market/sweeteners.<\/li>\n<li>Splits change share count and price, not total value or ownership %.<\/li>\n<li>Settlement: <strong>T+1<\/strong> for stocks, bonds, options, Treasuries. Reg T payment: S+2 (T+3).<\/li>\n<li>Dividend dates: Declaration → Ex (= record date under T+1) → Record → Payable. Buy <em>before<\/em> ex-date to get the dividend.<\/li>\n<li>Short sale: borrowed stock, margin account, unlimited loss, locate requirement (Reg SHO).<\/li>\n<li>ADR: foreign stock, US dollars, currency risk, usually no vote.<\/li>\n<li>Tender offer open ≥ 20 business days; only tender shares you own.<\/li>\n<li>Fundamental vs. technical analysis; EPS, P/E, current ratio, book value, debt/equity.<\/li>\n<\/ul>"}, {"num": 2, "name": "Preferred Stock", "file": "02-preferred-stock.md", "minutes": 6, "sections": [{"id": "s2-1", "num": "2.1", "title": "Basic characteristics", "level": 2}, {"id": "s2-2", "num": "2.2", "title": "Features", "level": 2}, {"id": "s2-3", "num": "2.3", "title": "Suitability", "level": 2}], "html": "\n<blockquote>\n<p>Preferred stock is an equity security that behaves a lot like a bond. The exam loves to test the <em>differences<\/em> between preferred and common, the features (cumulative, participating, convertible, callable, adjustable-rate), and the interest-rate sensitivity of preferred.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s2-1\" data-sec=\"s2-1\"><span class=\"secnum\">2.1<\/span> Basic characteristics<\/h2>\n<p><strong>What it is.<\/strong> Preferred stock is an ownership (equity) security with a <strong>fixed dividend<\/strong> stated either as a dollar amount or a percentage of <strong>par value<\/strong>. Par for preferred is usually <strong>$100<\/strong> (sometimes $25 or $50). A \"6% preferred\" with $100 par pays $6 per year, normally in quarterly installments of $1.50.<\/p>\n<p><strong>\"Preferred\" in two ways.<\/strong> Preferred stockholders have priority over common stockholders:<\/p>\n<ol>\n<li><strong>Dividends<\/strong> — preferred dividends must be paid in full before common stockholders receive anything.<\/li>\n<li><strong>Liquidation<\/strong> — preferred is paid after all creditors (bondholders) but before common.<\/li>\n<\/ol>\n<p><strong>What preferred does NOT have.<\/strong><\/p>\n<ul>\n<li>Usually <strong>no voting rights<\/strong> (some issues gain voting rights if dividends are missed for a period).<\/li>\n<li><strong>No preemptive rights<\/strong> in most cases.<\/li>\n<li><strong>No maturity date<\/strong> — like common stock, it is perpetual (unless called).<\/li>\n<li><strong>Limited growth potential<\/strong> — because the dividend is fixed, the price doesn't rise much when the company does well (except convertible preferred).<\/li>\n<\/ul>\n<p><strong>Dividends are still not guaranteed.<\/strong> The board must declare them. But because missed preferred dividends block common dividends, companies strongly prefer to pay them.<\/p>\n<p><strong>Why investors buy preferred.<\/strong> Fixed income, higher than typical common dividend yields, with priority over common. Corporations that own preferred stock of other companies get a <strong>dividends-received deduction<\/strong> (a corporation can exclude a large portion of dividends it receives from other domestic corporations from taxable income), which makes preferred especially attractive to corporate investors.<\/p>\n<p><strong>Interest-rate sensitivity.<\/strong> Because the dividend is fixed, preferred stock trades like a long-term bond: when interest rates rise, the price of existing preferred falls (its fixed payment becomes less attractive); when rates fall, the price rises. This is <strong>interest-rate risk<\/strong>. Preferred also carries <strong>inflation (purchasing-power) risk<\/strong> because the fixed payment loses value over time.<\/p>\n<p><strong>Pricing.<\/strong> Preferred prices move inversely to rates. If a $100-par 6% preferred is issued when comparable yields are 6%, and yields rise to 8%, the price falls toward $75 ($6 ÷ 8%). <strong>Current yield<\/strong> = annual dividend ÷ market price.<\/p>\n<hr />\n<h2 id=\"s2-2\" data-sec=\"s2-2\"><span class=\"secnum\">2.2<\/span> Features<\/h2>\n<p>Issuers add features to make preferred stock more attractive to investors (which lowers the dividend they must pay) or more flexible for themselves (which requires a higher dividend). Know each one and whether it benefits the issuer or the investor.<\/p>\n<h3>Straight (non-cumulative) preferred<\/h3>\n<p>The plain version. If a dividend is skipped, it is gone forever — the company never has to make it up. Least investor-friendly, so it pays the highest dividend of the basic types.<\/p>\n<h3>Cumulative preferred<\/h3>\n<p>If a dividend is missed, it <strong>accumulates<\/strong> as \"dividends in arrears.\" <strong>All arrears plus the current preferred dividend must be paid before any common dividend.<\/strong> Investor-friendly → lower stated dividend than straight preferred.<\/p>\n<p><strong>Example.<\/strong> A company has a $5 cumulative preferred. It skips dividends for two years, then wants to pay a common dividend in year three. It must first pay preferred holders $5 + $5 (arrears) + $5 (current) = <strong>$15<\/strong> per share.<\/p>\n<p>If the preferred is <em>non-cumulative<\/em>, it would only need to pay the current $5.<\/p>\n<h3>Participating preferred<\/h3>\n<p>Receives its fixed dividend <strong>plus<\/strong> a possible additional dividend if the company does especially well (usually tied to the common dividend exceeding some level). Investor-friendly. Rare in practice but tested.<\/p>\n<h3>Convertible preferred<\/h3>\n<p>Can be exchanged for a fixed number of common shares at the holder's option. The <strong>conversion ratio<\/strong> = par ÷ conversion price. A $100 par preferred convertible at $25 converts into 4 common shares.<\/p>\n<ul>\n<li><strong>Parity price<\/strong> of the common = preferred market price ÷ conversion ratio. If the preferred trades at $120 and converts into 4 shares, parity for the common is $30. If the common trades above $30, converting is profitable.<\/li>\n<li>Convertible preferred prices <strong>track the common stock<\/strong> when the common is near or above parity — so it has growth potential, unlike other preferred.<\/li>\n<li>Investor-friendly → lower dividend. Conversion is not a taxable event.<\/li>\n<\/ul>\n<h3>Callable preferred<\/h3>\n<p>The issuer may buy it back at a stated <strong>call price<\/strong> (par or a small premium) after a stated date. Issuers call preferred when interest rates <strong>fall<\/strong> so they can reissue at a lower dividend. Issuer-friendly → investors demand a <strong>higher<\/strong> dividend. Call protection (a period during which it can't be called) and the call premium partly compensate investors. Callable preferred faces <strong>call risk / reinvestment risk<\/strong> for the holder.<\/p>\n<h3>Adjustable-rate (floating-rate / variable-rate) preferred<\/h3>\n<p>The dividend is reset periodically (e.g., quarterly) based on a benchmark such as Treasury bill rates. Because the dividend floats with market rates, the <strong>price stays close to par<\/strong> — this type has the <strong>least interest-rate risk<\/strong> among preferred stocks.<\/p>\n<h3>Summary table<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Benefits<\/th>\n<th>Effect on dividend rate<\/th>\n<th>Key point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Straight<\/td>\n<td>—<\/td>\n<td>Highest of basics<\/td>\n<td>Missed dividends lost<\/td>\n<\/tr>\n<tr>\n<td>Cumulative<\/td>\n<td>Investor<\/td>\n<td>Lower<\/td>\n<td>Arrears must be paid before common<\/td>\n<\/tr>\n<tr>\n<td>Participating<\/td>\n<td>Investor<\/td>\n<td>Lower<\/td>\n<td>Fixed + possible extra<\/td>\n<\/tr>\n<tr>\n<td>Convertible<\/td>\n<td>Investor<\/td>\n<td>Lower<\/td>\n<td>Tracks common; conversion ratio = par ÷ conversion price<\/td>\n<\/tr>\n<tr>\n<td>Callable<\/td>\n<td>Issuer<\/td>\n<td>Higher<\/td>\n<td>Called when rates fall<\/td>\n<\/tr>\n<tr>\n<td>Adjustable-rate<\/td>\n<td>Investor (price stability)<\/td>\n<td>Varies with rates<\/td>\n<td>Price stable near par<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2 id=\"s2-3\" data-sec=\"s2-3\"><span class=\"secnum\">2.3<\/span> Suitability<\/h2>\n<p><strong>Best for:<\/strong><\/p>\n<ul>\n<li>Investors seeking <strong>steady income<\/strong> higher than common dividends, who accept equity-level (not bond-level) safety.<\/li>\n<li><strong>Corporations<\/strong> investing excess cash — the dividends-received deduction makes preferred very tax-efficient for corporate holders.<\/li>\n<li>Investors who want income plus some growth → <strong>convertible preferred<\/strong>.<\/li>\n<li>Investors who want income with less interest-rate risk → <strong>adjustable-rate preferred<\/strong>.<\/li>\n<\/ul>\n<p><strong>Not appropriate for:<\/strong><\/p>\n<ul>\n<li>Investors seeking <strong>capital appreciation<\/strong> (except convertible).<\/li>\n<li>Investors who cannot tolerate price declines when interest rates rise.<\/li>\n<li>Investors who need a guaranteed payment — a bond is safer because interest is a legal obligation; preferred dividends are not.<\/li>\n<\/ul>\n<p><strong>Preferred vs. common vs. bonds — the comparison the exam wants:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Common stock<\/th>\n<th>Preferred stock<\/th>\n<th>Corporate bond<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ownership or debt<\/td>\n<td>Equity<\/td>\n<td>Equity<\/td>\n<td>Debt<\/td>\n<\/tr>\n<tr>\n<td>Payment<\/td>\n<td>Variable dividend (not required)<\/td>\n<td>Fixed dividend (not required but prioritized)<\/td>\n<td>Fixed interest (legally required)<\/td>\n<\/tr>\n<tr>\n<td>Voting<\/td>\n<td>Yes<\/td>\n<td>Usually no<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Maturity<\/td>\n<td>None<\/td>\n<td>None<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Liquidation priority<\/td>\n<td>Last<\/td>\n<td>After creditors, before common<\/td>\n<td>Before all stockholders<\/td>\n<\/tr>\n<tr>\n<td>Growth potential<\/td>\n<td>High<\/td>\n<td>Low (unless convertible)<\/td>\n<td>None (unless convertible)<\/td>\n<\/tr>\n<tr>\n<td>Interest-rate risk<\/td>\n<td>Low/indirect<\/td>\n<td>High<\/td>\n<td>High<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Chapter 2 quick review<\/h2>\n<ul>\n<li>Fixed dividend based on <strong>par ($100 typical)<\/strong>; priority over common for dividends and in liquidation; usually no vote, no maturity.<\/li>\n<li>Price moves <strong>inversely to interest rates<\/strong> (like a bond). Adjustable-rate preferred is the exception — price stays near par.<\/li>\n<li><strong>Cumulative<\/strong>: arrears + current must be paid before any common dividend.<\/li>\n<li><strong>Convertible<\/strong>: conversion ratio = par ÷ conversion price; tracks the common; growth potential.<\/li>\n<li><strong>Callable<\/strong>: issuer calls when rates fall; investors get a higher dividend to compensate.<\/li>\n<li><strong>Participating<\/strong>: fixed dividend plus possible bonus.<\/li>\n<li>Corporations love preferred for the <strong>dividends-received deduction<\/strong>.<\/li>\n<\/ul>"}, {"num": 3, "name": "Debt Securities (Bond Fundamentals)", "file": "03-debt-securities.md", "minutes": 10, "sections": [{"id": "s3-1", "num": "3.1", "title": "Basic characteristics", "level": 2}, {"id": "s3-2", "num": "3.2", "title": "Issuance & underwriting", "level": 2}, {"id": "s3-3", "num": "3.3", "title": "Trading", "level": 2}, {"id": "s3-4", "num": "3.4", "title": "Features", "level": 2}, {"id": "s3-5", "num": "3.5", "title": "Yield", "level": 2}, {"id": "s3-6", "num": "3.6", "title": "Suitability", "level": 2}], "html": "\n<blockquote>\n<p>This chapter is the foundation for Chapters 4–6 (corporate, municipal and government debt). Bonds are heavily tested. Master price/yield relationships, the yield types, and bond features before moving on.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s3-1\" data-sec=\"s3-1\"><span class=\"secnum\">3.1<\/span> Basic characteristics<\/h2>\n<p><strong>A bond is a loan.<\/strong> The investor (bondholder) lends money to the issuer (corporation, municipality or government). The issuer promises to pay <strong>interest<\/strong> periodically and to return the <strong>principal<\/strong> at <strong>maturity<\/strong>. Bondholders are <strong>creditors<\/strong>, not owners — no vote, no ownership, but priority over all stockholders in liquidation.<\/p>\n<p><strong>Key terms.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Par (face) value<\/strong><\/td>\n<td>Amount repaid at maturity. Standard <strong>$1,000<\/strong> per bond.<\/td>\n<\/tr>\n<tr>\n<td><strong>Coupon (nominal/stated rate)<\/strong><\/td>\n<td>Annual interest as a % of par. A 5% coupon pays $50/year, usually <strong>$25 semiannually<\/strong>. Fixed for the life of the bond.<\/td>\n<\/tr>\n<tr>\n<td><strong>Maturity date<\/strong><\/td>\n<td>When principal is repaid and interest stops.<\/td>\n<\/tr>\n<tr>\n<td><strong>Indenture<\/strong><\/td>\n<td>The legal contract between issuer and bondholders (via a trustee) spelling out the terms, covenants, collateral, call features. Required for corporate bonds over $50 million by the <strong>Trust Indenture Act of 1939<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Trustee<\/strong><\/td>\n<td>Bank/trust company that enforces the indenture on behalf of bondholders.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Maturity structures.<\/strong><\/p>\n<ul>\n<li><strong>Term bond<\/strong> — entire issue matures on one date. Quoted on price (% of par).<\/li>\n<li><strong>Serial bond<\/strong> — portions of the issue mature in successive years (common for municipals). Quoted on yield (basis).<\/li>\n<li><strong>Balloon<\/strong> — serial with a large final payment.<\/li>\n<\/ul>\n<p><strong>Bond pricing conventions.<\/strong> Bonds are quoted as a <strong>percentage of par<\/strong> in points. 1 point = $10 (1% of $1,000).<\/p>\n<ul>\n<li>Quote of <strong>98<\/strong> = $980 (discount). Quote of <strong>102<\/strong> = $1,020 (premium). Quote of <strong>100<\/strong> = par.<\/li>\n<li>Corporate and municipal bonds are quoted in <strong>1/8ths<\/strong> of a point: 98 ⅛ = $981.25.<\/li>\n<li>Treasury notes and bonds are quoted in <strong>1/32nds<\/strong>: 98.16 (or 98-16) = 98 16/32 = 98.5% = $985.00.<\/li>\n<\/ul>\n<p><strong>Price and interest rates move inversely.<\/strong> This is the single most important bond concept. When market interest rates <strong>rise<\/strong>, existing bond prices <strong>fall<\/strong> (their fixed coupons are less attractive). When rates <strong>fall<\/strong>, bond prices <strong>rise<\/strong>.<\/p>\n<ul>\n<li>Longer maturity → <strong>more<\/strong> price volatility for a given rate change.<\/li>\n<li>Lower coupon → <strong>more<\/strong> price volatility. (Zero-coupon bonds are the most volatile.)<\/li>\n<li><strong>Duration<\/strong> measures this sensitivity; higher duration = more interest-rate risk.<\/li>\n<\/ul>\n<p><strong>Interest accrual.<\/strong> Bond interest accrues daily. When a bond is sold between coupon dates, the buyer pays the seller the <strong>accrued interest<\/strong> since the last payment on top of the price, and then receives the full next coupon.<\/p>\n<ul>\n<li>Corporate and municipal bonds: <strong>30/360<\/strong> day count (every month treated as 30 days, year as 360).<\/li>\n<li>US government bonds: <strong>actual/365<\/strong> (actual days elapsed).<\/li>\n<li>Accrued interest runs from the last coupon date <strong>up to but not including the settlement date<\/strong>.<\/li>\n<li>Bonds trading without accrued interest (e.g., in default or zero-coupon) trade <strong>flat<\/strong>.<\/li>\n<\/ul>\n<p><strong>Risks of bonds.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Risk<\/th>\n<th>Meaning<\/th>\n<th>Most exposed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Interest-rate risk<\/td>\n<td>Prices fall when rates rise<\/td>\n<td>Long-term, low-coupon bonds<\/td>\n<\/tr>\n<tr>\n<td>Credit (default) risk<\/td>\n<td>Issuer can't pay<\/td>\n<td>Low-rated (\"junk\") bonds<\/td>\n<\/tr>\n<tr>\n<td>Inflation (purchasing-power) risk<\/td>\n<td>Fixed payments buy less<\/td>\n<td>Long-term bonds<\/td>\n<\/tr>\n<tr>\n<td>Reinvestment risk<\/td>\n<td>Coupons/called principal reinvested at lower rates<\/td>\n<td>Callable, high-coupon bonds; <strong>zero-coupon bonds have none<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Call risk<\/td>\n<td>Issuer redeems early when rates fall<\/td>\n<td>Callable bonds<\/td>\n<\/tr>\n<tr>\n<td>Liquidity risk<\/td>\n<td>Hard to sell at fair value<\/td>\n<td>Thinly traded issues<\/td>\n<\/tr>\n<tr>\n<td>Legislative/political risk<\/td>\n<td>Tax law or regulation changes<\/td>\n<td>Municipals<\/td>\n<\/tr>\n<tr>\n<td>Currency risk<\/td>\n<td>Exchange rates<\/td>\n<td>Foreign bonds<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Credit ratings.<\/strong> Standard &amp; Poor's, Moody's and Fitch rate issuers' ability to pay.<\/p>\n<table>\n<thead>\n<tr>\n<th>Grade<\/th>\n<th>S&amp;P / Fitch<\/th>\n<th>Moody's<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Investment grade (top four tiers)<\/td>\n<td>AAA, AA, A, BBB<\/td>\n<td>Aaa, Aa, A, Baa<\/td>\n<\/tr>\n<tr>\n<td>Speculative / high-yield / \"junk\"<\/td>\n<td>BB, B, CCC, CC, C<\/td>\n<td>Ba, B, Caa, Ca, C<\/td>\n<\/tr>\n<tr>\n<td>In default<\/td>\n<td>D<\/td>\n<td>C<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>BBB/Baa is the lowest investment-grade rating.<\/strong> Lower rating → higher yield required (more credit risk). Ratings are the single best measure of a bond's default risk.<\/p>\n<hr />\n<h2 id=\"s3-2\" data-sec=\"s3-2\"><span class=\"secnum\">3.2<\/span> Issuance &amp; underwriting<\/h2>\n<p>Bonds are issued in the <strong>primary market<\/strong> through underwriters (investment banks), much like stocks (details in Chapter 11). A few bond-specific points:<\/p>\n<ul>\n<li>Corporate bonds registered under the Securities Act of 1933 need a prospectus; many corporate debt offerings are sold to institutions as <strong>private placements<\/strong> or under Rule 144A.<\/li>\n<li>Municipal bonds are <strong>exempt<\/strong> from SEC registration; instead, the issuer prepares an <strong>official statement<\/strong>.<\/li>\n<li>US government securities are sold at <strong>Treasury auctions<\/strong>.<\/li>\n<li><strong>Competitive bid<\/strong> underwriting (common for general obligation munis) vs. <strong>negotiated<\/strong> underwriting (common for corporates and revenue bonds).<\/li>\n<li>A bond sold at issue for exactly par is \"priced at par\"; new issues are often priced near par with the coupon set to current market yields.<\/li>\n<li>Bonds come in <strong>registered form<\/strong> (owner recorded by the issuer/transfer agent — this is standard now) or <strong>book-entry<\/strong> (electronic, no certificate — Treasuries and most new issues). <strong>Bearer bonds<\/strong> (no owner record, coupons physically clipped) are no longer issued in the US (prohibited since 1982) but older ones may still exist.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s3-3\" data-sec=\"s3-3\"><span class=\"secnum\">3.3<\/span> Trading<\/h2>\n<p>Most bonds trade <strong>over-the-counter (OTC)<\/strong> in a dealer market rather than on an exchange. Dealers quote a <strong>bid<\/strong> (what they'll pay) and an <strong>ask/offer<\/strong> (what they'll sell for); the difference is the <strong>spread<\/strong>.<\/p>\n<ul>\n<li><strong>Markup/markdown<\/strong> — when a dealer trades with a customer from its own inventory (principal), it charges a markup on sales or markdown on purchases. Must be fair and reasonable; FINRA's <strong>5% policy<\/strong> is a guideline (not a rule) for fairness in secondary trades.<\/li>\n<li>Corporate bond trades are reported to FINRA's <strong>TRACE<\/strong> (Trade Reporting and Compliance Engine) within 15 minutes. Municipal trades are reported to <strong>MSRB's EMMA/RTRS<\/strong> system.<\/li>\n<li><strong>Settlement: T+1<\/strong> for corporate and municipal bonds (regular way). Treasuries also T+1.<\/li>\n<li>Bond quotes: term bonds on <strong>price<\/strong> (dollar quotes), serial bonds on <strong>yield (basis)<\/strong>.<\/li>\n<li>Bonds trading at a discount are \"discount bonds,\" at a premium \"premium bonds.\"<\/li>\n<\/ul>\n<p><strong>Basis points.<\/strong> 1 basis point (bp) = 0.01%. 100 bp = 1%. A yield moving from 4.25% to 4.75% rose 50 bp.<\/p>\n<hr />\n<h2 id=\"s3-4\" data-sec=\"s3-4\"><span class=\"secnum\">3.4<\/span> Features<\/h2>\n<h3>Callable bonds<\/h3>\n<p>The issuer may redeem the bond before maturity at a stated <strong>call price<\/strong> (par or a premium), after a <strong>call protection<\/strong> period. Issuers call when rates <strong>fall<\/strong> to refinance cheaply (a \"refunding\"). Investors face call risk and reinvestment risk, so callable bonds pay <strong>higher<\/strong> coupons. Calls can be:<\/p>\n<ul>\n<li><strong>Whole call<\/strong> — the entire issue.<\/li>\n<li><strong>Partial call<\/strong> — a portion, often selected by lot.<\/li>\n<li><strong>Sinking fund<\/strong> — the issuer sets aside money regularly to retire bonds over time (reduces default risk).<\/li>\n<li><strong>Pre-refunding / advance refunding<\/strong> — issuer sells a new bond and puts the proceeds in escrow (Treasuries) to pay off the old one on its call date; the old bond becomes very safe (\"escrowed to maturity\").<\/li>\n<\/ul>\n<h3>Puttable bonds<\/h3>\n<p>The <strong>investor<\/strong> may force the issuer to buy the bond back at par on specified dates. Investor-friendly → <strong>lower<\/strong> coupon. Investors exercise when rates <strong>rise<\/strong> (to reinvest at higher rates).<\/p>\n<h3>Convertible bonds<\/h3>\n<p>Can be exchanged for a fixed number of the issuer's common shares. <strong>Conversion ratio<\/strong> = par ÷ conversion price. A bond convertible at $40 converts to $1,000 / $40 = <strong>25 shares<\/strong>. <strong>Parity price<\/strong> of the bond = stock price × conversion ratio; parity of the stock = bond price ÷ ratio. Lower coupon (investor-friendly); price tracks the stock when it's near/above parity. An <strong>anti-dilution<\/strong> provision adjusts the conversion price for stock splits/dividends. Covered more in Chapter 4.<\/p>\n<h3>Zero-coupon bonds<\/h3>\n<p>Pay no periodic interest; issued at a <strong>deep discount<\/strong> and mature at par. The return is the difference. Examples: Treasury STRIPS, corporate and municipal zeros.<\/p>\n<ul>\n<li><strong>No reinvestment risk<\/strong> (no coupons to reinvest) — ideal for a known future goal (college, retirement).<\/li>\n<li><strong>Most interest-rate-sensitive<\/strong> (highest duration) for a given maturity.<\/li>\n<li>The annual accretion of the discount is <strong>taxable each year<\/strong> as interest even though no cash is received (\"phantom income\") — except for municipal zeros, which are tax-exempt. Good candidates for tax-deferred accounts.<\/li>\n<\/ul>\n<h3>Secured vs. unsecured (covered in detail in Chapter 4)<\/h3>\n<p>Secured bonds are backed by specific collateral (mortgage bonds, equipment trust certificates, collateral trust bonds). Unsecured bonds (<strong>debentures<\/strong>) are backed only by the issuer's full faith and credit. Subordinated debentures rank below other debentures.<\/p>\n<h3>Variable-rate (floating-rate) bonds<\/h3>\n<p>Coupon resets periodically to a benchmark. Price stays near par; minimal interest-rate risk.<\/p>\n<h3>Step-coupon / step-up bonds<\/h3>\n<p>Coupon increases on a set schedule.<\/p>\n<hr />\n<h2 id=\"s3-5\" data-sec=\"s3-5\"><span class=\"secnum\">3.5<\/span> Yield<\/h2>\n<p>A bond's <strong>yield<\/strong> is its return expressed as an annual percentage. There are several, and the exam tests how they relate.<\/p>\n<h3>Nominal yield (coupon rate)<\/h3>\n<p>The stated rate. Fixed. 6% coupon → $60/year regardless of price.<\/p>\n<h3>Current yield (CY)<\/h3>\n<pre><code>Current yield = Annual interest ÷ Current market price\n<\/code><\/pre>\n<p>A 6% bond trading at $900: CY = $60 / $900 = 6.67%. At $1,100: $60 / $1,100 = 5.45%.<\/p>\n<h3>Yield to maturity (YTM, \"basis\")<\/h3>\n<p>The total annualized return if held to maturity — includes the coupons <strong>and<\/strong> the gain (discount bond) or loss (premium bond) of principal at maturity. A bond bought at a discount has YTM &gt; CY &gt; nominal. A bond bought at a premium has YTM &lt; CY &lt; nominal. Serial bonds are quoted on YTM (\"5.10 basis\").<\/p>\n<p>Approximate formula (for understanding, rarely required on the SIE):<\/p>\n<pre><code>YTM ≈ [Annual interest + (Par − Price) ÷ Years to maturity] ÷ [(Par + Price) ÷ 2]\n<\/code><\/pre>\n<h3>Yield to call (YTC)<\/h3>\n<p>Like YTM but assumes the bond is called at the first call date and call price. For a <strong>premium bond, YTC is the lowest yield<\/strong> (you lose the premium faster). For a discount bond, YTC is higher than YTM.<\/p>\n<h3>Yield to worst<\/h3>\n<p>The lowest of all possible yields (YTM vs. each YTC). Dealers must quote the <strong>lowest<\/strong> yield (yield to worst) on bond confirmations for callable bonds.<\/p>\n<h3>The relationships (memorize)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Bond trading at<\/th>\n<th>Order of yields<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Discount<\/strong> (price &lt; par)<\/td>\n<td>Nominal &lt; Current yield &lt; YTM &lt; YTC<\/td>\n<\/tr>\n<tr>\n<td><strong>Par<\/strong><\/td>\n<td>All yields equal<\/td>\n<\/tr>\n<tr>\n<td><strong>Premium<\/strong> (price &gt; par)<\/td>\n<td>Nominal &gt; Current yield &gt; YTM &gt; YTC<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Mental model: a discount bond gives you a bonus at maturity, so its \"all-in\" yields exceed the coupon; a premium bond makes you give some back, so they're lower.<\/p>\n<p><strong>Rates up → prices down → yields up.<\/strong> Price and yield move inversely; price and interest rates move inversely; yield and interest rates move together.<\/p>\n<h3>The yield curve<\/h3>\n<p>A plot of yields vs. maturity for similar-credit bonds (usually Treasuries).<\/p>\n<ul>\n<li><strong>Normal (positive/upward sloping)<\/strong> — long-term yields &gt; short-term. The typical shape; investors demand more for lending longer.<\/li>\n<li><strong>Flat<\/strong> — short and long roughly equal; often precedes a slowdown.<\/li>\n<li><strong>Inverted (negative)<\/strong> — short-term yields &gt; long-term. Historically a recession signal; usually results from the Fed tightening.<\/li>\n<\/ul>\n<p><strong>Credit spread<\/strong> — the yield difference between corporate bonds and Treasuries of the same maturity. Spreads <strong>widen<\/strong> when investors fear defaults (recession) and <strong>narrow<\/strong> in good times.<\/p>\n<hr />\n<h2 id=\"s3-6\" data-sec=\"s3-6\"><span class=\"secnum\">3.6<\/span> Suitability<\/h2>\n<p>Bonds suit investors seeking <strong>income<\/strong> and/or <strong>preservation of capital<\/strong>, with lower risk than stocks. Match the bond to the investor:<\/p>\n<table>\n<thead>\n<tr>\n<th>Investor need<\/th>\n<th>Appropriate choice<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maximum safety<\/td>\n<td>US Treasuries, then agencies, then investment-grade<\/td>\n<\/tr>\n<tr>\n<td>Tax-free income (high bracket)<\/td>\n<td>Municipal bonds (Chapter 5)<\/td>\n<\/tr>\n<tr>\n<td>Income in a tax-deferred account<\/td>\n<td>Corporate bonds (higher yield; taxes don't matter inside the account)<\/td>\n<\/tr>\n<tr>\n<td>Known future lump sum, no reinvestment risk<\/td>\n<td>Zero-coupon bonds<\/td>\n<\/tr>\n<tr>\n<td>Expecting rates to rise<\/td>\n<td>Short-term bonds, floating-rate bonds, puttable bonds<\/td>\n<\/tr>\n<tr>\n<td>Expecting rates to fall<\/td>\n<td>Long-term, non-callable bonds (lock in high yield, maximum price gain)<\/td>\n<\/tr>\n<tr>\n<td>Higher income, can tolerate default risk<\/td>\n<td>High-yield (junk) bonds<\/td>\n<\/tr>\n<tr>\n<td>Income plus equity upside<\/td>\n<td>Convertible bonds<\/td>\n<\/tr>\n<tr>\n<td>Concerned about inflation<\/td>\n<td>TIPS (Chapter 6), short maturities<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Bond laddering<\
