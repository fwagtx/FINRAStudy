o quo allocations.<\/p>\n<h3 id=\"s11-4-4\" data-sec=\"s11-4-4\"><span class=\"secnum\">11.4.4<\/span> Exemptions<\/h3>\n<p>Not every security or transaction must be registered. Memorize both lists.<\/p>\n<p><strong>Exempt securities<\/strong> (never need SEC registration, though anti-fraud rules always apply):<\/p>\n<ul>\n<li><strong>US government and federal agency<\/strong> securities.<\/li>\n<li><strong>Municipal<\/strong> securities.<\/li>\n<li>Securities issued by <strong>banks<\/strong> (not bank holding companies) and savings institutions.<\/li>\n<li><strong>Commercial paper and other short-term debt with maturities ≤ 270 days<\/strong>.<\/li>\n<li>Securities of <strong>non-profit<\/strong> (religious, educational, charitable) organizations.<\/li>\n<li><strong>Insurance policies and fixed annuities<\/strong> (variable annuities are <strong>not<\/strong> exempt — they are securities).<\/li>\n<li>Securities of common carriers (railroads) and small business investment companies.<\/li>\n<\/ul>\n<p><strong>Exempt transactions<\/strong> (the security itself isn't exempt, but the way it is sold is):<\/p>\n<table>\n<thead>\n<tr>\n<th>Exemption<\/th>\n<th>Key terms<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Regulation D — private placement<\/strong><\/td>\n<td>Sold privately, not through general public solicitation (though Rule 506(c) allows advertising if <em>all<\/em> buyers are verified accredited investors). <strong>Rule 506(b)<\/strong>: unlimited <strong>accredited investors<\/strong> plus up to <strong>35 non-accredited<\/strong> (but sophisticated) investors; unlimited dollar amount. <strong>Rule 504<\/strong>: up to $10 million in 12 months. Buyers receive a <strong>private placement memorandum (PPM)<\/strong> rather than a prospectus. Securities are <strong>restricted<\/strong> (must be held, typically 6 months–1 year, before resale under Rule 144). Issuer files <strong>Form D<\/strong> with the SEC within 15 days of the first sale.<\/td>\n<\/tr>\n<tr>\n<td><strong>Accredited investor<\/strong> (the Reg D definition)<\/td>\n<td>Individual with <strong>net worth &gt; $1 million<\/strong> (excluding primary residence) <strong>or<\/strong> income &gt; <strong>$200,000<\/strong> (&gt; <strong>$300,000<\/strong> with spouse) in each of the last two years with a reasonable expectation of the same; also institutions, banks, insurance companies, registered investment companies, employee benefit plans &gt; $5 million, entities with &gt; $5 million assets, directors/executives of the issuer, and holders of certain securities licenses (Series 7, 65, 82).<\/td>\n<\/tr>\n<tr>\n<td><strong>Regulation A (Reg A+)<\/strong><\/td>\n<td>Small/medium offerings: <strong>Tier 1 up to $20 million<\/strong>, <strong>Tier 2 up to $75 million<\/strong> in 12 months. Uses an <strong>offering circular<\/strong> instead of a prospectus; abbreviated \"mini-registration\" with the SEC. Tier 2 investors who aren't accredited are limited to 10% of income/net worth.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rule 147 / 147A — intrastate offering<\/strong><\/td>\n<td>Issuer organized/doing business in one state and sells <strong>only to residents of that state<\/strong>. Purchasers may not resell to non-residents for <strong>6 months<\/strong>. Still must comply with the state's blue-sky law.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rule 144A<\/strong><\/td>\n<td>Allows resale of <strong>restricted/unregistered securities to qualified institutional buyers (QIBs — institutions with ≥ $100 million in securities)<\/strong> without registration. Creates a liquid institutional market for private placements.<\/td>\n<\/tr>\n<tr>\n<td><strong>Regulation S<\/strong><\/td>\n<td>Offerings made <strong>outside the US<\/strong> to non-US persons are exempt from registration.<\/td>\n<\/tr>\n<tr>\n<td><strong>Regulation Crowdfunding<\/strong><\/td>\n<td>Up to <strong>$5 million<\/strong> per year through an SEC-registered funding portal; individual investment limits based on income/net worth.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rule 145<\/strong><\/td>\n<td>Securities issued in mergers/reclassifications generally require registration; stock splits and dividends do not.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Being exempt from registration does <strong>not<\/strong> exempt anyone from the <strong>anti-fraud<\/strong> provisions. All offers and sales must be truthful.<\/p>\n<hr />\n<h2 id=\"s11-5\" data-sec=\"s11-5\"><span class=\"secnum\">11.5<\/span> Rule 144<\/h2>\n<p><strong>Rule 144<\/strong> governs the resale of <strong>restricted<\/strong> and <strong>control<\/strong> securities so that insiders and private-placement buyers can't dump unregistered stock on the public in a way that circumvents the 1933 Act.<\/p>\n<p><strong>Definitions.<\/strong><\/p>\n<ul>\n<li><strong>Restricted securities<\/strong> — unregistered shares acquired from the issuer or an affiliate in a private transaction (Reg D placements, employee stock grants, shares received in a merger). They bear a restrictive legend.<\/li>\n<li><strong>Control securities<\/strong> — shares (registered or not) owned by an <strong>affiliate (control person)<\/strong> of the issuer — officers, directors, or holders of <strong>10% or more<\/strong> of the voting stock, and their immediate family.<\/li>\n<\/ul>\n<p><strong>Requirements for a sale under Rule 144.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Requirement<\/th>\n<th>Restricted securities (non-affiliate)<\/th>\n<th>Control securities (affiliate)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Holding period<\/strong><\/td>\n<td><strong>6 months<\/strong> (if the issuer is an SEC-reporting company; 1 year otherwise), measured from the date fully paid for<\/td>\n<td>No holding period for registered shares; restricted shares held by affiliates still need 6 months<\/td>\n<\/tr>\n<tr>\n<td><strong>Volume limit<\/strong> (per 90 days)<\/td>\n<td>None after the holding period (and after 1 year, no other conditions)<\/td>\n<td>Greater of <strong>1% of the outstanding shares<\/strong> or the <strong>average weekly trading volume over the preceding 4 weeks<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Form 144 filing<\/strong><\/td>\n<td>Not required<\/td>\n<td><strong>Filed with the SEC at or before the sale<\/strong>; valid for <strong>90 days<\/strong>; not required if selling ≤ 5,000 shares <strong>and<\/strong> ≤ $50,000<\/td>\n<\/tr>\n<tr>\n<td><strong>Manner of sale<\/strong><\/td>\n<td>—<\/td>\n<td>Through a broker (agency) or market maker in ordinary brokerage transactions; no solicitation<\/td>\n<\/tr>\n<tr>\n<td><strong>Current public information<\/strong><\/td>\n<td>Issuer must be current in SEC filings<\/td>\n<td>Same<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Example (volume limit).<\/strong> A director wants to sell shares in a company with 20 million shares outstanding. 1% = 200,000. The last four weeks' trading volumes were 150,000 / 200,000 / 250,000 / 300,000 (average 225,000). She may sell up to <strong>225,000 shares<\/strong> in the next 90 days (the greater of the two).<\/p>\n<p><strong>Related rules.<\/strong> Affiliates are also subject to <strong>Section 16<\/strong> of the 1934 Act — must report holdings and trades (Forms 3, 4, 5) and return <strong>short-swing profits<\/strong> (buy and sell within 6 months) to the company; insiders may not sell short their own company's stock. <strong>Rule 144A<\/strong> (above) is the institutional resale route.<\/p>\n<hr />\n<h2 id=\"s11-6\" data-sec=\"s11-6\"><span class=\"secnum\">11.6<\/span> Other rules<\/h2>\n<p><strong>Securities Act of 1933 anti-fraud (Section 17).<\/strong> Unlawful to use any device, scheme or untrue statement in the offer or sale of <strong>any<\/strong> security — exempt or not.<\/p>\n<p><strong>Prospectus rules for mutual funds.<\/strong> Because a mutual fund is a continuous offering, the prospectus must be delivered to every purchaser, must be updated at least every <strong>16 months<\/strong>, and sales literature may not go beyond it.<\/p>\n<p><strong>Restrictions on underwriters' compensation (FINRA Rule 5110, the Corporate Financing Rule).<\/strong> FINRA reviews underwriting terms for fairness; compensation must not be unreasonable; underwriters may not receive certain long-term options/warrants from the issuer.<\/p>\n<p><strong>Conflicts of interest (FINRA Rule 5121).<\/strong> If a member underwrites its own securities or those of an affiliate, or has a conflict (e.g., receiving more than 5% of proceeds to repay debt to itself), a <strong>qualified independent underwriter<\/strong> must participate and the conflict must be prominently disclosed.<\/p>\n<p><strong>Free-riding and withholding.<\/strong> Underwriters must make a bona fide public offering at the POP; they may not hold back shares of a hot issue for themselves (this is the origin of Rule 5130).<\/p>\n<p><strong>Communications during registration.<\/strong> Rule 134 permits tombstone ads; Rule 135 permits limited announcements of a planned offering; <strong>Rule 163<\/strong> lets <strong>well-known seasoned issuers (WKSIs)<\/strong> make offers before filing; <strong>free-writing prospectuses<\/strong> (Rule 433) are allowed for many issuers once the registration is filed, provided they are filed with the SEC. <strong>Emerging growth companies (EGCs)<\/strong> under the JOBS Act (&lt; $1.235 billion revenue) may \"test the waters\" with QIBs and institutions before filing and have reduced disclosure requirements.<\/p>\n<p><strong>Regulation M.<\/strong> Prohibits underwriters and issuers from bidding for or buying the security being distributed (except stabilization) during the restricted period, to prevent manipulation.<\/p>\n<p><strong>Penny stock rules (Rule 15g-9).<\/strong> Before a broker-dealer sells an unlisted stock priced under $5 to a new customer, it must obtain a <strong>written suitability statement<\/strong> and the customer's signed agreement for the specific transaction, and provide the risk disclosure document. Established customers (account open &gt; 1 year or 3+ prior penny stock purchases) are exempt from the suitability-statement requirement but not from disclosure. Monthly statements must show the market value of penny stock positions.<\/p>\n<p><strong>Direct participation program and REIT offerings.<\/strong> Public DPPs and non-traded REITs are registered offerings but FINRA limits underwriting compensation (10% of gross proceeds) and requires specific suitability standards and disclosures (valuations on statements, etc.).<\/p>\n<hr />\n<h2>Chapter 11 quick review<\/h2>\n<ul>\n<li>Primary market = issuer sells, issuer gets proceeds; Securities Act of 1933; SEC reviews for <strong>completeness, never approves<\/strong>.<\/li>\n<li>Spread = manager's fee + underwriting fee + selling concession (largest).<\/li>\n<li><strong>Firm commitment<\/strong> (principal, underwriter bears risk; standby for rights offerings) vs. <strong>best efforts<\/strong> (agent, issuer bears risk; AON and mini-max use escrow).<\/li>\n<li>Stabilizing bid: at or below POP, disclosed. Green shoe: +15%.<\/li>\n<li>Primary offering = new shares, issuer paid. Secondary offering = existing holders sell. Shelf registration: 3 years.<\/li>\n<li>Pre-filing: nothing. <strong>Cooling-off (≥ 20 days)<\/strong>: red herring, tombstones, indications of interest, road shows, due diligence — <strong>no sales<\/strong>. Effective: sell with final prospectus.<\/li>\n<li>Aftermarket prospectus delivery: 90 days (non-listed IPO), 25 days (listed IPO), 40 days (non-listed follow-on).<\/li>\n<li>Blue-sky: coordination, qualification, notice filing.<\/li>\n<li>Exempt securities: governments, munis, banks, ≤ 270-day CP, non-profits, insurance/fixed annuities. Exempt transactions: Reg D (506(b): unlimited accredited + 35 non-accredited; accredited = $1M net worth ex-home or $200k/$300k income), Reg A ($20M/$75M), Rule 147 (intrastate, 6-month resale restriction), 144A (QIBs, $100M), Reg S (offshore), crowdfunding ($5M).<\/li>\n<li><strong>Rule 144:<\/strong> restricted stock 6-month holding period; affiliates limited to the greater of 1% of outstanding or 4-week average weekly volume per 90 days; Form 144 valid 90 days; not needed for ≤ 5,000 shares and ≤ $50,000.<\/li>\n<li><strong>Rule 5130:<\/strong> no IPO shares to FINRA members, their employees and immediate family (restricted persons). <strong>Rule 5131:<\/strong> no spinning.<\/li>\n<li>Penny stock: &lt; $5, unlisted; suitability statement + signed agreement for new customers.<\/li>\n<\/ul>"}, {"num": 12, "name": "The Secondary Market", "file": "12-the-secondary-market.md", "minutes": 18, "sections": [{"id": "s12-1", "num": "12.1", "title": "Agency vs. principal capacity", "level": 2}, {"id": "s12-2", "num": "12.2", "title": "Roles", "level": 2}, {"id": "s12-3", "num": "12.3", "title": "Bid & ask", "level": 2}, {"id": "s12-4", "num": "12.4", "title": "The markets", "level": 2}, {"id": "s12-4-1", "num": "12.4.1", "title": "The New York Stock Exchange", "level": 3}, {"id": "s12-4-2", "num": "12.4.2", "title": "NASDAQ", "level": 3}, {"id": "s12-4-3", "num": "12.4.3", "title": "Other OTC markets", "level": 3}, {"id": "s12-4-4", "num": "12.4.4", "title": "Chicago Board Options Exchange", "level": 3}, {"id": "s12-5", "num": "12.5", "title": "The Securities Exchange Act of 1934", "level": 2}, {"id": "s12-6", "num": "12.6", "title": "Customer orders", "level": 2}, {"id": "s12-6-1", "num": "12.6.1", "title": "Market orders", "level": 3}, {"id": "s12-6-2", "num": "12.6.2", "title": "Limit orders", "level": 3}, {"id": "s12-6-3", "num": "12.6.3", "title": "Stop orders", "level": 3}, {"id": "s12-6-4", "num": "12.6.4", "title": "Stop limit orders", "level": 3}, {"id": "s12-6-5", "num": "12.6.5", "title": "Summary of the order types", "level": 3}, {"id": "s12-6-6", "num": "12.6.6", "title": "Additional order specifications", "level": 3}, {"id": "s12-6-7", "num": "12.6.7", "title": "Customer order rules", "level": 3}], "html": "\n<blockquote>\n<p>Where existing securities trade. Heavy on definitions: agent vs. principal, market makers and specialists/DMMs, the exchanges and OTC, the Securities Exchange Act of 1934, and — most tested — the order types (market, limit, stop, stop-limit) and where they're placed relative to the current price.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s12-1\" data-sec=\"s12-1\"><span class=\"secnum\">12.1<\/span> Agency vs. principal capacity<\/h2>\n<p>Every broker-dealer transaction is done in one of two capacities, and the capacity must be disclosed on the customer's <strong>trade confirmation<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Agency (broker)<\/strong><\/th>\n<th><strong>Principal (dealer)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Role<\/td>\n<td>Matches a buyer and seller; acts on <strong>behalf of<\/strong> the customer<\/td>\n<td>Trades <strong>with<\/strong> the customer from its <strong>own inventory<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Compensation<\/td>\n<td><strong>Commission<\/strong><\/td>\n<td><strong>Markup<\/strong> (when selling to the customer) or <strong>markdown<\/strong> (when buying from the customer) — built into the price<\/td>\n<\/tr>\n<tr>\n<td>Risk<\/td>\n<td>None (no inventory)<\/td>\n<td>Takes a position; bears market risk<\/td>\n<\/tr>\n<tr>\n<td>Disclosure on confirm<\/td>\n<td>Amount of commission; name of the other party available on request<\/td>\n<td>That it acted as principal; markup/markdown amount (now required for most retail corporate/agency/muni bond trades)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>A firm may <strong>not<\/strong> act as both broker and dealer on the <strong>same trade<\/strong> (charging a commission <em>and<\/em> a markup is prohibited). The term \"broker-dealer\" simply means a firm licensed to do either.<\/p>\n<ul>\n<li><strong>Riskless principal<\/strong> — the dealer buys a security to fill a customer order it already has in hand, then resells it to the customer at a markup; treated like an agency trade for disclosure purposes.<\/li>\n<li><strong>Markups and markdowns<\/strong> must be fair and reasonable. FINRA's <strong>5% policy<\/strong> is a guideline, not a hard cap, considering: type of security, availability, price, dollar amount, disclosure, pattern of markups, and the nature of the firm's business. It applies to secondary market trades, <strong>not<\/strong> to new issues (prospectus offerings) or mutual funds (where the sales charge is set by the prospectus), and not to securities sold at a stated price from a prospectus.<\/li>\n<li><strong>Proceeds transaction<\/strong> — when a customer sells one security and uses the proceeds to buy another, the firm must treat the two trades as one for markup purposes (not two separate 5%s).<\/li>\n<\/ul>\n<p><strong>Market maker.<\/strong> A dealer that stands ready to buy and sell a specific security at its quoted <strong>bid<\/strong> and <strong>ask<\/strong>, providing liquidity. Market makers are principals. On the NYSE, the market maker with special obligations is the <strong>designated market maker (DMM)<\/strong>; on Nasdaq, multiple competing market makers quote each stock.<\/p>\n<hr />\n<h2 id=\"s12-2\" data-sec=\"s12-2\"><span class=\"secnum\">12.2<\/span> Roles<\/h2>\n<table>\n<thead>\n<tr>\n<th>Participant<\/th>\n<th>Function<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Retail and institutional investors<\/strong><\/td>\n<td>Buyers and sellers of securities. Institutions (mutual funds, pensions, insurers, hedge funds) dominate trading volume.<\/td>\n<\/tr>\n<tr>\n<td><strong>Broker-dealers<\/strong><\/td>\n<td>Execute customer orders (as agent or principal), carry accounts, provide research and advice; must be registered with the SEC and be FINRA members.<\/td>\n<\/tr>\n<tr>\n<td><strong>Introducing broker<\/strong><\/td>\n<td>Takes customer orders and handles the relationship but doesn't hold customer assets; it \"introduces\" accounts to a…<\/td>\n<\/tr>\n<tr>\n<td><strong>Clearing (carrying) firm<\/strong><\/td>\n<td>Holds customer funds and securities, settles trades, sends confirmations and statements, extends margin.<\/td>\n<\/tr>\n<tr>\n<td><strong>Market makers / DMMs<\/strong><\/td>\n<td>Provide continuous two-sided quotes; DMMs on the NYSE also maintain a fair and orderly market, run the opening/closing auctions, and act as agent for orders left with them (the \"book\").<\/td>\n<\/tr>\n<tr>\n<td><strong>Floor brokers<\/strong><\/td>\n<td>NYSE members who execute orders on the floor for their firm's customers or other firms.<\/td>\n<\/tr>\n<tr>\n<td><strong>Exchanges / ATSs / ECNs<\/strong><\/td>\n<td>Venues where orders meet. <strong>Electronic communication networks (ECNs)<\/strong> match buy and sell orders electronically without a dealer, often used by institutions (the \"fourth market\") and for after-hours trading. <strong>Dark pools<\/strong> are private ATSs where large block trades execute without displaying quotes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Clearing agencies<\/strong><\/td>\n<td><strong>National Securities Clearing Corporation (NSCC)<\/strong> nets and guarantees trades; <strong>Depository Trust Company (DTC)<\/strong> holds securities in book-entry form; together they form <strong>DTCC<\/strong>. <strong>OCC<\/strong> clears options.<\/td>\n<\/tr>\n<tr>\n<td><strong>Transfer agents / registrars<\/strong><\/td>\n<td>Record ownership changes and ensure share counts.<\/td>\n<\/tr>\n<tr>\n<td><strong>Custodians / prime brokers<\/strong><\/td>\n<td>Hold assets for institutions; prime brokers provide consolidated services to hedge funds.<\/td>\n<\/tr>\n<tr>\n<td><strong>Regulators<\/strong><\/td>\n<td>SEC (oversight), FINRA (member firms and reps), the exchanges themselves (SROs), MSRB (muni rules), state regulators.<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment advisers<\/strong><\/td>\n<td>Give advice for a fee; fiduciaries; registered with the SEC (≥ $100 million AUM) or state.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Self-regulatory organizations (SROs).<\/strong> Membership organizations that regulate their members under SEC oversight: <strong>FINRA<\/strong>, the exchanges (NYSE, Nasdaq, Cboe), and the <strong>MSRB<\/strong> (makes rules but doesn't enforce). FINRA is the largest; nearly every broker-dealer must be a member.<\/p>\n<hr />\n<h2 id=\"s12-3\" data-sec=\"s12-3\"><span class=\"secnum\">12.3<\/span> Bid &amp; ask<\/h2>\n<p>A <strong>quote<\/strong> has two sides:<\/p>\n<ul>\n<li><strong>Bid<\/strong> — the highest price a buyer (market maker) is willing to <strong>pay<\/strong>. A customer <strong>sells<\/strong> at the bid.<\/li>\n<li><strong>Ask (offer)<\/strong> — the lowest price a seller (market maker) is willing to <strong>accept<\/strong>. A customer <strong>buys<\/strong> at the ask.<\/li>\n<li><strong>Spread<\/strong> = ask − bid. The market maker's profit margin; narrower spreads mean a more liquid security.<\/li>\n<li><strong>Size<\/strong> — the number of shares (in round lots of 100) bid for and offered. \"40.10 – 40.15, 10 × 5\" means bid $40.10 for 1,000 shares, ask $40.15 for 500 shares.<\/li>\n<li><strong>Inside market / NBBO<\/strong> — the <strong>highest bid and lowest ask<\/strong> across all market makers and venues; this is the <strong>National Best Bid and Offer<\/strong>, which firms must use to achieve best execution (Reg NMS order protection rule).<\/li>\n<\/ul>\n<p><strong>Types of quotes.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Quote type<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Firm quote<\/strong><\/td>\n<td>The dealer must honor it for at least the displayed size (normally 100 shares). Market makers' published quotes are firm.<\/td>\n<\/tr>\n<tr>\n<td><strong>Subject quote<\/strong><\/td>\n<td>Subject to confirmation; not firm.<\/td>\n<\/tr>\n<tr>\n<td><strong>Nominal quote<\/strong><\/td>\n<td>For informational purposes only; must be labeled as such.<\/td>\n<\/tr>\n<tr>\n<td><strong>Workout quote<\/strong><\/td>\n<td>An approximate price for a large/illiquid order the dealer needs time to \"work out.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Backing away<\/strong><\/td>\n<td>A market maker refusing to honor its firm quote — a violation.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Price increments.<\/strong> Stocks priced $1.00 and above quote in <strong>pennies<\/strong> ($0.01); sub-$1 stocks can quote in $0.0001. Round lot = <strong>100 shares<\/strong>; odd lot = fewer than 100.<\/p>\n<p><strong>Reading a stock table.<\/strong> Last price, net change from the prior close, high/low, volume; 52-week high/low; dividend and yield; P/E.<\/p>\n<hr />\n<h2 id=\"s12-4\" data-sec=\"s12-4\"><span class=\"secnum\">12.4<\/span> The markets<\/h2>\n<p>The secondary market is traditionally described as four markets:<\/p>\n<table>\n<thead>\n<tr>\n<th>Market<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>First market<\/strong><\/td>\n<td>Exchange-listed securities traded <strong>on the exchange<\/strong> (NYSE, Nasdaq). An auction market with a central order flow.<\/td>\n<\/tr>\n<tr>\n<td><strong>Second market<\/strong><\/td>\n<td><strong>Unlisted<\/strong> securities traded <strong>OTC<\/strong> (OTC Markets Group's OTCQX, OTCQB, Pink). A negotiated dealer market.<\/td>\n<\/tr>\n<tr>\n<td><strong>Third market<\/strong><\/td>\n<td><strong>Exchange-listed<\/strong> securities traded <strong>OTC<\/strong> by non-exchange-member broker-dealers/market makers.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fourth market<\/strong><\/td>\n<td><strong>Institutions trading directly with each other<\/strong> without a broker-dealer, through ECNs/ATSs; large blocks.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s12-4-1\" data-sec=\"s12-4-1\"><span class=\"secnum\">12.4.1<\/span> The New York Stock Exchange<\/h3>\n<ul>\n<li>The largest stock exchange by market cap; a <strong>listed, auction-style<\/strong> market combining electronic matching with a physical floor. Companies must meet <strong>listing requirements<\/strong> (earnings, market cap, share price, number of shareholders, corporate governance) and can be <strong>delisted<\/strong> if they fall short (e.g., share price below $1 for 30 days).<\/li>\n<li><strong>Designated market makers (DMMs)<\/strong> — assigned to each listed stock; obligated to maintain a <strong>fair and orderly market<\/strong>, supply liquidity when there's an imbalance (buying when others want to sell, and vice versa), set the opening and closing prices, and handle orders left on their book. They act as both dealers (for their own account) and agents (for the book).<\/li>\n<li><strong>Floor brokers<\/strong> execute orders for their firms' customers.<\/li>\n<li><strong>Supplemental liquidity providers (SLPs)<\/strong> add quotes electronically.<\/li>\n<li>Trading hours: <strong>9:30 am – 4:00 pm ET<\/strong>; pre-market and after-hours sessions via ECNs.<\/li>\n<li><strong>Circuit breakers (market-wide):<\/strong> based on the S&amp;P 500's decline from the prior close — <strong>Level 1: 7%<\/strong> → 15-minute halt; <strong>Level 2: 13%<\/strong> → 15-minute halt (neither applies after 3:25 pm); <strong>Level 3: 20%<\/strong> → trading halts for the rest of the day. Individual stocks are also subject to the <strong>Limit Up–Limit Down (LULD)<\/strong> mechanism which pauses trading for 5 minutes if the price moves outside a band.<\/li>\n<li><strong>Trading halts<\/strong> can be imposed for pending news (regulatory halt) or order imbalances.<\/li>\n<\/ul>\n<h3 id=\"s12-4-2\" data-sec=\"s12-4-2\"><span class=\"secnum\">12.4.2<\/span> NASDAQ<\/h3>\n<ul>\n<li>Began in 1971 as an electronic quotation system for OTC stocks; now a registered <strong>exchange<\/strong> with its own listing standards (Global Select, Global, and Capital markets). Home to many technology companies.<\/li>\n<li>A <strong>dealer (negotiated) market<\/strong> with <strong>multiple competing market makers<\/strong> for each stock (no single DMM) and electronic order matching. Market makers must maintain <strong>firm two-sided quotes<\/strong> during the trading day.<\/li>\n<li><strong>Market maker quote levels<\/strong>: Level 1 (inside bid/ask — what retail sees), Level 2 (every market maker's quotes and size — subscribers and professionals), Level 3 (market makers entering/updating their quotes).<\/li>\n<li>Trade reporting for Nasdaq-listed and OTC equities goes through FINRA's <strong>trade reporting facilities (TRFs)<\/strong> and <strong>ORF<\/strong> within <strong>10 seconds<\/strong> of execution.<\/li>\n<li>Nasdaq-listed stocks are also traded OTC by third-market makers and on ECNs.<\/li>\n<\/ul>\n<h3 id=\"s12-4-3\" data-sec=\"s12-4-3\"><span class=\"secnum\">12.4.3<\/span> Other OTC markets<\/h3>\n<ul>\n<li><strong>OTC Markets Group<\/strong> (formerly the Pink Sheets): quotes for <strong>unlisted<\/strong> stocks. Tiers: <strong>OTCQX<\/strong> (best — companies meeting financial standards), <strong>OTCQB<\/strong> (venture market — must be current in reporting), <strong>Pink Open Market<\/strong> (anything, including shells and delinquent filers; most \"penny stocks\" live here), and the <strong>Grey Market<\/strong> (no quotes at all).<\/li>\n<li><strong>OTC Bulletin Board (OTCBB)<\/strong> — a FINRA-run quotation service for SEC-reporting unlisted companies; now effectively defunct.<\/li>\n<li><strong>OTC equity trades<\/strong> are reported to FINRA's <strong>ORF<\/strong> (OTC Reporting Facility).<\/li>\n<li><strong>Bonds<\/strong> (corporate, muni, government) trade almost entirely OTC — see Chapters 4–6. Corporate bond trades report to <strong>TRACE<\/strong>; munis to <strong>RTRS/EMMA<\/strong>.<\/li>\n<li>The OTC market is a <strong>negotiated<\/strong> market: prices are set by negotiation between dealers rather than by a central auction.<\/li>\n<\/ul>\n<h3 id=\"s12-4-4\" data-sec=\"s12-4-4\"><span class=\"secnum\">12.4.4<\/span> Chicago Board Options Exchange<\/h3>\n<ul>\n<li>The <strong>Cboe<\/strong> was founded in 1973 as the first listed options exchange and remains the largest. It lists equity options, index options (SPX, VIX), and options on ETFs.<\/li>\n<li>Options exchanges use <strong>market makers<\/strong> and <strong>order book officials<\/strong> (or electronic equivalents) rather than DMMs; the <strong>Options Clearing Corporation (OCC)<\/strong> issues and clears every listed option.<\/li>\n<li>Options trade 9:30 am–4:00 pm ET (some index options until 4:15 pm). The Cboe is also a major equities exchange operator (Cboe BZX, EDGX).<\/li>\n<li>Other options exchanges: NYSE Arca, NYSE American, Nasdaq PHLX, ISE, BOX, MIAX. Listed options are <strong>fungible<\/strong> across exchanges because the OCC guarantees them.<\/li>\n<\/ul>\n<p><strong>Other exchanges/markets to recognize:<\/strong> NYSE American (smaller companies), NYSE Arca (ETFs), the <strong>CME Group<\/strong> (futures and commodities — Chicago Mercantile Exchange, CBOT, NYMEX), regional exchanges, and foreign exchanges (London, Tokyo, Hong Kong).<\/p>\n<hr />\n<h2 id=\"s12-5\" data-sec=\"s12-5\"><span class=\"secnum\">12.5<\/span> The Securities Exchange Act of 1934<\/h2>\n<p>The <strong>\"People Act\"<\/strong> or <strong>\"Exchange Act.\"<\/strong> Where the 1933 Act regulates new issues, the 1934 Act regulates the <strong>secondary market<\/strong> and the people in it. Key provisions:<\/p>\n<ul>\n<li><strong>Created the Securities and Exchange Commission (SEC)<\/strong> — five commissioners appointed by the President for staggered 5-year terms; no more than three from one party. The SEC enforces all federal securities laws.<\/li>\n<li><strong>Registration of broker-dealers<\/strong> with the SEC and requirement to join an SRO (FINRA). Registration of exchanges, transfer agents, clearing agencies, and associated persons (through FINRA).<\/li>\n<li><strong>Registration of exchanges<\/strong> and recognition of SROs.<\/li>\n<li><strong>Periodic reporting by public companies:<\/strong> <strong>10-K<\/strong> (annual, audited), <strong>10-Q<\/strong> (quarterly), <strong>8-K<\/strong> (material events within 4 business days), proxy statements. These \"reporting companies\" are those with listed securities or with ≥ $10 million in assets and 2,000+ holders.<\/li>\n<li><strong>Proxy rules<\/strong> — regulate solicitation of shareholder votes (Chapter 15).<\/li>\n<li><strong>Insider reporting (Section 16)<\/strong> — officers, directors and 10%+ holders report trades (Forms 3, 4 within 2 business days, 5) and must disgorge <strong>short-swing profits<\/strong> (buy/sell within 6 months); may not short their company's stock. <strong>Schedule 13D<\/strong> must be filed within <strong>5 business days<\/strong> by anyone acquiring <strong>more than 5%<\/strong> of a company's equity with intent to influence control; passive investors file 13G.<\/li>\n<li><strong>Anti-fraud and anti-manipulation (Section 10(b), Rule 10b-5)<\/strong> — prohibits any manipulative or deceptive device in connection with buying or selling <strong>any<\/strong> security (listed or not, exempt or not). This is the basis for <strong>insider trading<\/strong> prosecutions.<\/li>\n<li><strong>Margin regulation<\/strong> — gives the <strong>Federal Reserve<\/strong> authority to set margin requirements (<strong>Regulation T<\/strong>, 50%).<\/li>\n<li><strong>Net capital rules<\/strong> for broker-dealers (financial responsibility) and the <strong>customer protection rule<\/strong> (segregation of customer assets).<\/li>\n<li><strong>Trading rules<\/strong> — short sale regulation (Reg SHO), prohibition of wash trades and matched orders, rules on trading halts and circuit breakers.<\/li>\n<li><strong>Records and reports<\/strong> — broker-dealers must keep books and records (Rules 17a-3, 17a-4) and file annual audited financials (FOCUS reports).<\/li>\n<li>Later amendments: the <strong>Maloney Act of 1938<\/strong> authorized the NASD (now FINRA); the <strong>Securities Investor Protection Act of 1970<\/strong> created SIPC; the <strong>Insider Trading and Securities Fraud Enforcement Act of 1988<\/strong> set penalties; <strong>Sarbanes-Oxley (2002)<\/strong> added CEO/CFO certification of financials and auditor independence; <strong>Dodd-Frank (2010)<\/strong> reformed derivatives and created the CFPB and FSOC; <strong>Regulation NMS (2005)<\/strong> created the order protection rule and the NBBO framework.<\/li>\n<\/ul>\n<p><strong>Regulation SHO (short sales).<\/strong> Orders must be marked long or short; a \"locate\" is required before a short sale; <strong>threshold securities<\/strong> with persistent fails must be closed out; a <strong>short sale circuit breaker (Rule 201)<\/strong> restricts short selling at or below the best bid for the rest of the day and the next day when a stock falls <strong>10%<\/strong> from the prior close.<\/p>\n<hr />\n<h2 id=\"s12-6\" data-sec=\"s12-6\"><span class=\"secnum\">12.6<\/span> Customer orders<\/h2>\n<p>Customer orders instruct the broker how to execute. Know each type, its purpose, and its drawbacks.<\/p>\n<h3 id=\"s12-6-1\" data-sec=\"s12-6-1\"><span class=\"secnum\">12.6.1<\/span> Market orders<\/h3>\n<p><strong>Execute immediately at the best available price.<\/strong> Guaranteed <strong>execution<\/strong>, not price. A market order to buy fills at the current ask; to sell, at the current bid. Most common order type. Risk: in a fast-moving or illiquid market, the fill may be far from the last quote (slippage). Market orders cannot be placed with price conditions and are always \"day\" orders in practice.<\/p>\n<h3 id=\"s12-6-2\" data-sec=\"s12-6-2\"><span class=\"secnum\">12.6.2<\/span> Limit orders<\/h3>\n<p><strong>Execute only at the limit price or better.<\/strong> Guaranteed <strong>price<\/strong> (if filled), not execution.<\/p>\n<ul>\n<li><strong>Buy limit<\/strong> — placed <strong>below<\/strong> the current market; fills at the limit or lower. \"Buy 100 XYZ at 48 limit\" when XYZ is 50.<\/li>\n<li><strong>Sell limit<\/strong> — placed <strong>above<\/strong> the current market; fills at the limit or higher. \"Sell 100 XYZ at 52 limit\" when XYZ is 50.<\/li>\n<\/ul>\n<p>Risks: the order may never fill if the market doesn't reach the price, or may be only partially filled, or may be \"stuck\" behind other orders at the same price (priority is price, then time). Limit orders on the book contribute to displayed liquidity.<\/p>\n<h3 id=\"s12-6-3\" data-sec=\"s12-6-3\"><span class=\"secnum\">12.6.3<\/span> Stop orders<\/h3>\n<p>A <strong>stop (stop-loss) order<\/strong> becomes a <strong>market order<\/strong> when the stock trades at or through the <strong>stop price<\/strong>. Used mainly to <strong>protect<\/strong> a position or to enter a position on a breakout.<\/p>\n<ul>\n<li><strong>Sell stop<\/strong> — placed <strong>below<\/strong> the current market. Protects a <strong>long<\/strong> position against a decline (or limits the loss). \"Sell 100 XYZ at 45 stop\" when XYZ is 50: if XYZ trades at 45 or lower, the order is <strong>triggered (elected)<\/strong> and becomes a market order to sell, filling at the next price — which may be lower than 45.<\/li>\n<li><strong>Buy stop<\/strong> — placed <strong>above<\/strong> the current market. Protects a <strong>short<\/strong> position against a rise, or buys a stock once it \"breaks out\" above resistance. \"Buy 100 XYZ at 55 stop.\"<\/li>\n<\/ul>\n<p>Two steps: <strong>trigger<\/strong> (a trade at or through the stop price) and <strong>execution<\/strong> (the next trade, at whatever price). Stop orders guarantee neither price nor (in a gap) a fill near the stop. In a sharp decline, a sell stop at 45 can execute at 40. Stop orders can accelerate declines (cascading stops).<\/p>\n<h3 id=\"s12-6-4\" data-sec=\"s12-6-4\"><span class=\"secnum\">12.6.4<\/span> Stop limit orders<\/h3>\n<p>A <strong>stop-limit order<\/strong> becomes a <strong>limit order<\/strong> (not a market order) once the stop price is triggered. \"Sell 100 XYZ at 45 stop, 44 limit\": when XYZ trades at 45 or below, a sell limit order at 44 is entered — it will execute only at 44 or higher. Advantage: price control after the trigger. Disadvantage: if the stock gaps through the limit, the order <strong>may never execute<\/strong>, leaving the investor unprotected (the exact thing a stop-loss was supposed to prevent). The stop and limit prices can be the same.<\/p>\n<h3 id=\"s12-6-5\" data-sec=\"s12-6-5\"><span class=\"secnum\">12.6.5<\/span> Summary of the order types<\/h3>\n<table>\n<thead>\n<tr>\n<th>Order<\/th>\n<th>Placed where (relative to market)<\/th>\n<th>Becomes<\/th>\n<th>Guarantees<\/th>\n<th>Typical use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Market<\/strong><\/td>\n<td>—<\/td>\n<td>Executes now<\/td>\n<td>Execution<\/td>\n<td>Get in/out immediately<\/td>\n<\/tr>\n<tr>\n<td><strong>Buy limit<\/strong><\/td>\n<td><strong>Below<\/strong> market<\/td>\n<td>—<\/td>\n<td>Price<\/td>\n<td>Buy cheaper<\/td>\n<\/tr>\n<tr>\n<td><strong>Sell limit<\/strong><\/td>\n<td><strong>Above<\/strong> market<\/td>\n<td>—<\/td>\n<td>Price<\/td>\n<td>Sell higher (take profit)<\/td>\n<\/tr>\n<tr>\n<td><strong>Buy stop<\/strong><\/td>\n<td><strong>Above<\/strong> market<\/td>\n<td>Market order when triggered<\/td>\n<td>Neither<\/td>\n<td>Protect a short; buy a breakout<\/td>\n<\/tr>\n<tr>\n<td><strong>Sell stop<\/strong><\/td>\n<td><strong>Below<\/strong> market<\/td>\n<td>Market order when triggered<\/td>\n<td>Neither<\/td>\n<td>Protect a long (stop-loss)<\/td>\n<\/tr>\n<tr>\n<td><strong>Buy stop-limit<\/strong><\/td>\n<td>Above<\/td>\n<td>Limit order when triggered<\/td>\n<td>Price (if filled)<\/td>\n<td>Protect short with price control<\/td>\n<\/tr>\n<tr>\n<td><strong>Sell stop-limit<\/strong><\/td>\n<td>Below<\/td>\n<td>Limit order when triggered<\/td>\n<td>Price (if filled)<\/td>\n<td>Protect long with price control<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Memory aid — <strong>BLiSS / SLoBS<\/strong>: <strong>B<\/strong>uy <strong>Li<\/strong>mits and <strong>S<\/strong>ell <strong>S<\/strong>tops go <strong>below<\/strong> the market; <strong>S<\/strong>ell <strong>L<\/strong>imits and <strong>B<\/strong>uy <strong>S<\/strong>tops go <strong>above<\/strong>. Orders below the market are reduced on the ex-dividend date; orders above are not.<\/p>\n<h3 id=\"s12-6-6\" data-sec=\"s12-6-6\"><span class=\"secnum\">12.6.6<\/span> Additional order specifications<\/h3>\n<table>\n<thead>\n<tr>\n<th>Qualifier<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Day order<\/strong><\/td>\n<td>Expires at the end of the trading day if not filled (the default).<\/td>\n<\/tr>\n<tr>\n<td><strong>Good-till-cancelled (GTC) / open order<\/strong><\/td>\n<td>Stays on the book until filled or cancelled (firms typically require renewal, e.g., quarterly).<\/td>\n<\/tr>\n<tr>\n<td><strong>Immediate-or-cancel (IOC)<\/strong><\/td>\n<td>Execute whatever portion is immediately available; cancel the rest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fill-or-kill (FOK)<\/strong><\/td>\n<td>Execute the <strong>entire<\/strong> order immediately or cancel it entirely.<\/td>\n<\/tr>\n<tr>\n<td><strong>All-or-none (AON)<\/strong><\/td>\n<td>Entire order must be filled, but it can wait (no immediacy requirement).<\/td>\n<\/tr>\n<tr>\n<td><strong>At-the-open / market-on-open<\/strong><\/td>\n<td>Execute at or near the opening price; must be in before the open.<\/td>\n<\/tr>\n<tr>\n<td><strong>At-the-close / market-on-close (MOC)<\/strong><\/td>\n<td>Execute at or near the closing price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Not-held (NH)<\/strong><\/td>\n<td>Gives the floor broker discretion over <strong>time and price<\/strong> only (not over security, action or amount) — not considered a discretionary order requiring written authority.<\/td>\n<\/tr>\n<tr>\n<td><strong>Do-not-reduce (DNR)<\/strong><\/td>\n<td>Open orders below the market (buy limits, sell stops) are normally <strong>reduced by the dividend amount on the ex-date<\/strong>; DNR prevents this.<\/td>\n<\/tr>\n<tr>\n<td><strong>Discretionary<\/strong><\/td>\n<td>The rep decides the security, action (buy/sell) or amount — requires <strong>written authorization<\/strong> from the customer and principal approval of each order (Chapter 13). Deciding only time/price is not discretion.<\/td>\n<\/tr>\n<tr>\n<td><strong>Solicited vs. unsolicited<\/strong><\/td>\n<td>Whether the rep recommended the trade; unsolicited orders must be marked and carry less suitability obligation.<\/td>\n<\/tr>\n<tr>\n<td><strong>Long / short marking<\/strong><\/td>\n<td>Every sell order marked long or short (Reg SHO).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"s12-6-7\" data-sec=\"s12-6-7\"><span class=\"secnum\">12.6.7<\/span> Customer order rules<\/h3>\n<ul>\n<li><strong>Best execution (FINRA Rule 5310).<\/strong> Firms must use <strong>reasonable diligence<\/strong> to get the customer the <strong>most favorable terms reasonably available<\/strong> — price, speed, likelihood of execution — regardless of any payment for order flow the firm receives. Routing to a market with an inferior price is a violation.<\/li>\n<li><strong>Payment for order flow<\/strong> — compensation a firm receives for routing orders to a particular market maker; permitted but must be disclosed (on confirms and in SEC Rule 606 quarterly reports), and cannot override best execution.<\/li>\n<li><strong>Order ticket (memorandum)<\/strong> requirements: account number, security, buy/sell, long/short, size, order type and limits, solicited/unsolicited, discretionary status, time received and time executed, rep ID. Prepared <strong>before<\/strong> the order is entered. Records retained <strong>3 years<\/strong>.<\/li>\n<li><strong>Trade confirmation<\/strong> sent at or before <strong>completion of the transaction (settlement)<\/strong> showing details including capacity, price, commission/markup (Chapter 13).<\/li>\n<li><strong>Front-running<\/strong> — trading ahead of a customer's (or research report's) pending order — prohibited (FINRA Rule 5270).<\/li>\n<li><strong>Trading ahead of customer limit orders (Manning rule / Rule 5320)<\/strong> — a firm holding a customer limit order may not trade for its own account at that price or better without filling the customer first.<\/li>\n<li><strong>Order protection (Reg NMS Rule 611)<\/strong> — a trading center may not execute at a price worse than a better <strong>protected quote<\/strong> displayed elsewhere (\"trade-through\").<\/li>\n<li><strong>Error correction<\/strong> — execution errors are handled through the firm's error account with principal approval; reps cannot guarantee a customer against loss or take errors into their own accounts.<\/li>\n<li><strong>Prohibited:<\/strong> marking the close, wash trades, matched orders, spoofing, front-running, interpositioning (inserting an unnecessary third party between the firm and the best market), and backing away (Chapter 15).<\/li>\n<li><strong>Regulation SHO marking<\/strong> — every sell order marked \"long\" or \"short\"; locate required for shorts.<\/li>\n<li><strong>Trading restrictions during distributions (Reg M)<\/strong> and <strong>blackout periods<\/strong> for insiders.<\/li>\n<\/ul>\n<hr />\n<h2>Chapter 12 quick review<\/h2>\n<ul>\n<li><strong>Agent = commission; principal = markup/markdown.<\/strong> Never both on one trade. Capacity disclosed on the confirm. 5% policy is a guideline for secondary trades (not new issues or funds).<\/li>\n<li>Bid = what dealer pays (customer sells); ask = what dealer charges (customer buys); spread = profit. Firm quotes must be honored; backing away is a violation.<\/li>\n<li>First market = exchange; second = OTC unlisted; third = listed traded OTC; fourth = institution-to-institution via ECNs.<\/li>\n<li>NYSE: auction, DMMs maintain fair/orderly market. Nasdaq: dealer market, competing market makers, Level 1/2/3. OTC tiers: OTCQX, OTCQB, Pink. Cboe: largest options exchange; OCC clears.<\/li>\n<li>Circuit breakers: S&amp;P 500 down 7% and 13% → 15-min halt (not after 3:25); 20% → close for the day.<\/li>\n<li>1934 Act: created SEC; registers BDs, exchanges, SROs; 10-K/10-Q/8-K; proxy rules; insider (Section 16) and 13D (&gt; 5%); Rule 10b-5 anti-fraud; Fed sets margin (Reg T); Reg SHO.<\/li>\n<li><strong>Orders:<\/strong> market (execution guaranteed), limit (price guaranteed; buy limit below, sell limit above), stop (becomes market when triggered; sell stop below to protect long, buy stop above to protect short), stop-limit (becomes limit — may not execute).<\/li>\n<li>BLiSS/SLoBS. Orders below the market are reduced on the ex-date unless DNR.<\/li>\n<li>Day vs. GTC; IOC, FOK, AON; not-held = time/price discretion only; discretionary = written authorization.<\/li>\n<li>Best execution regardless of payment for order flow; no front-running; Manning rule; order tickets kept 3 years.<\/li>\n<\/ul>"}, {"num": 13, "name": "Brokerage Accounts", "file": "13-brokerage-accounts.md", "minutes": 24, "sections": [{"id": "s13-1", "num": "13.1", "title": "Fundamentals", "level": 2}, {"id": "s13-1-1", "num": "13.1.1", "title": "Statements", "level": 3}, {"id": "s13-1-2", "num": "13.1.2", "title": "Trade confirmations", "level": 3}, {"id": "s13-1-3", "num": "13.1.3", "title": "Customer complaints", "level": 3}, {"id": "s13-2", "num": "13.2", "title": "New accounts", "level": 2}, {"id": "s13-2-1", "num": "13.2.1", "title": "Required customer information", "level": 3}, {"id": "s13-2-2", "num": "13.2.2", "title": "Optional customer information", "level": 3}, {"id": "s13-2-3", "num": "13.2.3", "title": "Account opening", "level": 3}, {"id": "s13-3", "num": "13.3", "title": "Account registrations", "level": 2}, {"id": "s13-3-1", "num": "13.3.1", "title": "Individual accounts", "level": 3}, {"id": "s13-3-2", "num": "13.3.2", "title": "Joint accounts", "level": 3}, {"id": "s13-3-3", "num": "13.3.3", "title": "Power of attorney", "level": 3}, {"id": "s13-3-4", "num": "13.3.4", "title": "Discretionary accounts", "level": 3}, {"id": "s13-3-5", "num": "13.3.5", "title": "Custodial accounts", "level": 3}, {"id": "s13-3-6", "num": "13.3.6", "title": "Guardianship accounts", "level": 3}, {"id": "s13-3-7", "num": "13.3.7", "title": "Trust accounts", "level": 3}, {"id": "s13-3-8", "num": "13.3.8", "title": "Business accounts", "level": 3}, {"id": "s13-3-9", "num": "13.3.9", "title": "Prime brokerage accounts", "level": 3}, {"id": "s13-4", "num": "13.4", "title": "Margin accounts", "level": 2}, {"id": "s13-4-1", "num": "13.4.1", "title": "Overview", "level": 3}, {"id": "s13-4-2", "num": "13.4.2", "title": "Opening a margin account", "level": 3}, {"id": "s13-4-3", "num": "13.4.3", "title": "Deposit requirements", "level": 3}, {"id": "s13-4-4", "num": "13.4.4", "title": "Equity", "level": 3}, {"id": "s13-4-5", "num": "13.4.5", "title": "Minimum maintenance", "level": 3}, {"id": "s13-5", "num": "13.5", "title": "Options accounts", "level": 2}, {"id": "s13-6", "num": "13.6", "title": "Other account specifications", "level": 2}, {"id": "s13-6-1", "num": "13.6.1", "title": "SIPC insurance", "level": 3}, {"id": "s13-6-2", "num": "13.6.2", "title": "Business continuity plans", "level": 3}], "html": "\n<blockquote>\n<p>Account documentation, the types of account registrations, margin basics, options accounts, SIPC and business continuity. Section 3 of the FINRA outline (31%) draws heavily from here — especially new-account requirements, custodial/joint/discretionary accounts, Reg T, and SIPC coverage.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s13-1\" data-sec=\"s13-1\"><span class=\"secnum\">13.1<\/span> Fundamentals<\/h2>\n<h3 id=\"s13-1-1\" data-sec=\"s13-1-1\"><span class=\"secnum\">13.1.1<\/span> Statements<\/h3>\n<p>Customer <strong>account statements<\/strong> show the account's positions, their market values, all activity (trades, deposits, withdrawals, dividends/interest, fees) for the period, and the firm's contact information.<\/p>\n<ul>\n<li>Must be sent at least <strong>quarterly<\/strong> (every calendar quarter) for any account with activity or a balance; in practice, <strong>monthly<\/strong> when there's activity.<\/li>\n<li>Must include a statement advising the customer to <strong>report any inaccuracies promptly<\/strong> to the firm (and to the carrying firm, if introduced).<\/li>\n<li>Penny stock positions must show the market value and the firm's estimate.<\/li>\n<li>Statements for <strong>DPPs and non-traded REITs<\/strong> must show a per-share estimated value.<\/li>\n<li>Customers may ask that statements be held (e.g., while traveling) for a limited time (up to 3 months with a written request and a valid reason); statements may not be sent to the rep instead of the customer.<\/li>\n<li>Electronic delivery requires the customer's <strong>affirmative consent<\/strong>.<\/li>\n<\/ul>\n<h3 id=\"s13-1-2\" data-sec=\"s13-1-2\"><span class=\"secnum\">13.1.2<\/span> Trade confirmations<\/h3>\n<p>A <strong>confirmation<\/strong> is sent for every transaction <strong>at or before completion of the transaction (the settlement date)<\/strong>. Required contents (SEC Rule 10b-10):<\/p>\n<ul>\n<li>Trade date and (if different) settlement date; security description; quantity; <strong>price<\/strong>.<\/li>\n<li>Whether the firm acted as <strong>agent<\/strong> (commission disclosed) or <strong>principal<\/strong> (markup/markdown for most retail bond trades; for equities, that it acted as principal).<\/li>\n<li>For bonds: <strong>yield<\/strong> (yield to worst for callable bonds), call features, and whether the bond is unrated.<\/li>\n<li>Whether the firm receives <strong>payment for order flow<\/strong>.<\/li>\n<li>For mutual funds: sales charge information or reference to the prospectus.<\/li>\n<\/ul>\n<p>Customers should receive confirms directly; a customer may direct duplicate confirms to a third party (e.g., an adviser) in writing.<\/p>\n<h3 id=\"s13-1-3\" data-sec=\"s13-1-3\"><span class=\"secnum\">13.1.3<\/span> Customer complaints<\/h3>\n<p>A <strong>complaint<\/strong> is any <strong>written<\/strong> (including electronic — email, text, social media message) statement from a customer or someone acting for a customer alleging a grievance involving the firm or an associated person's activities.<\/p>\n<ul>\n<li>Must be reported to the firm's <strong>compliance/principal<\/strong>, logged, investigated and responded to; the firm keeps a <strong>complaint file<\/strong> at the OSJ.<\/li>\n<li>Firms must report statistical summaries of written customer complaints to FINRA <strong>quarterly<\/strong> (Rule 4530) and must report any complaint alleging theft/forgery/misappropriation promptly (within 30 days).<\/li>\n<li>Records of complaints are retained for <strong>4 years<\/strong>.<\/li>\n<li>A rep must <strong>never<\/strong> settle a complaint privately, pay the customer out of pocket, or hide a complaint from the firm.<\/li>\n<li>Customer complaints are also disclosed on the rep's <strong>Form U4/U5<\/strong> and on <strong>BrokerCheck<\/strong> in many cases.<\/li>\n<li>Disputes between customers and firms are generally resolved through <strong>FINRA arbitration<\/strong> (most new-account agreements contain a <strong>pre-dispute arbitration clause<\/strong>, which must be highlighted and explained). Arbitration awards are final and binding, with very limited appeal; claims must be filed within <strong>6 years<\/strong> of the event. <strong>Mediation<\/strong> is a voluntary, non-binding alternative. Disputes between firms or between a firm and its reps must go to arbitration (industry disputes). Class actions are excluded from arbitration.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s13-2\" data-sec=\"s13-2\"><span class=\"secnum\">13.2<\/span> New accounts<\/h2>\n<h3 id=\"s13-2-1\" data-sec=\"s13-2-1\"><span class=\"secnum\">13.2.1<\/span> Required customer information<\/h3>\n<p>To open an account, FINRA Rule 4512 and the USA PATRIOT Act's <strong>Customer Identification Program (CIP)<\/strong> require the firm to obtain, at a minimum:<\/p>\n<ul>\n<li><strong>Name<\/strong> and <strong>address<\/strong> (residence; a P.O. box alone is not acceptable).<\/li>\n<li><strong>Date of birth<\/strong> (must be of legal age — generally 18 — to open an account in their own name).<\/li>\n<li><strong>Taxpayer ID / Social Security number<\/strong> (or passport/ID for non-US persons).<\/li>\n<li>Whether the customer is of <strong>legal age<\/strong>.<\/li>\n<li>The name of the <strong>registered representative<\/strong> responsible for the account and the signature of the <strong>principal<\/strong> who approved it.<\/li>\n<li>Whether the customer is <strong>employed by another broker-dealer or FINRA member<\/strong> (if so, the employer must be notified and may require duplicate confirms/statements).<\/li>\n<li>Whether the customer is a <strong>control person / insider<\/strong> of a public company (affects Rule 144 handling).<\/li>\n<li>For <strong>cash accounts<\/strong>, the customer's <strong>signature is not required<\/strong>; for margin and options accounts, signed agreements are required.<\/li>\n<\/ul>\n<p>The firm must <strong>verify the customer's identity<\/strong> (via documents like a driver's license/passport or non-documentary means like credit bureaus) within a reasonable time after opening, keep records of the verification, and check the customer against the <strong>OFAC<\/strong> Specially Designated Nationals list.<\/p>\n<p>The firm must also provide the customer with a copy of the <strong>account record<\/strong> (and any updates) at opening and at least every <strong>36 months<\/strong> thereafter, and must give new customers a written notice about <strong>SIPC<\/strong> and about <strong>FINRA BrokerCheck<\/strong> (with FINRA's hotline number and website).<\/p>\n<h3 id=\"s13-2-2\" data-sec=\"s13-2-2\"><span class=\"secnum\">13.2.2<\/span> Optional customer information<\/h3>\n<p>FINRA's suitability rule (and Reg BI for recommendations to retail customers) requires firms to make a <strong>reasonable effort<\/strong> to collect the customer's <strong>investment profile<\/strong> — but the customer may decline to provide it, in which case the rep must not make recommendations without a reasonable basis:<\/p>\n<ul>\n<li><strong>Investment objectives<\/strong> (growth, income, preservation of capital, speculation).<\/li>\n<li><strong>Financial situation<\/strong> — annual income, net worth (liquid net worth), other investments.<\/li>\n<li><strong>Tax status / bracket.<\/strong><\/li>\n<li><strong>Risk tolerance.<\/strong><\/li>\n<li><strong>Time horizon<\/strong> and <strong>liquidity needs<\/strong>.<\/li>\n<li><strong>Investment experience.<\/strong><\/li>\n<li><strong>Age<\/strong> and employment/occupation.<\/li>\n<li><strong>Trusted contact person<\/strong> (FINRA Rule 4512 requires firms to <em>attempt<\/em> to obtain the name of a trusted contact — a person age 18+ the firm may contact about possible exploitation or diminished capacity; the customer may decline).<\/li>\n<\/ul>\n<p>If a customer refuses to give financial information, the account can still be opened (for unsolicited trades); the rep simply can't justify recommendations.<\/p>\n<h3 id=\"s13-2-3\" data-sec=\"s13-2-3\"><span class=\"secnum\">13.2.3<\/span> Account opening<\/h3>\n<p><strong>Steps.<\/strong><\/p>\n<ol>\n<li>Rep collects the required/optional information on the <strong>new account form<\/strong>.<\/li>\n<li>A <strong>principal<\/strong> reviews and <strong>approves<\/strong> the account (signature) — before or promptly after the first trade. No principal signature = no account.<\/li>\n<li>For <strong>margin<\/strong> accounts: customer signs the <strong>margin agreement<\/strong> (credit agreement, hypothecation agreement, loan consent) and receives the margin risk disclosure.<\/li>\n<li>For <strong>options<\/strong> accounts: customer receives the <strong>ODD<\/strong>, a Registered Options Principal (ROP) approves, and the customer signs the <strong>options agreement within 15 days<\/strong> of approval.<\/li>\n<li>For <strong>discretionary<\/strong> accounts: written <strong>power of attorney/trading authorization<\/strong> from the customer and principal approval.<\/li>\n<li>Firm delivers the account record copy, SIPC and BrokerCheck notices, and (for margin) the margin disclosure.<\/li>\n<\/ol>\n<p><strong>Numbered accounts.<\/strong> A customer may use a number or symbol instead of a name on the account for privacy, but the firm must keep a <strong>signed statement of ownership<\/strong> on file.<\/p>\n<p><strong>Cash account<\/strong> — the customer must pay in full for each purchase by the Reg T deadline (S+2). Most accounts. <strong>Margin account<\/strong> — the customer borrows part of the purchase price from the firm (13.4).<\/p>\n<p><strong>Restrictions and red flags.<\/strong> Firms may refuse to open an account. Accounts for <strong>employees of other FINRA firms<\/strong> require prior written notice to the employer. Accounts for <strong>minors<\/strong> must be custodial. <strong>Institutional<\/strong> accounts (banks, insurers, RIAs, entities with ≥ $50 million) have modified suitability obligations.<\/p>\n<p><strong>Anti-money laundering (AML) at account opening.<\/strong> Firms must have an AML program (written policies, a designated AML compliance officer, annual independent testing, ongoing training, and customer due diligence). <strong>Suspicious activity reports (SARs)<\/strong> are filed with <strong>FinCEN<\/strong> for suspicious transactions of <strong>$5,000+<\/strong> within <strong>30 days<\/strong>, and the customer must not be told. <strong>Currency transaction reports (CTRs)<\/strong> are filed for cash transactions over <strong>$10,000<\/strong> in a day. Money laundering has three stages: <strong>placement<\/strong> (cash enters the system), <strong>layering<\/strong> (complex transfers to hide the trail), <strong>integration<\/strong> (funds return looking legitimate). <strong>Structuring<\/strong> (breaking deposits into sub-$10,000 pieces to avoid CTRs) is illegal.<\/p>\n<hr />\n<h2 id=\"s13-3\" data-sec=\"s13-3\"><span class=\"secnum\">13.3<\/span> Account registrations<\/h2>\n<h3 id=\"s13-3-1\" data-sec=\"s13-3-1\"><span class=\"secnum\">13.3.1<\/span> Individual accounts<\/h3>\n<p>One owner, who alone can trade, deposit and withdraw. On death, the account becomes part of the owner's <strong>estate<\/strong> (probate) unless a <strong>transfer-on-death (TOD)<\/strong> designation names a beneficiary, which passes the assets directly. Only the owner can give instructions (unless a third-party trading authorization is on file).<\/p>\n<h3 id=\"s13-3-2\" data-sec=\"s13-3-2\"><span class=\"secnum\">13.3.2<\/span> Joint accounts<\/h3>\n<p>Two or more owners; each has full authority to trade. All owners sign the joint account agreement; checks must be payable to <strong>all<\/strong> owners (or the account title), never to one owner alone. Two main forms:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Joint tenants with right of survivorship (JTWROS)<\/strong><\/th>\n<th><strong>Tenants in common (TIC / JTIC)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ownership<\/td>\n<td>Equal and undivided<\/td>\n<td>May be <strong>unequal<\/strong> percentages (e.g., 70/30)<\/td>\n<\/tr>\n<tr>\n<td>At death of one owner<\/td>\n<td>The deceased's share passes <strong>to the surviving owner(s)<\/strong> automatically, bypassing probate<\/td>\n<td>The deceased's share passes to the deceased's <strong>estate<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Typical users<\/td>\n<td>Married couples<\/td>\n<td>Business partners, unrelated investors<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Other forms: <strong>tenancy by the entirety<\/strong> (married couples in some states — creditor protection), <strong>community property<\/strong> (in community property states, assets acquired during marriage are owned 50/50).<\/p>\n<h3 id=\"s13-3-3\" data-sec=\"s13-3-3\"><span class=\"secnum\">13.3.3<\/span> Power of attorney<\/h3>\n<p>A customer may authorize a <strong>third party<\/strong> to act on the account:<\/p>\n<ul>\n<li><strong>Limited (trading) authorization<\/strong> — the third party may <strong>trade<\/strong> but <strong>not withdraw<\/strong> assets.<\/li>\n<li><strong>Full power of attorney<\/strong> — the third party may trade <strong>and<\/strong> withdraw/transfer assets.<\/li>\n<li>A <strong>durable<\/strong> power of attorney remains in effect if the customer becomes incapacitated; a non-durable POA ends at incapacity. <strong>All POAs end at the customer's death<\/strong> — the executor then controls the estate.<\/li>\n<li>Must be in <strong>writing<\/strong>, signed by the customer, and kept on file. The firm may require its own form.<\/li>\n<\/ul>\n<h3 id=\"s13-3-4\" data-sec=\"s13-3-4\"><span class=\"secnum\">13.3.4<\/span> Discretionary accounts<\/h3>\n<p>An account in which the <strong>registered representative<\/strong> decides <strong>what security, whether to buy or sell, and how much<\/strong> without checking with the customer on each trade. Requirements:<\/p>\n<ul>\n<li><strong>Written trading authorization (power of attorney)<\/strong> from the customer <strong>before<\/strong> any discretionary trade.<\/li>\n<li><strong>Principal approval<\/strong> of the account, and a principal must <strong>review each discretionary order promptly<\/strong> (frequently reviewed to detect churning).<\/li>\n<li>Each order ticket must be <strong>marked \"discretionary.\"<\/strong><\/li>\n<li>Choosing only the <strong>time or price<\/strong> of an order the customer has already specified (security, action, amount) is <strong>not<\/strong> discretion and needs no written authority (it's a \"not-held\" order, good for the day).<\/li>\n<li>Discretion must still be exercised suitably; excessive trading in a discretionary account is <strong>churning<\/strong>.<\/li>\n<li>Investment advisers often have discretion under their advisory agreement; broker-dealers' reps need the firm's approval.<\/li>\n<\/ul>\n<h3 id=\"s13-3-5\" data-sec=\"s13-3-5\"><span class=\"secnum\">13.3.5<\/span> Custodial accounts<\/h3>\n<p>Accounts for <strong>minors<\/strong> (who cannot legally enter contracts) under the <strong>Uniform Gifts to Minors Act (UGMA)<\/strong> or the <strong>Uniform Transfers to Minors Act (UTMA)<\/strong> — state laws.<\/p>\n<ul>\n<li><strong>One custodian, one minor<\/strong> per account. The custodian (any adult; needn't be a parent) manages the account; the <strong>minor is the beneficial owner<\/strong> and the account uses the <strong>minor's Social Security number<\/strong> (taxes are the minor's, with kiddie-tax rules).<\/li>\n<li>Gifts are <strong>irrevocable<\/strong> — once given, the money belongs to the minor and can't be taken back. Anyone may give; there's no limit, but gifts above the annual exclusion ($19,000 in 2026) have gift-tax consequences for the donor.<\/li>\n<li>The custodian has a <strong>fiduciary duty<\/strong>: invest prudently, no margin, no options writing (long options may be prohibited by firm policy), no speculative trading, may not commingle with their own assets. Custodian may be reimbursed for reasonable expenses but may not profit.<\/li>\n<li>Can be used for the minor's benefit but not for parental support obligations.<\/li>\n<li>The minor receives the assets at the <strong>age of majority<\/strong> (UGMA: 18; UTMA: <strong>up to 21 or 25<\/strong>, depending on the state) — the account is then re-registered in their name. UTMA allows a broader range of assets (real estate, etc.).<\/li>\n<li>Only the custodian may give instructions; a third-party trading authorization is not allowed; registration is \"[Custodian] as custodian for [Minor] under the [State] UTMA.\"<\/li>\n<\/ul>\n<h3 id=\"s13-3-6\" data-sec=\"s13-3-6\"><span class=\"secnum\">13.3.6<\/span> Guardianship accounts<\/h3>\n<p>Opened for a person a court has declared unable to manage their affairs — a <strong>minor without a custodian<\/strong> (e.g., after an inheritance) or an <strong>incompetent adult<\/strong>. The <strong>court-appointed guardian (or conservator)<\/strong> controls the account and must provide the <strong>court appointment documents<\/strong>, which typically expire and must be renewed. The guardian is a fiduciary bound by the court's rules. Similar fiduciary accounts: <strong>executor/administrator<\/strong> accounts for estates (requires letters testamentary and a tax ID for the estate), <strong>receiver<\/strong> in bankruptcy.<\/p>\n<h3 id=\"s13-3-7\" data-sec=\"s13-3-7\"><span class=\"secnum\">13.3.7<\/span> Trust accounts<\/h3>\n<p>A <strong>trust<\/strong> holds assets for the benefit of <strong>beneficiaries<\/strong>, managed by a <strong>trustee<\/strong> under the <strong>trust document<\/strong>. The firm needs a copy of the trust (or a trustee certification) showing the trustee's authority, the type of trust, and the tax ID.<\/p>\n<ul>\n<li><strong>Revocable (living) trust<\/strong> — the grantor can change or revoke it; assets are still in the grantor's taxable estate; avoids probate.<\/li>\n<li><strong>Irrevocable trust<\/strong> — can't be changed; assets are removed from the grantor's estate (estate-tax planning); the trust is a separate taxpayer.<\/li>\n<li><strong>Testamentary trust<\/strong> — created by a will at death.<\/li>\n<li>The trustee is a <strong>fiduciary<\/strong> governed by the <strong>prudent investor rule<\/strong> (diversify, reasonable risk, act solely for beneficiaries). Margin and options are generally prohibited unless the trust document specifically permits them.<\/li>\n<\/ul>\n<h3 id=\"s13-3-8\" data-sec=\"s13-3-8\"><span class=\"secnum\">13.3.8<\/span> Business accounts<\/h3>\n<ul>\n<li><strong>Sole proprietorship<\/strong> — treated like an individual account in the owner's name d/b/a the business.<\/li>\n<li><strong>Partnership<\/strong> — the firm needs the <strong>partnership agreement<\/strong> showing which partners may trade and whether margin is permitted; general partners are liable.<\/li>\n<li><strong>Corporation<\/strong> — requires a <strong>corporate resolution<\/strong> (naming the officers authorized to trade) and, for margin or options, the <strong>corporate charter/bylaws<\/strong> showing the corporation is permitted to do so. Corporate accounts use the company's EIN.<\/li>\n<li><strong>LLC<\/strong> — operating agreement and resolution.<\/li>\n<li><strong>Unincorporated association / investment club<\/strong> — agreement naming authorized persons; no breakpoints for clubs.<\/li>\n<li><strong>Institutional accounts<\/strong> (banks, insurers, investment companies, RIAs, any entity with ≥ $50 million in assets) — a rep may rely on the institution's own judgment for suitability if the institution affirmatively says it is exercising independent judgment.<\/li>\n<\/ul>\n<h3 id=\"s13-3-9\" data-sec=\"s13-3-9\"><span class=\"secnum\">13.3.9<\/span> Prime brokerage accounts<\/h3>\n<p>Used by <strong>hedge funds and large institutions<\/strong>: the client trades through <strong>multiple executing brokers<\/strong> but <strong>settles and custodies everything with one prime broker<\/strong>, which also provides margin lending, securities lending for short sales, reporting and other services. The client signs a prime brokerage agreement; executing brokers give up trades to the prime broker for settlement. A <strong>DVP/RVP (delivery vs. payment / receive vs. payment)<\/strong> account is a related institutional arrangement in which the customer's custodian bank pays for securities on delivery — a form of cash account with no money held at the broker-dealer.<\/p>\n<p><strong>Other account arrangements to recognize:<\/strong> <strong>fee-based (wrap) accounts<\/strong> (one asset-based fee covers advice and trading — must be suitable for active traders, not buy-and-hold investors who'd pay less in commissions); <strong>advisory accounts<\/strong> (managed by an RIA); <strong>day-trading accounts<\/strong> (special disclosure and $25,000 minimum equity for pattern day traders); <strong>TOD/POD<\/strong> designations; <strong>transfer via ACATS<\/strong> (Automated Customer Account Transfer Service — the receiving firm sends a transfer initiation form; the delivering firm must validate or take exception within <strong>1 business day<\/strong> and complete the transfer within <strong>3 business days<\/strong> after validation).<\/p>\n<hr />\n<h2 id=\"s13-4\" data-sec=\"s13-4\"><span class=\"secnum\">13.4<\/span> Margin accounts<\/h2>\n<h3 id=\"s13-4-1\" data-sec=\"s13-4-1\"><span class=\"secnum\">13.4.1<\/span> Overview<\/h3>\n<p>A <strong>margin account<\/strong> lets a customer <strong>borrow part of the purchase price<\/strong> of securities from the broker-dealer, using the securities as collateral. Margin magnifies both gains and losses (leverage). Rules come from three layers:<\/p>\n<ol>\n<li><strong>The Federal Reserve — Regulation T<\/strong> (under the 1934 Act): initial margin for purchases = <strong>50%<\/strong> of the purchase price for most securities; payment due by <strong>S+2<\/strong> (two business days after settlement, i.e., T+3). Also defines which securities are marginable.<\/li>\n<li><strong>FINRA / exchange rules<\/strong> — <strong>minimum initial deposit<\/strong> of <strong>$2,000<\/strong> (or 100% of the purchase if less) and <strong>maintenance margin<\/strong> (<strong>25%<\/strong> long, <strong>30%<\/strong> short).<\/li>\n<li><strong>House rules<\/strong> — firms may set stricter (higher) requirements, often 30–35% maintenance.<\/li>\n<\/ol>\n<p><strong>Marginable securities:<\/strong> exchange-listed and Nasdaq stocks, most OTC stocks on the margin list, corporate/muni/government bonds (with lower requirements), mutual funds after <strong>30 days<\/strong> of ownership (new mutual fund purchases and new issues/IPOs cannot be bought on margin until 30 days after). <strong>Options<\/strong> (except LEAPS with &gt; 9 months) must be paid in full. Penny stocks and most low-priced OTC stocks are not marginable.<\/p>\n<p><strong>Why margin?<\/strong> Leverage — more buying power — and the ability to <strong>sell short<\/strong> (which must be done in a margin account). <strong>Risks:<\/strong> losses can exceed the initial investment; the firm can sell securities without notice (margin call) and chooses which; interest accrues on the loan; the customer isn't entitled to an extension of time on a call.<\/p>\n<h3 id=\"s13-4-2\" data-sec=\"s13-4-2\"><span class=\"secnum\">13.4.2<\/span> Opening a margin account<\/h3>\n<p>The customer signs the <strong>margin agreement<\/strong>, which has three parts:<\/p>\n<table>\n<thead>\n<tr>\n<th>Agreement<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Credit agreement<\/strong><\/td>\n<td>Terms of the loan — interest rate (based on the <strong>broker call rate<\/strong> plus a spread) and how it's computed<\/td>\n<\/tr>\n<tr>\n<td><strong>Hypothecation agreement<\/strong><\/td>\n<td>Customer <strong>pledges (hypothecates)<\/strong> the securities as collateral; permits the firm to <strong>rehypothecate<\/strong> (re-pledge) up to <strong>140% of the debit balance<\/strong> to a bank to finance the loan<\/td>\n<\/tr>\n<tr>\n<td><strong>Loan consent form<\/strong> (optional)<\/td>\n<td>Allows the firm to <strong>lend the customer's securities to other customers<\/strong> for short sales. Customer may decline to sign this part.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Also required: <strong>margin risk disclosure statement<\/strong> delivered at or before opening and <strong>annually<\/strong> thereafter; principal approval; margin account securities are held in <strong>street name<\/strong>. Who <strong>cannot<\/strong> open a margin account: <strong>custodial (UGMA/UTMA) accounts<\/strong>, most fiduciary/trust accounts (unless the document permits), <strong>retirement accounts (IRAs)<\/strong>, and minors.<\/p>\n<h3 id=\"s13-4-3\" data-sec=\"s13-4-3\"><span class=\"secnum\">13.4.3<\/span> Deposit requirements<\/h3>\n<p><strong>Long purchase.<\/strong> Reg T initial = <strong>50%<\/strong> of the market value. Minimum initial deposit = <strong>$2,000<\/strong> (FINRA), unless the full purchase price is less than $2,000 — then pay in full.<\/p>\n<ul>\n<li>Buy $10,000 of stock → deposit $5,000; the firm lends $5,000 (the <strong>debit balance<\/strong>).<\/li>\n<li>Buy $3,000 of stock → 50% is $1,500, but the $2,000 minimum applies → deposit <strong>$2,000<\/strong>.<\/li>\n<li>Buy $1,500 of stock → pay the full <strong>$1,500<\/strong> (can't deposit more than the price).<\/li>\n<\/ul>\n<p><strong>Short sale.<\/strong> Reg T initial = <strong>50%<\/strong> of the short sale proceeds, deposited in addition to the proceeds, which are held by the firm. Short $10,000 → the account holds $10,000 proceeds + $5,000 deposit = $15,000 <strong>credit balance<\/strong>. Minimum $2,000 applies.<\/p>\n<p><strong>Meeting a Reg T call.<\/strong> Deposit <strong>cash<\/strong> for the full amount, or deposit <strong>fully paid marginable securities<\/strong> worth <strong>twice<\/strong> the call (because the securities themselves can only be margined at 50%). Calls must be met by <strong>S+2<\/strong>; the firm may request an extension from FINRA (for exceptional circumstances), otherwise it sells out the position and freezes the account for <strong>90 days<\/strong>.<\/p>\n<p><strong>Other initial requirements (FINRA):<\/strong> Treasury securities — a small percentage of market value based on maturity (e.g., 1–6%); municipal bonds — the greater of 7% of face or 15% of market value; investment-grade corporate bonds — 20–25%.<\/p>\n<h3 id=\"s13-4-4\" data-sec=\"s13-4-4\"><span class=\"secnum\">13.4.4<\/span> Equity<\/h3>\n<p><strong>Long account.<\/strong><\/p>\n<pre><code>Long market value (LMV) − Debit balance (DR) = Equity (EQ)\n<\/code><\/pre>\n<p>Equity is the customer's ownership in the account — what they'd have if everything were sold and the loan repaid. The debit balance is <strong>fixed<\/strong> (except for interest and new transactions); as the market value changes, equity changes dollar for dollar.<\/p>\n<p><strong>Example.<\/strong> Buy $20,000 of stock with a $10,000 deposit → LMV $20,000, DR $10,000, EQ $10,000 (50%). If the stock rises to $24,000 → EQ $14,000. If it falls to $16,000 → EQ $6,000.<\/p>\n<ul>\n<li><strong>Excess equity (SMA — special memorandum account).<\/strong> When the market value rises, equity above the 50% Reg T requirement becomes excess equity, credited to <strong>SMA<\/strong>, a line of credit the customer can withdraw as cash or use to buy more securities (<strong>buying power = SMA × 2<\/strong>). With LMV $24,000 and DR $10,000, the Reg T requirement is $12,000, so excess = $2,000 → buying power $4,000. SMA, once created, does not go away when the market falls (it can only be used if it won't violate maintenance).<\/li>\n<li><strong>Restricted account.<\/strong> If equity falls <strong>below 50%<\/strong> (but above maintenance), the account is restricted — no Reg T call, but new purchases require 50% of the new purchase, and sales of securities require that <strong>50% of proceeds<\/strong> be retained to reduce the debit (the \"retention requirement\"); the other 50% may be withdrawn.<\/li>\n<\/ul>\n<p><strong>Short account.<\/strong><\/p>\n<pre><code>Credit balance (CR) − Short market value (SMV) = Equity\n<\/code><\/pre>\n<p>Short $10,000 with $5,000 deposit → CR $15,000, SMV $10,000, EQ $5,000. If the stock <strong>rises<\/strong> to $12,000 → EQ $3,000 (losing). If it <strong>falls<\/strong> to $8,000 → EQ $7,000 (winning). The credit balance is fixed; equity moves inversely to the stock.<\/p>\n<p><strong>Combined accounts<\/strong> net the long and short sides. Interest is charged on the debit balance only.<\/p>\n<h3 id=\"s13-4-5\" data-sec=\"s13-4-5\"><span class=\"secnum\">13.4.5<\/span> Minimum maintenance<\/h3>\n<p>To keep the loan protected, equity must never fall below the <strong>maintenance requirement<\/strong>:<\/p>\n<ul>\n<li><strong>Long accounts: 25%<\/strong> of the long market value (FINRA minimum; houses often use 30%+).<\/li>\n<li><strong>Short accounts: 30%<\/strong> of the short market value (higher because losses are unlimited). Special minimums for low-priced shorts: <strong>$2.50/share or 100%<\/strong> of market value (whichever is greater) for stocks under $5; <strong>$5/share or 30%<\/strong> for stocks $5 and above.<\/li>\n<\/ul>\n<p>If equity drops below maintenance, the firm issues a <strong>maintenance (house) call<\/strong>, which must be met <strong>promptly<\/strong> (firms' policies typically give a few days) by depositing cash, depositing marginable securities (worth 1÷0.75 ≈ 1.33× the call, since 25% of the deposit's value is retained as margin), or selling securities (at 25% maintenance, selling securities worth 4× the call amount cures it, because the proceeds reduce the debit). The firm may liquidate without notice.<\/p>\n<p><strong>Shortcut formulas.<\/strong><\/p>\n<ul>\n<li>Long account: the market value at which a maintenance call occurs = <strong>Debit balance ÷ 0.75<\/strong> (i.e., debit ÷ (1 − 25%)). For DR $10,000: LMV below $13,333 triggers a call.<\/li>\n<li>Short account at 30%: market value at which a call occurs = <strong>Credit balance ÷ 1.30<\/strong>. For CR $15,000: SMV above $11,538 triggers a call.<\/li>\n<li>Maintenance call amount = required equity − actual equity.<\/li>\n<\/ul>\n<p><strong>Example.<\/strong> LMV $12,000, DR $10,000 → EQ $2,000. Required at 25% = $3,000. <strong>Maintenance call = $1,000.<\/strong><\/p>\n<p><strong>Pattern day trader rule.<\/strong> A customer who makes <strong>4 or more day trades in 5 business days<\/strong> (and those trades are &gt; 6% of total trades) in a margin account is a pattern day trader and must maintain <strong>$25,000 minimum equity<\/strong>; day-trading buying power is 4× maintenance excess.<\/p>\n<p><strong>Portfolio margin<\/strong> — a risk-based alternative for sophisticated customers with lower requirements; needs special approval.<\/p>\n<hr />\n<h2 id=\"s13-5\" data-sec=\"s13-5\"><span class=\"secnum\">13.5<\/span> Options accounts<\/h2>\n<p>Because options carry special risks, opening an options account has extra steps (FINRA Rule 2360):<\/p>\n<ol>\n<li>The rep gathers the customer's financial information, investment experience and objectives, and determines what level of option trading is suitable (firms use approval levels: e.g., Level 1 covered calls → Level 2 long calls/puts → Level 3 spreads → Level 4 uncovered writing).<\/li>\n<li>The customer receives the <strong>Options Disclosure Document (ODD)<\/strong> — <em>Characteristics and Risks of Standardized Options<\/em> — <strong>at or before<\/strong> the account is approved.<\/li>\n<li>A <strong>Registered Options Principal (ROP)<\/strong> or a designated branch manager <strong>approves<\/strong> the account in writing (the account may not be approved by the rep alone). The approval must be documented.<\/li>\n<li>The customer signs and returns the <strong>options agreement<\/strong> (acknowledging the ODD and agreeing to abide by position/exercise limits and the firm's rules) <strong>within 15 days<\/strong> of account approval. If not returned, the customer may <strong>only close<\/strong> existing positions — no new opening transactions.<\/li>\n<li>Each options recommendation must be suitable, and each options order must be approved by an ROP/principal promptly.<\/li>\n<\/ol>\n<p><strong>Uncovered writing<\/strong> requires a margin account and the highest approval level; a special written statement
