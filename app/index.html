rm supervises and retains it. Firms must retain all business communications (including texts, if used for business) for 3 years.<\/li>\n<li><strong>Recommendations in communications<\/strong> trigger disclosures of the price at the time, the firm's market-making status and ownership, and the availability of supporting information.<\/li>\n<li><strong>Public appearances<\/strong> (seminars, TV interviews, radio) — not pre-approval unless scripted, but subject to supervision and content standards; written materials used at a seminar are retail communications.<\/li>\n<li><strong>Electronic communications/email<\/strong> — correspondence; firms must retain and review a sample.<\/li>\n<li><strong>Record retention for communications:<\/strong> <strong>3 years<\/strong> (first 2 in an easily accessible place), including the name of the approving principal and the dates of first and last use.<\/li>\n<li>Research reports have extra rules (Rule 2241): analysts' independence from investment banking, quiet periods after IPOs (10 days) and before/after lock-up expirations, disclosure of ratings distribution and price charts.<\/li>\n<li><strong>Testimonials and \"endorsements\"<\/strong> in investment adviser advertising are now permitted under the SEC's Marketing Rule with disclosures.<\/li>\n<li>Using <strong>FINRA's name<\/strong>: a firm may say it is a FINRA member and must display the FINRA hyperlink on its website, but may not imply FINRA endorsement.<\/li>\n<li>A <strong>\"guarantee\"<\/strong> language or \"no risk\" claims are prohibited; \"<strong>principal-protected<\/strong>\" products must explain the issuer's credit risk.<\/li>\n<\/ul>\n<h3 id=\"s15-4-4\" data-sec=\"s15-4-4\"><span class=\"secnum\">15.4.4<\/span> Proxy rules<\/h3>\n<p>A <strong>proxy<\/strong> is a written authorization that allows a shareholder's shares to be voted at a meeting without attending. Proxy solicitation is regulated by the SEC under the 1934 Act (Section 14):<\/p>\n<ul>\n<li>Companies must file <strong>proxy statements<\/strong> with the SEC and send them to shareholders before soliciting votes; they disclose the matters to be voted on (election of directors, auditor ratification, mergers, executive compensation \"say-on-pay,\" shareholder proposals), the board's recommendations, and executive compensation.<\/li>\n<li>Shares held in <strong>street name<\/strong> are legally owned by the broker-dealer. The firm must <strong>forward proxy materials and annual reports<\/strong> to the beneficial owners (the issuer pays the costs), and must vote as the customer directs. If the customer <strong>doesn't respond<\/strong> by a deadline (typically 10 days before the meeting), the firm may vote the shares <strong>only on routine matters<\/strong> (uncontested director elections are no longer \"routine\"; auditor ratification is) — not on contested elections, mergers, or compensation.<\/li>\n<li><strong>Proxy fights (contests)<\/strong> — competing groups solicit proxies for different board slates; the dissidents must also file with the SEC. Firms must forward dissident materials if the dissidents pay.<\/li>\n<li>Shareholder proposals meeting SEC thresholds must be included in the proxy.<\/li>\n<li>A shareholder may revoke a proxy by giving a later proxy or by voting in person.<\/li>\n<li>Registered reps may not <strong>solicit proxies<\/strong> for a company outside the normal forwarding process without the firm's approval; they also may not vote customer shares themselves.<\/li>\n<\/ul>\n<h3 id=\"s15-4-5\" data-sec=\"s15-4-5\"><span class=\"secnum\">15.4.5<\/span> Licenses &amp; CE<\/h3>\n<p><strong>Registration.<\/strong> To work in the securities business as a rep or principal you must be <strong>associated with a FINRA member firm<\/strong>, pass the required exams, and be registered by the firm through <strong>Form U4<\/strong> filed on <strong>CRD<\/strong>. Form U4 collects personal history, employment (10 years), residences (5 years), disciplinary history, criminal history, bankruptcies, liens, customer complaints, outside business activities; it requires <strong>fingerprinting<\/strong> and a <strong>background check<\/strong> by the firm. Any material change must be amended <strong>within 30 days<\/strong>. <strong>Form U5<\/strong> is filed within 30 days when a rep leaves; the firm must give the rep a copy and must be truthful (rep can't be forced to sign a U5). Registration transfers to a new firm via a new U4; the new firm reviews the U5 within 60 days of filing a U4.<\/p>\n<p><strong>Exams.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Exam<\/th>\n<th>Purpose<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SIE (Securities Industry Essentials)<\/strong><\/td>\n<td>Basic industry knowledge — a <strong>co-requisite<\/strong> for all representative-level exams<\/td>\n<td>Can be taken by <strong>anyone 18+ without sponsorship<\/strong>; <strong>75 questions<\/strong> (plus 10 unscored), <strong>1 hour 45 minutes<\/strong>, passing score <strong>70<\/strong>, fee $100 as of 2026; results valid <strong>4 years<\/strong> (you must pass a top-off exam and register within 4 years to keep credit). Passing the SIE alone does <strong>not<\/strong> make you registered or allow you to do any securities business.<\/td>\n<\/tr>\n<tr>\n<td><strong>Series 6<\/strong><\/td>\n<td>Investment company and variable contracts rep — mutual funds, variable annuities/life, UITs; <strong>cannot<\/strong> sell individual stocks/bonds or options<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 7<\/strong><\/td>\n<td>General securities rep — virtually all products (stocks, bonds, options, funds, munis, DPPs, VAs); not commodities/futures<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 22<\/strong><\/td>\n<td>DPP rep<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 57<\/strong><\/td>\n<td>Equity trader<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 79<\/strong><\/td>\n<td>Investment banking rep<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 82<\/strong><\/td>\n<td>Private securities offerings rep<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 86/87<\/strong><\/td>\n<td>Research analyst<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 99<\/strong><\/td>\n<td>Operations professional<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 3<\/strong><\/td>\n<td>Commodities/futures (NFA)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 63<\/strong><\/td>\n<td>State agent exam (Uniform Securities Agent) — required by most states in addition to FINRA registration<\/td>\n<td>NASAA<\/td>\n<\/tr>\n<tr>\n<td><strong>Series 65<\/strong><\/td>\n<td>Investment adviser representative (state law)<\/td>\n<td>NASAA<\/td>\n<\/tr>\n<tr>\n<td><strong>Series 66<\/strong><\/td>\n<td>Combined 63 + 65 (requires the Series 7)<\/td>\n<td>NASAA<\/td>\n<\/tr>\n<tr>\n<td><strong>Series 24<\/strong><\/td>\n<td>General securities principal (supervises reps)<\/td>\n<td>Principal exams require a rep registration first<\/td>\n<\/tr>\n<tr>\n<td><strong>Series 26<\/strong><\/td>\n<td>Investment company products principal<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 4<\/strong><\/td>\n<td>Registered options principal<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 9/10<\/strong><\/td>\n<td>General securities sales supervisor<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 27/28<\/strong><\/td>\n<td>Financial and operations principal (FINOP)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Series 53<\/strong><\/td>\n<td>Municipal securities principal<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Waiting periods for failed exams:<\/strong> <strong>30 days<\/strong> after the first and second failures; <strong>180 days<\/strong> after the third and each subsequent failure (applies to SIE and top-off exams).<\/p>\n<p><strong>Who must register.<\/strong> Anyone who solicits, sells, or gives advice on securities, or supervises those who do, must be registered. <strong>Exempt:<\/strong> purely <strong>clerical/ministerial<\/strong> employees (though they can't take orders or discuss investments), persons whose functions are related solely to the firm's non-securities business, and persons who only handle transactions on an exchange floor (register with the exchange). A person can be registered only with the firm(s) that sponsor them (dual registration requires both firms' consent). <strong>Unregistered persons may not<\/strong> receive transaction-based compensation, take customer orders, qualify prospects, discuss products, or be paid referral fees beyond a nominal fixed amount — and reps may not <strong>share commissions<\/strong> with unregistered persons (including unregistered assistants and, after they've left the industry, former reps except under a pre-existing written continuing commission agreement).<\/p>\n<p><strong>Permissive registration<\/strong> — firms may now register employees (e.g., back office) even if they don't perform registered functions, subject to the same rules and CE.<\/p>\n<p><strong>Maintaining qualifications (MQP).<\/strong> A person whose registration lapses can keep their exam qualifications <strong>up to 5 years<\/strong> by completing annual CE while unregistered (Financial Services Affiliate Waiver and the MQP program). Otherwise, registration lapses after <strong>2 years<\/strong> out of the industry and the exams must be retaken (the SIE itself stays valid 4 years).<\/p>\n<p><strong>Continuing education (FINRA Rule 1240).<\/strong><\/p>\n<ul>\n<li><strong>Regulatory Element<\/strong> — FINRA's online training on regulatory, compliance and ethics topics, now required <strong>annually<\/strong> (by December 31) for every registered person; failure makes the registration <strong>inactive<\/strong> (can't do business or get paid) until completed; after 2 years inactive, the registration is terminated.<\/li>\n<li><strong>Firm Element<\/strong> — the <strong>firm's own annual training program<\/strong>, based on an annual <strong>needs analysis<\/strong> and a written training plan, covering products, sales practices, regulatory developments and ethics; required of all registered persons who have customer contact or supervise; the firm keeps records.<\/li>\n<\/ul>\n<p><strong>Statutory disqualification.<\/strong> A person is disqualified from associating with a member if, among other things, within the past <strong>10 years<\/strong> they were convicted of <strong>any felony<\/strong> or a <strong>securities/money-related misdemeanor<\/strong> (fraud, theft, forgery, perjury, bribery), are subject to a regulator's bar/suspension or expulsion, or willfully made a false statement on a registration application. A firm wanting to hire a disqualified person must get FINRA's approval (an \"eligibility proceeding,\" Form MC-400).<\/p>\n<p><strong>Fingerprinting:<\/strong> all registered persons and most employees handling cash/securities must be fingerprinted (checked against FBI records).<\/p>\n<h3 id=\"s15-4-6\" data-sec=\"s15-4-6\"><span class=\"secnum\">15.4.6<\/span> Registered representative rules<\/h3>\n<p><strong>Regulation Best Interest (Reg BI).<\/strong> When a broker-dealer or rep makes a <strong>recommendation<\/strong> of a security, strategy, or account type (including rollovers) to a <strong>retail customer<\/strong>, they must act in the customer's <strong>best interest<\/strong> at the time of the recommendation, <strong>without placing the financial or other interest of the firm or rep ahead of the customer's<\/strong>. Four obligations:<\/p>\n<ol>\n<li><strong>Disclosure<\/strong> — before or at the time of the recommendation, disclose in writing all material facts about the relationship and the recommendation: capacity (BD vs. IA), fees and costs, type and scope of services, <strong>conflicts of interest<\/strong>, and limitations (e.g., proprietary products only). The <strong>Form CRS (customer relationship summary)<\/strong> — a short plain-English document — must be delivered to retail customers at or before the earliest of a recommendation, order, or account opening.<\/li>\n<li><strong>Care<\/strong> — understand the risks, rewards and costs of the recommendation (reasonable-basis), have a reasonable basis to believe it's in the <strong>specific customer's<\/strong> best interest based on their investment profile (customer-specific), and not recommend a <strong>series<\/strong> of transactions that is excessive (quantitative — churning). Cost is always a factor, though not the only one.<\/li>\n<li><strong>Conflict of interest<\/strong> — the firm must have written policies to <strong>identify and disclose (or eliminate)<\/strong> conflicts; must <strong>mitigate<\/strong> conflicts that create incentives for reps to place their interests ahead of the customer's; must disclose and mitigate limitations like proprietary-only menus; and must <strong>eliminate<\/strong> sales contests, quotas, bonuses and non-cash compensation based on sales of <strong>specific securities or types of securities<\/strong> within a limited period.<\/li>\n<li><strong>Compliance<\/strong> — written policies and procedures reasonably designed to achieve compliance with Reg BI.<\/li>\n<\/ol>\n<p>Reg BI does <strong>not<\/strong> make a broker-dealer a fiduciary on an ongoing basis (no duty to monitor unless agreed), and it doesn't apply to institutional customers (FINRA's <strong>suitability rule 2111<\/strong> still covers them) or to unsolicited trades. The three suitability components (reasonable-basis, customer-specific, quantitative) still apply under Rule 2111.<\/p>\n<p><strong>Investment profile<\/strong> considered: age, other investments, financial situation and needs, tax status, objectives, experience, time horizon, liquidity needs, risk tolerance, and anything else the customer discloses.<\/p>\n<p><strong>Know-your-customer (Rule 2090):<\/strong> use reasonable diligence to know the essential facts about every customer and the authority of each person acting for them, at opening and throughout the relationship.<\/p>\n<p><strong>Outside business activities (Rule 3270).<\/strong> A registered person must give <strong>prior written notice<\/strong> to the firm before engaging in <strong>any<\/strong> business activity outside the firm for compensation (a second job, a board seat, rental real estate business, selling insurance through another entity). The firm evaluates whether it interferes with the rep's duties or could be viewed by customers as part of the firm's business and may limit or prohibit it. Passive investments aren't OBAs.<\/p>\n<p><strong>Private securities transactions / selling away (Rule 3280).<\/strong> Any securities transaction <strong>outside the regular scope<\/strong> of the rep's employment requires <strong>prior written notice<\/strong> to the firm describing the transaction, the rep's role, and whether compensation is involved. If the rep will be <strong>compensated<\/strong>, the firm must <strong>approve in writing<\/strong> and then <strong>supervise and record<\/strong> the transaction on its books as if it were the firm's own. If <strong>no compensation<\/strong>, the firm must acknowledge the notice and may impose conditions. Selling unregistered private placements or a friend's startup stock to customers without this is the classic \"selling away\" violation.<\/p>\n<p><strong>Personal accounts at other firms (Rule 3210).<\/strong> A registered person who opens an account at <strong>another<\/strong> broker-dealer (or has a beneficial interest in one — including a spouse's/dependent's account) must get <strong>prior written consent<\/strong> of their <strong>employer<\/strong>, and must notify the executing firm that they're associated with a member. The employer may request <strong>duplicate confirmations and statements<\/strong>. Accounts limited to mutual funds, VAs, UITs, or 529 plans are exempt.<\/p>\n<p><strong>Gifts and gratuities (Rule 3220).<\/strong> Business-related gifts to persons associated with <strong>another member firm or a customer<\/strong> are limited to <strong>$100 per person per year<\/strong> and must be recorded by the firm. Exclusions: <strong>business entertainment<\/strong> (meals, event tickets) where the giver <strong>attends<\/strong> and it's not so lavish as to be improper, promotional items of nominal value (logo pens, mugs), and personal gifts (wedding/baby gifts) clearly not business-related. <strong>Non-cash compensation<\/strong> from product sponsors (e.g., mutual fund wholesalers) is governed by separate rules: occasional meals/tickets OK, training/education meetings may be paid for only with firm approval and no guests, and sales contests must be based on total production across all products of a type, not a specific sponsor's product.<\/p>\n<p><strong>Borrowing from or lending to customers (Rule 3240).<\/strong> Prohibited unless the firm has written procedures permitting it <strong>and<\/strong> the customer is: an <strong>immediate family member<\/strong>; a <strong>financial institution<\/strong> in the business of lending; a <strong>registered person of the same firm<\/strong>; a person with a <strong>personal relationship<\/strong> outside the brokerage relationship; or a <strong>business relationship<\/strong> outside the brokerage relationship. The last three categories require <strong>notice to and approval by the firm<\/strong> in writing; immediate family and institutions do not (unless the firm requires it).<\/p>\n<p><strong>Sharing in customer accounts (Rule 2150).<\/strong> Only with <strong>prior written authorization<\/strong> of the firm and the customer, and the rep's share must be <strong>proportionate<\/strong> to their financial contribution (except with immediate family members). Guaranteeing against loss is <strong>always<\/strong> prohibited. The firm may not use customer securities without authorization (margin agreement).<\/p>\n<p><strong>Discretionary authority<\/strong> — written authorization + principal approval + review (Chapter 13).<\/p>\n<p><strong>Commissions and compensation.<\/strong> May be paid only to registered persons through the firm; cannot be paid to unregistered persons or to customers; a departed rep may receive continuing commissions only under a bona fide written contract entered into before leaving. <strong>Fee-based accounts<\/strong> must be appropriate for the customer's trading activity. Reps may not accept compensation from customers directly for securities advice without the firm's knowledge.<\/p>\n<p><strong>Political contributions (pay-to-play).<\/strong> MSRB <strong>G-37<\/strong> (muni dealers — $250 limit per election to candidates you can vote for; two-year ban) and SEC Rule 206(4)-5 (investment advisers — $350/$150 limits) restrict contributions to officials who can influence the award of business; FINRA Rule 2030 applies similar limits to member firms soliciting government entities for advisers.<\/p>\n<p><strong>Use of titles.<\/strong> A rep may not use misleading professional designations; \"financial adviser/planner\" titles require disclosure; \"senior specialist\" designations without substance are prohibited.<\/p>\n<p><strong>Supervision (Rule 3110).<\/strong> Every firm must have a <strong>written supervisory procedures (WSP)<\/strong> manual, designate principals responsible for supervising each type of business and each <strong>office of supervisory jurisdiction (OSJ)<\/strong>, review all correspondence and transactions, conduct an <strong>annual compliance meeting<\/strong> (can be virtual), inspect OSJs annually and branch offices periodically (non-supervisory branches every 3 years, supervisory branches annually), and conduct an <strong>annual compliance certification<\/strong> by the CEO. Firms must also have a <strong>compliance officer<\/strong> and an <strong>AML officer<\/strong>. Registered reps are supervised by principals; a principal must approve new accounts, discretionary orders, correspondence samples, retail communications and options accounts.<\/p>\n<h3 id=\"s15-4-7\" data-sec=\"s15-4-7\"><span class=\"secnum\">15.4.7<\/span> Record retention requirements<\/h3>\n<p>SEC Rules 17a-3/17a-4 and FINRA Rule 4511 dictate what broker-dealers must keep and for how long. Records must be kept for the required period, with the first <strong>2 years in an easily accessible place<\/strong>, and may be stored electronically (non-rewriteable, non-erasable \"WORM\" format or audit-trail systems).<\/p>\n<table>\n<thead>\n<tr>\n<th>Retention period<\/th>\n<th>Records<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lifetime of the firm (permanent)<\/strong><\/td>\n<td>Articles of incorporation/partnership agreements, <strong>minute books<\/strong>, stock certificate books, Form BD and amendments, FINRA membership agreement<\/td>\n<\/tr>\n<tr>\n<td><strong>6 years<\/strong><\/td>\n<td><strong>Blotters<\/strong> (daily records of all purchases, sales, receipts and deliveries of cash and securities), <strong>general ledger<\/strong>, <strong>customer ledgers (account records)<\/strong>, <strong>stock record<\/strong> (securities position ledger), <strong>customer account information / new account forms<\/strong> (6 years after the account is closed), designation records of principals<\/td>\n<\/tr>\n<tr>\n<td><strong>5 years<\/strong><\/td>\n<td><strong>Do-not-call records<\/strong>; <strong>AML/CIP identity-verification records<\/strong> (5 years after the account closes, under the Bank Secrecy Act)<\/td>\n<\/tr>\n<tr>\n<td><strong>4 years<\/strong><\/td>\n<td><strong>Customer complaints<\/strong> (and related records)<\/td>\n<\/tr>\n<tr>\n<td><strong>3 years<\/strong><\/td>\n<td><strong>Order tickets/memoranda<\/strong>, <strong>trade confirmations<\/strong>, <strong>trial balances and computations of net capital<\/strong>, <strong>employment applications and U4/U5 for terminated persons (3 years after termination)<\/strong>, <strong>communications with the public (retail communications, correspondence, institutional communications, including approval records)<\/strong>, advertising/sales literature, <strong>fingerprint cards<\/strong>, <strong>subsidiary ledgers<\/strong>, <strong>Form 144 records<\/strong>, gifts &amp; gratuities records, <strong>customer account statements<\/strong>, <strong>compliance/supervisory records (WSPs, annual compliance reports)<\/strong>, business continuity plan records, options agreements, margin agreements, <strong>FOCUS reports<\/strong>, checks/bank statements, records of associated persons' outside business activities<\/td>\n<\/tr>\n<tr>\n<td><strong>Until account closed + 6 years<\/strong><\/td>\n<td>Customer account records<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Simplified version the exam expects:<\/p>\n<ul>\n<li><strong>Forever:<\/strong> organizational documents, minutes, stock certificate books.<\/li>\n<li><strong>6 years:<\/strong> blotters, ledgers, stock record, account records/new account forms.<\/li>\n<li><strong>4 years:<\/strong> complaints.<\/li>\n<li><strong>3 years:<\/strong> almost everything else — order tickets, confirms, communications, U4/U5 of ex-employees, net capital computations, gifts records, fingerprint records, trial balances.<\/li>\n<li><strong>Regulatory element CE records<\/strong> and <strong>Firm Element plans:<\/strong> 3 years. <strong>Do-not-call:<\/strong> 5 years.<\/li>\n<\/ul>\n<p><strong>Electronic records<\/strong> must have an audit trail, a backup copy, an index, and the firm must be able to download them for regulators. FINRA and the SEC may inspect any record on demand.<\/p>\n<p><strong>Financial reports:<\/strong> broker-dealers file <strong>FOCUS reports<\/strong> (monthly or quarterly) and an <strong>annual audited financial statement<\/strong> (within 60 days of fiscal year-end) with the SEC and FINRA, and must make a <strong>statement of financial condition (balance sheet)<\/strong> available to customers semiannually. Net capital requirements must be met at all times (<strong>net capital rule<\/strong>); a firm falling below must notify the SEC/FINRA immediately and stop expanding.<\/p>\n<p><strong>Books and records on reps:<\/strong> Form U4, fingerprint records, outside business activity disclosures, CE records, and a record of each office.<\/p>\n<hr />\n<h2>Chapter 15 quick review<\/h2>\n<ul>\n<li><strong>SEC<\/strong> = government regulator (1934 Act); <strong>FINRA<\/strong> = largest SRO (BDs and reps; exams, CRD, BrokerCheck, arbitration); <strong>MSRB<\/strong> = muni rules only, no enforcement (FINRA/SEC/bank regulators enforce), no authority over issuers; <strong>state Administrators<\/strong> (NASAA, blue-sky, Series 63/65/66).<\/li>\n<li>BD standard: <strong>Reg BI<\/strong> (best interest for retail recommendations; Form CRS; 4 obligations: disclosure, care, conflicts, compliance; no sales contests on specific securities). IA standard: <strong>fiduciary<\/strong>.<\/li>\n<li>Manipulation: wash trades, matched orders, painting the tape, marking the close, pump-and-dump, front-running, spoofing, capping/pegging. Only legal one: stabilizing bid.<\/li>\n<li>Unethical: churning, unsuitable, unauthorized trading, misrepresentation, <strong>guarantees against loss (never)<\/strong>, sharing accounts (written approval + proportional, except family), selling away (written notice; approval if paid), borrowing/lending (family, institution, same-firm rep, personal/business relationship + firm procedures), commingling, breakpoint sales.<\/li>\n<li><strong>Insider trading:<\/strong> MNPI; tippers and tippees liable; misappropriation theory; <strong>treble damages<\/strong>, <strong>$5M/20 years<\/strong> individuals, $25M firms; information barriers; Reg FD; Section 16 short-swing; 10b5-1 plans.<\/li>\n<li><strong>Seniors:<\/strong> trusted contact (must attempt); specified adult = 65+ or impaired 18+; temporary hold on disbursements <strong>15 business days + 10 (+30)<\/strong>.<\/li>\n<li>AML: SAR $5,000 within 30 days; CTR &gt; $10,000 cash; placement → layering → integration; structuring illegal; AML officer; annual audit.<\/li>\n<li><strong>TCPA:<\/strong> 8 am–9 pm called party's time; identify self/firm/contact; firm DNC list + national registry (check every 31 days); 18-month existing relationship exemption.<\/li>\n<li><strong>Communications:<\/strong> correspondence ≤ 25 retail/30 days (review); retail &gt; 25 (principal pre-approval; some filed — new firms 10 days before; fund/VA/DPP/CMO within 10 days of use); institutional (procedures). Fair and balanced, no predictions, no guarantees; fund performance 1/5/10 years at max load; records 3 years.<\/li>\n<li>Proxies: firm forwards materials for street-name shares; votes uninstructed shares only on routine matters.<\/li>\n<li><strong>SIE:<\/strong> anyone 18+, 75 questions, 105 minutes, 70 to pass, valid 4 years, co-requisite — not a registration. Series 6 (funds/VAs), 7 (general), 63/65/66 (state), 24 (principal). Fail waits: 30/30/180 days. U4 within 30 days of changes; U5 within 30 days of leaving; registration lapses after 2 years out (MQP up to 5). <strong>CE:<\/strong> Regulatory Element annually (inactive if missed); Firm Element annually with needs analysis. Statutory disqualification: felony or securities misdemeanor within 10 years.<\/li>\n<li><strong>Rep rules:<\/strong> OBA → prior written <strong>notice<\/strong>; private securities transactions → notice, and <strong>approval<\/strong> if compensated; outside accounts → prior written consent + duplicate confirms; <strong>gifts $100/person/year<\/strong> (entertainment excluded if giver attends); borrowing/lending restricted; no sharing commissions with unregistered persons.<\/li>\n<li><strong>Records:<\/strong> permanent (organizational docs, minutes); <strong>6 years<\/strong> (blotters, ledgers, stock record, account records); <strong>4 years<\/strong> (complaints); <strong>3 years<\/strong> (order tickets, confirms, communications, U4/U5 after termination, net capital, gifts); first 2 years easily accessible.<\/li>\n<\/ul>"}];
const QUESTIONS = [{"id": 1, "ch": 1, "sec": "1.1", "fs": 2, "q": "A corporation's charter authorizes 10 million shares. It has sold 6 million shares to the public and later repurchased 1 million of them, which it holds as treasury stock. How many shares are outstanding?", "o": ["10 million", "6 million", "5 million", "4 million"], "a": 2, "e": "Outstanding = issued − treasury = 6M − 1M = 5 million. Treasury stock carries no vote and receives no dividends."}, {"id": 2, "ch": 1, "sec": "1.2.2", "fs": 2, "q": "An investor owns 200 shares of a company that is electing four directors. Under cumulative voting, the investor may cast:", "o": ["200 votes for each of the four seats", "800 votes total, allocated in any way", "50 votes for each seat", "800 votes, but no more than 200 for any one candidate"], "a": 1, "e": "Cumulative voting gives shares × seats = 800 votes that can be distributed in any way, including all on one candidate. This benefits small shareholders. Statutory voting would be 200 votes per seat."}, {"id": 3, "ch": 1, "sec": "1.2.4", "fs": 2, "q": "Which of the following is TRUE of a warrant compared to a stock right?", "o": ["A warrant is short-term and its exercise price is below market at issuance", "A warrant is long-term and its exercise price is above market at issuance", "Warrants are issued only to existing shareholders under preemptive rights", "Warrants cannot be traded separately from the bond they accompany"], "a": 1, "e": "Warrants are long-term (often years), issued with an exercise price above the current market, and typically attached to bond or preferred offerings as sweeteners. Rights are short-term, priced below market, and given to existing shareholders."}, {"id": 4, "ch": 1, "sec": "1.3.3", "fs": 3, "q": "A customer buys 100 shares of a listed stock on Tuesday, June 3. Under regular-way settlement, the trade settles on:", "o": ["Tuesday, June 3", "Wednesday, June 4", "Thursday, June 5", "Friday, June 6"], "a": 1, "e": "Corporate securities settle T+1 — one business day after the trade date. Wednesday, June 4. The Reg T payment deadline would be S+2 (Friday)."}, {"id": 5, "ch": 1, "sec": "1.3.4", "fs": 2, "q": "A company declares a $0.50 dividend payable to holders of record on Thursday, March 20. To receive the dividend, an investor must purchase the stock no later than:", "o": ["Tuesday, March 18", "Wednesday, March 19", "Thursday, March 20", "Friday, March 21"], "a": 1, "e": "Under T+1 settlement the ex-dividend date is the same day as the record date (March 20). To be a holder of record, the purchase must settle by March 20, so the trade must occur by March 19 — the last day before the ex-date."}, {"id": 6, "ch": 1, "sec": "1.3.5", "fs": 2, "q": "The maximum potential loss for an investor who sells a stock short is:", "o": ["The sale proceeds", "The margin deposit", "Unlimited", "The current market value minus the margin deposit"], "a": 2, "e": "A short seller must eventually buy the stock back, and there is no ceiling on how high a stock can rise, so the loss potential is unlimited. Maximum gain is the sale proceeds (stock goes to zero)."}, {"id": 7, "ch": 1, "sec": "1.3.6", "fs": 2, "q": "An investor holding an American Depositary Receipt is exposed to all of the following EXCEPT:", "o": ["Currency risk", "Market risk of the foreign company's stock", "Having to receive dividends in a foreign currency", "Political risk in the foreign country"], "a": 2, "e": "ADRs are priced in US dollars and pay dividends in US dollars (converted by the depositary bank). The holder still bears currency risk because the conversion rate affects the dollar value."}, {"id": 8, "ch": 1, "sec": "1.2.5", "fs": 2, "q": "An investor owns 300 shares of XYZ at $90. XYZ announces a 3-for-2 stock split. After the split the investor will own:", "o": ["450 shares at $60", "200 shares at $135", "450 shares at $90", "600 shares at $45"], "a": 0, "e": "3-for-2: shares × 3/2 = 450; price × 2/3 = $60. Total value stays $27,000. Ownership percentage is unchanged."}, {"id": 9, "ch": 1, "sec": "1.5", "fs": 2, "q": "A company has net income of $8 million, pays $2 million in preferred dividends, and has 3 million common shares outstanding. Its stock trades at $40. The P/E ratio is:", "o": ["15", "20", "13.3", "12"], "a": 1, "e": "EPS = ($8M − $2M) ÷ 3M = $2.00. P/E = $40 ÷ $2 = 20."}, {"id": 10, "ch": 1, "sec": "1.3.7", "fs": 3, "q": "A tender offer for a company's shares must remain open for at least:", "o": ["10 business days", "20 business days", "30 calendar days", "45 calendar days"], "a": 1, "e": "SEC rules require tender offers to stay open at least 20 business days. Investors may only tender shares they actually own (net long)."}, {"id": 11, "ch": 2, "sec": "2.2", "fs": 2, "q": "A corporation has $6 cumulative preferred stock outstanding. It paid no preferred dividends in the last two years. Before paying a common dividend this year, it must pay preferred holders:", "o": ["$6", "$12", "$18", "Nothing — the missed dividends are forfeited"], "a": 2, "e": "Cumulative preferred accumulates dividends in arrears: two missed years ($12) plus the current year ($6) = $18 per share must be paid before any common dividend."}, {"id": 12, "ch": 2, "sec": "2.1", "fs": 2, "q": "When market interest rates rise, the price of a fixed-rate preferred stock will most likely:", "o": ["Rise", "Fall", "Stay the same", "Rise only if the issuer is highly rated"], "a": 1, "e": "Preferred pays a fixed dividend, so like a bond its price moves inversely to interest rates. Adjustable-rate preferred is the exception because its dividend resets."}, {"id": 13, "ch": 2, "sec": "2.2", "fs": 2, "q": "Which type of preferred stock would an issuer most likely redeem when interest rates fall?", "o": ["Cumulative", "Participating", "Callable", "Convertible"], "a": 2, "e": "Issuers call preferred (and bonds) when rates fall so they can reissue at a lower dividend rate. Investors are compensated with a higher stated dividend on callable issues."}, {"id": 14, "ch": 2, "sec": "2.2", "fs": 2, "q": "A $100 par preferred stock is convertible at $20 per common share. If the preferred is trading at $110, the parity price of the common stock is:", "o": ["$20", "$22", "$25", "$5.50"], "a": 1, "e": "Conversion ratio = $100 ÷ $20 = 5 shares. Parity for the common = $110 ÷ 5 = $22."}, {"id": 15, "ch": 2, "sec": "2.3", "fs": 2, "q": "Which investor would benefit MOST from the tax treatment of preferred stock dividends?", "o": ["A corporation investing excess cash", "An individual in the lowest tax bracket", "A traditional IRA", "A municipal pension fund"], "a": 0, "e": "Corporations can exclude a large portion of dividends received from other domestic corporations (the dividends-received deduction), making preferred especially attractive to corporate investors."}, {"id": 16, "ch": 2, "sec": "2.2", "fs": 2, "q": "Which type of preferred stock has the LEAST interest-rate risk?", "o": ["Straight preferred", "Cumulative preferred", "Adjustable-rate preferred", "Callable preferred"], "a": 2, "e": "Because the dividend on adjustable-rate preferred resets with market rates, its price stays close to par and it is far less sensitive to rate changes."}, {"id": 17, "ch": 2, "sec": "2.1", "fs": 2, "q": "Compared with common stockholders, preferred stockholders generally have:", "o": ["Greater voting rights and greater growth potential", "Priority in dividends and liquidation but usually no voting rights", "Preemptive rights and a maturity date", "A legal right to receive dividends each year"], "a": 1, "e": "Preferred is 'preferred' for dividends and in liquidation (after creditors, before common). It generally has no voting rights, no maturity, and dividends are still not a legal obligation."}, {"id": 18, "ch": 2, "sec": "2.2", "fs": 2, "q": "Which feature allows preferred stockholders to receive more than the stated dividend in a very profitable year?", "o": ["Cumulative", "Participating", "Convertible", "Callable"], "a": 1, "e": "Participating preferred receives its fixed dividend plus a share of additional dividends when the company does well."}, {"id": 19, "ch": 2, "sec": "2.1", "fs": 2, "q": "A 7% preferred stock with a $100 par value is trading at $87.50. Its current yield is:", "o": ["7.0%", "8.0%", "6.1%", "8.75%"], "a": 1, "e": "Annual dividend = 7% × $100 = $7. Current yield = $7 ÷ $87.50 = 8.0%."}, {"id": 20, "ch": 2, "sec": "2.2", "fs": 2, "q": "Convertible preferred stock typically pays a dividend that is _____ than non-convertible preferred from the same issuer because _____.", "o": ["higher; it carries call risk", "lower; the conversion feature benefits the investor", "higher; it is subordinate to convertible bonds", "lower; it has no liquidation preference"], "a": 1, "e": "Investor-friendly features (convertibility, cumulative, participating) let the issuer pay a lower dividend; issuer-friendly features (callability) require a higher dividend."}, {"id": 21, "ch": 3, "sec": "3.1", "fs": 2, "q": "A corporate bond is quoted at 102 3/8. The dollar price is:", "o": ["$1,020.38", "$1,023.75", "$1,002.375", "$1,023.00"], "a": 1, "e": "102 3/8 = 102.375% of $1,000 par = $1,023.75. Corporates are quoted in eighths; each point is $10."}, {"id": 22, "ch": 3, "sec": "3.5", "fs": 2, "q": "A bond with a 5% coupon is trading at $1,100. Which of the following correctly ranks its yields from highest to lowest?", "o": ["YTC, YTM, CY, nominal", "Nominal, CY, YTM, YTC", "CY, nominal, YTM, YTC", "YTM, YTC, CY, nominal"], "a": 1, "e": "For a premium bond, nominal > current yield > YTM > YTC. The investor paid more than par and loses the premium, so the 'all-in' yields are lower than the coupon."}, {"id": 23, "ch": 3, "sec": "3.1", "fs": 2, "q": "Which bond would experience the GREATEST price decline if interest rates rise 1%?", "o": ["A 2-year 6% bond", "A 10-year 6% bond", "A 30-year 6% bond", "A 30-year zero-coupon bond"], "a": 3, "e": "Price volatility increases with longer maturity and lower coupon. A long-term zero-coupon bond has the highest duration and is the most sensitive to rate changes."}, {"id": 24, "ch": 3, "sec": "3.1", "fs": 2, "q": "The lowest rating that is still considered investment grade is:", "o": ["A", "BBB", "BB", "B"], "a": 1, "e": "BBB (S&P/Fitch) or Baa (Moody's) is the lowest investment-grade tier. Anything below is speculative/high-yield ('junk')."}, {"id": 25, "ch": 3, "sec": "3.4", "fs": 2, "q": "An investor wants to accumulate exactly $50,000 for a child's college tuition in 12 years and does not want reinvestment risk. The most appropriate investment is:", "o": ["A 12-year 5% corporate bond", "A 12-year zero-coupon bond", "A bond mutual fund", "A 12-year callable municipal bond"], "a": 1, "e": "Zero-coupon bonds pay no interim interest, so there is nothing to reinvest; the investor locks in a known maturity value. The annual accretion is taxed unless it's a muni or held in a tax-deferred account."}, {"id": 26, "ch": 3, "sec": "3.4", "fs": 2, "q": "An investor who owns a puttable bond would most likely exercise the put when:", "o": ["Interest rates fall", "Interest rates rise", "The issuer's credit rating is upgraded", "The bond trades at a premium"], "a": 1, "e": "A put lets the holder sell the bond back at par. When rates rise, bond prices fall, so the holder puts the bond at par and reinvests at the higher rates."}, {"id": 27, "ch": 3, "sec": "3.1", "fs": 2, "q": "A corporate bond pays interest on January 1 and July 1. A trade settles on April 16. How many days of accrued interest does the buyer owe the seller?", "o": ["105", "106", "104", "107"], "a": 0, "e": "Corporate bonds use 30/360: January (30) + February (30) + March (30) + April 1–15 (15) = 105 days. Accrued interest runs up to but not including settlement."}, {"id": 28, "ch": 3, "sec": "3.5", "fs": 1, "q": "An inverted yield curve exists when:", "o": ["Long-term rates exceed short-term rates", "Short-term rates exceed long-term rates", "Corporate yields exceed Treasury yields", "All maturities yield approximately the same"], "a": 1, "e": "An inverted (negative) yield curve has short-term yields above long-term yields, usually from Fed tightening, and historically signals a coming recession."}, {"id": 29, "ch": 3, "sec": "3.4", "fs": 2, "q": "Which of the following is TRUE about a callable bond compared to a non-callable bond from the same issuer?", "o": ["It pays a lower coupon", "It is most likely to be called when rates rise", "It pays a higher coupon to compensate for call risk", "Its yield to call is always higher than its yield to maturity"], "a": 2, "e": "Callability benefits the issuer (called when rates fall), so investors demand a higher coupon. For a premium bond YTC is lower than YTM."}, {"id": 30, "ch": 3, "sec": "3.3", "fs": 1, "q": "Corporate bond transactions must be reported to:", "o": ["EMMA", "TRACE", "The Consolidated Tape", "RTRS"], "a": 1, "e": "FINRA's TRACE (Trade Reporting and Compliance Engine) captures corporate bond trades. Municipal trades go to the MSRB's RTRS, displayed on EMMA."}, {"id": 31, "ch": 4, "sec": "4.1", "fs": 2, "q": "Commercial paper is issued with a maximum maturity of 270 days primarily because:", "o": ["Banks will not guarantee longer paper", "Debt of 270 days or less is exempt from SEC registration", "The Fed limits corporate borrowing beyond 270 days", "Money market funds cannot buy longer maturities"], "a": 1, "e": "The Securities Act of 1933 exempts short-term debt with a maturity of 270 days or less from registration, so issuers cap commercial paper at 270 days."}, {"id": 32, "ch": 4, "sec": "4.2", "fs": 2, "q": "A bond secured by rolling stock such as railcars or aircraft is known as a(n):", "o": ["Mortgage bond", "Collateral trust bond", "Equipment trust certificate", "Debenture"], "a": 2, "e": "Equipment trust certificates are backed by movable equipment held by a trustee; mortgage bonds by real property; collateral trust bonds by securities; debentures are unsecured."}, {"id": 33, "ch": 4, "sec": "4.3", "fs": 2, "q": "A $1,000 bond is convertible at $40. The common stock is trading at $45. The parity price of the bond is:", "o": ["$1,000", "$1,125", "$1,111", "$900"], "a": 1, "e": "Conversion ratio = 1,000 ÷ 40 = 25 shares. Parity = 25 × $45 = $1,125."}, {"id": 34, "ch": 4, "sec": "4.4", "fs": 2, "q": "In a corporate liquidation, which claim is paid FIRST?", "o": ["Subordinated debentures", "Preferred stock", "Secured bonds", "General creditors"], "a": 2, "e": "Order: secured creditors → general (unsecured) creditors → subordinated debentures → preferred → common."}, {"id": 35, "ch": 4, "sec": "4.1", "fs": 2, "q": "A banker's acceptance is most commonly used to finance:", "o": ["Corporate payroll", "Import and export transactions", "Municipal construction projects", "Margin lending to broker-dealers"], "a": 1, "e": "BAs are bank-guaranteed time drafts used in international trade; they trade at a discount with maturities up to 270 days."}, {"id": 36, "ch": 4, "sec": "4.7", "fs": 2, "q": "A US corporation issues dollar-denominated bonds in London that are not registered with the SEC. These are:", "o": ["Yankee bonds", "Eurodollar bonds", "Treasury receipts", "Brady bonds"], "a": 1, "e": "Eurodollar bonds are USD-denominated bonds issued outside the US; they're unregistered and usually pay interest annually. A Yankee bond is a foreign issuer's dollar bond sold and registered in the US."}, {"id": 37, "ch": 4, "sec": "4.2", "fs": 2, "q": "Which corporate bond trades 'flat' (without accrued interest)?", "o": ["A first-mortgage bond", "An income (adjustment) bond", "A convertible debenture", "An equipment trust certificate"], "a": 1, "e": "Income bonds pay interest only if the company earns enough, so they trade flat. Bonds in default also trade flat."}, {"id": 38, "ch": 4, "sec": "4.6", "fs": 2, "q": "A negotiable certificate of deposit differs from a regular bank CD in that it:", "o": ["Is not FDIC insured", "Can be sold in the secondary market before maturity", "Has a minimum denomination of $1,000", "Pays interest monthly"], "a": 1, "e": "Negotiable (jumbo) CDs are $100,000+ and can be traded before maturity, so there's no early-withdrawal penalty but the holder faces interest-rate risk. FDIC coverage still applies up to $250,000."}, {"id": 39, "ch": 4, "sec": "4.3", "fs": 2, "q": "A corporation would most likely force conversion of its convertible bonds by:", "o": ["Lowering the conversion price", "Calling the bonds when the stock is trading above parity", "Suspending interest payments", "Issuing additional common stock"], "a": 1, "e": "If the bond is called at a price below its conversion value, holders will convert rather than accept the call price — eliminating the issuer's debt."}, {"id": 40, "ch": 4, "sec": "4.2", "fs": 2, "q": "Interest paid on corporate bonds is attractive to the issuing corporation compared with dividends on stock because:", "o": ["Interest is tax-deductible to the corporation; dividends are not", "Interest payments are optional", "Bondholders have voting rights", "Interest is tax-free to the bondholder"], "a": 0, "e": "Interest expense reduces taxable income; dividends are paid from after-tax profits. This makes debt a cheaper source of capital, but it adds leverage and a fixed obligation."}, {"id": 41, "ch": 5, "sec": "5.1", "fs": 2, "q": "An investor in the 35% federal tax bracket is comparing a municipal bond yielding 4.2% with a corporate bond. The corporate bond must yield at least approximately:", "o": ["5.67%", "6.46%", "2.73%", "4.20%"], "a": 1, "e": "Tax-equivalent yield = 4.2% ÷ (1 − 0.35) = 4.2% ÷ 0.65 = 6.46%."}, {"id": 42, "ch": 5, "sec": "5.2", "fs": 2, "q": "Which of the following is TRUE of general obligation bonds but NOT revenue bonds?", "o": ["They are backed by user fees from a specific project", "They are usually subject to voter approval and statutory debt limits", "They require a feasibility study", "They are exempt from federal taxation"], "a": 1, "e": "G.O. bonds pledge the issuer's taxing power, so they typically need voter approval and are subject to debt limits. Revenue bonds rely on a project's revenue and a feasibility study."}, {"id": 43, "ch": 5, "sec": "5.4", "fs": 2, "q": "A municipality issues short-term notes to be repaid from the proceeds of a long-term bond issue it plans to sell next year. These are:", "o": ["Tax anticipation notes", "Revenue anticipation notes", "Bond anticipation notes", "Grant anticipation notes"], "a": 2, "e": "BANs are interim financing paid off by a future bond sale. TANs come from future taxes; RANs from future non-tax revenue; GANs from expected grants."}, {"id": 44, "ch": 5, "sec": "5.1", "fs": 2, "q": "Interest from which of the following municipal bonds may be subject to the alternative minimum tax?", "o": ["General obligation bonds", "Public housing authority bonds", "Private activity (industrial development) bonds", "Pre-refunded bonds"], "a": 2, "e": "Private activity bonds — those that primarily benefit a private entity, such as industrial development bonds — are AMT preference items."}, {"id": 45, "ch": 5, "sec": "5.5", "fs": 4, "q": "The MSRB's authority is best described as:", "o": ["Making and enforcing rules for municipal issuers", "Making rules for municipal dealers, which are enforced by FINRA, the SEC and bank regulators", "Registering municipal securities with the SEC", "Insuring municipal bonds against default"], "a": 1, "e": "The MSRB writes rules for broker-dealers, bank dealers and municipal advisors but has no enforcement power and no jurisdiction over issuers."}, {"id": 46, "ch": 5, "sec": "5.5", "fs": 4, "q": "Under MSRB Rule G-37, a municipal finance professional who contributes $500 to the campaign of a mayoral candidate for whom she is entitled to vote will cause her firm to be:", "o": ["Fined $500", "Banned from negotiated underwriting with that issuer for two years", "Required to disclose the contribution on EMMA only", "Unaffected, because she can vote for the candidate"], "a": 1, "e": "The de minimis exception is $250 per election for candidates the MFP can vote for. A $500 contribution exceeds it and triggers the two-year ban on negotiated business with that issuer."}, {"id": 47, "ch": 5, "sec": "5.6", "fs": 2, "q": "Which account is LEAST appropriate for municipal bonds?", "o": ["A taxable brokerage account of a high-income investor", "A corporate cash management account", "A traditional IRA", "A joint account of a retired couple in a high bracket"], "a": 2, "e": "Muni interest is already tax-exempt; inside a tax-deferred IRA the benefit is wasted and withdrawals become taxable ordinary income. Munis yield less than taxable bonds, so the investor loses."}, {"id": 48, "ch": 5, "sec": "5.3", "fs": 2, "q": "A revenue bond's debt service coverage ratio of 1.8 means:", "o": ["Debt service is 1.8 times net revenue", "Net revenue is 1.8 times the annual principal and interest", "The bond is rated 1.8 notches above investment grade", "The issuer may borrow 1.8 times its current debt"], "a": 1, "e": "Coverage ratio = net revenue available ÷ annual debt service. 1.8 means revenue covers debt service 1.8 times — higher is safer."}, {"id": 49, "ch": 5, "sec": "5.1", "fs": 2, "q": "A resident of Texas buys a bond issued by the Commonwealth of Puerto Rico. The interest is:", "o": ["Subject to federal tax but exempt from Texas tax", "Exempt from federal tax only", "Exempt from federal, state and local taxes", "Fully taxable"], "a": 2, "e": "Bonds of US territories (Puerto Rico, Guam, USVI) are triple tax-exempt for investors in every state."}, {"id": 50, "ch": 5, "sec": "5.5", "fs": 1, "q": "A municipal G.O. bond issue is most commonly awarded through:", "o": ["A negotiated underwriting", "A competitive bid based on the lowest net interest cost", "A best-efforts offering", "A private placement under Regulation D"], "a": 1, "e": "G.O. issues typically publish a notice of sale and award the bonds to the syndicate with the lowest NIC/TIC. Revenue bonds are usually negotiated."}, {"id": 51, "ch": 6, "sec": "6.1", "fs": 2, "q": "Interest earned on US Treasury notes is:", "o": ["Exempt from federal tax, taxable at the state level", "Taxable at the federal level, exempt from state and local tax", "Exempt at all levels", "Taxable at all levels"], "a": 1, "e": "Treasury interest is subject to federal income tax but exempt from state and local tax — the opposite of municipal bonds."}, {"id": 52, "ch": 6, "sec": "6.2", "fs": 2, "q": "A Treasury note is quoted at 98.24. Its dollar price is:", "o": ["$982.40", "$987.50", "$982.75", "$998.24"], "a": 1, "e": "Treasury notes and bonds are quoted in 32nds: 98.24 = 98 24/32 = 98.75% of $1,000 = $987.50."}, {"id": 53, "ch": 6, "sec": "6.3", "fs": 2, "q": "Which agency's mortgage-backed securities are backed by the full faith and credit of the US government?", "o": ["Fannie Mae", "Freddie Mac", "Ginnie Mae", "Federal Home Loan Banks"], "a": 2, "e": "Only GNMA pass-throughs carry the direct full-faith-and-credit backing of the US government. Fannie and Freddie are GSEs with implied support."}, {"id": 54, "ch": 6, "sec": "6.3", "fs": 2, "q": "The holder of a mortgage-backed pass-through certificate is most exposed to prepayment risk when:", "o": ["Interest rates rise", "Interest rates fall", "Housing prices fall", "The Fed sells Treasuries"], "a": 1, "e": "When rates fall, homeowners refinance, returning principal early that must be reinvested at lower rates. Rising rates cause extension risk instead."}, {"id": 55, "ch": 6, "sec": "6.5.3", "fs": 1, "q": "To stimulate a slowing economy, the Federal Open Market Committee would most likely:", "o": ["Sell Treasury securities", "Raise the discount rate", "Buy Treasury securities", "Raise reserve requirements"], "a": 2, "e": "Buying securities injects money into the banking system, increasing reserves and pushing interest rates down (easy money). Selling, raising rates or raising reserve requirements tighten."}, {"id": 56, "ch": 6, "sec": "6.5.2", "fs": 1, "q": "The rate that banks charge each other for overnight loans of excess reserves is the:", "o": ["Discount rate", "Prime rate", "Federal funds rate", "Broker call rate"], "a": 2, "e": "The fed funds rate is bank-to-bank overnight. The discount rate is what the Fed charges banks; prime is what banks charge top customers; broker call is what banks charge broker-dealers for margin loans."}, {"id": 57, "ch": 6, "sec": "6.5.4", "fs": 1, "q": "Which of the following is considered a LEADING economic indicator?", "o": ["The unemployment rate", "The Consumer Price Index", "Building permits", "Corporate profits"], "a": 2, "e": "Building permits/housing starts, the stock market, M2, new orders and initial jobless claims lead the economy. Unemployment rate, CPI and corporate profits lag."}, {"id": 58, "ch": 6, "sec": "6.5.5", "fs": 1, "q": "Fiscal policy is set by:", "o": ["The Federal Reserve Board", "The Federal Open Market Committee", "Congress and the President", "The Treasury Department acting alone"], "a": 2, "e": "Fiscal policy — taxation and government spending — comes from Congress and the President. The Fed controls monetary policy."}, {"id": 59, "ch": 6, "sec": "6.2", "fs": 2, "q": "An investor concerned about inflation who wants a Treasury security whose principal adjusts with the CPI should buy:", "o": ["Treasury STRIPS", "Treasury bills", "TIPS", "Series EE bonds"], "a": 2, "e": "Treasury Inflation-Protected Securities adjust principal with CPI; the fixed coupon rate is applied to the adjusted principal."}, {"id": 60, "ch": 6, "sec": "6.5.4", "fs": 1, "q": "A weakening US dollar would most directly benefit:", "o": ["US importers", "US consumers buying foreign goods", "US exporters", "Foreign investors holding US bonds"], "a": 2, "e": "A weak dollar makes US goods cheaper abroad, helping exporters; it hurts importers and consumers of foreign goods, and reduces the home-currency value of US assets held by foreigners."}, {"id": 61, "ch": 7, "sec": "7.3.3", "fs": 2, "q": "A mutual fund has a NAV of $18.60 and a sales charge of 7%. Its public offering price is:", "o": ["$19.90", "$20.00", "$19.30", "$17.30"], "a": 1, "e": "POP = NAV ÷ (1 − 0.07) = 18.60 ÷ 0.93 = $20.00. The sales charge is a percentage of the POP."}, {"id": 62, "ch": 7, "sec": "7.3.3", "fs": 3, "q": "A customer signs a letter of intent to invest $50,000 in a fund family over the next 13 months. Which statement is TRUE?", "o": ["The letter may be backdated up to 90 days to include a prior purchase", "Appreciation in the account counts toward the $50,000", "The reduced sales charge applies only after $50,000 has been invested", "The customer is legally obligated to complete the purchases"], "a": 0, "e": "An LOI can be backdated 90 days, gives the reduced charge immediately, counts only new money (not appreciation), and is not binding — unmet LOIs trigger a retroactive charge on escrowed shares."}, {"id": 63, "ch": 7, "sec": "7.3.5", "fs": 3, "q": "A customer wants to invest $750,000 in a mutual fund and hold it for 15 years. The MOST suitable share class is:", "o": ["Class A", "Class B", "Class C", "Class B, converting to A later"], "a": 0, "e": "Large amounts qualify for breakpoints (possibly a 0% load at $1 million) and long holding periods favor the low 12b-1 fee of Class A. Class B has no breakpoints; Class C's level load never converts."}, {"id": 64, "ch": 7, "sec": "7.3.6", "fs": 2, "q": "Under Subchapter M, a regulated investment company avoids tax on income distributed to shareholders if it distributes at least:", "o": ["50% of net investment income", "75% of net investment income", "90% of net investment income", "100% of net investment income"], "a": 2, "e": "The 90% conduit rule: distribute at least 90% of net investment income and the fund is taxed only on what it retains."}, {"id": 65, "ch": 7, "sec": "7.4", "fs": 2, "q": "Which of the following is TRUE of a closed-end fund but NOT an open-end fund?", "o": ["It is priced at NAV plus a sales charge", "It may trade at a discount to NAV", "It continuously issues new shares", "It must redeem shares within seven days"], "a": 1, "e": "Closed-end funds trade in the secondary market at prices set by supply and demand, so they can trade above or below NAV. They don't issue new shares continuously or redeem shares."}, {"id": 66, "ch": 7, "sec": "7.5.2", "fs": 2, "q": "A leveraged ETF that seeks 3× the daily return of an index is LEAST suitable for:", "o": ["A day trader", "A buy-and-hold retirement investor", "A hedge fund", "A sophisticated speculator with a one-day outlook"], "a": 1, "e": "Leveraged and inverse ETFs reset daily; over longer periods compounding causes returns to diverge from 3× the index, especially in volatile markets. They're designed for short-term trading."}, {"id": 67, "ch": 7, "sec": "7.5.3", "fs": 2, "q": "An exchange-traded note differs from an ETF in that the ETN holder:", "o": ["Receives dividends from the underlying stocks", "Bears the credit risk of the issuing bank", "Can only redeem through the fund", "Pays a front-end sales charge"], "a": 1, "e": "An ETN is an unsecured debt obligation of a bank; there is no portfolio. If the bank fails, the ETN can become worthless regardless of the index."}, {"id": 68, "ch": 7, "sec": "7.6", "fs": 2, "q": "A unit investment trust differs from a mutual fund in that a UIT:", "o": ["Has a board of directors", "Has a fixed, unmanaged portfolio and no investment adviser", "Issues shares that trade on an exchange", "Cannot hold bonds"], "a": 1, "e": "UITs hold a fixed portfolio with no active management or board; units are redeemable, and the trust terminates on a set date."}, {"id": 69, "ch": 7, "sec": "7.7", "fs": 2, "q": "A fund has a beta of 1.3. If the market rises 10%, the fund would be expected to:", "o": ["Rise about 13%", "Rise about 7.7%", "Rise about 10%", "Fall about 3%"], "a": 0, "e": "Beta measures movement relative to the market (beta 1.0). A beta of 1.3 implies about 1.3 × 10% = 13%."}, {"id": 70, "ch": 7, "sec": "7.3.4", "fs": 3, "q": "A mutual fund shareholder elects to reinvest all dividends and capital gains distributions. For tax purposes, the distributions are:", "o": ["Not taxable until shares are sold", "Taxable in the year received and added to cost basis", "Taxable only if taken in cash", "Taxed as long-term gains regardless of type"], "a": 1, "e": "Distributions are taxable whether reinvested or not; reinvested amounts increase the investor's cost basis to avoid double taxation on sale."}, {"id": 71, "ch": 7, "sec": "7.1", "fs": 2, "q": "A diversified management company must have at least 75% of its assets invested such that no more than ___ is in any one issuer and it owns no more than ___ of any issuer's voting securities.", "o": ["10%; 5%", "5%; 10%", "25%; 10%", "5%; 25%"], "a": 1, "e": "The 75-5-10 test: 75% of assets diversified, no more than 5% in one issuer, no more than 10% of an issuer's voting shares."}, {"id": 72, "ch": 7, "sec": "7.3.3", "fs": 3, "q": "A registered representative recommends that a customer invest $24,000 in Fund X and $24,000 in Fund Y, from two different fund families, when each family offers a breakpoint at $25,000. This is:", "o": ["Appropriate diversification", "A prohibited breakpoint sale", "Acceptable if the customer signs a waiver", "Acceptable because each purchase is below the breakpoint"], "a": 1, "e": "Splitting purchases to keep each below a breakpoint (or selling just under one) to earn higher commissions is a prohibited breakpoint sale."}, {"id": 73, "ch": 8, "sec": "8.1", "fs": 2, "q": "Which of the following is TRUE of a real estate investment trust?", "o": ["It passes through both income and losses to shareholders", "It must distribute at least 90% of its taxable income to avoid corporate tax", "It is regulated under the Investment Company Act of 1940", "Its dividends are always taxed as qualified dividends"], "a": 1, "e": "REITs distribute 90%+ of income and hold 75%+ in real estate to avoid corporate tax. They pass through income but NOT losses, are not 1940 Act companies, and dividends are generally ordinary income."}, {"id": 74, "ch": 8, "sec": "8.2", "fs": 2, "q": "Hedge funds are typically offered as:", "o": ["Registered public offerings with a prospectus", "Private placements under Regulation D to accredited investors", "Exchange-listed closed-end funds", "Unit investment trusts"], "a": 1, "e": "Hedge funds are privately offered limited partnerships sold under Reg D to accredited investors, exempt from the 1940 Act, with lock-ups and limited disclosure."}, {"id": 75, "ch": 8, "sec": "8.3", "fs": 2, "q": "In a limited partnership, which party has unlimited personal liability for the partnership's debts?", "o": ["The limited partners", "The general partner", "The subscription agent", "All partners equally"], "a": 1, "e": "The general partner manages the business and has unlimited liability; limited partners are liable only for their investment as long as they stay passive."}, {"id": 76, "ch": 8, "sec": "8.3", "fs": 2, "q": "The most significant risk of investing in a direct participation program is generally:", "o": ["Interest-rate risk", "Lack of liquidity", "Currency risk", "Reinvestment risk"], "a": 1, "e": "DPP interests have no real secondary market; transfers usually need GP approval and holding periods are long. Illiquidity is the primary risk."}, {"id": 77, "ch": 8, "sec": "8.3", "fs": 3, "q": "Losses from a limited partnership may be used by an investor to offset:", "o": ["Wages and salary", "Interest and dividends", "Income from other passive activities", "Capital gains on stock"], "a": 2, "e": "DPP losses are passive losses, which may offset only passive income (other DPPs, rental activities), never earned or portfolio income."}, {"id": 78, "ch": 8, "sec": "8.3", "fs": 2, "q": "Which oil and gas program carries the HIGHEST risk?", "o": ["Income program", "Developmental program", "Exploratory (wildcat) program", "Combination program"], "a": 2, "e": "Exploratory programs drill in unproven areas — the highest chance of dry holes but the largest potential reward. Income programs buy producing wells (lowest risk)."}, {"id": 79, "ch": 8, "sec": "8.2", "fs": 2, "q": "The 'high-water mark' in a hedge fund refers to:", "o": ["The maximum leverage the fund may use", "The level above which performance fees are charged only on new gains", "The minimum investment required", "The lock-up period"], "a": 1, "e": "With a high-water mark, the manager earns the incentive fee only when the fund's value exceeds its previous peak, preventing fees on recovered losses."}, {"id": 80, "ch": 8, "sec": "8.1", "fs": 2, "q": "A non-traded REIT compared to an exchange-listed REIT generally has:", "o": ["Greater liquidity and lower fees", "Less liquidity and higher upfront fees", "The same liquidity but better tax treatment", "No SEC registration"], "a": 1, "e": "Non-traded REITs are SEC-registered but don't trade on exchanges; redemption programs are limited, and upfront commissions and fees are high."}, {"id": 81, "ch": 9, "sec": "9.3.1", "fs": 2, "q": "An investor buys 1 ABC Jun 50 call at 4. The breakeven point and maximum loss are:", "o": ["$46; $400", "$54; $400", "$54; unlimited", "$50; $4"], "a": 1, "e": "Call breakeven = strike + premium = 54. Maximum loss for any option buyer = premium = 4 × 100 = $400. Maximum gain is unlimited."}, {"id": 82, "ch": 9, "sec": "9.3.2", "fs": 2, "q": "The maximum potential loss for the writer of an uncovered (naked) call is:", "o": ["The premium received", "The strike price minus the premium", "The strike price plus the premium", "Unlimited"], "a": 3, "e": "A naked call writer must deliver stock they don't own; since a stock can rise without limit, the loss is unlimited. This is the riskiest basic option position."}, {"id": 83, "ch": 9, "sec": "9.2.2", "fs": 2, "q": "XYZ stock is trading at $62. An XYZ 55 put is trading at 1. Which statement is TRUE?", "o": ["The put is in the money by 7 points", "The put has 1 point of intrinsic value", "The put has no intrinsic value and 1 point of time value", "The put is at the money"], "a": 2, "e": "A put is in the money only when the stock is below the strike. At $62 vs. a 55 strike, the put is out of the money; the entire premium is time value."}, {"id": 84, "ch": 9, "sec": "9.3.5", "fs": 2, "q": "An investor who is long 100 shares of stock wants to protect against a decline while keeping unlimited upside. The BEST strategy is to:", "o": ["Write a call", "Buy a call", "Buy a put", "Write a put"], "a": 2, "e": "A protective put locks in a minimum sale price (the strike) at the cost of the premium while leaving the upside intact. Writing a call provides only limited downside protection and caps the upside."}, {"id": 85, "ch": 9, "sec": "9.3.6", "fs": 2, "q": "An investor owns 100 shares of ABC purchased at $42 and writes 1 ABC 45 call at 2. Maximum gain is:", "o": ["$200", "$300", "$500", "Unlimited"], "a": 2, "e": "Covered call max gain = (strike − cost) + premium = (45 − 42) + 2 = 5 points = $500. The stock is called away at 45."}, {"id": 86, "ch": 9, "sec": "9.2.4", "fs": 2, "q": "An investor holds 1 XYZ 80 call. XYZ declares a 2-for-1 stock split. After adjustment the investor holds:", "o": ["1 XYZ 40 call for 200 shares", "2 XYZ 40 calls for 100 shares each", "2 XYZ 80 calls for 100 shares each", "1 XYZ 80 call for 200 shares"], "a": 1, "e": "Even splits multiply the number of contracts and divide the strike; each contract still covers 100 shares. Uneven splits instead change the shares per contract."}, {"id": 87, "ch": 9, "sec": "9.3.7", "fs": 2, "q": "Which of the following is TRUE of broad-based index options?", "o": ["Exercise results in delivery of the underlying stocks", "They are settled in cash", "They are always American style", "They settle T+2"], "a": 1, "e": "Index options settle in cash (the in-the-money amount × $100) the next business day; most are European style."}, {"id": 88, "ch": 9, "sec": "9.2.1", "fs": 1, "q": "Listed options are issued and guaranteed by:", "o": ["The Cboe", "FINRA", "The Options Clearing Corporation", "The underlying corporation"], "a": 2, "e": "The OCC is the issuer and guarantor of all listed options, standing between every buyer and seller."}, {"id": 89, "ch": 9, "sec": "9.3.4", "fs": 2, "q": "An investor writes 1 DEF 30 put at 3. The maximum loss is:", "o": ["$300", "$2,700", "$3,000", "Unlimited"], "a": 1, "e": "Put writer max loss = (strike − premium) × 100 = (30 − 3) × 100 = $2,700; the stock can only fall to zero."}, {"id": 90, "ch": 9, "sec": "9.3.3", "fs": 2, "q": "An investor who is bearish on a stock but wants limited risk should:", "o": ["Sell the stock short", "Buy a put", "Write a call", "Write a put"], "a": 1, "e": "A long put profits from a decline with loss limited to the premium. Short sales and naked calls have unlimited risk; writing a put is bullish."}, {"id": 91, "ch": 10, "sec": "10.3", "fs": 3, "q": "An investor has $12,000 in long-term capital gains and $20,000 in short-term capital losses this year. The investor may:", "o": ["Deduct $8,000 against ordinary income this year", "Deduct $3,000 against ordinary income and carry forward $5,000", "Deduct $20,000 against ordinary income", "Carry forward the entire $8,000"], "a": 1, "e": "Net loss = $8,000. Up to $3,000 of net capital loss is deductible against ordinary income each year; the remaining $5,000 carries forward."}, {"id": 92, "ch": 10, "sec": "10.3", "fs": 3, "q": "An investor sells XYZ at a loss on March 10 and buys XYZ call options on March 25. For tax purposes:", "o": ["The loss is fully deductible", "The loss is disallowed under the wash sale rule", "The loss is deductible only against gains in XYZ", "The loss is converted to a long-term loss"], "a": 1, "e": "Buying the same or a substantially identical security — including options or convertibles on it — within 30 days before or after a loss sale is a wash sale; the loss is added to the new position's basis."}, {"id": 93, "ch": 10, "sec": "10.3", "fs": 3, "q": "A father gives his daughter 100 shares of stock he bought at $20 when it is worth $50. She sells it a month later for $55. Her taxable gain is:", "o": ["$500 short-term", "$3,500 short-term", "$3,500 long-term (if the father held it more than a year)", "$0 — gifts are not taxable to the recipient"], "a": 2, "e": "Gifted securities carry over the donor's basis ($20) and holding period. Gain = $55 − $20 = $35 × 100 = $3,500, long-term if the combined holding period exceeds a year."}, {"id": 94, "ch": 10, "sec": "10.3", "fs": 3, "q": "An investor inherits stock that the deceased bought for $10,000 and that was worth $40,000 on the date of death. The investor's cost basis is:", "o": ["$10,000", "$40,000", "$25,000", "$0"], "a": 1, "e": "Inherited securities receive a stepped-up basis to the fair market value at death, and the holding period is automatically long-term."}, {"id": 95, "ch": 10, "sec": "10.2", "fs": 3, "q": "The annual accretion on a corporate zero-coupon bond held in a taxable account is:", "o": ["Not taxable until maturity", "Taxed each year as interest income even though no cash is received", "Taxed as a capital gain at maturity", "Exempt from federal tax"], "a": 1, "e": "Original issue discount accretes annually and is taxed as 'phantom' interest income. Municipal zeros are the exception (tax-exempt). Hold corporate zeros in tax-deferred accounts."}, {"id": 96, "ch": 10, "sec": "10.1", "fs": 3, "q": "Qualified dividends are taxed at:", "o": ["Ordinary income rates", "The long-term capital gains rates", "A flat 28%", "The investor's state rate only"], "a": 1, "e": "Qualified dividends (from US corporations, with the holding period met) are taxed at the 0/15/20% long-term capital gains rates. REIT and money-market dividends are ordinary."}, {"id": 97, "ch": 10, "sec": "10.4", "fs": 3, "q": "Which type of income is required for an individual to make an IRA contribution?", "o": ["Portfolio income", "Passive income", "Earned income", "Any taxable income"], "a": 2, "e": "IRA contributions require earned income (wages, salary, self-employment). Interest, dividends, capital gains, pensions and rental income don't qualify."}, {"id": 98, "ch": 10, "sec": "10.3", "fs": 3, "q": "A long-term capital gain requires a holding period of:", "o": ["At least 6 months", "At least one year", "More than one year", "More than 18 months"], "a": 2, "e": "More than one year (one year and a day). One year or less is short-term, taxed as ordinary income."}, {"id": 99, "ch": 10, "sec": "10.4", "fs": 3, "q": "A customer refuses to provide a Social Security number when opening an account. The firm must:", "o": ["Refuse all trading", "Apply backup withholding of 24% on dividends, interest and sale proceeds", "Report the customer to the SEC", "Close the account within 30 days"], "a": 1, "e": "Without a taxpayer ID (Form W-9), the IRS requires backup withholding at 24%."}, {"id": 100, "ch": 10, "sec": "10.3", "fs": 3, "q": "If an investor who bought shares at several different prices does not specify which shares to sell, the IRS assumes:", "o": ["Average cost", "Highest cost first", "First-in, first-out", "Last-in, first-out"], "a": 2, "e": "FIFO is the default; specific identification lets the investor choose lots; average cost is allowed for mutual funds."}, {"id": 101, "ch": 11, "sec": "11.2", "fs": 1, "q": "In a firm commitment underwriting, the underwriters act as:", "o": ["Agents, earning a commission with no risk", "Principals, buying the issue from the issuer and bearing the risk of unsold shares", "Brokers for the issuer under an escrow arrangement", "Trustees under the Trust Indenture Act"], "a": 1, "e": "Firm commitment = underwriters buy the entire issue and resell it; unsold shares are their problem. Best efforts = agents; issuer bears the risk."}, {"id": 102, "ch": 11, "sec": "11.4.1", "fs": 1, "q": "During the cooling-off period, an underwriter may:", "o": ["Accept orders and payment from customers", "Distribute a preliminary prospectus and take indications of interest", "Send sales literature highlighting the offering", "Guarantee allocations to favored customers"], "a": 1, "e": "During the cooling-off period (at least 20 days) the red herring may be distributed, tombstone ads run, and non-binding indications of interest collected. No sales, orders, money or sales literature."}, {"id": 103, "ch": 11, "sec": "11.4.3", "fs": 1, "q": "When the SEC declares a registration statement effective, it means the SEC:", "o": ["Has approved the security as a sound investment", "Has verified the accuracy of all statements in the prospectus", "Has found the registration statement complete", "Guarantees the offering price"], "a": 2, "e": "The SEC reviews for completeness only; it never approves or passes on the merits or accuracy. Saying the SEC 'approved' an issue is a violation."}, {"id": 104, "ch": 11, "sec": "11.4.4", "fs": 1, "q": "Under Rule 506(b) of Regulation D, an issuer may sell to:", "o": ["No more than 35 accredited investors", "An unlimited number of accredited investors and up to 35 non-accredited investors", "Only qualified institutional buyers", "An unlimited number of any investors if the offering is under $5 million"], "a": 1, "e": "506(b): unlimited accredited investors plus up to 35 sophisticated non-accredited investors, unlimited dollar amount, no general solicitation."}, {"id": 105, "ch": 11, "sec": "11.4.4", "fs": 1, "q": "An individual qualifies as an accredited investor with a net worth of at least _____ (excluding primary residence) or income of at least _____ in each of the last two years.", "o": ["$500,000; $100,000", "$1 million; $200,000 ($300,000 joint)", "$5 million; $250,000", "$1 million including primary residence; $150,000"], "a": 1, "e": "Net worth over $1 million excluding the primary residence, or income over $200,000 individually / $300,000 with a spouse."}, {"id": 106, "ch": 11, "sec": "11.5", "fs": 1, "q": "A corporate officer wishes to sell shares under Rule 144. The company has 50 million shares outstanding; average weekly volume over the last four weeks was 600,000 shares. The maximum she may sell in a 90-day period is:", "o": ["500,000 shares", "600,000 shares", "50,000 shares", "There is no limit for officers"], "a": 1, "e": "The limit is the greater of 1% of outstanding (500,000) or the four-week average weekly volume (600,000) — so 600,000 shares."}, {"id": 107, "ch": 11, "sec": "11.4.3", "fs": 4, "q": "Under FINRA Rule 5130, which of the following may purchase shares of a new issue of common stock (IPO)?", "o": ["A registered representative at another broker-dealer", "The spouse of a FINRA member firm employee", "A retired schoolteacher with no industry connections", "A finder in the offering"], "a": 2, "e": "Restricted persons include FINRA members, their employees, immediate family members, finders and certain fiduciaries. The schoolteacher is not restricted."}, {"id": 108, "ch": 11, "sec": "11.4.4", "fs": 1, "q": "Which of the following securities is EXEMPT from registration under the Securities Act of 1933?", "o": ["A variable annuity", "A corporate debenture", "A municipal general obligation bond", "A closed-end fund share"], "a": 2, "e": "Exempt securities include US government and municipal securities, bank securities, commercial paper ≤ 270 days, non-profit issues, and insurance/fixed annuities. Variable annuities are securities that must be registered."}, {"id": 109, "ch": 11, "sec": "11.3", "fs": 1, "q": "In a secondary offering, the proceeds of the sale go to:", "o": ["The issuing corporation", "The selling shareholders", "The underwriting syndicate", "The exchange"], "a": 1, "e": "A secondary offering is a registered sale of existing shares by current holders (insiders, VCs). The issuer receives nothing. In a primary offering the issuer receives the proceeds."}, {"id": 110, "ch": 11, "sec": "11.4.4", "fs": 1, "q": "Rule 144A permits the resale of unregistered securities to:", "o": ["Accredited individual investors", "Qualified institutional buyers with at least $100 million in securities", "Residents of the issuer's state", "Any investor after a six-month holding period"], "a": 1, "e": "Rule 144A creates a liquid institutional market: restricted securities can be freely resold to QIBs (institutions managing $100 million+ in securities)."}, {"id": 111, "ch": 12, "sec": "12.1", "fs": 3, "q": "A broker-dealer sells a bond to a customer from its own inventory. The firm must disclose on the confirmation that it acted as:", "o": ["An agent and show the commission", "A principal", "A market maker for the issuer", "A fiduciary"], "a": 1, "e": "Selling from inventory is a principal (dealer) transaction compensated by a markup. The capacity must be disclosed; a firm can't charge both a markup and a commission on one trade."}, {"id": 112, "ch": 12, "sec": "12.3", "fs": 1, "q": "A market maker quotes XYZ at 25.10 – 25.20. A customer entering a market order to buy will pay:", "o": ["$25.10", "$25.20", "$25.15", "The last sale price"], "a": 1, "e": "Customers buy at the ask (offer) and sell at the bid. The spread is the market maker's profit."}, {"id": 113, "ch": 12, "sec": "12.4", "fs": 1, "q": "Exchange-listed securities traded over-the-counter by non-member broker-dealers make up the:", "o": ["First market", "Second market", "Third market", "Fourth market"], "a": 2, "e": "First = listed on exchange; second = unlisted OTC; third = listed securities traded OTC; fourth = institution-to-institution via ECNs."}, {"id": 114, "ch": 12, "sec": "12.6.3", "fs": 3, "q": "An investor who is long 500 shares of ABC at $60 wants to limit losses if the stock falls. The appropriate order is a:", "o": ["Buy stop at 65", "Sell limit at 55", "Sell stop at 55", "Buy limit at 55"], "a": 2, "e": "A sell stop is placed below the market; if ABC trades at or below
