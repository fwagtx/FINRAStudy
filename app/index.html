of the risks of uncovered options must be provided. <strong>Retirement accounts and custodial accounts<\/strong> are limited to conservative strategies (covered calls, protective puts, long options as permitted).<\/p>\n<p><strong>Position limits<\/strong> cap the number of contracts on the same side of the market an investor (or group acting together) may hold in one underlying; <strong>exercise limits<\/strong> cap exercises in 5 business days. The OCC and exchanges set them (large for liquid stocks, e.g., 250,000 contracts).<\/p>\n<hr />\n<h2 id=\"s13-6\" data-sec=\"s13-6\"><span class=\"secnum\">13.6<\/span> Other account specifications<\/h2>\n<h3 id=\"s13-6-1\" data-sec=\"s13-6-1\"><span class=\"secnum\">13.6.1<\/span> SIPC insurance<\/h3>\n<p>The <strong>Securities Investor Protection Corporation (SIPC)<\/strong> — a <strong>non-profit, non-government<\/strong> membership corporation created by the Securities Investor Protection Act of 1970, funded by assessments on broker-dealer members. Nearly all broker-dealers must be members.<\/p>\n<p><strong>What SIPC does.<\/strong> Protects customers if a <strong>broker-dealer fails (goes bankrupt/insolvent)<\/strong> and customer assets are missing. A trustee is appointed to liquidate the firm and return customer property. SIPC restores missing securities and cash up to the limits.<\/p>\n<p><strong>Coverage limits:<\/strong> up to <strong>$500,000 per separate customer<\/strong>, of which no more than <strong>$250,000 may be cash<\/strong>.<\/p>\n<ul>\n<li>Coverage is per <strong>separate customer<\/strong> (separate capacity), not per account: an individual account, a joint account, an IRA, and a custodial account at the same firm each count as a separate customer. Two individual accounts in the same name at the same firm are <strong>combined<\/strong>.<\/li>\n<li>A <strong>margin account's<\/strong> claim is measured by equity (market value less the debit balance).<\/li>\n<li>Securities are valued as of the date the trustee is appointed (the filing date).<\/li>\n<li>Claims above SIPC limits become general creditor claims against the failed firm.<\/li>\n<\/ul>\n<p><strong>What SIPC does NOT cover.<\/strong><\/p>\n<ul>\n<li><strong>Market losses<\/strong> (a decline in the value of investments) — ever.<\/li>\n<li>Commodity/futures contracts, fixed annuities, currency, precious metals, and investment contracts not registered as securities.<\/li>\n<li>Unregistered investment contracts, Ponzi losses beyond what was on the books, and claims against firms that aren't SIPC members (e.g., investment advisers alone, banks).<\/li>\n<li>Losses from bad advice, unsuitable recommendations, or fraud (customers pursue arbitration for those).<\/li>\n<\/ul>\n<p><strong>Disclosure:<\/strong> firms must display the SIPC logo and give new customers written notice of SIPC coverage and how to contact SIPC (website/phone), and repeat the notice annually.<\/p>\n<p><strong>Compare: FDIC<\/strong> insures bank deposits (checking, savings, CDs) up to <strong>$250,000<\/strong> per depositor per bank per ownership category; a government agency. SIPC is not FDIC — brokerage sweep accounts into bank deposits get FDIC, not SIPC, coverage.<\/p>\n<h3 id=\"s13-6-2\" data-sec=\"s13-6-2\"><span class=\"secnum\">13.6.2<\/span> Business continuity plans<\/h3>\n<p>FINRA Rule 4370 requires every member firm to create, maintain and annually review a <strong>business continuity plan (BCP)<\/strong> describing how the firm will meet its obligations to customers in a <strong>significant business disruption<\/strong> (natural disaster, terrorist attack, pandemic, power/communications failure, cyberattack).<\/p>\n<p>The plan must address at minimum: data backup and recovery (hard copy and electronic); all mission-critical systems; financial and operational assessments; alternate communications between the firm and customers, and between the firm and employees; alternate physical location of employees; critical business constituent, bank and counterparty impact; regulatory reporting; communications with regulators; and <strong>how the firm will assure customers prompt access to their funds and securities<\/strong> if the firm can't continue (e.g., if the firm is unable to continue, transferring accounts to another firm).<\/p>\n<ul>\n<li>Must be approved by a member of senior management (a registered principal) and updated for material changes.<\/li>\n<li>Firms must <strong>disclose a summary<\/strong> of the BCP to customers <strong>in writing at account opening<\/strong>, post it on the firm's website, and mail it on request.<\/li>\n<li>Firms designate <strong>two emergency contact persons<\/strong> (both members of senior management, at least one a registered principal) whose information is given to FINRA and updated promptly.<\/li>\n<\/ul>\n<hr />\n<h2>Chapter 13 quick review<\/h2>\n<ul>\n<li>Statements at least quarterly (monthly with activity); confirms at or before settlement, showing capacity and commission/markup. Written complaints go to the principal; kept 4 years; disputes to FINRA arbitration (6-year eligibility window).<\/li>\n<li><strong>Required at opening:<\/strong> name, address, DOB/legal age, SSN/TIN, rep's name, principal approval, employment with another BD, insider status; verify identity (CIP), check OFAC. Suitability info (objectives, income, net worth, tax, risk tolerance, horizon, experience) is sought but may be refused. Trusted contact must be <em>requested<\/em>.<\/li>\n<li>Account record copy at opening and every 36 months; SIPC and BrokerCheck notices.<\/li>\n<li>AML: SAR for $5,000+ suspicious (30 days, don't tell customer); CTR for cash &gt; $10,000; placement → layering → integration; structuring is illegal.<\/li>\n<li><strong>JTWROS<\/strong> → survivor gets it (equal ownership); <strong>TIC<\/strong> → estate gets it (unequal OK). Checks payable to all owners.<\/li>\n<li>Limited POA = trade only; full POA = trade + withdraw; durable survives incapacity; all end at death.<\/li>\n<li><strong>Discretionary<\/strong> = rep chooses security/action/amount → written authorization + principal approval + review + ticket marked. Time/price only is not discretion.<\/li>\n<li><strong>UGMA/UTMA:<\/strong> one custodian, one minor, minor's SSN, irrevocable gifts, no margin, fiduciary, transferred at majority (18/21/25).<\/li>\n<li>Guardian needs court papers; trustee needs trust document (prudent investor rule); corporation needs resolution (plus charter for margin/options).<\/li>\n<li>Prime brokerage: multiple executing brokers, one settlement/custody broker.<\/li>\n<li><strong>Margin:<\/strong> Reg T 50% (Fed), $2,000 minimum and maintenance 25% long / 30% short (FINRA); three agreements (credit, hypothecation — rehypothecate 140% of debit, loan consent optional); risk disclosure at opening and annually; no margin for custodial, IRA, new mutual funds/IPOs for 30 days.<\/li>\n<li>LMV − DR = EQ; CR − SMV = EQ. Maintenance call when LMV &lt; DR ÷ 0.75. Excess equity → SMA; buying power = 2 × SMA. Pattern day trader: $25,000.<\/li>\n<li><strong>Options account:<\/strong> ODD before approval; ROP approves; options agreement signed within 15 days (else closing-only).<\/li>\n<li><strong>SIPC:<\/strong> $500,000 per separate customer, max $250,000 cash; covers BD failure, <strong>not market losses<\/strong>; not commodities/fixed annuities; non-government. FDIC: $250,000 bank deposits.<\/li>\n<li><strong>BCP:<\/strong> annual review, senior management approval, summary disclosed to customers at opening and on the website, two emergency contacts.<\/li>\n<\/ul>"}, {"num": 14, "name": "Retirement & Education Plans", "file": "14-retirement-and-education-plans.md", "minutes": 21, "sections": [{"id": "s14-1", "num": "14.1", "title": "Generalities", "level": 2}, {"id": "s14-2", "num": "14.2", "title": "Rules", "level": 2}, {"id": "s14-3", "num": "14.3", "title": "Workplace plans", "level": 2}, {"id": "s14-4", "num": "14.4", "title": "Individual retirement accounts (IRAs)", "level": 2}, {"id": "s14-5", "num": "14.5", "title": "Variable life insurance", "level": 2}, {"id": "s14-6", "num": "14.6", "title": "Variable annuities", "level": 2}, {"id": "s14-7", "num": "14.7", "title": "Education & other plans", "level": 2}], "html": "\n<blockquote>\n<p>IRAs, employer plans, ERISA, variable annuities and variable life, 529s and Coverdells. Expect questions on traditional vs. Roth, contribution rules, early-withdrawal penalties, RMDs, annuity phases and death benefits, and the tax treatment of each plan. Dollar limits shown are <strong>2026<\/strong> figures (the exam emphasizes rules over exact amounts).<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s14-1\" data-sec=\"s14-1\"><span class=\"secnum\">14.1<\/span> Generalities<\/h2>\n<p><strong>Why retirement plans exist.<\/strong> Tax law encourages saving for retirement by giving plans one of two tax advantages:<\/p>\n<ul>\n<li><strong>Tax-deferred (pre-tax)<\/strong> — contributions are deductible/excluded from income now, earnings grow untaxed, and <strong>all withdrawals are taxed as ordinary income<\/strong> later (traditional IRA, 401(k), 403(b), SEP, SIMPLE, non-qualified annuity <em>earnings<\/em>).<\/li>\n<li><strong>Tax-free (after-tax)<\/strong> — contributions are made with taxed dollars, earnings grow untaxed, and <strong>qualified withdrawals are entirely tax-free<\/strong> (Roth IRA, Roth 401(k), 529 plans, Coverdell ESAs, HSAs).<\/li>\n<\/ul>\n<p>Either way, growth inside the plan is <strong>not taxed while it compounds<\/strong> — the central benefit.<\/p>\n<p><strong>Qualified vs. non-qualified plans.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Qualified plan<\/strong><\/th>\n<th><strong>Non-qualified plan<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Meets IRS/ERISA requirements<\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td>Employer contributions deductible<\/td>\n<td>Yes, immediately<\/td>\n<td>Only when the employee is taxed<\/td>\n<\/tr>\n<tr>\n<td>Must be offered to all eligible employees (non-discrimination)<\/td>\n<td><strong>Yes<\/strong><\/td>\n<td>No — can favor executives<\/td>\n<\/tr>\n<tr>\n<td>Contributions<\/td>\n<td>Pre-tax<\/td>\n<td>After-tax<\/td>\n<\/tr>\n<tr>\n<td>Growth<\/td>\n<td>Tax-deferred<\/td>\n<td>Tax-deferred<\/td>\n<\/tr>\n<tr>\n<td>Withdrawals<\/td>\n<td>Fully taxable (ordinary income)<\/td>\n<td>Only <strong>earnings<\/strong> taxable<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td>401(k), 403(b), defined benefit pensions, profit-sharing, Keogh/HR-10<\/td>\n<td>Deferred compensation plans, payroll-deduction plans, non-qualified annuities<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>IRAs are not \"qualified plans\" in the ERISA sense, but they share the tax-deferral features.<\/p>\n<p><strong>Suitability basics.<\/strong> Tax-advantaged accounts should hold investments that benefit from deferral — growth stocks, taxable bonds, REITs, zero-coupon bonds. They should <strong>not<\/strong> hold <strong>municipal bonds<\/strong> (tax-free yield wasted), and <strong>annuities<\/strong> inside an IRA add cost without added tax benefit (acceptable only for the annuity's guarantees). Margin is not allowed in retirement accounts; option strategies are limited to the conservative ones.<\/p>\n<hr />\n<h2 id=\"s14-2\" data-sec=\"s14-2\"><span class=\"secnum\">14.2<\/span> Rules<\/h2>\n<h3>ERISA<\/h3>\n<p>The <strong>Employee Retirement Income Security Act of 1974<\/strong> governs <strong>private-sector<\/strong> employer retirement plans (not government or church plans, not IRAs). Its purpose: protect participants from mismanagement and abuse. Key requirements:<\/p>\n<ul>\n<li><strong>Participation (eligibility)<\/strong> — employees who are at least <strong>21<\/strong> and have <strong>one year of service<\/strong> (1,000 hours) must be allowed to participate (long-term part-time employees with 500 hours for 2 years now also qualify).<\/li>\n<li><strong>Funding<\/strong> — contributions must be segregated from employer assets (held in trust).<\/li>\n<li><strong>Vesting<\/strong> — the employee's right to <strong>employer<\/strong> contributions becomes non-forfeitable on a schedule (cliff vesting by 3 years or graded by 6 years for DC plans). <strong>Employee contributions are always 100% vested immediately.<\/strong><\/li>\n<li><strong>Non-discrimination<\/strong> — the plan can't favor highly compensated employees; tested annually.<\/li>\n<li><strong>Fiduciary responsibility<\/strong> — those who manage the plan must act <strong>solely in the interest of participants<\/strong> (the <strong>prudent expert rule<\/strong>), diversify, and follow the plan documents. An <strong>investment policy statement<\/strong> guides the plan's investments.<\/li>\n<li><strong>Reporting and disclosure<\/strong> — participants get a summary plan description, annual statements; plans file Form 5500.<\/li>\n<li><strong>Beneficiary rules<\/strong> — a married participant's spouse is the default beneficiary unless the spouse waives in writing.<\/li>\n<\/ul>\n<h3>Distributions and penalties (apply to IRAs and most qualified plans)<\/h3>\n<ul>\n<li>Withdrawals of pre-tax money are taxed as <strong>ordinary income<\/strong> — never as capital gains, regardless of what was earned inside.<\/li>\n<li><strong>Early withdrawal penalty:<\/strong> <strong>10%<\/strong> additional tax on distributions taken <strong>before age 59½<\/strong>, on top of income tax. Exceptions (no penalty, tax still due): <strong>death<\/strong>, <strong>disability<\/strong>, substantially equal periodic payments (<strong>Rule 72(t)<\/strong>), medical expenses above a threshold, qualified <strong>first-time home purchase (up to $10,000 lifetime — IRAs)<\/strong>, qualified <strong>higher education expenses (IRAs)<\/strong>, health insurance while unemployed (IRAs), birth/adoption (up to $5,000), <strong>separation from service at age 55+<\/strong> (employer plans only), qualified domestic relations orders (QDROs), terminal illness, emergency withdrawals up to $1,000/year, and certain disaster distributions.<\/li>\n<li><strong>Required minimum distributions (RMDs):<\/strong> must begin by <strong>April 1 of the year after turning 73<\/strong> (age 75 for those born in 1960 or later), then by December 31 each year. Based on the account balance divided by an IRS life-expectancy factor. <strong>Roth IRAs have no lifetime RMDs<\/strong> for the owner (and Roth 401(k)s no longer require them either). Penalty for missing an RMD: <strong>25%<\/strong> of the shortfall (reduced to 10% if corrected promptly). Still-working employees can often delay RMDs from their current employer's plan.<\/li>\n<li><strong>Rollovers and transfers.<\/strong> A <strong>direct transfer (trustee-to-trustee)<\/strong> moves money between custodians without the owner touching it — unlimited, no tax. A <strong>rollover<\/strong> is when the owner receives a check and must redeposit it within <strong>60 days<\/strong> — allowed <strong>once per 12 months<\/strong> for IRA-to-IRA rollovers; distributions from employer plans paid to the participant are subject to <strong>20% mandatory withholding<\/strong> (which the participant must make up from other funds to roll over the full amount). A direct rollover from an employer plan to an IRA avoids withholding.<\/li>\n<li><strong>Beneficiaries.<\/strong> Spouses can treat an inherited IRA as their own. Most non-spouse beneficiaries must empty an inherited IRA within <strong>10 years<\/strong> (SECURE Act). Assets in retirement accounts pass by <strong>beneficiary designation<\/strong>, not by will.<\/li>\n<li><strong>Excess contributions<\/strong> are subject to a <strong>6% penalty<\/strong> each year until removed.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s14-3\" data-sec=\"s14-3\"><span class=\"secnum\">14.3<\/span> Workplace plans<\/h2>\n<h3>Defined benefit vs. defined contribution<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Defined benefit (DB) — traditional pension<\/strong><\/th>\n<th><strong>Defined contribution (DC)<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What is defined<\/td>\n<td>The <strong>benefit<\/strong> at retirement (e.g., 2% × years of service × final salary)<\/td>\n<td>The <strong>contribution<\/strong> going in (e.g., 5% of salary + employer match)<\/td>\n<\/tr>\n<tr>\n<td>Investment risk borne by<\/td>\n<td><strong>Employer<\/strong> (must fund the promised benefit; actuaries determine contributions)<\/td>\n<td><strong>Employee<\/strong> (benefit depends on investment results)<\/td>\n<\/tr>\n<tr>\n<td>Favors<\/td>\n<td><strong>Older, highly paid<\/strong> employees with few years to retirement (larger contributions needed to fund the benefit)<\/td>\n<td><strong>Younger<\/strong> employees (longer time to compound)<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td>Corporate and government pensions<\/td>\n<td>401(k), 403(b), profit-sharing, money purchase, ESOP, SIMPLE, SEP<\/td>\n<\/tr>\n<tr>\n<td>Insured by<\/td>\n<td><strong>PBGC<\/strong> (Pension Benefit Guaranty Corporation)<\/td>\n<td>Not insured<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>401(k) plans<\/h3>\n<p>The dominant private-sector DC plan. Employees defer part of salary <strong>pre-tax<\/strong> (traditional) or <strong>after-tax (Roth 401(k))<\/strong> via payroll deduction; employers often <strong>match<\/strong> (e.g., 50% of the first 6%). 2026 employee deferral limit: <strong>$24,500<\/strong>; catch-up for age 50+: <strong>$8,000<\/strong> (super catch-up at ages 60–63: <strong>$11,250<\/strong>); total annual additions (employee + employer) limit: <strong>$72,000<\/strong>. Loans are often permitted (up to 50% of vested balance or $50,000). Employer contributions vest on a schedule. Highly compensated employees are subject to non-discrimination testing unless the plan is a \"safe harbor\" plan. <strong>Automatic enrollment<\/strong> is now required for many new plans. Hardship withdrawals are allowed but taxed and penalized.<\/p>\n<ul>\n<li><strong>Solo (individual) 401(k)<\/strong> — for self-employed persons with no employees.<\/li>\n<li><strong>Roth 401(k)<\/strong> — same limits, after-tax contributions, tax-free qualified withdrawals; no income limits (unlike Roth IRAs).<\/li>\n<\/ul>\n<h3>403(b) plans (tax-sheltered annuities, TSAs)<\/h3>\n<p>For employees of <strong>public schools, colleges, hospitals, and 501(c)(3) non-profit organizations<\/strong> (churches, charities). Same contribution limits as 401(k)s. Investments are limited to <strong>annuity contracts and mutual funds<\/strong> (no individual stocks). Contributions are pre-tax (or Roth); withdrawals taxable; 10% penalty before 59½. Long-tenured employees may have an extra catch-up.<\/p>\n<h3>457 plans<\/h3>\n<p>Deferred compensation plans for <strong>state and local government employees<\/strong> and some non-profits. Same deferral limits; <strong>no 10% early withdrawal penalty<\/strong> on separation from service (unique advantage); can be contributed to <strong>in addition to<\/strong> a 401(k)/403(b).<\/p>\n<h3>Profit-sharing plans<\/h3>\n<p>Employer contributions are <strong>discretionary<\/strong> (tied to profits or not) — flexible for the employer; no required annual contribution. Allocated to employees by a formula; same annual addition limits.<\/p>\n<h3>Money purchase plans<\/h3>\n<p>Employer must contribute a <strong>fixed percentage<\/strong> of each employee's salary every year, profit or not.<\/p>\n<h3>Employee stock ownership plans (ESOPs) and stock bonus plans<\/h3>\n<p>The plan invests primarily in the <strong>employer's stock<\/strong>; participants receive shares. Concentration risk — the exam notes the lack of diversification.<\/p>\n<h3>SEP IRAs (Simplified Employee Pension)<\/h3>\n<p>For <strong>small businesses and self-employed<\/strong>. <strong>Only the employer contributes<\/strong> (up to 25% of compensation, max <strong>$72,000<\/strong> in 2026), and the same percentage must go to all eligible employees (age 21, worked 3 of the last 5 years, earned $800+). Contributions are immediately 100% vested, held in each employee's own IRA. Easy to set up; no annual filing.<\/p>\n<h3>SIMPLE IRAs / SIMPLE 401(k)s (Savings Incentive Match Plan for Employees)<\/h3>\n<p>For employers with <strong>100 or fewer employees<\/strong> that have <strong>no other retirement plan<\/strong>. Employees defer up to <strong>$17,000<\/strong> (2026; catch-up $4,000 at 50+, $5,250 at 60–63); the employer must either <strong>match up to 3%<\/strong> of pay or contribute <strong>2%<\/strong> for everyone. Immediately vested. Early withdrawal within the <strong>first 2 years<\/strong> carries a <strong>25%<\/strong> penalty (instead of 10%).<\/p>\n<h3>Keogh (HR-10) plans<\/h3>\n<p>Older term for qualified plans of <strong>self-employed<\/strong> individuals and unincorporated businesses (sole proprietors, partnerships); contribution based on self-employment income. Largely replaced by SEPs and solo 401(k)s.<\/p>\n<h3>Non-qualified deferred compensation<\/h3>\n<p>An unsecured promise by the employer to pay an executive later; the employee is a <strong>general creditor<\/strong> if the firm fails; can be discriminatory; no immediate deduction for the employer. <strong>Payroll deduction plans<\/strong> (after-tax savings taken from paychecks) are also non-qualified.<\/p>\n<hr />\n<h2 id=\"s14-4\" data-sec=\"s14-4\"><span class=\"secnum\">14.4<\/span> Individual retirement accounts (IRAs)<\/h2>\n<p>Anyone with <strong>earned income<\/strong> (wages, salary, self-employment income, alimony under pre-2019 agreements — <strong>not<\/strong> interest, dividends, capital gains, pension, Social Security or rental income) may contribute to an IRA. A <strong>spousal IRA<\/strong> lets a non-working spouse contribute based on the working spouse's income if filing jointly. There is no longer an age limit for traditional IRA contributions.<\/p>\n<p><strong>Contribution limits (2026):<\/strong> <strong>$7,500<\/strong> per year, plus <strong>$1,100<\/strong> catch-up for age <strong>50+<\/strong>, or 100% of earned income if less. The limit is <strong>combined<\/strong> across all traditional and Roth IRAs. Contributions for a tax year may be made up to the <strong>tax-filing deadline (April 15)<\/strong> of the following year, no extensions. Excess contributions are penalized <strong>6%<\/strong> per year.<\/p>\n<h3>Traditional IRA<\/h3>\n<ul>\n<li>Contributions are <strong>tax-deductible<\/strong> unless the individual (or spouse) is <strong>covered by an employer plan<\/strong> <em>and<\/em> income exceeds phase-out thresholds — in which case the contribution may still be made but is <strong>non-deductible<\/strong> (creating after-tax basis in the IRA).<\/li>\n<li>Earnings grow <strong>tax-deferred<\/strong>.<\/li>\n<li>Withdrawals of deductible contributions and all earnings are taxed as <strong>ordinary income<\/strong>; non-deductible contributions come out tax-free (pro-rata).<\/li>\n<li><strong>10% penalty<\/strong> before <strong>59½<\/strong> (with the exceptions listed in 14.2).<\/li>\n<li><strong>RMDs<\/strong> required starting at <strong>73<\/strong> (75 for those born 1960+).<\/li>\n<\/ul>\n<h3>Roth IRA<\/h3>\n<ul>\n<li>Contributions are <strong>never deductible<\/strong> (after-tax money).<\/li>\n<li><strong>Qualified withdrawals are completely tax-free<\/strong>: the account must be open <strong>5 years<\/strong> (from the first contribution) <strong>and<\/strong> the owner must be <strong>59½<\/strong> (or dead, disabled, or using up to $10,000 for a first home). Contributions (not earnings) can be withdrawn at any time tax- and penalty-free because they were already taxed.<\/li>\n<li><strong>No RMDs<\/strong> during the owner's lifetime.<\/li>\n<li><strong>Income limits<\/strong> apply: high earners phase out of eligibility to contribute directly (a \"backdoor\" conversion route exists).<\/li>\n<li><strong>Roth conversion:<\/strong> a traditional IRA may be converted to a Roth at any income level; the converted pre-tax amount is <strong>taxed as ordinary income<\/strong> in the year of conversion (no 10% penalty).<\/li>\n<li>Best for people who expect to be in a <strong>higher<\/strong> bracket in retirement, young savers, and those who want to leave tax-free money to heirs.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Traditional IRA<\/th>\n<th>Roth IRA<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Contribution<\/td>\n<td>Pre-tax (deductible, subject to limits)<\/td>\n<td>After-tax<\/td>\n<\/tr>\n<tr>\n<td>Growth<\/td>\n<td>Tax-deferred<\/td>\n<td>Tax-free<\/td>\n<\/tr>\n<tr>\n<td>Qualified withdrawals<\/td>\n<td>Taxed as ordinary income<\/td>\n<td>Tax-free<\/td>\n<\/tr>\n<tr>\n<td>Early withdrawal<\/td>\n<td>Tax + 10% penalty on everything<\/td>\n<td>Contributions free anytime; earnings taxed + 10% if non-qualified<\/td>\n<\/tr>\n<tr>\n<td>RMDs<\/td>\n<td>Yes, at 73/75<\/td>\n<td>No (owner)<\/td>\n<\/tr>\n<tr>\n<td>Income limit to contribute<\/td>\n<td>None (limit on deductibility)<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>IRA investment rules<\/h3>\n<ul>\n<li><strong>Permitted:<\/strong> stocks, bonds, mutual funds, ETFs, CDs, annuities, US government gold/silver coins and certain bullion, REITs, options strategies that are not speculative (covered calls, protective puts).<\/li>\n<li><strong>Prohibited/ineligible:<\/strong> <strong>collectibles<\/strong> (art, antiques, stamps, most coins, gems, wine), <strong>life insurance<\/strong>, <strong>margin trading<\/strong>, short sales, uncovered options, and <strong>municipal bonds<\/strong> are not prohibited but are <strong>unsuitable<\/strong>. <strong>Prohibited transactions<\/strong> (self-dealing — borrowing from the IRA, pledging it as collateral, buying property for personal use) disqualify the entire IRA.<\/li>\n<li>The IRA must be held by a <strong>custodian/trustee<\/strong> (bank, broker-dealer, trust company).<\/li>\n<\/ul>\n<h3>Other IRA-type accounts<\/h3>\n<ul>\n<li><strong>SEP IRA, SIMPLE IRA<\/strong> — employer-sponsored (14.3).<\/li>\n<li><strong>Inherited (beneficiary) IRA<\/strong> — 10-year rule for most non-spouse beneficiaries.<\/li>\n<li><strong>Rollover IRA<\/strong> — receives money from an employer plan; keeps the option of rolling back into a future employer plan.<\/li>\n<li><strong>Health savings account (HSA)<\/strong> — triple tax advantage (deductible, tax-free growth, tax-free for medical); requires a high-deductible health plan; 2026 limits $4,400 individual / $8,750 family.<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s14-5\" data-sec=\"s14-5\"><span class=\"secnum\">14.5<\/span> Variable life insurance<\/h2>\n<p><strong>Life insurance basics.<\/strong> The policy owner pays <strong>premiums<\/strong>; the insurer pays a <strong>death benefit<\/strong> to the beneficiary when the insured dies. Death benefits are generally <strong>income-tax-free<\/strong> to the beneficiary.<\/p>\n<ul>\n<li><strong>Term life<\/strong> — pure protection for a set period; no cash value; cheapest; not a security.<\/li>\n<li><strong>Whole life<\/strong> — permanent coverage with a guaranteed cash value growing at a fixed rate; fixed premium; the insurer bears investment risk; not a security.<\/li>\n<li><strong>Universal life<\/strong> — flexible premiums and death benefit; cash value earns a rate the insurer declares; not a security.<\/li>\n<li><strong>Variable life (VL)<\/strong> — fixed premium; cash value and part of the death benefit <strong>vary<\/strong> with the performance of <strong>separate account<\/strong> sub-accounts chosen by the owner. <strong>A security<\/strong> (requires Series 6/7 + state insurance license, prospectus delivery). There is a <strong>guaranteed minimum death benefit<\/strong> (the face amount) as long as premiums are paid, but <strong>no guaranteed cash value<\/strong> — the owner bears investment risk.<\/li>\n<li><strong>Variable universal life (VUL)<\/strong> — variable life with flexible premiums; death benefit may fall below the initial face if the cash value is poor; also a security.<\/li>\n<\/ul>\n<p><strong>Variable life features the exam tests.<\/strong><\/p>\n<ul>\n<li>Premiums go partly to insurance costs/expenses and partly into the <strong>separate account<\/strong>, which is registered under the Investment Company Act of 1940 (as a UIT or open-end company); the policy is registered under the 1933 Act. Sales require <strong>both<\/strong> a securities registration and a <strong>state insurance license<\/strong>.<\/li>\n<li><strong>Cash value<\/strong> is not guaranteed; it can be borrowed against (loans reduce the death benefit if not repaid) and grows tax-deferred.<\/li>\n<li><strong>Death benefit<\/strong> has a guaranteed floor equal to the face amount; it is recalculated at least <strong>annually<\/strong> (cash value at least monthly).<\/li>\n<li><strong>Contract exchange (free-look) rights:<\/strong> the owner may exchange a variable life policy for a traditional fixed/whole life policy from the same insurer, without evidence of insurability, for at least <strong>24 months<\/strong> after issue (federal rule; many states allow longer). All variable policies have a <strong>free-look period<\/strong> (typically 10 days, up to 45 days for variable life under some rules) to cancel for a full refund.<\/li>\n<li><strong>Sales charges<\/strong> are capped at <strong>9%<\/strong> of the total premiums over the life of the policy (maximum 20 years); refunds of excess sales charges are required if the policy is surrendered in the first two years.<\/li>\n<li>Suitability: for people who need <strong>permanent life insurance<\/strong> <em>and<\/em> want equity-based growth in cash value and can tolerate investment risk; not a pure investment and not for those who need guarantees.<\/li>\n<li><strong>1035 exchange<\/strong> — tax-free exchange of one life insurance policy or annuity for another (life → life, life → annuity, annuity → annuity; <strong>annuity → life is not allowed<\/strong>).<\/li>\n<\/ul>\n<hr />\n<h2 id=\"s14-6\" data-sec=\"s14-6\"><span class=\"secnum\">14.6<\/span> Variable annuities<\/h2>\n<p>An <strong>annuity<\/strong> is a contract with an <strong>insurance company<\/strong> that provides tax-deferred growth and, at the owner's option, a stream of payments for life (or a period). Annuities are the insurance industry's answer to outliving one's money (<strong>longevity risk<\/strong>).<\/p>\n<p><strong>Fixed annuity<\/strong> — the insurer guarantees a <strong>fixed rate<\/strong> and fixed payments; the <strong>insurer<\/strong> bears the investment risk; the owner bears <strong>inflation (purchasing-power) risk<\/strong>. Backed by the insurer's <strong>general account<\/strong>. <strong>Not a security<\/strong> — only an insurance license is needed.<\/p>\n<p><strong>Variable annuity (VA)<\/strong> — the owner directs premiums into <strong>sub-accounts<\/strong> (mutual-fund-like portfolios) within the insurer's <strong>separate account<\/strong>; the value and the eventual payments <strong>vary<\/strong> with investment results; the <strong>owner bears the investment risk<\/strong>. <strong>A security<\/strong> — requires a <strong>prospectus<\/strong>, SEC registration (separate account under the 1940 Act), and reps need a securities registration (Series 6 or 7) plus a state insurance license. Sold by FINRA members; FINRA Rule 2330 requires principal review of VA purchases within 7 business days and specific suitability.<\/p>\n<p><strong>Indexed (equity-indexed) annuity<\/strong> — a fixed annuity whose credited rate is tied to an index (S&amp;P 500) with a <strong>floor<\/strong> (often 0%) and a <strong>cap/participation rate<\/strong>; generally treated as insurance, not a security, but FINRA has suitability concerns.<\/p>\n<p><strong>Two phases.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Accumulation (pay-in) phase<\/strong><\/td>\n<td>Owner contributes (lump sum, periodic, or single premium) and buys <strong>accumulation units<\/strong>; value grows tax-deferred; withdrawals allowed but taxed (<strong>LIFO<\/strong> — earnings come out first, taxed as ordinary income) and subject to the <strong>10% penalty before 59½<\/strong> and the insurer's <strong>surrender charges<\/strong> (typically declining over 5–10 years).<\/td>\n<\/tr>\n<tr>\n<td><strong>Annuitization (payout) phase<\/strong><\/td>\n<td>Accumulation units convert to a fixed number of <strong>annuity units<\/strong>; the insurer makes payments for life or a period. Each payment's <strong>value varies<\/strong> with the separate account's performance relative to the <strong>assumed interest rate (AIR)<\/strong>: if the sub-accounts earn <strong>more than the AIR<\/strong>, the next payment <strong>rises<\/strong>; less → it <strong>falls<\/strong>; exactly the AIR → unchanged. Once annuitized, the decision is irrevocable.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Payout options<\/strong> (settlement options, from highest to lowest monthly payment):<\/p>\n<ol>\n<li><strong>Life (straight life / life only)<\/strong> — payments for the annuitant's life only; stop at death. <strong>Highest<\/strong> payment, most risk (die early, lose the balance).<\/li>\n<li><strong>Life with period certain<\/strong> — for life, but at least a guaranteed number of years (e.g., 10) to a beneficiary.<\/li>\n<li><strong>Unit refund life<\/strong> — life payments, and any remaining value at death goes to the beneficiary.<\/li>\n<li><strong>Joint and last survivor<\/strong> — payments continue until the second of two annuitants dies. <strong>Lowest<\/strong> payment (longest expected period).<\/li>\n<li>Period certain only (not life-based) and lump-sum/systematic withdrawals are alternatives to annuitizing.<\/li>\n<\/ol>\n<p><strong>Taxation.<\/strong><\/p>\n<ul>\n<li>Purchased with <strong>after-tax<\/strong> dollars (non-qualified annuity): contributions are the <strong>cost basis<\/strong> (not taxed again); <strong>earnings are taxed as ordinary income<\/strong> when withdrawn. Random withdrawals are <strong>LIFO<\/strong> (earnings first). Annuitized payments use an <strong>exclusion ratio<\/strong> — part of each payment is a tax-free return of basis, part taxable.<\/li>\n<li>In a <strong>qualified<\/strong> plan (IRA, 403(b)), everything comes out taxable.<\/li>\n<li><strong>10% penalty<\/strong> on earnings withdrawn before <strong>59½<\/strong>.<\/li>\n<li><strong>Death:<\/strong> the beneficiary receives at least the <strong>guaranteed minimum death benefit<\/strong> (typically the greater of contract value or total premiums paid, less withdrawals) — this is the insurance element. Gains are taxable to the beneficiary as ordinary income (no step-up in basis).<\/li>\n<li><strong>1035 exchange<\/strong> — annuity-to-annuity swaps are tax-free, but surrender charges on the old contract and a new surrender period on the new one are a red flag for unsuitable \"churning.\"<\/li>\n<li>No contribution limits for non-qualified annuities; no RMDs during the owner's life.<\/li>\n<\/ul>\n<p><strong>Costs<\/strong> (why VAs are controversial): <strong>mortality and expense (M&amp;E) risk charge<\/strong> (pays for the death benefit guarantee and the insurer's expense risk), administrative fees, sub-account management fees, surrender charges, and charges for optional <strong>living benefit riders<\/strong> (guaranteed minimum income/withdrawal/accumulation benefits — GMIB, GMWB, GMAB). Total costs often run 2–3% a year.<\/p>\n<p><strong>Suitability.<\/strong> For investors who have <strong>maxed out<\/strong> other tax-deferred plans, have a <strong>long time horizon<\/strong> (to outlast surrender charges), want tax deferral and a lifetime income option or the death benefit, and can bear market risk. <strong>Unsuitable<\/strong> for: short horizons, seniors who may need liquidity, or placing inside an IRA solely for tax deferral (already tax-deferred). Reps must not recommend exchanges that mainly generate new commissions.<\/p>\n<hr />\n<h2 id=\"s14-7\" data-sec=\"s14-7\"><span class=\"secnum\">14.7<\/span> Education &amp; other plans<\/h2>\n<h3>529 plans (qualified tuition programs)<\/h3>\n<p>State-sponsored plans under IRC Section 529. Two types: <strong>prepaid tuition plans<\/strong> (lock in today's tuition at participating in-state public schools) and <strong>college savings plans<\/strong> (invest in mutual-fund portfolios, often age-based).<\/p>\n<ul>\n<li>Contributions are <strong>after-tax<\/strong> for federal purposes (many states give a state deduction/credit); earnings grow <strong>tax-deferred<\/strong>; withdrawals for <strong>qualified education expenses<\/strong> (tuition, fees, books, room &amp; board for college; K–12 expenses up to <strong>$20,000 per year per beneficiary from 2026<\/strong> (was $10,000 of tuition only through 2025; the 2025 tax law also broadened K–12 expenses to include books, tutoring and testing fees); registered apprenticeships; up to $10,000 lifetime of student loan repayment) are <strong>federally tax-free<\/strong>.<\/li>\n<li><strong>No income limits<\/strong> on contributors; high contribution limits (set by each state, often $300,000–$550,000 aggregate).<\/li>\n<li>Contributions are completed gifts: up to the annual exclusion (<strong>$19,000<\/strong> in 2026) per beneficiary, or a special <strong>5-year front-loading<\/strong> election (<strong>$95,000<\/strong> at once, $190,000 for a couple) with no gift tax.<\/li>\n<li>The <strong>account owner (donor) keeps control<\/strong> — not the beneficiary — and can change the beneficiary to another <strong>family member<\/strong> without tax. Assets are counted as the parent's for financial aid (favorable).<\/li>\n<li><strong>Non-qualified withdrawals:<\/strong> earnings taxed as ordinary income plus a <strong>10% penalty<\/strong> (penalty waived for death, disability, scholarship up to the scholarship amount). Unused 529 funds (account open 15+ years) can be rolled to the beneficiary's Roth IRA up to a $35,000 lifetime limit.<\/li>\n<li>Sold by prospectus-like <strong>official statement/program disclosure<\/strong>; MSRB rules apply because they are municipal fund securities (reps need a Series 6/7 and must disclose if an out-of-state plan may lose state tax benefits).<\/li>\n<\/ul>\n<h3>Coverdell Education Savings Accounts (ESAs)<\/h3>\n<ul>\n<li>After-tax contributions up to <strong>$2,000 per beneficiary per year<\/strong> (all contributors combined), until the beneficiary turns <strong>18<\/strong>.<\/li>\n<li>Tax-free growth and withdrawals for <strong>qualified K–12 or college<\/strong> expenses.<\/li>\n<li><strong>Income limits<\/strong> apply to contributors (phase-outs for high earners).<\/li>\n<li>Funds must be used by age <strong>30<\/strong> (or rolled to another family member) or earnings are taxed + 10% penalty.<\/li>\n<li>Self-directed — can hold any permitted investment, like an IRA.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>529<\/th>\n<th>Coverdell ESA<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Annual contribution<\/td>\n<td>Gift-tax limit ($19,000; 5-yr election)<\/td>\n<td>$2,000<\/td>\n<\/tr>\n<tr>\n<td>Income limits<\/td>\n<td>None<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Investment choice<\/td>\n<td>Plan's menu<\/td>\n<td>Any (self-directed)<\/td>\n<\/tr>\n<tr>\n<td>K–12<\/td>\n<td>Up to $20,000/yr from 2026 ($10,000 tuition-only before)<\/td>\n<td>All qualified K–12 expenses<\/td>\n<\/tr>\n<tr>\n<td>Age limits<\/td>\n<td>None<\/td>\n<td>Contribute until 18; use by 30<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Account owner<\/td>\n<td>Custodian/responsible individual<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>UGMA/UTMA accounts for education<\/h3>\n<p>Covered in Chapter 13 — the gift is irrevocable, the money belongs to the minor at majority (and can be spent on anything), and it is counted as the child's asset for financial aid (unfavorable). Taxed under the <strong>kiddie tax<\/strong> rules.<\/p>\n<h3>ABLE accounts (529A)<\/h3>\n<p>Tax-advantaged savings for individuals with <strong>disabilities<\/strong> that began before age 26 (46 from 2026); contributions limited to the annual gift exclusion; withdrawals tax-free for qualified disability expenses; don't jeopardize SSI/Medicaid benefits up to limits.<\/p>\n<h3>Health savings accounts (HSAs)<\/h3>\n<p>Mentioned in 14.4 — the only account that is deductible going in, tax-free growing, and tax-free coming out for medical expenses; after 65 can be used for anything (taxed like an IRA).<\/p>\n<h3>Other plans<\/h3>\n<ul>\n<li><strong>Series EE/I savings bonds<\/strong> — interest may be federally tax-free when used for education (income limits).<\/li>\n<li><strong>Deferred compensation and non-qualified plans<\/strong> — 14.3.<\/li>\n<li><strong>Social Security<\/strong> — government pension funded by FICA; benefits based on earnings history; full retirement age 66–67.<\/li>\n<\/ul>\n<hr />\n<h2>Chapter 14 quick review<\/h2>\n<ul>\n<li>Pre-tax plans (traditional IRA/401(k)): deductible in, ordinary income out. After-tax plans (Roth, 529, Coverdell): taxed in, tax-free out if qualified. Growth untaxed in both.<\/li>\n<li>Qualified plans: non-discriminatory, employer deduction, ERISA. Non-qualified: can discriminate, after-tax, only earnings taxed.<\/li>\n<li>ERISA: age 21 + 1 year, vesting (employee money always vested), non-discrimination, fiduciary/prudent expert, spouse default beneficiary; private sector only.<\/li>\n<li><strong>10% penalty before 59½<\/strong> (exceptions: death, disability, 72(t), medical, first home $10k, education, 55+ separation); <strong>RMDs at 73<\/strong> (75 if born 1960+), 25% penalty; Roth IRA no RMDs. Rollover 60 days, once/12 months, 20% withholding on plan checks; direct transfers unlimited.<\/li>\n<li>DB: benefit fixed, employer risk, favors older/high earners, PBGC. DC: contribution fixed, employee risk, favors younger.<\/li>\n<li>401(k): $24,500 (+$8,000 at 50; $11,250 at 60–63); 403(b): schools/non-profits, annuities &amp; funds only; 457: government, no 10% penalty; SEP: employer-only, 25%/$72,000; SIMPLE: ≤ 100 employees, $17,000, 3% match or 2%, 25% penalty first 2 years.<\/li>\n<li>IRA: earned income required; $7,500 + $1,100 catch-up; deadline April 15; 6% excess penalty. Traditional: deductible unless covered by plan + high income. Roth: after-tax, tax-free if 5 years + 59½, no RMDs, income limits, conversions taxable. No collectibles, life insurance, margin; munis unsuitable.<\/li>\n<li>Variable life: fixed premium, guaranteed minimum death benefit, cash value not guaranteed, separate account, security + insurance license, 24-month exchange to fixed policy, 9% sales charge cap.<\/li>\n<li>Variable annuity: security, separate account, owner bears risk; accumulation units → annuity units; payments change vs. <strong>AIR<\/strong>; straight life = highest payment, joint &amp; survivor = lowest; LIFO on withdrawals, earnings ordinary income, 10% before 59½, surrender charges, M&amp;E charge, death benefit ≥ premiums; 1035 exchanges tax-free. Fixed annuity: insurer bears risk, inflation risk for owner, not a security.<\/li>\n<li><strong>529:<\/strong> after-tax, federally tax-free for education, no income limit, 5-year gifting ($95,000), owner controls, change beneficiary within family, 10% penalty on non-qualified earnings. <strong>Coverdell:<\/strong> $2,000/yr, income limits, until 18, use by 30, K–12 OK.<\/li>\n<\/ul>"}, {"num": 15, "name": "Rules & Ethics", "file": "15-rules-and-ethics.md", "minutes": 36, "sections": [{"id": "s15-1", "num": "15.1", "title": "The regulators", "level": 2}, {"id": "s15-2", "num": "15.2", "title": "Prohibited activities", "level": 2}, {"id": "s15-2-1", "num": "15.2.1", "title": "Market manipulation", "level": 3}, {"id": "s15-2-2", "num": "15.2.2", "title": "Unethical activities", "level": 3}, {"id": "s15-2-3", "num": "15.2.3", "title": "Insider trading", "level": 3}, {"id": "s15-3", "num": "15.3", "title": "Ethical duties", "level": 2}, {"id": "s15-3-1", "num": "15.3.1", "title": "Protecting vulnerable investors", "level": 3}, {"id": "s15-3-2", "num": "15.3.2", "title": "Recognizing illegal activities", "level": 3}, {"id": "s15-4", "num": "15.4", "title": "Other laws & regulations", "level": 2}, {"id": "s15-4-1", "num": "15.4.1", "title": "Regulations", "level": 3}, {"id": "s15-4-2", "num": "15.4.2", "title": "Telephone Consumer Protection Act", "level": 3}, {"id": "s15-4-3", "num": "15.4.3", "title": "Public communications", "level": 3}, {"id": "s15-4-4", "num": "15.4.4", "title": "Proxy rules", "level": 3}, {"id": "s15-4-5", "num": "15.4.5", "title": "Licenses & CE", "level": 3}, {"id": "s15-4-6", "num": "15.4.6", "title": "Registered representative rules", "level": 3}, {"id": "s15-4-7", "num": "15.4.7", "title": "Record retention requirements", "level": 3}], "html": "\n<blockquote>\n<p>The regulators, prohibited activities, ethical duties, and the catalog of rules reps must follow — Reg BI, communications, gifts, outside business activities, licensing/CE, record retention. Section 4 of the FINRA outline (9%) plus most of Section 3's \"prohibited activities\" come from here. Lots of memorizable numbers.<\/p>\n<\/blockquote>\n<hr />\n<h2 id=\"s15-1\" data-sec=\"s15-1\"><span class=\"secnum\">15.1<\/span> The regulators<\/h2>\n<h3>Securities and Exchange Commission (SEC)<\/h3>\n<p>The <strong>federal government agency<\/strong> (created by the Securities Exchange Act of 1934) with ultimate authority over the US securities industry. Five commissioners appointed by the President, 5-year staggered terms, no more than three from one party. The SEC:<\/p>\n<ul>\n<li>Enforces the federal securities laws (1933, 1934, 1939 Trust Indenture, 1940 Investment Company and Investment Advisers Acts, Sarbanes-Oxley, Dodd-Frank).<\/li>\n<li>Reviews registration statements and public company filings (EDGAR).<\/li>\n<li>Registers and oversees broker-dealers, investment advisers, exchanges, SROs, transfer agents and clearing agencies.<\/li>\n<li>Oversees and must approve SRO rules; can discipline SROs and their members.<\/li>\n<li>Brings civil enforcement actions (fines, disgorgement, injunctions, bars); refers criminal cases to the <strong>Department of Justice<\/strong>.<\/li>\n<\/ul>\n<h3>Self-regulatory organizations (SROs)<\/h3>\n<p>Membership organizations that write and enforce rules for their members under SEC supervision.<\/p>\n<p><strong>FINRA (Financial Industry Regulatory Authority)<\/strong> — the largest SRO, formed in 2007 from the NASD and NYSE Regulation. A <strong>non-government, non-profit<\/strong> organization. Nearly every US broker-dealer and its registered representatives must be FINRA members/associated persons. FINRA:<\/p>\n<ul>\n<li>Writes and enforces rules for member firms and their associated persons (conduct rules, sales practice rules, advertising).<\/li>\n<li>Registers and tests reps and principals (administers the SIE, Series 6, 7, 24, etc.) and runs <strong>CRD<\/strong> (Central Registration Depository) and <strong>BrokerCheck<\/strong>.<\/li>\n<li>Examines member firms; investigates and disciplines violators (fines, suspensions, bars, expulsion of firms).<\/li>\n<li>Operates the largest securities <strong>arbitration and mediation<\/strong> forum.<\/li>\n<li>Provides market surveillance and trade reporting (TRACE, TRFs, ORF, OATS/CAT).<\/li>\n<li>FINRA's rulebook: the <strong>Conduct Rules<\/strong> (business practices), <strong>Uniform Practice Code<\/strong> (settlement, deliveries, ex-dates between members), <strong>Code of Procedure<\/strong> (how disciplinary cases are handled — Department of Enforcement, hearing panels, appeals to the National Adjudicatory Council, then the SEC, then federal court), and the <strong>Code of Arbitration Procedure<\/strong> (customer and industry disputes).<\/li>\n<\/ul>\n<p><strong>FINRA's By-Laws<\/strong> establish membership, registration and <strong>statutory disqualification<\/strong> (persons convicted of certain crimes, barred by regulators, etc., may not associate with a member without special approval).<\/p>\n<p><strong>Exchanges<\/strong> — NYSE, Nasdaq, Cboe and others are SROs for their own markets and members (listing standards, trading rules).<\/p>\n<p><strong>MSRB (Municipal Securities Rulemaking Board)<\/strong> — created by the 1975 amendments to the 1934 Act; writes rules for <strong>broker-dealers, bank dealers and municipal advisors<\/strong> in municipal securities (fair dealing, suitability, gifts, pay-to-play, disclosure). The MSRB has <strong>no enforcement power<\/strong> and <strong>no jurisdiction over issuers<\/strong> — its rules are enforced by <strong>FINRA<\/strong> (for securities firms), the <strong>SEC<\/strong>, and <strong>bank regulators<\/strong> (for bank dealers). Municipal issuers are exempt from SEC registration, but the anti-fraud rules still apply.<\/p>\n<h3>Other regulators and bodies<\/h3>\n<table>\n<thead>\n<tr>\n<th>Body<\/th>\n<th>Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Federal Reserve Board<\/strong><\/td>\n<td>Monetary policy; sets margin requirements (Reg T, U); regulates banks<\/td>\n<\/tr>\n<tr>\n<td><strong>State securities regulators<\/strong><\/td>\n<td>Administer state \"blue-sky\" laws under the Uniform Securities Act; register agents, broker-dealers, investment adviser representatives and securities within the state; the <strong>Administrator<\/strong> can deny/suspend/revoke registrations and investigate fraud. Coordinated through <strong>NASAA<\/strong> (North American Securities Administrators Association), which writes model rules and the Series 63/65/66 exams.<\/td>\n<\/tr>\n<tr>\n<td><strong>Department of the Treasury / FinCEN<\/strong><\/td>\n<td>Anti-money laundering (Bank Secrecy Act); receives SARs and CTRs; <strong>OFAC<\/strong> maintains sanctions lists<\/td>\n<\/tr>\n<tr>\n<td><strong>SIPC<\/strong><\/td>\n<td>Customer protection when broker-dealers fail (Chapter 13)<\/td>\n<\/tr>\n<tr>\n<td><strong>FDIC<\/strong><\/td>\n<td>Insures bank deposits (not securities)<\/td>\n<\/tr>\n<tr>\n<td><strong>CFTC<\/strong><\/td>\n<td>Regulates commodities and futures markets; the <strong>NFA<\/strong> is the futures SRO<\/td>\n<\/tr>\n<tr>\n<td><strong>Department of Labor<\/strong><\/td>\n<td>ERISA plans<\/td>\n<\/tr>\n<tr>\n<td><strong>IRS<\/strong><\/td>\n<td>Tax rules for retirement plans and investments<\/td>\n<\/tr>\n<tr>\n<td><strong>Options Clearing Corporation (OCC)<\/strong><\/td>\n<td>Issues, clears and guarantees options<\/td>\n<\/tr>\n<tr>\n<td><strong>DTCC (DTC + NSCC)<\/strong><\/td>\n<td>Clearing and depository for securities<\/td>\n<\/tr>\n<tr>\n<td><strong>State insurance commissioners<\/strong><\/td>\n<td>Fixed annuities, insurance licensing<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment Advisers Act of 1940<\/strong><\/td>\n<td>Governs investment advisers (fee-based advice); federal registration for advisers with ≥ $100 million AUM, state registration below; fiduciary duty; Form ADV<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment Company Act of 1940<\/strong><\/td>\n<td>Governs mutual funds, closed-end funds, UITs (Chapter 7)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Broker-dealers vs. investment advisers<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Broker-dealer / registered rep<\/th>\n<th>Investment adviser / IAR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Business<\/td>\n<td>Buying and selling securities for customers (commissions, markups)<\/td>\n<td>Giving advice about securities for a <strong>fee<\/strong> (asset-based, hourly, flat)<\/td>\n<\/tr>\n<tr>\n<td>Regulator<\/td>\n<td>SEC + FINRA (+ states)<\/td>\n<td>SEC (≥ $100M AUM) or state; no SRO<\/td>\n<\/tr>\n<tr>\n<td>Standard of conduct<\/td>\n<td><strong>Regulation Best Interest<\/strong> (for recommendations to retail customers); suitability for institutional<\/td>\n<td><strong>Fiduciary<\/strong> duty at all times<\/td>\n<\/tr>\n<tr>\n<td>Registration form<\/td>\n<td>BD (firm), U4 (rep)<\/td>\n<td>ADV (firm), U4 (IAR)<\/td>\n<\/tr>\n<tr>\n<td>Exams<\/td>\n<td>SIE + Series 6/7/etc.<\/td>\n<td>Series 65 or 66<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Firms are often <strong>dually registered<\/strong> as both.<\/p>\n<hr />\n<h2 id=\"s15-2\" data-sec=\"s15-2\"><span class=\"secnum\">15.2<\/span> Prohibited activities<\/h2>\n<h3 id=\"s15-2-1\" data-sec=\"s15-2-1\"><span class=\"secnum\">15.2.1<\/span> Market manipulation<\/h3>\n<p>Creating a false or misleading appearance of trading activity or prices. Prohibited under Section 9 and 10(b)/Rule 10b-5 of the 1934 Act and FINRA Rule 2020.<\/p>\n<table>\n<thead>\n<tr>\n<th>Practice<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Wash trades (wash sales)<\/strong><\/td>\n<td>Buying and selling the same security at the same time with no change in beneficial ownership, to create the appearance of volume. (Different from the tax \"wash sale rule.\")<\/td>\n<\/tr>\n<tr>\n<td><strong>Matched orders<\/strong><\/td>\n<td>Two or more parties coordinate buys and sells at the same price/time to create artificial activity or price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Painting the tape<\/strong><\/td>\n<td>A series of trades/reports designed to show activity or move the price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Marking the close / marking the open<\/strong><\/td>\n<td>Trading near the close to manipulate the closing price (affects option values, margin, fund NAVs).<\/td>\n<\/tr>\n<tr>\n<td><strong>Pump and dump<\/strong><\/td>\n<td>Hyping a (usually thinly traded) stock with false or misleading statements, then selling into the inflated price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Front-running<\/strong><\/td>\n<td>Trading ahead of a known large customer order or an upcoming research report to profit from the expected price move.<\/td>\n<\/tr>\n<tr>\n<td><strong>Spoofing / layering<\/strong><\/td>\n<td>Entering orders with no intent to execute, to move the price, then cancelling.<\/td>\n<\/tr>\n<tr>\n<td><strong>Capping / pegging<\/strong><\/td>\n<td>Trading to hold a stock's price down (capping) or up (pegging) — often around option expirations.<\/td>\n<\/tr>\n<tr>\n<td><strong>Rumor-mongering<\/strong><\/td>\n<td>Spreading false rumors to affect a price.<\/td>\n<\/tr>\n<tr>\n<td><strong>Short-sale abuses<\/strong><\/td>\n<td>Naked short selling without a locate; \"bear raids.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Interpositioning<\/strong><\/td>\n<td>Inserting an unnecessary third party between the firm and the best market, raising the customer's cost.<\/td>\n<\/tr>\n<tr>\n<td><strong>Backing away<\/strong><\/td>\n<td>A market maker refusing to honor its firm quote.<\/td>\n<\/tr>\n<tr>\n<td><strong>Freeriding<\/strong><\/td>\n<td>In a cash account, buying and selling a security without ever paying for it (using sale proceeds to cover the purchase) — results in a 90-day freeze.<\/td>\n<\/tr>\n<tr>\n<td><strong>Trading ahead<\/strong><\/td>\n<td>A firm trading for its own account ahead of a customer's limit order at the same or better price (Manning).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The <strong>only permitted \"manipulation\"<\/strong> is a disclosed <strong>stabilizing bid<\/strong> during an underwriting at or below the public offering price.<\/p>\n<h3 id=\"s15-2-2\" data-sec=\"s15-2-2\"><span class=\"secnum\">15.2.2<\/span> Unethical activities<\/h3>\n<p>Sales-practice violations that hurt customers; grounds for FINRA discipline and often civil liability.<\/p>\n<table>\n<thead>\n<tr>\n<th>Practice<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Churning (excessive trading)<\/strong><\/td>\n<td>Trading a customer's account excessively to generate commissions, relative to the customer's objectives and resources. Red flags: high turnover, cost-to-equity ratio, in-and-out trading. Especially scrutinized in <strong>discretionary<\/strong> accounts. The rep's profit, not the customer's loss, is the measure.<\/td>\n<\/tr>\n<tr>\n<td><strong>Unsuitable recommendations<\/strong><\/td>\n<td>Recommending a security or strategy that doesn't fit the customer's profile (Reg BI / Rule 2111), e.g., speculative products for a conservative retiree, Class B shares for a $1 million purchase, VAs for an 85-year-old needing liquidity.<\/td>\n<\/tr>\n<tr>\n<td><strong>Unauthorized trading<\/strong><\/td>\n<td>Executing a trade without the customer's permission (and without written discretionary authority). Even a profitable unauthorized trade is a violation.<\/td>\n<\/tr>\n<tr>\n<td><strong>Misrepresentation / omission<\/strong><\/td>\n<td>False statements or leaving out material facts — about the security, the rep's qualifications, fees, or risks. Telling a customer the SEC \"approved\" a security.<\/td>\n<\/tr>\n<tr>\n<td><strong>Guarantees against loss<\/strong><\/td>\n<td>A rep or firm may <strong>never<\/strong> guarantee a customer against loss or promise a specific return (except for the issuer's own guarantees properly described, e.g., a bond's stated coupon).<\/td>\n<\/tr>\n<tr>\n<td><strong>Sharing in a customer's account<\/strong><\/td>\n<td>A rep may share in profits/losses of a customer's account <strong>only<\/strong> with <strong>prior written approval of the firm<\/strong> and the customer, and only in <strong>proportion to the rep's investment<\/strong> (exception: immediate family — proportional sharing not required).<\/td>\n<\/tr>\n<tr>\n<td><strong>Selling away<\/strong><\/td>\n<td>Participating in <strong>private securities transactions<\/strong> outside the firm (e.g., selling a friend's private placement) without <strong>prior written notice<\/strong> to the firm — and, if compensated, the firm's written <strong>approval and supervision<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Borrowing from or lending to customers<\/strong><\/td>\n<td>Prohibited unless the firm has written procedures allowing it <strong>and<\/strong> the customer is an immediate family member, a financial institution in the lending business, a registered person of the same firm, or has a personal/business relationship outside the brokerage relationship — with firm notice/approval as the procedures require.<\/td>\n<\/tr>\n<tr>\n<td><strong>Commingling<\/strong><\/td>\n<td>Mixing customer funds/securities with the firm's or the rep's own. Firms must segregate fully paid customer securities.<\/td>\n<\/tr>\n<tr>\n<td><strong>Breakpoint sales<\/strong><\/td>\n<td>Recommending a mutual fund purchase just below a breakpoint or splitting across families to avoid giving the discount (Chapter 7).<\/td>\n<\/tr>\n<tr>\n<td><strong>Switching<\/strong><\/td>\n<td>Moving a customer between fund families or VAs to generate new sales charges without a legitimate reason.<\/td>\n<\/tr>\n<tr>\n<td><strong>Signature forgery / improper use of customer documents<\/strong><\/td>\n<td>Pre-signed blank forms, altering documents, signing for a customer — serious violations.<\/td>\n<\/tr>\n<tr>\n<td><strong>Using customer information improperly<\/strong><\/td>\n<td>Disclosing non-public personal information (Reg S-P), trading on it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Failure to disclose conflicts<\/strong><\/td>\n<td>Control relationships (firm controls or is controlled by the issuer), compensation arrangements, research analyst conflicts.<\/td>\n<\/tr>\n<tr>\n<td><strong>Blanket recommendations<\/strong><\/td>\n<td>Recommending the same security to all customers regardless of their profiles.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fictitious accounts / parking<\/strong><\/td>\n<td>Hiding positions in other accounts to evade rules or taxes.<\/td>\n<\/tr>\n<tr>\n<td><strong>Discrimination / high-pressure tactics / cold-calling violations<\/strong><\/td>\n<td>Chapter 15.4.2<\/td>\n<\/tr>\n<tr>\n<td><strong>Prohibited compensation<\/strong><\/td>\n<td>Accepting payment from non-members for securities business; paying continuing commissions only under written agreements.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sanctions.<\/strong> FINRA may censure, fine, suspend, bar individuals, expel firms, and order restitution. The SEC and state regulators can bring civil actions; the <strong>DOJ<\/strong> handles criminal prosecution (fraud carries up to <strong>20 years<\/strong> in prison and $5 million fines under Sarbanes-Oxley). Violations must be reported to the firm; the firm reports on Form U4/U5 and under Rule 4530.<\/p>\n<h3 id=\"s15-2-3\" data-sec=\"s15-2-3\"><span class=\"secnum\">15.2.3<\/span> Insider trading<\/h3>\n<p><strong>Insider trading<\/strong> is buying or selling a security while in possession of <strong>material, non-public information (MNPI)<\/strong> about the issuer, or <strong>tipping<\/strong> such information to others who trade. Illegal under <strong>Rule 10b-5<\/strong> of the 1934 Act and the <strong>Insider Trading and Securities Fraud Enforcement Act of 1988 (ITSFEA)<\/strong>.<\/p>\n<ul>\n<li><strong>Material<\/strong> — a reasonable investor would consider it important (earnings, mergers, new products, dividend changes, management changes, regulatory actions, major contracts).<\/li>\n<li><strong>Non-public<\/strong> — not yet disseminated to the general public (via press release, SEC filing, etc.). Information remains non-public until it's been broadly released <strong>and<\/strong> the market has had time to absorb it.<\/li>\n<li><strong>Insiders<\/strong> include not just officers, directors and 10% holders, but anyone who receives MNPI in a position of trust — lawyers, accountants, bankers, printers, consultants, family members, and <strong>anyone who gets a tip<\/strong> (the tippee), no matter how far down the chain. The <strong>tipper<\/strong> is liable even if they didn't trade. Under the <strong>misappropriation theory<\/strong>, a person who steals confidential information from any source (e.g., a lawyer trading on a client's merger plans) is also liable.<\/li>\n<li><strong>Trading isn't required<\/strong> — passing the tip is a violation. Recommending a security based on MNPI (without saying why) is also a violation.<\/li>\n<li><strong>Penalties (ITSFEA):<\/strong> <strong>civil penalty up to three times the profit gained or loss avoided (treble damages)<\/strong>, disgorgement, and <strong>criminal penalties of up to 20 years in prison and $5 million per individual<\/strong> (<strong>$25 million<\/strong> for firms). <strong>Controlling persons<\/strong> (the firm/supervisor) who fail to take steps to prevent insider trading can be fined the greater of $1 million (inflation-adjusted upward) or three times the profit. Whistleblowers may receive bounties (10–30% of recoveries). The statute of limitations is 5 years.<\/li>\n<li><strong>Firm obligations:<\/strong> every broker-dealer and adviser must maintain written policies to prevent misuse of MNPI — <strong>information barriers (\"Chinese walls\")<\/strong> between investment banking/research and trading/sales, <strong>restricted lists<\/strong> and <strong>watch lists<\/strong>, employee trading pre-clearance and surveillance.<\/li>\n<li><strong>Regulation FD (Fair Disclosure)<\/strong> — public companies that disclose MNPI to analysts or institutions must disclose it to the public simultaneously (if intentional) or promptly (if accidental).<\/li>\n<li><strong>Section 16 short-swing rule<\/strong> — corporate insiders must return profits from buying and selling within 6 months, regardless of whether they had MNPI.<\/li>\n<li><strong>Rule 10b5-1 plans<\/strong> — pre-arranged trading plans let insiders sell on a schedule without being accused of trading on MNPI.<\/li>\n<\/ul>\n<p>What is <strong>not<\/strong> insider trading: trading on publicly available information, on rumors, on your own analysis (\"mosaic theory\" — assembling public and non-material private information), or by an insider under a 10b5-1 plan.<\/p>\n<hr />\n<h2 id=\"s15-3\" data-sec=\"s15-3\"><span class=\"secnum\">15.3<\/span> Ethical duties<\/h2>\n<h3 id=\"s15-3-1\" data-sec=\"s15-3-1\"><span class=\"secnum\">15.3.1<\/span> Protecting vulnerable investors<\/h3>\n<p><strong>Senior and vulnerable adult protection (FINRA Rules 2165 and 4512).<\/strong><\/p>\n<ul>\n<li>Firms must make <strong>reasonable efforts to obtain the name and contact information of a trusted contact person<\/strong> (age 18+) when opening or updating an account. The firm may contact that person to address possible financial exploitation, confirm the customer's current contact information or health status, or identify a legal guardian/POA — but the trusted contact has no authority over the account.<\/li>\n<li>A <strong>\"specified adult\"<\/strong> is anyone <strong>65 or older<\/strong>, or anyone <strong>18+<\/strong> with a mental or physical impairment that makes them unable to protect their own interests.<\/li>\n<li>If the firm reasonably believes <strong>financial exploitation<\/strong> of a specified adult has occurred or is being attempted, it may place a <strong>temporary hold on disbursements<\/strong> (and, since 2022, on transactions) for up to <strong>15 business days<\/strong>, extendable by <strong>10 more<\/strong> business days (and another 30 if a regulator/agency asks). The firm must notify the trusted contact and all parties authorized on the account within 2 business days (unless they're suspected of the exploitation), open an internal review, and document everything. Firms must train associated persons on these issues.<\/li>\n<li>State laws may also require reporting to Adult Protective Services; many states have adopted the NASAA model act.<\/li>\n<li>Suitability concerns for seniors: liquidity needs, shorter horizons, cognitive decline, products with long surrender periods (VAs, non-traded REITs), concentrated positions, high-pressure \"free lunch\" seminars. Reps must not use misleading <strong>senior designations<\/strong> (\"certified senior adviser\") that imply special expertise without real credentials.<\/li>\n<li><strong>Diminished capacity<\/strong> red flags: confusion about transactions, uncharacteristic trades, new \"friends\" or caregivers involved in finances, isolation from family, urgency, large gifts or withdrawals.<\/li>\n<\/ul>\n<p><strong>Military personnel<\/strong> — protected from abusive sales of periodic payment plans (Military Personnel Financial Services Protection Act); firms must not make false statements about endorsements by the armed forces.<\/p>\n<p><strong>Privacy (Regulation S-P).<\/strong> Firms must protect customers' <strong>non-public personal information<\/strong>: deliver a <strong>privacy notice<\/strong> at account opening and <strong>annually<\/strong>, give customers the right to <strong>opt out<\/strong> of sharing with non-affiliated third parties, safeguard data (written policies, encryption, secure disposal — the Safeguards and Disposal Rules), and now notify customers of data breaches within 30 days. <strong>Regulation S-ID<\/strong> requires identity-theft \"red flag\" programs.<\/p>\n<h3 id=\"s15-3-2\" data-sec=\"s15-3-2\"><span class=\"secnum\">15.3.2<\/span> Recognizing illegal activities<\/h3>\n<p>Associated persons are expected to know and report the following:<\/p>\n<p><strong>Money laundering (the Bank Secrecy Act / USA PATRIOT Act).<\/strong> Reviewed in Chapter 13: three stages (placement, layering, integration), <strong>SARs for $5,000+<\/strong> suspicious activity within 30 days (never tell the customer), <strong>CTRs for cash over $10,000<\/strong>, <strong>structuring<\/strong> is a crime, customer identification and OFAC screening, the firm's AML program (written, AML compliance officer named to FINRA, annual independent audit, training). Red flags: a customer who is secretive about the source of funds, wires to/from high-risk countries, deposits followed by immediate withdrawals with no investment purpose, multiple accounts with no apparent reason, transactions that make no economic sense, reluctance to provide ID, third-party payments.<\/p>\n<p><strong>Cash reporting.<\/strong> A firm receiving more than <strong>$10,000 in cash<\/strong> in one transaction (or related transactions) files a CTR; the definition of cash includes currency and certain monetary instruments. Reps should also know that personal checks and wire transfers are not \"cash\" for CTR purposes but can still be suspicious.<\/p>\n<p><strong>Financial exploitation of seniors<\/strong> (15.3.1).<\/p>\n<p><strong>Insider trading<\/strong> (15.2.3) and <strong>market manipulation<\/strong> (15.2.1).<\/p>\n<p><strong>Fraud indicators:<\/strong> Ponzi schemes (returns paid from new investors' money; promises of consistent high returns regardless of market), affinity fraud (targeting a religious/ethnic group), pump-and-dumps, advance-fee schemes, unregistered offerings sold with guarantees, and offshore \"prime bank\" schemes. Red flags: guaranteed returns, unregistered persons/products, secrecy, pressure to act fast, difficulty getting paid out, missing or unaudited statements.<\/p>\n<p><strong>Cybersecurity.<\/strong> Phishing, account takeovers, identity theft. Firms must have written cybersecurity policies, protect customer data, verify wire/disbursement requests (callbacks), and report breaches.<\/p>\n<p><strong>Whistleblowing.<\/strong> The Dodd-Frank SEC whistleblower program pays <strong>10–30%<\/strong> of sanctions over $1 million to people who provide original information; retaliation is prohibited. Associated persons who learn of violations must report them internally; firms must have procedures (and a hotline) for this.<\/p>\n<p><strong>Reporting obligations of associated persons.<\/strong> Reps must promptly report (so the firm can update Form U4 within 30 days): arrests/charges/convictions for felonies or securities-related misdemeanors, regulatory actions, customer complaints alleging fraud or theft, bankruptcies, judgments/liens, being named in investigations, and outside business activities. Failure to update a U4 is itself a violation.<\/p>\n<hr />\n<h2 id=\"s15-4\" data-sec=\"s15-4\"><span class=\"secnum\">15.4<\/span> Other laws &amp; regulations<\/h2>\n<h3 id=\"s15-4-1\" data-sec=\"s15-4-1\"><span class=\"secnum\">15.4.1<\/span> Regulations<\/h3>\n<p><strong>The alphabet of laws (one line each — the exam asks \"which act…?\").<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Law<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Securities Act of 1933<\/strong><\/td>\n<td>New issues (primary market); registration and prospectus; anti-fraud; exemptions. \"Paper Act.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Securities Exchange Act of 1934<\/strong><\/td>\n<td>Secondary market; created the SEC; registration of BDs, exchanges, SROs; reporting; proxy rules; insider rules; margin (Fed); anti-manipulation; Rule 10b-5. \"People Act.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Maloney Act of 1938<\/strong><\/td>\n<td>Amended the 1934 Act to allow a national securities association (NASD → FINRA) to self-regulate the OTC market.<\/td>\n<\/tr>\n<tr>\n<td><strong>Trust Indenture Act of 1939<\/strong><\/td>\n<td>Corporate bond issues over $50 million (public) must have a trust indenture and an independent trustee. Not for government/municipal bonds.<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment Company Act of 1940<\/strong><\/td>\n<td>Regulates mutual funds, closed-end funds, UITs, face-amount certificate companies.<\/td>\n<\/tr>\n<tr>\n<td><strong>Investment Advisers Act of 1940<\/strong><\/td>\n<td>Regulates persons who give securities advice for compensation; fiduciary duty; registration (Form ADV); anti-fraud; exemptions for BDs whose advice is incidental, banks, lawyers/accountants/teachers/engineers (LATE), publishers.<\/td>\n<\/tr>\n<tr>\n<td><strong>Securities Investor Protection Act of 1970<\/strong><\/td>\n<td>Created SIPC.<\/td>\n<\/tr>\n<tr>\n<td><strong>Securities Acts Amendments of 1975<\/strong><\/td>\n<td>Created the MSRB; national market system.<\/td>\n<\/tr>\n<tr>\n<td><strong>Insider Trading and Securities Fraud Enforcement Act of 1988<\/strong><\/td>\n<td>Penalties for insider trading (treble damages, $5M/20 years); firms must have procedures.<\/td>\n<\/tr>\n<tr>\n<td><strong>Uniform Securities Act (state \"blue-sky\" laws)<\/strong><\/td>\n<td>Model state law; registration of agents, BDs, IAs, IARs and securities at the state level; the state <strong>Administrator<\/strong>; anti-fraud.<\/td>\n<\/tr>\n<tr>\n<td><strong>Telephone Consumer Protection Act of 1991<\/strong><\/td>\n<td>Cold-calling rules (15.4.2).<\/td>\n<\/tr>\n<tr>\n<td><strong>Bank Secrecy Act (1970) / USA PATRIOT Act (2001)<\/strong><\/td>\n<td>AML: CIP, SARs, CTRs, OFAC, AML programs.<\/td>\n<\/tr>\n<tr>\n<td><strong>Gramm-Leach-Bliley Act (1999)<\/strong><\/td>\n<td>Privacy of consumer financial information → Regulation S-P.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sarbanes-Oxley Act of 2002<\/strong><\/td>\n<td>Corporate accountability after Enron: CEO/CFO certification of financial reports, auditor independence, PCAOB, research analyst conflict rules, criminal penalties for securities fraud (up to 20 years).<\/td>\n<\/tr>\n<tr>\n<td><strong>Dodd-Frank Act of 2010<\/strong><\/td>\n<td>Post-crisis reform: FSOC, CFPB, Volcker rule, derivatives regulation, whistleblower program, SEC authority over hedge fund advisers, \"say-on-pay.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>JOBS Act of 2012<\/strong><\/td>\n<td>Eased capital raising: emerging growth companies, crowdfunding, Reg A+, general solicitation in 506(c).<\/td>\n<\/tr>\n<tr>\n<td><strong>Regulation Best Interest (Reg BI, 2020)<\/strong><\/td>\n<td>BDs and reps must act in the <strong>best interest<\/strong> of retail customers when making recommendations, without placing their own interest ahead (15.4.6).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Key SEC regulations by letter:<\/strong> <strong>Reg T<\/strong> (margin — Fed), <strong>Reg D<\/strong> (private placements), <strong>Reg A<\/strong> (small offerings), <strong>Reg S<\/strong> (offshore), <strong>Reg M<\/strong> (distributions/anti-manipulation), <strong>Reg SHO<\/strong> (short sales), <strong>Reg NMS<\/strong> (national market system — best execution/order protection), <strong>Reg FD<\/strong> (fair disclosure), <strong>Reg S-P<\/strong> (privacy), <strong>Reg S-ID<\/strong> (identity theft), <strong>Reg BI<\/strong> (best interest), <strong>Reg SCI<\/strong> (systems compliance), <strong>Reg ATS<\/strong> (alternative trading systems).<\/p>\n<h3 id=\"s15-4-2\" data-sec=\"s15-4-2\"><span class=\"secnum\">15.4.2<\/span> Telephone Consumer Protection Act<\/h3>\n<p>The <strong>TCPA of 1991<\/strong> (FCC rules, implemented in FINRA Rule 3230) regulates <strong>cold calls<\/strong> (unsolicited telephone solicitations to people with no existing relationship):<\/p>\n<ul>\n<li>Calls only between <strong>8:00 am and 9:00 pm<\/strong> in the <strong>called party's<\/strong> local time zone (unless the person has given prior consent or is an existing customer).<\/li>\n<li>The caller must give their <strong>name, the firm's name, the firm's address or telephone number<\/strong>, and that the purpose is to sell securities.<\/li>\n<li>Firms must maintain a <strong>firm-specific do-not-call list<\/strong> (honor requests for at least <strong>5 years<\/strong>) and must check the <strong>National Do-Not-Call Registry<\/strong> at least every <strong>31 days<\/strong> before calling; numbers on the registry may not be called unless there's an established business relationship (within the prior <strong>18 months<\/strong>) or prior written consent (within 3 months of an inquiry).<\/li>\n<li><strong>No auto-dialed or pre-recorded calls<\/strong> to cell phones without prior express consent; no unsolicited <strong>fax<\/strong> advertisements.<\/li>\n<li>Firms must train callers and keep records. Calls made in violation expose the firm to fines of $500–$1,500 per call.<\/li>\n<li>Exemptions: calls to existing customers (relationship within 18 months), calls to persons who gave written consent, calls by a rep on behalf of a tax-exempt non-profit, and calls not making a sales pitch.<\/li>\n<\/ul>\n<h3 id=\"s15-4-3\" data-sec=\"s15-4-3\"><span class=\"secnum\">15.4.3<\/span> Public communications<\/h3>\n<p>FINRA Rule 2210 classifies communications by audience and sets approval, filing and content standards.<\/p>\n<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>Definition<\/th>\n<th>Approval<\/th>\n<th>Filing with FINRA<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Correspondence<\/strong><\/td>\n<td>Written/electronic communication to <strong>25 or fewer retail investors<\/strong> within any 30-day period<\/td>\n<td>Supervisory <strong>review<\/strong> (need not be pre-approved; firms must have procedures for review of incoming and outgoing)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Retail communication<\/strong><\/td>\n<td>Written/electronic communication to <strong>more than 25 retail investors<\/strong> within 30 days (ads, sales literature, websites, social media posts, seminars scripts, form letters, TV/radio, mutual fund literature)<\/td>\n<td><strong>Prior approval by a registered principal<\/strong> before use (with limited exceptions for reuse of approved material)<\/td>\n<td>Some types must be filed: new firms (first year) file <strong>10 business days before first use<\/strong>; investment company (mutual fund, VA), DPP, CMO and options material filed <strong>within 10 business days of first use<\/strong>; free-writing prospectuses may require filing<\/td>\n<\/tr>\n<tr>\n<td><strong>Institutional communication<\/strong><\/td>\n<td>Communication distributed <strong>only to institutional investors<\/strong> (banks, insurers, investment companies, RIAs, entities with ≥ $50 million assets, government entities, employee benefit plans with ≥ 100 participants, FINRA members)<\/td>\n<td>Written procedures; need not be pre-approved by a principal (but may be)<\/td>\n<td>No<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Content standards (all communications).<\/strong> Must be <strong>fair and balanced<\/strong>, based on principles of fair dealing and good faith; must not omit material facts; no exaggerated, unwarranted, promissory or misleading statements; <strong>no predictions or projections of performance<\/strong> (except hypothetical illustrations in certain tools, e.g., VA illustrations at a 0% and ≤ 12% rate); must disclose the firm's name; comparisons must be fair; testimonials must disclose if paid and that they may not be representative; research reports and recommendations must disclose conflicts (the firm's position, investment banking relationships, analyst's holdings); must not imply SEC/FINRA approval.<\/p>\n<p><strong>Specific items.<\/strong><\/p>\n<ul>\n<li><strong>Mutual fund performance<\/strong> must show standardized 1-, 5- and 10-year average annual total returns as of the most recent quarter, with the maximum sales charge reflected, plus the \"past performance\" disclaimer. <strong>Rankings<\/strong> must be from independent sources and disclose the category and time period. <strong>Yield<\/strong> quoted as SEC standardized yield.<\/li>\n<li><strong>Options communications<\/strong> must be preceded or accompanied by the ODD unless they're limited to general descriptions; approved by a Registered Options Principal.<\/li>\n<li><strong>Social media:<\/strong> static content (profile, background) = retail communication requiring principal approval; interactive/real-time posts (tweets, chat) = treated like correspondence (supervised, retained) but must still be fair and not misleading. Reps may not use personal social media for business unless the fi
