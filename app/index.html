 55 it becomes a market order to sell. Sell limits go above the market."}, {"id": 115, "ch": 12, "sec": "12.6.4", "fs": 3, "q": "The primary disadvantage of a sell stop-limit order compared with a sell stop order is that:", "o": ["It may be executed at a much lower price than the stop", "It may never be executed if the stock gaps below the limit", "It requires a margin account", "It cannot be entered as a GTC order"], "a": 1, "e": "Once triggered, a stop-limit becomes a limit order; if the price falls through the limit the order sits unfilled, leaving the investor unprotected."}, {"id": 116, "ch": 12, "sec": "12.6.5", "fs": 3, "q": "Which orders are placed BELOW the current market price?", "o": ["Buy limit and sell stop", "Buy stop and sell limit", "Buy limit and buy stop", "Sell stop and sell limit"], "a": 0, "e": "BLiSS: Buy Limits and Sell Stops go below the market. SLoBS: Sell Limits and Buy Stops go above."}, {"id": 117, "ch": 12, "sec": "12.6.6", "fs": 3, "q": "A customer tells a rep to 'buy 1,000 shares of XYZ today at the best price you can get.' This order is:", "o": ["Discretionary and requires written authorization", "A not-held order that does not require written authorization", "Prohibited without principal approval", "A market-on-close order"], "a": 1, "e": "The customer specified security, action and amount; leaving only time and price to the rep is not discretion. It's a not-held order, good for the day."}, {"id": 118, "ch": 12, "sec": "12.5", "fs": 4, "q": "The Securities Exchange Act of 1934 did all of the following EXCEPT:", "o": ["Create the SEC", "Require registration of broker-dealers", "Require registration of new securities issues with a prospectus", "Give the Federal Reserve authority over margin"], "a": 2, "e": "Registration of new issues and the prospectus requirement come from the Securities Act of 1933. The 1934 Act regulates the secondary market, created the SEC, and covers BDs, exchanges, margin and anti-fraud."}, {"id": 119, "ch": 12, "sec": "12.4.1", "fs": 1, "q": "A market-wide circuit breaker halts trading for the remainder of the day when the S&P 500 falls:", "o": ["7%", "10%", "13%", "20%"], "a": 3, "e": "Level 1 (7%) and Level 2 (13%) trigger 15-minute halts (before 3:25 pm); Level 3 (20%) closes the market for the day."}, {"id": 120, "ch": 12, "sec": "12.6.7", "fs": 3, "q": "A broker-dealer receives payment for order flow from a market maker. The firm:", "o": ["May route orders to that market maker regardless of price", "Must still obtain best execution for its customers and disclose the arrangement", "Must refuse the payment", "May accept the payment only for institutional orders"], "a": 1, "e": "Payment for order flow is legal but must be disclosed, and it never overrides the duty of best execution."}, {"id": 121, "ch": 13, "sec": "13.2.1", "fs": 3, "q": "Which of the following is NOT required to open a cash account?", "o": ["The customer's date of birth", "The customer's Social Security number", "The customer's signature", "A principal's approval"], "a": 2, "e": "A customer signature isn't required for a cash account (it is for margin and options accounts). Name, address, DOB, TIN, rep name and principal approval are required."}, {"id": 122, "ch": 13, "sec": "13.3.2", "fs": 3, "q": "In a joint account registered as tenants in common, when one owner dies, that owner's share:", "o": ["Passes automatically to the surviving owner", "Passes to the deceased's estate", "Is divided equally among all surviving owners", "Is frozen for one year"], "a": 1, "e": "TIC: the deceased's (possibly unequal) share goes to the estate. JTWROS: it passes to the survivor(s)."}, {"id": 123, "ch": 13, "sec": "13.3.5", "fs": 3, "q": "Which of the following is TRUE of an UTMA account?", "o": ["There may be multiple custodians for one minor", "Gifts to the account are revocable until the minor reaches majority", "The account uses the minor's Social Security number and the minor is the beneficial owner", "The custodian may trade on margin to maximize growth"], "a": 2, "e": "One custodian, one minor; gifts are irrevocable; the minor is the beneficial owner and taxpayer; no margin; the custodian is a fiduciary."}, {"id": 124, "ch": 13, "sec": "13.3.4", "fs": 3, "q": "Before a registered representative may exercise discretion over which securities to buy in a customer's account, the firm must have:", "o": ["An oral authorization from the customer", "Written authorization from the customer and principal approval of the account", "A trusted contact person on file", "A signed options agreement"], "a": 1, "e": "Discretion over security, action or amount requires written trading authorization and principal approval, plus frequent principal review of the account."}, {"id": 125, "ch": 13, "sec": "13.4.3", "fs": 3, "q": "A customer buys $3,000 of stock in a new margin account. The required deposit is:", "o": ["$1,500", "$2,000", "$3,000", "$750"], "a": 1, "e": "Reg T is 50% ($1,500), but FINRA's $2,000 minimum initial equity applies when the purchase exceeds $2,000. If the purchase were under $2,000, the customer would pay in full."}, {"id": 126, "ch": 13, "sec": "13.4.5", "fs": 3, "q": "A long margin account has a market value of $16,000 and a debit balance of $13,000. At the FINRA minimum maintenance requirement, the maintenance call is:", "o": ["$0", "$1,000", "$3,000", "$4,000"], "a": 1, "e": "Equity = $3,000. Required = 25% × $16,000 = $4,000. Call = $1,000."}, {"id": 127, "ch": 13, "sec": "13.4.2", "fs": 3, "q": "The part of the margin agreement that allows the broker-dealer to pledge the customer's securities to a bank as collateral for the loan is the:", "o": ["Credit agreement", "Hypothecation agreement", "Loan consent form", "Risk disclosure statement"], "a": 1, "e": "The hypothecation agreement lets the firm pledge (rehypothecate) up to 140% of the debit balance. The optional loan consent allows lending the shares to other customers for short sales."}, {"id": 128, "ch": 13, "sec": "13.5", "fs": 3, "q": "A customer's options account was approved on June 1 but the signed options agreement has not been returned by June 20. The customer may:", "o": ["Continue trading normally", "Open new positions only with principal approval", "Only close existing positions", "Trade only covered calls"], "a": 2, "e": "The options agreement must be returned within 15 days of approval; otherwise the account is limited to closing transactions."}, {"id": 129, "ch": 13, "sec": "13.6.1", "fs": 3, "q": "SIPC protects customers against:", "o": ["Market losses on securities", "Losses from unsuitable recommendations", "Loss of cash and securities if the broker-dealer fails", "Losses in commodity futures accounts"], "a": 2, "e": "SIPC covers missing customer assets when a member firm becomes insolvent — up to $500,000 per separate customer, including $250,000 cash. It never covers market losses."}, {"id": 130, "ch": 13, "sec": "13.6.1", "fs": 3, "q": "A customer has an individual account with $400,000 in securities and $300,000 in cash at a failed broker-dealer. SIPC coverage is:", "o": ["$500,000", "$650,000", "$700,000", "$250,000"], "a": 0, "e": "SIPC covers up to $500,000 per separate customer in total, of which no more than $250,000 may be cash. The $400,000 in securities is fully covered and the first $100,000 of cash fills the remaining room, for a total of $500,000. The other $200,000 of cash becomes a general creditor claim against the firm."}, {"id": 131, "ch": 13, "sec": "13.2.3", "fs": 3, "q": "A broker-dealer must file a Suspicious Activity Report with FinCEN for suspicious transactions involving at least:", "o": ["$3,000", "$5,000", "$10,000", "$25,000"], "a": 1, "e": "SARs are filed within 30 days for suspicious activity of $5,000 or more; the customer must not be told. CTRs are filed for cash transactions over $10,000."}, {"id": 132, "ch": 13, "sec": "13.6.2", "fs": 4, "q": "FINRA's business continuity plan rule requires each member firm to:", "o": ["Keep its BCP confidential from customers", "Disclose a summary of the plan to customers at account opening and on its website", "Update the plan every five years", "Designate a single emergency contact at FINRA"], "a": 1, "e": "Firms must review the BCP annually, have senior management approve it, give customers a written summary at account opening (and on request/website), and designate two emergency contacts."}, {"id": 133, "ch": 14, "sec": "14.4", "fs": 3, "q": "A 45-year-old investor withdraws $10,000 from a traditional IRA to buy a boat. The withdrawal is:", "o": ["Tax-free", "Taxed as ordinary income only", "Taxed as ordinary income plus a 10% penalty", "Taxed as a long-term capital gain"], "a": 2, "e": "Distributions before 59½ without an exception are taxed as ordinary income plus a 10% additional tax."}, {"id": 134, "ch": 14, "sec": "14.4", "fs": 3, "q": "Which statement about a Roth IRA is TRUE?", "o": ["Contributions are tax-deductible", "Required minimum distributions begin at age 73", "Qualified withdrawals are tax-free after five years and age 59½", "Anyone with earned income may contribute regardless of income"], "a": 2, "e": "Roth contributions are after-tax, there are no lifetime RMDs, income limits apply, and qualified withdrawals (5-year rule + 59½, death, disability, or first home) are tax-free."}, {"id": 135, "ch": 14, "sec": "14.3", "fs": 3, "q": "In a defined benefit pension plan, the investment risk is borne by:", "o": ["The employee", "The employer", "The plan trustee", "The PBGC"], "a": 1, "e": "The employer promises a specific benefit and must fund it regardless of investment results. In a defined contribution plan the employee bears the risk."}, {"id": 136, "ch": 14, "sec": "14.2", "fs": 3, "q": "A participant in a 401(k) receives a distribution check payable to herself and intends to roll it into an IRA. She must complete the rollover within:", "o": ["30 days", "60 days", "90 days", "One year"], "a": 1, "e": "Indirect rollovers must be completed within 60 days; 20% is withheld from plan distributions, which she must make up to roll over the full amount. Direct transfers avoid these issues."}, {"id": 137, "ch": 14, "sec": "14.6", "fs": 2, "q": "During the payout phase of a variable annuity, the monthly payment will increase if the separate account's return is:", "o": ["Positive", "Greater than the assumed interest rate", "Greater than the prior month's return", "Greater than the CPI"], "a": 1, "e": "Payments change relative to the AIR: return above the AIR raises the next payment; below lowers it; equal keeps it unchanged."}, {"id": 138, "ch": 14, "sec": "14.6", "fs": 2, "q": "Which annuity payout option provides the LARGEST monthly payment?", "o": ["Life with 10-year period certain", "Joint and last survivor", "Straight life", "Unit refund life"], "a": 2, "e": "Straight life pays only for the annuitant's lifetime with no guarantees to beneficiaries, so the insurer can pay the most per month."}, {"id": 139, "ch": 14, "sec": "14.6", "fs": 2, "q": "A non-qualified variable annuity owner, age 50, makes a partial withdrawal. For tax purposes the withdrawal is treated as:", "o": ["Return of cost basis first, tax-free", "Earnings first, taxed as ordinary income plus 10% penalty", "Half basis, half earnings", "Long-term capital gain"], "a": 1, "e": "Annuity withdrawals are LIFO — earnings come out first and are taxed as ordinary income, with a 10% penalty before 59½."}, {"id": 140, "ch": 14, "sec": "14.7", "fs": 3, "q": "Which of the following is TRUE of a 529 college savings plan?", "o": ["Contributions are deductible on the federal return", "Contributors are subject to income limits", "The account owner, not the beneficiary, controls the assets", "Withdrawals for any purpose are tax-free after age 18"], "a": 2, "e": "529 contributions are after-tax federally, have no income limits, the donor/owner keeps control and may change the beneficiary within the family, and non-qualified withdrawals incur tax plus a 10% penalty on earnings."}, {"id": 141, "ch": 14, "sec": "14.5", "fs": 2, "q": "In a variable life insurance policy, which of the following is guaranteed?", "o": ["The cash value", "A minimum death benefit", "The rate of return on the separate account", "The premium will never be due"], "a": 1, "e": "Variable life has a fixed premium and a guaranteed minimum death benefit; the cash value and any additional death benefit vary with separate account performance."}, {"id": 142, "ch": 14, "sec": "14.3", "fs": 3, "q": "A 403(b) plan is available to employees of:", "o": ["Any corporation with fewer than 100 employees", "State and local governments only", "Public schools and 501(c)(3) non-profit organizations", "Self-employed individuals"], "a": 2, "e": "403(b) tax-sheltered annuity plans serve public education and non-profit employees; investments are limited to annuities and mutual funds."}, {"id": 143, "ch": 15, "sec": "15.2.3", "fs": 3, "q": "An attorney working on a merger tells her brother, who buys the target's stock. Which parties have violated insider trading rules?", "o": ["Only the brother", "Only the attorney", "Both the attorney (tipper) and the brother (tippee)", "Neither, because the attorney did not trade"], "a": 2, "e": "Tippers are liable even if they don't trade; tippees who trade on MNPI are liable. Civil penalties can reach three times the profit."}, {"id": 144, "ch": 15, "sec": "15.4.6", "fs": 3, "q": "A registered representative wants to work weekends as a paid real estate agent. Under FINRA rules she must:", "o": ["Do nothing; it's unrelated to securities", "Give her firm prior written notice", "Obtain FINRA's written approval", "Register the activity with the state Administrator"], "a": 1, "e": "Outside business activities for compensation require prior written notice to the firm (Rule 3270). Private securities transactions require notice and, if compensated, approval (Rule 3280)."}, {"id": 145, "ch": 15, "sec": "15.4.6", "fs": 3, "q": "Under FINRA's gifts rule, business gifts to an employee of another member firm may not exceed:", "o": ["$50 per year", "$100 per person per year", "$250 per person per year", "$500 per year"], "a": 1, "e": "The limit is $100 per person per year; business entertainment where the giver attends is excluded."}, {"id": 146, "ch": 15, "sec": "15.4.3", "fs": 4, "q": "A form letter sent to 40 retail customers within a week is classified as:", "o": ["Correspondence, requiring supervisory review", "Retail communication, requiring prior principal approval", "Institutional communication", "A public appearance"], "a": 1, "e": "Communications to more than 25 retail investors within 30 days are retail communications and must be approved by a registered principal before use. 25 or fewer = correspondence."}, {"id": 147, "ch": 15, "sec": "15.3.1", "fs": 3, "q": "A firm reasonably believes an 80-year-old customer is being financially exploited by a caregiver. The firm may place a temporary hold on disbursements for up to:", "o": ["5 business days", "10 business days", "15 business days, extendable by 10 more", "30 calendar days"], "a": 2, "e": "FINRA Rule 2165 allows a 15-business-day hold, extendable by 10 business days (and further if a regulator requests), with notification of the trusted contact and an internal review."}, {"id": 148, "ch": 15, "sec": "15.4.5", "fs": 4, "q": "A candidate fails the SIE exam for the third time. Before retesting, the candidate must wait:", "o": ["30 days", "60 days", "90 days", "180 days"], "a": 3, "e": "Waiting periods are 30 days after the first and second failures and 180 days after the third and each subsequent failure."}, {"id": 149, "ch": 15, "sec": "15.4.7", "fs": 4, "q": "Under SEC and FINRA record-keeping rules, customer complaint records must be retained for:", "o": ["3 years", "4 years", "6 years", "The life of the firm"], "a": 1, "e": "Complaints: 4 years. Blotters, ledgers and account records: 6 years. Order tickets, confirms and communications: 3 years. Organizational documents: permanent."}, {"id": 150, "ch": 15, "sec": "15.4.2", "fs": 3, "q": "Under the Telephone Consumer Protection Act, cold calls to prospective customers may be made only between:", "o": ["9 am and 5 pm in the caller's time zone", "8 am and 9 pm in the called party's time zone", "8 am and 8 pm in the caller's time zone", "7 am and 10 pm in the called party's time zone"], "a": 1, "e": "Cold calls are limited to 8:00 am–9:00 pm local time of the person called, the caller must identify themselves and the firm, and do-not-call lists must be honored."}, {"ch": 15, "sec": "15.1", "fs": 4, "q": "Which of the following is a self-regulatory organization?", "o": ["The SEC", "FINRA", "The Federal Reserve", "FinCEN"], "a": 1, "e": "FINRA, the exchanges and the MSRB are SROs operating under SEC oversight. The SEC is a government agency; the Fed and FinCEN are government bodies.", "id": 151}, {"ch": 15, "sec": "15.4.5", "fs": 4, "q": "Passing the SIE exam allows an individual to:", "o": ["Open customer accounts at a broker-dealer", "Sell mutual funds under supervision", "Take a representative-level qualification exam when sponsored by a member firm", "Register as an investment adviser representative"], "a": 2, "e": "The SIE is a co-requisite; it confers no registration. To do securities business the person must be sponsored by a firm, pass a top-off exam (Series 6, 7, etc.) and be registered on Form U4.", "id": 152}, {"ch": 15, "sec": "15.4.5", "fs": 4, "q": "A registered representative moves to a new address. Form U4 must be amended within:", "o": ["10 days", "30 days", "60 days", "90 days"], "a": 1, "e": "Material changes to Form U4 information must be filed within 30 days. Form U5 is also due within 30 days of termination.", "id": 153}, {"ch": 15, "sec": "15.4.5", "fs": 4, "q": "A registered person who fails to complete the Regulatory Element of continuing education by the deadline:", "o": ["Is fined $1,000", "Has registration become inactive until it is completed", "Must retake the SIE", "Is suspended for 30 days"], "a": 1, "e": "Registration becomes inactive — no securities business or compensation — until the Regulatory Element is completed; after two years inactive it is terminated.", "id": 154}, {"ch": 15, "sec": "15.4.3", "fs": 4, "q": "A new FINRA member firm must file its retail communications with FINRA:", "o": ["Within 10 business days after first use", "At least 10 business days before first use", "Within 30 days after first use", "Only if they concern mutual funds"], "a": 1, "e": "For its first year a new member files retail communications 10 business days BEFORE first use. Investment company, DPP and CMO material is filed within 10 business days AFTER first use.", "id": 155}, {"ch": 15, "sec": "15.4.7", "fs": 4, "q": "Which records must a broker-dealer retain for six years?", "o": ["Order tickets and trade confirmations", "Blotters, general ledger and customer account records", "Customer complaints", "Articles of incorporation"], "a": 1, "e": "Six years: blotters, ledgers, stock record, account records. Three years: tickets, confirms, communications. Four years: complaints. Permanent: organizational documents.", "id": 156}, {"ch": 15, "sec": "15.4.1", "fs": 4, "q": "Which law requires corporate bond issues over $50 million to have an indenture and an independent trustee?", "o": ["Securities Act of 1933", "Securities Exchange Act of 1934", "Trust Indenture Act of 1939", "Investment Company Act of 1940"], "a": 2, "e": "The Trust Indenture Act of 1939 applies to public corporate debt (not governments or munis).", "id": 157}, {"ch": 15, "sec": "15.4.6", "fs": 4, "q": "Regulation Best Interest requires a broker-dealer making a recommendation to a retail customer to satisfy all of the following obligations EXCEPT:", "o": ["Disclosure", "Care", "Conflict of interest", "Ongoing account monitoring"], "a": 3, "e": "Reg BI's four obligations are disclosure, care, conflict of interest and compliance. It does /* ---------- state ---------- */
const KEY = "sie-study-hub-v1";
let S = {read:{}, qlog:{}, exams:[], lastView:"dashboard", lastChapter:1};
function load(){ try{ const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} refreshRail(); }
load();

const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const view = $("#view"), viewTitle = $("#viewtitle"), topchip = $("#topchip");
let toastT; function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
const chapterByNum = n => CHAPTERS.find(c => c.num === n);
const allSections = CHAPTERS.flatMap(c => c.sections.map(s => ({...s, ch:c.num})));
const chRead = n => { const c = chapterByNum(n); const d = c.sections.filter(s => S.read[s.id]).length; return {done:d, total:c.sections.length}; };
function accuracy(n){ let r=0,w=0; for(const q of QUESTIONS){ if(n && q.ch!==n) continue; const l=S.qlog[q.id]; if(!l) continue; r+=l.r; w+=l.w; } return {r,w,n:r+w,pct:(r+w)?Math.round(100*r/(r+w)):null}; }
function logAnswer(q, correct){ const l = S.qlog[q.id] || (S.qlog[q.id]={r:0,w:0,last:null}); correct?l.r++:l.w++; l.last=correct; }
function refreshRail(){
  const d = Object.keys(S.read).filter(k=>S.read[k]).length, t = allSections.length, p = Math.round(100*d/t);

}

const VIEWS = {dashboard:"Dashboard", textbook:"Textbook", quizzes:"Chapter quizzes", exams:"Practice exams", cheatsheet:"Cheat sheet"};
let activeExam = null; // guards leaving mid-exam
function go(v, opts={}){
  if(!VIEWS[v]) v = "dashboard";
  if(activeExam && v!=="exams" && !opts.force){ if(!confirmLeave(v)) return; }
  S.lastView = v; save();
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.view===v));
  viewTitle.textContent = VIEWS[v]; topchip.hidden = true; $("#tocbtn").hidden = v!=="textbook";
  $("#rail").classList.remove("open");
  if(location.hash.replace("#","") !== v) history.replaceState(null,"","#"+v);
  ({dashboard:renderDashboard, textbook:renderTextbook, quizzes:renderQuizzes, exams:renderExams, cheatsheet:renderCheat})[v](opts);
  view.scrollTop = 0;
}
document.querySelectorAll(".navbtn").forEach(b => b.addEventListener("click", () => go(b.dataset.view)));

function confirmLeave(v){
  // inline confirmation instead of window.confirm (dialogs are blocked in some viewers)

}

/* ---------- dashboard ---------- */
function statusChip(n){
  const r = chRead(n), a = accuracy(n);
  if(r.done===r.total && a.pct!==null && a.pct>=80) return '<span class="chip good">Solid</span>';
  if(a.pct!==null && a.n>=3 && a.pct<65) return '<span class="chip bad">Needs work</span>';
  if(r.done>0 || a.n>0) return '<span class="chip warn">In progress</span>';
  return '<span class="chip">Not started</span>';
}

      <div class="stat"><div class="lbl">Question accuracy</div><div class="val">${acc.pct!==null?acc.pct+"%":"–"}</div><div class="sub">${acc.n} answered</div></div>
    </div>
    <div class="card" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><span class="chip ${avg3===null?"":avg3>=80?"good":avg3>=70?"warn":"bad"}">Readiness</span><span>${ready}</span><span class="grow" style="flex:1"></span><button class="btn primary" id="dash-exam">Start a practice exam</button></div>
    <div class="grid2">
      <div class="card"><h2>Exam score history<small>pass line at 70</small></h2>${ex.length?examChart(ex):'<div class="empty">Your scores will chart here after your first practice exam.</div>'}</div>
      <div class="card"><h2>Weakest chapters<small>lowest accuracy, 3+ answered</small></h2>${weak.length?weak.map(x=>`<div style="display:flex;align-items:center;gap:10px;margin:8px 0"><span style="flex:1;min-width:0">${x.c.num}. ${esc(x.c.name)}</span><span class="num muted" style="font-size:12px">${x.a.r}/${x.a.n}</span><span class="chip ${x.a.pct<65?"bad":x.a.pct<80?"warn":"good"}">${x.a.pct}%</span><button class="btn sm" data-quiz="${x.c.num}">Quiz</button></div>`).join(""):'<div class="empty">Answer some quiz or exam questions and your weak spots will show up here.</div>'}</div>
    </div>
    <div class="card" style="margin-bottom:14px"><h2>Chapter progress</h2><div class="tablewrap"><table>
      <thead><tr><th>Chapter</th><th>Reading</th><th>Accuracy</th><th>Status</th><th></th></tr></thead>
      <tbody>${CHAPTERS.map(c=>{const r=chRead(c.num),a=accuracy(c.num),p=Math.round(100*r.done/r.total);return `<tr class="chrow"><td>${c.num}. ${esc(c.name)}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${p}%"></i></div><span class="num muted" style="font-size:12px;width:52px">${r.done}/${r.total}</span></div></td><td>${a.pct!==null?`<span class="num">${a.pct}%</span> <span class="muted" style="font-size:12px">(${a.n})</span>`:'<span class="muted">–</span>'}</td><td>${statusChip(c.num)}</td><td style="white-space:nowrap"><button class="btn sm" data-read="${c.num}">Read</button> <button class="btn sm" data-quiz="${c.num}">Quiz</button></td></tr>`}).join("")}</tbody></table></div></div>
    ${ex.length?`<div class="card" style="margin-bottom:14px"><h2>Exam log</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Type</th><th>Score</th><th>Time used</th><th>By FINRA section</th></tr></thead><tbody>${[...ex].reverse().map(e=>`<tr><td class="num">${esc(e.date)}</td><td>${e.n} questions</td><td><span class="chip ${e.pct>=70?"good":"bad"}">${e.pct}%</span> <span class="muted num" style="font-size:12px">${e.right}/${e.n}</span></td><td class="num">${fmtTime(e.secs)}</td><td class="muted" style="font-size:12px">${[1,2,3,4].map(f=>e.fs&&e.fs[f]?`S${f} ${e.fs[f].r}/${e.fs[f].n}`:"").filter(Boolean).join(" · ")}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    <div class="card"><h2>Your progress data</h2><p class="hint">Progress is saved in this browser. Copy the JSON to move it to another device or to hand to Claude Code; paste it back here to restore.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn sm" id="exp">Show export</button><button class="btn sm" id="imp">Import from text below</button><button class="btn sm danger" id="reset">Reset all progress</button></div>
      <div id="resetconfirm" class="inlineconfirm" hidden>This erases reading progress, quiz history and exam scores. <button class="btn sm danger" id="reset-yes">Yes, erase</button><button class="btn sm" id="reset-no">Cancel</button></div>
      <textarea class="io" id="io" placeholder="Export appears here, or paste a previous export to import." aria-label="Progress data"></textarea></div>

  $("#dash-exam").onclick = () => go("exams");

  $("#exp").onclick = () => { $("#io").value = JSON.stringify(S); $("#io").select(); navigator.clipboard?.writeText($("#io").value).then(()=>toast("Copied to clipboard")).catch(()=>toast("Select the text and copy it")); };
  $("#imp").onclick = () => { try{ const o = JSON.parse($("#io").value); if(!o.read||!o.exams) throw 0; S = Object.assign({read:{},qlog:{},exams:[]}, o); save(); toast("Progress imported"); renderDashboard(); }catch(e){ toast("That isn't a valid export"); } };

  $("#reset-no").onclick = () => $("#resetconfirm").hidden = true;

function examChart(ex){
  const W=520,H=190,pl=36,pr=12,pt=14,pb=28, n=ex.length;
  const x=i=> n===1 ? pl+(W-pl-pr)/2 : pl+(W-pl-pr)*i/(n-1), y=v=> pt+(H-pt-pb)*(1-v/100);
  const pts = ex.map((e,i)=>[x(i),y(e.pct)]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area = path + ` L${pts[pts.length-1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z`;
  const grid = [0,25,50,75,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--fg-3)" font-family="var(--mono)">${v}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Practice exam scores over time">${grid}
    <line x1="${pl}" x2="${W-pr}" y1="${y(70)}" y2="${y(70)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.2"/>
    <text x="${W-pr}" y="${y(70)-5}" text-anchor="end" font-size="10" fill="var(--warn)">pass 70</text>
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3}" fill="${ex[i].pct>=70?"var(--good)":"var(--bad)"}"/><text x="${p[0]}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--fg-3)" font-family="var(--mono)">${i+1}</text>`).join("")}
  </svg>`;
}
const fmtTime = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

/* ---------- textbook ---------- */
let curChapter = S.lastChapter || 1, curSec = null;
function renderTextbook(opts={}){
  if(opts.chapter) curChapter = opts.chapter;
  view.innerHTML = `<div class="book"><aside class="toc" id="toc"><div class="search"><input id="search" type="search" placeholder="Search sections…" aria-label="Search sections"></div><div id="toclist"></div></aside><div class="reader" id="reader"></div></div>`;
  $("#tocbtn").onclick = () => $("#toc").classList.toggle("open");
  $("#toc").addEventListener("click", e => { if(e.target.id==="toc") $("#toc").classList.remove("open"); });
  $("#search").addEventListener("input", e => buildToc(e.target.value.trim().toLowerCase()));
  buildToc(""); showChapter(curChapter, opts.section);
}
function buildToc(filter){
  const list = $("#toclist");
  list.innerHTML = CHAPTERS.map(c => {
    const secs = c.sections.filter(s => !filter || (s.num+" "+s.title).toLowerCase().includes(filter) || c.name.toLowerCase().includes(filter));
    if(filter && !secs.length) return "";
    const r = chRead(c.num), open = filter || c.num===curChapter;
    return `<div class="chap ${open?"open":""}" data-ch="${c.num}"><button><span>${c.num}. ${esc(c.name)}</span><span class="done">${r.done}/${r.total}</span><span class="caret">›</span></button>
      <ul ${open?"":"hidden"}>${secs.map(s=>`<li class="l${s.level} ${S.read[s.id]?"read":""} ${s.id===curSec?"cur":""}" data-sec="${s.id}"><button class="${s.id===curSec?"current":""}" data-ch="${c.num}" data-sec="${s.id}"><span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><span>${s.num} ${esc(s.title)}</span></button></li>`).join("")}</ul></div>`;
  }).join("");
  list.querySelectorAll(".chap > button").forEach(b => b.onclick = () => { const ch = b.parentElement; const ul = ch.querySelector("ul"); const open = ch.classList.toggle("open"); ul.hidden = !open; if(open && +ch.dataset.ch!==curChapter) showChapter(+ch.dataset.ch); });
  list.querySelectorAll("li button").forEach(b => b.onclick = () => { showChapter(+b.dataset.ch, b.dataset.sec); $("#toc").classList.remove("open"); });
}
function showChapter(n, secId){
  curChapter = n; S.lastChapter = n; curSec = secId || null;
  const c = chapterByNum(n), i = CHAPTERS.indexOf(c), r = chRead(n);
  const reader = $("#reader");
  reader.innerHTML = `<article class="article"><h1 class="ct">${esc(c.name)}</h1><div class="meta"><span>Chapter ${c.num} of ${CHAPTERS.length}</span><span>${c.minutes} min read</span><span class="num">${r.done}/${r.total} sections read</span><span class="grow" style="flex:1"></span><button class="btn sm" id="markall">${r.done===r.total?"Unmark chapter":"Mark whole chapter read"}</button></div><div class="prose" id="prose">${c.html}</div>
    <div class="endnav">${i>0?`<button class="btn" data-go="${CHAPTERS[i-1].num}">← ${CHAPTERS[i-1].num}. ${esc(CHAPTERS[i-1].name)}</button>`:"<span></span>"}<button class="btn" data-quiz="${c.num}">Quiz this chapter</button>${i<CHAPTERS.length-1?`<button class="btn primary" data-go="${CHAPTERS[i+1].num}">${CHAPTERS[i+1].num}. ${esc(CHAPTERS[i+1].name)} →</button>`:"<span></span>"}</div></article>`;
  // attach "mark read" toggles to numbered headings
  reader.querySelectorAll("[data-sec]").forEach(h => {
    const id = h.dataset.sec, b = document.createElement("button"); b.className = "mark" + (S.read[id]?" on":""); b.textContent = S.read[id] ? "Read ✓" : "Mark read";
    b.onclick = () => { S.read[id] = !S.read[id]; save(); b.className = "mark" + (S.read[id]?" on":""); b.textContent = S.read[id] ? "Read ✓" : "Mark read"; syncToc(); };
    h.appendChild(b);
  });
  const qr = [...reader.querySelectorAll("h2")].find(h => /quick review/i.test(h.textContent)); if(qr) qr.parentElement.classList.add("quickreview");
  $("#markall").onclick = () => { const all = r.done===chRead(n).total ? false : true; const v = chRead(n).done===chRead(n).total ? false : true; c.sections.forEach(s => S.read[s.id] = v); save(); showChapter(n); buildToc($("#search").value.trim().toLowerCase()); };
  reader.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { showChapter(+b.dataset.go); buildToc(""); $("#reader").scrollTop = 0; });
  reader.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => go("quizzes",{chapter:+b.dataset.quiz}));
  topchip.hidden = false; topchip.textContent = `${c.num}. ${c.name}`;
  save();
  if(secId){ const el = reader.querySelector("#"+secId); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),0); } else reader.scrollTop = 0;
  syncToc(true);
}
function syncToc(reopen){
  const list = $("#toclist"); if(!list) return;
  list.querySelectorAll(".chap").forEach(ch => { const n=+ch.dataset.ch, r=chRead(n); ch.querySelector(".done").textContent = `${r.done}/${r.total}`; if(reopen){ const open=n===curChapter; ch.classList.toggle("open",open); ch.querySelector("ul").hidden=!open; } });
  list.querySelectorAll("li[data-sec]").forEach(li => { li.classList.toggle("read", !!S.read[li.dataset.sec]); li.querySelector("button").classList.toggle("current", li.dataset.sec===curSec); });
  const r = chRead(curChapter), m = $("#markall"); if(m) m.textContent = r.done===r.total?"Unmark chapter":"Mark whole chapter read";
  const meta = $(".article .meta .num"); if(meta) meta.textContent = `${r.done}/${r.total} sections read`;
}

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderQuizzes(opts={}){
  if(opts.chapter) return startQuiz(opts.chapter);
  view.innerHTML = `<div class="pad"><p class="hint">Pick a chapter. Each quiz shows the explanation right after you answer, and every answer feeds the accuracy numbers on your dashboard. Questions you missed before are weighted to come up again.</p><div class="chgrid">${CHAPTERS.map(c=>{const n=QUESTIONS.filter(q=>q.ch===c.num).length,a=accuracy(c.num);return `<button class="chbtn" data-ch="${c.num}"><span class="t">${c.num}. ${esc(c.name)}</span><span class="s"><span>${n} questions</span>${a.n?`<span>· ${a.pct}% accuracy</span>`:""}</span><div class="bar ${a.pct===null?"":a.pct>=80?"good":a.pct>=65?"warn":"bad"}"><i style="width:${a.pct??0}%"></i></div></button>`}).join("")}
    <button class="chbtn" data-ch="0"><span class="t">Mixed review</span><span class="s"><span>20 random questions across all chapters</span></span><div class="bar"><i style="width:0"></i></div></button></div></div>`;
  view.querySelectorAll(".chbtn").forEach(b => b.onclick = () => startQuiz(+b.dataset.ch));
}
function startQuiz(ch){
  let pool = ch ? QUESTIONS.filter(q=>q.ch===ch) : QUESTIONS;
  // weight previously-missed questions first
  const missed = pool.filter(q => S.qlog[q.id] && S.qlog[q.id].last===false), rest = pool.filter(q => !missed.includes(q));
  let qs = [...shuffle(missed), ...shuffle(rest)];
  if(!ch) qs = qs.slice(0,20);
  const name = ch ? `${ch}. ${chapterByNum(ch).name}` : "Mixed review";
  let i = 0, right = 0;
  const render = () => {
    if(i >= qs.length){ view.innerHTML = `<div class="qwrap"><div class="qcard"><div class="score"><div class="big ${right/qs.length>=.7?"pass":"fail"}">${Math.round(100*right/qs.length)}%</div><div><div style="font-weight:600;font-size:17px">${esc(name)} — ${right} of ${qs.length} correct</div><div class="muted">${right/qs.length>=.8?"Strong. Move on to the next chapter.":right/qs.length>=.7?"Passing level, but review the ones you missed.":"Re-read the chapter's quick review, then retake this quiz."}</div></div></div><div class="qfoot"><button class="btn primary" id="again">Retake</button>${ch?`<button class="btn" id="readch">Read chapter ${ch}</button>`:""}<button class="btn" id="back">All quizzes</button></div></div></div>`;
      $("#again").onclick = () => startQuiz(ch); $("#back").onclick = () => renderQuizzes(); const rc=$("#readch"); if(rc) rc.onclick = () => go("textbook",{chapter:ch}); return; }
    const q = qs[i]; let picked = null;
    view.innerHTML = `<div class="qwrap"><div class="qhead"><span class="chip accent">${esc(name)}</span><span class="muted num">Question ${i+1} of ${qs.length}</span><span class="grow"></span><span class="muted num">${right} correct</span></div><div class="bar" style="margin-bottom:14px"><i style="width:${Math.round(100*i/qs.length)}%"></i></div>
      <div class="qcard"><div class="qn"><span>§${esc(q.sec)}</span><span>FINRA section ${q.fs}</span>${S.qlog[q.id]&&S.qlog[q.id].last===false?'<span class="chip warn">Missed before</span>':""}</div><div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="let">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="ex"></div>
      <div class="qfoot"><button class="btn" id="quit">Quit</button><span class="grow"></span><button class="btn primary" id="check" disabled>Check answer</button></div></div></div>`;
    const opts = view.querySelectorAll(".opt");
    opts.forEach(b => b.onclick = () => { if(picked!==null && $("#check").hidden) return; picked = +b.dataset.k; opts.forEach(x=>x.classList.toggle("sel", x===b)); $("#check").disabled=false; });
    $("#quit").onclick = () => renderQuizzes();
    $("#check").onclick = () => {
      const ok = picked===q.a; if(ok) right++; logAnswer(q, ok); save();
      opts.forEach(x => { x.disabled = true; const k=+x.dataset.k; if(k===q.a) x.classList.add("right"); else if(k===picked) x.classList.add("wrong"); });
      $("#ex").innerHTML = `<div class="explain ${ok?"ok":"no"}"><div class="tag">${ok?"Correct":"Incorrect — the answer is "+"ABCD"[q.a]}</div>${esc(q.e)}</div>`;
      const c = $("#check"); c.textContent = i+1<qs.length ? "Next question →" : "See results"; c.onclick = () => { i++; render(); }; c.focus();
    };
    view.scrollTop = 0;
  };
  render();
}

/* ---------- exams ---------- */
function buildExam(n){
  const scale = n/75, qs = [];
  for(const f of [1,2,3,4]){ const want = Math.round(FS_WEIGHTS[f]*scale); qs.push(...shuffle(QUESTIONS.filter(q=>q.fs===f)).slice(0,want)); }
  const ids = new Set(qs.map(q=>q.id));
  for(const q of shuffle(QUESTIONS)){ if(qs.length>=n) break; if(!ids.has(q.id)){ qs.push(q); ids.add(q.id); } }
  return shuffle(qs).slice(0,n);
}
function renderExams(){
  const ex = S.exams;
  view.innerHTML = `<div class="pad"><div class="grid2">
    <div class="card"><h2>Full-length practice exam</h2><p class="hint">75 questions in 105 minutes, mirroring the real SIE: 12 on capital markets, 33 on products, 23 on trading/accounts/prohibited activities, 7 on the regulatory framework. No feedback until you submit. Flag questions to revisit. Passing is 70%.</p><button class="btn primary" id="full">Start full exam</button></div>
    <div class="card"><h2>Short exam</h2><p class="hint">25 questions, 35 minutes, same section weighting. Good for a daily check-in.</p><button class="btn" id="short">Start short exam</button></div></div>
    <div class="card"><h2>History</h2>${ex.length?`<div class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Questions</th><th>Score</th><th>Time</th></tr></thead><tbody>${ex.map((e,i)=>`<tr><td class="num">${i+1}</td><td class="num">${esc(e.date)}</td><td>${e.n}</td><td><span class="chip ${e.pct>=70?"good":"bad"}">${e.pct}%</span></td><td class="num">${fmtTime(e.secs)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No exams yet. The question pool has '+QUESTIONS.length+' questions, so each exam is a fresh random draw.</div>'}</div></div>`;
  $("#full").onclick = () => startExam(75, EXAM_MIN*60);
  $("#short").onclick = () => startExam(25, 35*60);
}
function startExam(n, secs){
  const qs = buildExam(n); const ans = new Array(qs.length).fill(null), flags = new Set(); let i=0, left=secs, timer=null; const t0 = Date.now();
  activeExam = {qs};
  const tick = () => { left--; const t=$("#timer"); if(t){ t.textContent = fmtTime(Math.max(0,left)); t.classList.toggle("low", left<300); } if(left<=0){ clearInterval(timer); finish(true); } };
  timer = setInterval(tick, 1000);
  const render = () => {
    const q = qs[i];
    view.innerHTML = `<div class="qwrap"><div class="qhead"><span class="chip accent">Practice exam</span><span class="muted num">Question ${i+1} of ${qs.length}</span><span class="muted num">${ans.filter(a=>a!==null).length} answered</span><span class="grow"></span><span class="timer" id="timer">${fmtTime(left)}</span></div>
      <div id="leavebar" class="inlineconfirm" hidden style="margin-bottom:12px">Leaving ends this exam without a score. <button class="btn sm danger" id="leave-yes">End exam</button><button class="btn sm" id="leave-no">Stay</button></div>
      <div class="qcard"><div class="qn"><span>FINRA section ${q.fs}: ${esc(FS_NAMES[q.fs])}</span></div><div class="qtext">${esc(q.q)}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt ${ans[i]===k?"sel":""}" data-k="${k}"><span class="let">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="qfoot"><button class="btn" id="prev" ${i===0?"disabled":""}>← Previous</button><button class="btn ${flags.has(i)?"danger":""}" id="flag">${flags.has(i)?"Unflag":"Flag for review"}</button><span class="grow"></span>${i<qs.length-1?'<button class="btn primary" id="next">Next →</button>':'<button class="btn primary" id="submit">Submit exam</button>'}</div>
      <div id="subconfirm" class="inlineconfirm" hidden style="margin-top:12px"><span id="subtext"></span><button class="btn sm primary" id="sub-yes">Submit</button><button class="btn sm" id="sub-no">Keep working</button></div></div>
      <div class="navgrid" id="navgrid">${qs.map((_,k)=>`<button class="${ans[k]!==null?"ans":""} ${flags.has(k)?"flag":""} ${k===i?"cur":""}" data-j="${k}">${k+1}</button>`).join("")}</div>
      <div class="qfoot"><span class="muted" style="font-size:13px">Grey = answered · amber = flagged</span><span class="grow"></span><button class="btn sm" id="submit2">Submit exam</button></div></div>`;
    view.querySelectorAll(".opt").forEach(b => b.onclick = () => { ans[i]=+b.dataset.k; view.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b)); const g=$("#navgrid").children[i]; g.classList.add("ans"); });
    const p=$("#prev"); if(p) p.onclick = () => { i--; render(); };
    const nx=$("#next"); if(nx) nx.onclick = () => { i++; render(); };
    $("#flag").onclick = () => { flags.has(i)?flags.delete(i):flags.add(i); render(); };
    view.querySelectorAll("#navgrid button").forEach(b => b.onclick = () => { i=+b.dataset.j; render(); });
    const askSubmit = () => { const un = ans.filter(a=>a===null).length; $("#subtext").textContent = un ? `${un} unanswered question${un>1?"s":""} will count as wrong. Submit anyway?` : "Submit and see your score?"; $("#subconfirm").hidden=false; $("#subconfirm").scrollIntoView({block:"nearest"}); };
    const s1=$("#submit"); if(s1) s1.onclick = askSubmit; $("#submit2").onclick = askSubmit;
    $("#sub-no").onclick = () => $("#subconfirm").hidden = true; $("#sub-yes").onclick = () => finish(false);
    $("#leave-no").onclick = () => $("#leavebar").hidden = true; $("#leave-yes").onclick = () => { clearInterval(timer); activeExam=null; go($("#leavebar").dataset.to||"dashboard",{force:true}); };
    view.scrollTop = 0;
  };
  const finish = (timedOut) => {
    clearInterval(timer); activeExam = null;
    const secsUsed = Math.min(secs, Math.round((Date.now()-t0)/1000));
    let right=0; const fs={}, ch={};
    qs.forEach((q,k) => { const ok = ans[k]===q.a; if(ok) right++; logAnswer(q, ok); fs[q.fs]=fs[q.fs]||{r:0,n:0}; fs[q.fs].n++; if(ok) fs[q.fs].r++; ch[q.ch]=ch[q.ch]||{r:0,n:0}; ch[q.ch].n++; if(ok) ch[q.ch].r++; });
    const pct = Math.round(100*right/qs.length);
    const d = new Date(), date = d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
    S.exams.push({date, n:qs.length, right, pct, secs:secsUsed, fs, ch}); save();
    let showWrong = false;
    const renderResults = () => {
      const list = qs.map((q,k)=>({q,k,ok:ans[k]===q.a})).filter(x => !showWrong || !x.ok);
      view.innerHTML = `<div class="qwrap"><div class="qcard" style="margin-bottom:14px"><div class="score"><div class="big ${pct>=70?"pass":"fail"}">${pct}%</div><div><div style="font-weight:600;font-size:18px">${pct>=70?"Pass":"Below the 70% pass mark"} — ${right} of ${qs.length} correct${timedOut?" (time expired)":""}</div><div class="muted">Time used ${fmtTime(secsUsed)} of ${fmtTime(secs)}</div></div></div>
        <div class="tablewrap"><table><thead><tr><th>FINRA section</th><th>Correct</th><th></th></tr></thead><tbody>${[1,2,3,4].filter(f=>fs[f]).map(f=>{const p=Math.round(100*fs[f].r/fs[f].n);return `<tr><td>${f}. ${esc(FS_NAMES[f])}</td><td class="num">${fs[f].r}/${fs[f].n}</td><td style="min-width:140px"><div style="display:flex;align-items:center;gap:8px"><div class="bar ${p>=80?"good":p>=65?"warn":"bad"}" style="flex:1"><i style="width:${p}%"></i></div><span class="num muted" style="font-size:12px">${p}%</span></div></td></tr>`}).join("")}</tbody></table></div>
        <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Chapter</th><th>Correct</th></tr></thead><tbody>${Object.keys(ch).map(Number).sort((a,b)=>a-b).map(c=>`<tr><td>${c}. ${esc(chapterByNum(c).name)}</td><td class="num">${ch[c].r}/${ch[c].n} ${ch[c].r<ch[c].n?`<button class="btn sm" data-quiz="${c}" style="margin-left:8px">Quiz</button>`:""}</td></tr>`).join("")}</tbody></table></div>
        <div class="qfoot"><button class="btn primary" id="again">Take another</button><button class="btn" id="dash">Dashboard</button><span class="grow"></span><label class="toggle"><input type="checkbox" id="onlywrong" ${showWrong?"checked":""}> Show only missed questions</label></div></div>
        ${list.map(({q,k,ok})=>`<div class="qcard" style="margin-bottom:12px"><div class="qn"><span>Q${k+1}</span><span>§${esc(q.sec)} · ${esc(chapterByNum(q.ch).name)}</span>${flags.has(k)?'<span class="chip warn">Flagged</span>':""}<span class="chip ${ok?"good":"bad"}">${ok?"Correct":ans[k]===null?"Unanswered":"Incorrect"}</span></div><div class="qtext" style="font-size:15px">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<div class="opt ${j===q.a?"right":j===ans[k]?"wrong":""}"><span class="let">${"ABCD"[j]}</span><span>${esc(o)}</span></div>`).join("")}</div><div class="explain ${ok?"ok":"no"}"><div class="tag">Explanation</div>${esc(q.e)}</div></div>`).join("")}
        ${list.length?"":'<div class="empty">You got every question right.</div>'}</div>`;
      $("#again").onclick = () => renderExams(); $("#dash").onclick = () => go("dashboard");
      $("#onlywrong").onchange = e => { showWrong = e.target.checked; renderResults(); };
      view.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => go("quizzes",{chapter:+b.dataset.quiz}));
      view.scrollTop = 0;
    };
    renderResults();
  };
  render();
}

/* ---------- cheat sheet ---------- */
function renderCheat(){ view.innerHTML = ""; view.appendChild($("#tpl-cheat").content.cloneNode(true)); }

/* ---------- boot ---------- */
refreshRail();
const h = location.hash.replace("#","");
go(VIEWS[h] ? h : (S.lastView || "dashboard"), {force:true});
</script>
